openapi: 3.1.0
info:
  title: vfs.v1
paths:
  /vfs.v1.VirtualFilesystemService/PutObject:
    post:
      tags:
        - vfs.v1.VirtualFilesystemService
      summary: PutObject
      description: |-
        PutObject writes bytes directly to a workspace path and creates the first
         immutable version or appends a new version to an existing path.
      operationId: vfs.v1.VirtualFilesystemService.PutObject
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/vfs.v1.PutObjectRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vfs.v1.PutObjectResponse'
  /vfs.v1.VirtualFilesystemService/GetObject:
    post:
      tags:
        - vfs.v1.VirtualFilesystemService
      summary: GetObject
      description: |-
        GetObject returns metadata and an optional ranged byte slice for one
         object, selected by object ID or path.
      operationId: vfs.v1.VirtualFilesystemService.GetObject
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/vfs.v1.GetObjectRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vfs.v1.GetObjectResponse'
  /vfs.v1.VirtualFilesystemService/ListObjects:
    post:
      tags:
        - vfs.v1.VirtualFilesystemService
      summary: ListObjects
      description: ListObjects lists path metadata within a workspace and optional prefix.
      operationId: vfs.v1.VirtualFilesystemService.ListObjects
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/vfs.v1.ListObjectsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vfs.v1.ListObjectsResponse'
  /vfs.v1.VirtualFilesystemService/StatObject:
    post:
      tags:
        - vfs.v1.VirtualFilesystemService
      summary: StatObject
      description: StatObject returns metadata and optional version history without bytes.
      operationId: vfs.v1.VirtualFilesystemService.StatObject
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/vfs.v1.StatObjectRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vfs.v1.StatObjectResponse'
  /vfs.v1.VirtualFilesystemService/DeleteObject:
    post:
      tags:
        - vfs.v1.VirtualFilesystemService
      summary: DeleteObject
      description: DeleteObject tombstones a path while retaining metadata and versions.
      operationId: vfs.v1.VirtualFilesystemService.DeleteObject
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/vfs.v1.DeleteObjectRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vfs.v1.DeleteObjectResponse'
  /vfs.v1.VirtualFilesystemService/CopyObject:
    post:
      tags:
        - vfs.v1.VirtualFilesystemService
      summary: CopyObject
      description: CopyObject creates a new path with independent metadata over copied bytes.
      operationId: vfs.v1.VirtualFilesystemService.CopyObject
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/vfs.v1.CopyObjectRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vfs.v1.CopyObjectResponse'
  /vfs.v1.VirtualFilesystemService/LinkObject:
    post:
      tags:
        - vfs.v1.VirtualFilesystemService
      summary: LinkObject
      description: LinkObject creates another path entry pointing at the same content hash.
      operationId: vfs.v1.VirtualFilesystemService.LinkObject
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/vfs.v1.LinkObjectRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vfs.v1.LinkObjectResponse'
  /vfs.v1.VirtualFilesystemService/CreateLease:
    post:
      tags:
        - vfs.v1.VirtualFilesystemService
      summary: CreateLease
      description: CreateLease reserves a path for a long-running upload.
      operationId: vfs.v1.VirtualFilesystemService.CreateLease
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/vfs.v1.CreateLeaseRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vfs.v1.CreateLeaseResponse'
  /vfs.v1.VirtualFilesystemService/CompleteLease:
    post:
      tags:
        - vfs.v1.VirtualFilesystemService
      summary: CompleteLease
      description: CompleteLease completes a lease and publishes an immutable object version.
      operationId: vfs.v1.VirtualFilesystemService.CompleteLease
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/vfs.v1.CompleteLeaseRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vfs.v1.CompleteLeaseResponse'
  /vfs.v1.VirtualFilesystemService/GrantObject:
    post:
      tags:
        - vfs.v1.VirtualFilesystemService
      summary: GrantObject
      description: GrantObject replaces or appends capability grants for one object.
      operationId: vfs.v1.VirtualFilesystemService.GrantObject
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/vfs.v1.GrantObjectRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vfs.v1.GrantObjectResponse'
  /vfs.v1.VirtualFilesystemService/SearchMetadata:
    post:
      tags:
        - vfs.v1.VirtualFilesystemService
      summary: SearchMetadata
      description: |-
        SearchMetadata searches object metadata, tags, paths, and titles without
         returning file bytes.
      operationId: vfs.v1.VirtualFilesystemService.SearchMetadata
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/vfs.v1.SearchMetadataRequest'
        required: true
      responses:
        default:
