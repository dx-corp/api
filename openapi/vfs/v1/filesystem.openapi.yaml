          title: source_path
        destinationPath:
          type: string
          title: destination_path
          minLength: 1
        creatorId:
          type: string
          title: creator_id
        sourceService:
          type: string
          title: source_service
        metadata:
          type: object
          title: metadata
          additionalProperties:
            type: string
            title: value
        organizationId:
          type: string
          title: organization_id
          minLength: 1
      title: CopyObjectRequest
