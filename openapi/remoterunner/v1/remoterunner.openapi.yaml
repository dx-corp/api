components:
  schemas:
    google.protobuf.NullValue:
      type: string
      title: NullValue
      enum:
        - NULL_VALUE
      description: |-
        `NullValue` is a singleton enumeration to represent the null value for the
         `Value` type union.

         The JSON representation for `NullValue` is JSON `null`.
    remoterunner.v1.RunnerArtifactClass:
      type: string
      title: RunnerArtifactClass
      enum:
        - RUNNER_ARTIFACT_CLASS_UNSPECIFIED
        - RUNNER_ARTIFACT_CLASS_CONTROL_PLANE_METADATA
        - RUNNER_ARTIFACT_CLASS_WORKSPACE_EXPORT
        - RUNNER_ARTIFACT_CLASS_RUNTIME_SNAPSHOT
        - RUNNER_ARTIFACT_CLASS_RUNTIME_LOGS
    remoterunner.v1.RunnerArtifactLifecycleState:
      type: string
      title: RunnerArtifactLifecycleState
      enum:
        - RUNNER_ARTIFACT_LIFECYCLE_STATE_UNSPECIFIED
        - RUNNER_ARTIFACT_LIFECYCLE_STATE_UPLOAD_REQUESTED
        - RUNNER_ARTIFACT_LIFECYCLE_STATE_UPLOADED
        - RUNNER_ARTIFACT_LIFECYCLE_STATE_UPLOAD_SKIPPED
        - RUNNER_ARTIFACT_LIFECYCLE_STATE_RETENTION_EXPIRED
        - RUNNER_ARTIFACT_LIFECYCLE_STATE_DELETE_REQUESTED
        - RUNNER_ARTIFACT_LIFECYCLE_STATE_DELETED
        - RUNNER_ARTIFACT_LIFECYCLE_STATE_CLEANUP_FAILED
    remoterunner.v1.RunnerAttachRole:
      type: string
      title: RunnerAttachRole
      enum:
        - RUNNER_ATTACH_ROLE_UNSPECIFIED
        - RUNNER_ATTACH_ROLE_VIEWER
        - RUNNER_ATTACH_ROLE_CONTROLLER
        - RUNNER_ATTACH_ROLE_ADMIN
    remoterunner.v1.RunnerRestoreFailureCode:
      type: string
      title: RunnerRestoreFailureCode
      enum:
        - RUNNER_RESTORE_FAILURE_CODE_UNSPECIFIED
        - RUNNER_RESTORE_FAILURE_CODE_MISSING_ARTIFACT
        - RUNNER_RESTORE_FAILURE_CODE_INVALID_MANIFEST
        - RUNNER_RESTORE_FAILURE_CODE_WORKSPACE_ESCAPE
        - RUNNER_RESTORE_FAILURE_CODE_PROVIDER_TIMEOUT
        - RUNNER_RESTORE_FAILURE_CODE_RUNTIME_NOT_READY
        - RUNNER_RESTORE_FAILURE_CODE_OWNER_MISMATCH
        - RUNNER_RESTORE_FAILURE_CODE_HYDRATION_UNAVAILABLE
        - RUNNER_RESTORE_FAILURE_CODE_POLICY_DENIED
        - RUNNER_RESTORE_FAILURE_CODE_SESSION_CREATE_FAILED
    remoterunner.v1.RunnerRestoreState:
      type: string
      title: RunnerRestoreState
      enum:
        - RUNNER_RESTORE_STATE_UNSPECIFIED
        - RUNNER_RESTORE_STATE_REQUESTED
        - RUNNER_RESTORE_STATE_ARTIFACTS_HYDRATING
        - RUNNER_RESTORE_STATE_PROVIDER_STARTING
        - RUNNER_RESTORE_STATE_IDENTITY_READY
        - RUNNER_RESTORE_STATE_ATTACHABLE
        - RUNNER_RESTORE_STATE_FAILED
        - RUNNER_RESTORE_STATE_EXPIRED
    remoterunner.v1.RunnerSessionApexAuthorityState:
      type: string
      title: RunnerSessionApexAuthorityState
      enum:
        - RUNNER_SESSION_APEX_AUTHORITY_STATE_UNSPECIFIED
        - RUNNER_SESSION_APEX_AUTHORITY_STATE_NOT_REQUIRED
        - RUNNER_SESSION_APEX_AUTHORITY_STATE_PENDING_RESERVATION
        - RUNNER_SESSION_APEX_AUTHORITY_STATE_RESERVATION_VALIDATED
        - RUNNER_SESSION_APEX_AUTHORITY_STATE_MISSION_ADOPTED
    remoterunner.v1.RunnerSessionRestoreFailurePolicy:
      type: string
      title: RunnerSessionRestoreFailurePolicy
      enum:
        - RUNNER_SESSION_RESTORE_FAILURE_POLICY_UNSPECIFIED
