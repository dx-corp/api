openapi: 3.1.0
info:
  title: codex.v1
paths: {}
components:
  schemas:
    codex.v1.CodexActionType:
      type: string
      title: CodexActionType
      enum:
        - CODEX_ACTION_TYPE_UNSPECIFIED
        - CODEX_ACTION_TYPE_START_WORK
        - CODEX_ACTION_TYPE_FOLLOW_UP
        - CODEX_ACTION_TYPE_INVESTIGATE
        - CODEX_ACTION_TYPE_FIX
        - CODEX_ACTION_TYPE_REVIEW
        - CODEX_ACTION_TYPE_TEST
        - CODEX_ACTION_TYPE_EXPLAIN
        - CODEX_ACTION_TYPE_RETRY
        - CODEX_ACTION_TYPE_FORK
      description: |-
        CodexActionType describes the user intent that should shape prompting,
         permissions, routing, and output expectations for a Codex run.
    codex.v1.CodexAuthorityScope:
      type: string
      title: CodexAuthorityScope
      enum:
        - CODEX_AUTHORITY_SCOPE_UNSPECIFIED
        - CODEX_AUTHORITY_SCOPE_DISCUSS_ONLY
        - CODEX_AUTHORITY_SCOPE_READ_ONLY
        - CODEX_AUTHORITY_SCOPE_WORKSPACE_WRITE
      description: |-
        CodexAuthorityScope is the maximum local filesystem authority requested for
         delegated work. Platform policy, device mappings, and native confirmation
         may only narrow this value.
    codex.v1.CodexBackend:
      type: string
      title: CodexBackend
      enum:
        - CODEX_BACKEND_UNSPECIFIED
        - CODEX_BACKEND_APP_SERVER
        - CODEX_BACKEND_CODEX_SDK
        - CODEX_BACKEND_CLAUDE_CODE
        - CODEX_BACKEND_INTERNAL_AGENT
        - CODEX_BACKEND_MODEL_TRIAGE
      description: CodexBackend identifies the execution backend selected for a run.
    codex.v1.CodexContextSourceKind:
      type: string
      title: CodexContextSourceKind
      enum:
        - CODEX_CONTEXT_SOURCE_KIND_UNSPECIFIED
        - CODEX_CONTEXT_SOURCE_KIND_SLACK_MESSAGE
        - CODEX_CONTEXT_SOURCE_KIND_SLACK_THREAD
        - CODEX_CONTEXT_SOURCE_KIND_GITHUB_PULL_REQUEST
        - CODEX_CONTEXT_SOURCE_KIND_GITHUB_ISSUE
        - CODEX_CONTEXT_SOURCE_KIND_LINEAR_TICKET
        - CODEX_CONTEXT_SOURCE_KIND_JIRA_TICKET
        - CODEX_CONTEXT_SOURCE_KIND_SENTRY_EVENT
        - CODEX_CONTEXT_SOURCE_KIND_DATADOG_DASHBOARD
        - CODEX_CONTEXT_SOURCE_KIND_LOG_SNIPPET
        - CODEX_CONTEXT_SOURCE_KIND_SCREENSHOT
        - CODEX_CONTEXT_SOURCE_KIND_MEMORY
        - CODEX_CONTEXT_SOURCE_KIND_URL
        - CODEX_CONTEXT_SOURCE_KIND_CEREBRO_THING
        - CODEX_CONTEXT_SOURCE_KIND_CEREBRO_FACT
        - CODEX_CONTEXT_SOURCE_KIND_CEREBRO_EVENT
        - CODEX_CONTEXT_SOURCE_KIND_CEREBRO_ACTION
        - CODEX_CONTEXT_SOURCE_KIND_CEREBRO_PREDICTION
        - CODEX_CONTEXT_SOURCE_KIND_GRANOLA_MEETING
        - CODEX_CONTEXT_SOURCE_KIND_GOOGLE_EMAIL_THREAD
        - CODEX_CONTEXT_SOURCE_KIND_GOOGLE_DRIVE_FILE
        - CODEX_CONTEXT_SOURCE_KIND_GOOGLE_CALENDAR_EVENT
        - CODEX_CONTEXT_SOURCE_KIND_DEPLOYMENT
        - CODEX_CONTEXT_SOURCE_KIND_BUILD
      description: |-
        CodexContextSourceKind names a structured context source enriched before a
         run reaches the worker.
    codex.v1.CodexExecutionIntent:
      type: string
      title: CodexExecutionIntent
      enum:
        - CODEX_EXECUTION_INTENT_UNSPECIFIED
        - CODEX_EXECUTION_INTENT_READ_ONLY_DIAGNOSIS
        - CODEX_EXECUTION_INTENT_PATCH_AND_VERIFY
        - CODEX_EXECUTION_INTENT_REVIEW_ONLY
        - CODEX_EXECUTION_INTENT_TEST_AUTHORING
        - CODEX_EXECUTION_INTENT_EXPLANATION
      description: CodexExecutionIntent captures the expected risk and write profile.
    codex.v1.CodexGitState:
      type: string
      title: CodexGitState
      enum:
        - CODEX_GIT_STATE_UNSPECIFIED
        - CODEX_GIT_STATE_UNCHANGED
        - CODEX_GIT_STATE_DIRTY
        - CODEX_GIT_STATE_COMMITTED
      description: CodexGitState records the repository state without embedding branch prose.
    codex.v1.CodexInteractionType:
      type: string
      title: CodexInteractionType
      enum:
        - CODEX_INTERACTION_TYPE_UNSPECIFIED
        - CODEX_INTERACTION_TYPE_APPROVE_PLAN
        - CODEX_INTERACTION_TYPE_REJECT_PLAN
        - CODEX_INTERACTION_TYPE_APPLY_PATCH
        - CODEX_INTERACTION_TYPE_DISCARD_PATCH
        - CODEX_INTERACTION_TYPE_STOP_TURN
        - CODEX_INTERACTION_TYPE_RETRY_TURN
        - CODEX_INTERACTION_TYPE_FORK_THREAD
        - CODEX_INTERACTION_TYPE_APPROVE_COMMAND
        - CODEX_INTERACTION_TYPE_PROVIDE_INPUT
      description: CodexInteractionType describes a channel-native control action.
    codex.v1.CodexInteractivityMode:
      type: string
      title: CodexInteractivityMode
      enum:
        - CODEX_INTERACTIVITY_MODE_UNSPECIFIED
        - CODEX_INTERACTIVITY_MODE_BACKGROUND
        - CODEX_INTERACTIVITY_MODE_THREAD_CONVERSATION
        - CODEX_INTERACTIVITY_MODE_HUMAN_APPROVAL_GATED
      description: |-
        CodexInteractivityMode controls how much of the run is projected back to a
         human conversation surface.
    codex.v1.CodexMemoryScopeKind:
      type: string
      title: CodexMemoryScopeKind
      enum:
        - CODEX_MEMORY_SCOPE_KIND_UNSPECIFIED
        - CODEX_MEMORY_SCOPE_KIND_THREAD
        - CODEX_MEMORY_SCOPE_KIND_REPOSITORY
        - CODEX_MEMORY_SCOPE_KIND_TEAM
        - CODEX_MEMORY_SCOPE_KIND_WORKSPACE
      description: CodexMemoryScopeKind identifies the retrieval scope for prior run memory.
    codex.v1.CodexOutputKind:
      type: string
      title: CodexOutputKind
      enum:
        - CODEX_OUTPUT_KIND_UNSPECIFIED
        - CODEX_OUTPUT_KIND_THREAD_MESSAGE
        - CODEX_OUTPUT_KIND_PULL_REQUEST
        - CODEX_OUTPUT_KIND_PULL_REQUEST_COMMENT
        - CODEX_OUTPUT_KIND_ARTIFACT
        - CODEX_OUTPUT_KIND_RUN_PANEL
        - CODEX_OUTPUT_KIND_EVALUATION_EXAMPLE
        - CODEX_OUTPUT_KIND_DRAFT_MESSAGE
        - CODEX_OUTPUT_KIND_DECISION_BRIEF
        - CODEX_OUTPUT_KIND_PREPARED_FUTURE
        - CODEX_OUTPUT_KIND_ISSUE
      description: |-
        CodexOutputKind classifies an artifact or external object the run should
         create or synchronize.
    codex.v1.CodexProgressStage:
      type: string
      title: CodexProgressStage
      enum:
        - CODEX_PROGRESS_STAGE_UNSPECIFIED
        - CODEX_PROGRESS_STAGE_ACCEPTED
        - CODEX_PROGRESS_STAGE_CONTEXT_ENRICHING
        - CODEX_PROGRESS_STAGE_PLANNING
        - CODEX_PROGRESS_STAGE_WAITING_FOR_APPROVAL
        - CODEX_PROGRESS_STAGE_EDITING
        - CODEX_PROGRESS_STAGE_TESTING
        - CODEX_PROGRESS_STAGE_CREATING_OUTPUT
        - CODEX_PROGRESS_STAGE_WATCHING_CI
        - CODEX_PROGRESS_STAGE_COMPLETED
        - CODEX_PROGRESS_STAGE_FAILED
        - CODEX_PROGRESS_STAGE_CANCELLED
      description: CodexProgressStage classifies user-visible run progress.
    codex.v1.CodexVerificationStatus:
      type: string
      title: CodexVerificationStatus
      enum:
        - CODEX_VERIFICATION_STATUS_UNSPECIFIED
        - CODEX_VERIFICATION_STATUS_NOT_RUN
        - CODEX_VERIFICATION_STATUS_PASSED
        - CODEX_VERIFICATION_STATUS_FAILED
        - CODEX_VERIFICATION_STATUS_PARTIAL
      description: CodexVerificationStatus records whether the bounded result was verified.
    google.protobuf.NullValue:
      type: string
      title: NullValue
      enum:
        - NULL_VALUE
      description: |-
        `NullValue` is a singleton enumeration to represent the null value for the
         `Value` type union.

         The JSON representation for `NullValue` is JSON `null`.
    codex.v1.CodexApprovalPolicy:
      type: object
      properties:
        dryRun:
          type: boolean
          title: dry_run
        allowWrites:
          type: boolean
          title: allow_writes
        requirePlanApproval:
          type: boolean
          title: require_plan_approval
        requirePatchApproval:
          type: boolean
          title: require_patch_approval
        requireCommandApproval:
          type: boolean
          title: require_command_approval
        protectedPathGlobs:
          type: array
          items:
            type: string
          title: protected_path_globs
        approverEntityIds:
          type: array
          items:
            type: string
          title: approver_entity_ids
        networkEgressAllowlist:
          type: array
          items:
            type: string
          title: network_egress_allowlist
        scrubSecretsFromOutputs:
          type: boolean
          title: scrub_secrets_from_outputs
        sandboxMode:
          type: string
          title: sandbox_mode
        attributes:
          type: object
          title: attributes
          additionalProperties:
            type: string
            title: value
      title: CodexApprovalPolicy
      additionalProperties: false
      description: |-
        CodexApprovalPolicy captures governance controls before a worker performs
         write, network, or otherwise sensitive operations.
    codex.v1.CodexApprovalPolicy.AttributesEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: AttributesEntry
      additionalProperties: false
    codex.v1.CodexBudgetPolicy:
      type: object
      properties:
        maxInputTokens:
          type:
            - integer
            - string
          title: max_input_tokens
          format: int64
        maxOutputTokens:
          type:
            - integer
            - string
          title: max_output_tokens
          format: int64
        maxTotalTokens:
          type:
            - integer
            - string
          title: max_total_tokens
          format: int64
        maxCostMicros:
          type:
            - integer
            - string
          title: max_cost_micros
          format: int64
        maxRunSeconds:
          type: integer
          title: max_run_seconds
          format: int32
        maxToolCalls:
          type: integer
          title: max_tool_calls
          format: int32
        maxRetries:
          type: integer
          title: max_retries
          format: int32
      title: CodexBudgetPolicy
      additionalProperties: false
      description: CodexBudgetPolicy defines per-run resource limits.
    codex.v1.CodexContextItem:
      type: object
      properties:
        sourceKind:
          title: source_kind
          $ref: '#/components/schemas/codex.v1.CodexContextSourceKind'
        id:
          type: string
          title: id
        uri:
          type: string
          title: uri
        title:
          type: string
          title: title
        text:
          type: string
          title: text
        contentType:
          type: string
          title: content_type
        digest:
          type: string
          title: digest
        attributes:
          type: object
          title: attributes
          additionalProperties:
            type: string
            title: value
      title: CodexContextItem
      additionalProperties: false
      description: CodexContextItem is a single enriched context object available to the run.
    codex.v1.CodexContextItem.AttributesEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: AttributesEntry
      additionalProperties: false
    codex.v1.CodexConversationRef:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
        appServerThreadId:
          type: string
          title: app_server_thread_id
        previousRunId:
          type: string
          title: previous_run_id
        parentRunId:
          type: string
          title: parent_run_id
        followupToTurnId:
          type: string
          title: followup_to_turn_id
        channelThreadId:
          type: string
          title: channel_thread_id
        channelMessageId:
          type: string
          title: channel_message_id
        keepSessionAlive:
          type: boolean
          title: keep_session_alive
        attributes:
          type: object
          title: attributes
          additionalProperties:
            type: string
            title: value
      title: CodexConversationRef
      additionalProperties: false
      description: CodexConversationRef carries durable session coordinates across turns.
    codex.v1.CodexConversationRef.AttributesEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: AttributesEntry
      additionalProperties: false
    codex.v1.CodexInteractionDecision:
      type: object
      properties:
        interactionType:
          title: interaction_type
          $ref: '#/components/schemas/codex.v1.CodexInteractionType'
        decision:
          type: string
          title: decision
        reason:
          type: string
          title: reason
        actorEntityId:
          type: string
          title: actor_entity_id
        selectedChoice:
          type: string
          title: selected_choice
        payload:
          title: payload
          $ref: '#/components/schemas/google.protobuf.Struct'
        attributes:
          type: object
          title: attributes
          additionalProperties:
            type: string
            title: value
      title: CodexInteractionDecision
      additionalProperties: false
      description: CodexInteractionDecision captures the user's response to a Codex control.
    codex.v1.CodexInteractionDecision.AttributesEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: AttributesEntry
      additionalProperties: false
    codex.v1.CodexInteractionRequest:
      type: object
      properties:
        interactionType:
          title: interaction_type
          $ref: '#/components/schemas/codex.v1.CodexInteractionType'
        runId:
          type: string
          title: run_id
        waitId:
          type: string
          title: wait_id
        stepId:
          type: string
          title: step_id
        artifactId:
          type: string
          title: artifact_id
        patchId:
          type: string
          title: patch_id
        prompt:
          type: string
          title: prompt
        choices:
          type: array
          items:
            type: string
          title: choices
        payload:
          title: payload
          $ref: '#/components/schemas/google.protobuf.Struct'
        expiresAt:
          title: expires_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        attributes:
          type: object
          title: attributes
          additionalProperties:
            type: string
            title: value
      title: CodexInteractionRequest
      additionalProperties: false
      description: |-
        CodexInteractionRequest describes a pending human decision projected to a
         channel surface.
    codex.v1.CodexInteractionRequest.AttributesEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: AttributesEntry
      additionalProperties: false
    codex.v1.CodexMemoryScope:
      type: object
      properties:
        kind:
          title: kind
          $ref: '#/components/schemas/codex.v1.CodexMemoryScopeKind'
        key:
          type: string
          title: key
        retentionDays:
          type: integer
          title: retention_days
          format: int32
        attributes:
          type: object
          title: attributes
          additionalProperties:
            type: string
            title: value
      title: CodexMemoryScope
      additionalProperties: false
      description: CodexMemoryScope describes what prior run knowledge should be retrieved.
    codex.v1.CodexMemoryScope.AttributesEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: AttributesEntry
      additionalProperties: false
    codex.v1.CodexOutcomeSignal:
      type: object
      properties:
        runId:
          type: string
          title: run_id
        pullRequestUrl:
          type: string
          title: pull_request_url
        merged:
          type: boolean
          title: merged
        reverted:
          type: boolean
          title: reverted
        humanEdited:
          type: boolean
          title: human_edited
        channelReaction:
          type: string
          title: channel_reaction
        reviewOutcome:
          type: string
          title: review_outcome
        observedAt:
          title: observed_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        attributes:
          type: object
          title: attributes
          additionalProperties:
            type: string
            title: value
      title: CodexOutcomeSignal
      additionalProperties: false
      description: CodexOutcomeSignal feeds evaluation and routing loops after the run.
    codex.v1.CodexOutcomeSignal.AttributesEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: AttributesEntry
      additionalProperties: false
    codex.v1.CodexOutputTarget:
      type: object
      properties:
        kind:
          title: kind
          $ref: '#/components/schemas/codex.v1.CodexOutputKind'
        id:
          type: string
          title: id
        uri:
          type: string
          title: uri
        title:
          type: string
          title: title
        draft:
          type: boolean
          title: draft
        attributes:
          type: object
          title: attributes
          additionalProperties:
            type: string
            title: value
      title: CodexOutputTarget
      additionalProperties: false
      description: CodexOutputTarget describes a desired or produced external output.
    codex.v1.CodexOutputTarget.AttributesEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: AttributesEntry
      additionalProperties: false
    codex.v1.CodexPreparedFutureRef:
      type: object
      properties:
        preparedFutureId:
          type: string
          title: prepared_future_id
        cerebroActionId:
          type: string
          title: cerebro_action_id
        cerebroPredictionId:
          type: string
          title: cerebro_prediction_id
        cerebroFactIds:
          type: array
          items:
            type: string
          title: cerebro_fact_ids
        sourceRecordIds:
          type: array
          items:
            type: string
          title: source_record_ids
        artifactIds:
          type: array
          items:
            type: string
          title: artifact_ids
        approvalRequestIds:
          type: array
          items:
            type: string
          title: approval_request_ids
        evidenceUri:
          type: string
          title: evidence_uri
        sourceHealth:
          type: string
          title: source_health
        riskLevel:
          type: string
          title: risk_level
        attributes:
          type: object
          title: attributes
          additionalProperties:
            type: string
            title: value
      title: CodexPreparedFutureRef
      additionalProperties: false
      description: |-
        CodexPreparedFutureRef ties a Codex run to the reviewable next move it is
         preparing. It is a grouping contract, not an approval or execution grant.
    codex.v1.CodexPreparedFutureRef.AttributesEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: AttributesEntry
      additionalProperties: false
    codex.v1.CodexRoutingPolicy:
      type: object
      properties:
        backend:
          title: backend
          $ref: '#/components/schemas/codex.v1.CodexBackend'
        workerQueue:
          type: string
          title: worker_queue
        modelTier:
          type: string
          title: model_tier
        preferredAgentId:
          type: string
          title: preferred_agent_id
        attributes:
          type: object
          title: attributes
          additionalProperties:
            type: string
            title: value
      title: CodexRoutingPolicy
      additionalProperties: false
      description: CodexRoutingPolicy captures backend and worker selection.
    codex.v1.CodexRoutingPolicy.AttributesEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: AttributesEntry
      additionalProperties: false
    codex.v1.CodexRunProgress:
      type: object
      properties:
        stage:
          title: stage
          $ref: '#/components/schemas/codex.v1.CodexProgressStage'
        safeSummary:
          type: string
          title: safe_summary
        progressPercent:
          type: integer
          title: progress_percent
          maximum: 100
          format: int32
        filesRead:
          type: integer
          title: files_read
          format: int32
        filesChanged:
          type: integer
          title: files_changed
          format: int32
        commandsRun:
          type: integer
          title: commands_run
          format: int32
        inputTokens:
          type:
            - integer
            - string
          title: input_tokens
          format: int64
        outputTokens:
          type:
            - integer
            - string
          title: output_tokens
          format: int64
        estimatedCostMicros:
          type:
            - integer
            - string
          title: estimated_cost_micros
          format: int64
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        attributes:
          type: object
          title: attributes
          additionalProperties:
            type: string
            title: value
      title: CodexRunProgress
      additionalProperties: false
      description: CodexRunProgress is the compact, user-visible progress projection.
    codex.v1.CodexRunProgress.AttributesEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: AttributesEntry
      additionalProperties: false
    codex.v1.CodexWorkRequest:
      type: object
      properties:
        actionType:
          title: action_type
          $ref: '#/components/schemas/codex.v1.CodexActionType'
        executionIntent:
          title: execution_intent
          $ref: '#/components/schemas/codex.v1.CodexExecutionIntent'
        prompt:
          type: string
          title: prompt
        repo:
          type: string
          title: repo
        cwd:
          type: string
          title: cwd
        branch:
          type: string
          title: branch
        baseBranch:
          type: string
          title: base_branch
        tenantId:
          type: string
          title: tenant_id
        reason:
          type: string
          title: reason
        conversation:
          title: conversation
          $ref: '#/components/schemas/codex.v1.CodexConversationRef'
        routing:
          title: routing
          $ref: '#/components/schemas/codex.v1.CodexRoutingPolicy'
        budget:
          title: budget
          $ref: '#/components/schemas/codex.v1.CodexBudgetPolicy'
        approvalPolicy:
          title: approval_policy
          $ref: '#/components/schemas/codex.v1.CodexApprovalPolicy'
        interactivityMode:
          title: interactivity_mode
          $ref: '#/components/schemas/codex.v1.CodexInteractivityMode'
        contextItems:
          type: array
          items:
            $ref: '#/components/schemas/codex.v1.CodexContextItem'
          title: context_items
        desiredOutputs:
          type: array
          items:
            $ref: '#/components/schemas/codex.v1.CodexOutputTarget'
          title: desired_outputs
        memoryScopes:
          type: array
          items:
            $ref: '#/components/schemas/codex.v1.CodexMemoryScope'
          title: memory_scopes
        attributes:
          type: object
          title: attributes
          additionalProperties:
            type: string
            title: value
        preparedFuture:
          title: prepared_future
          $ref: '#/components/schemas/codex.v1.CodexPreparedFutureRef'
        resourceId:
          type: string
          title: resource_id
          maxLength: 512
          pattern: ^$|^[^/\\:][^\\:]*$|^[A-Za-z][A-Za-z0-9+.-]+:([^A-Za-z/\\][^\\]*|[A-Za-z]([^:\\][^\\]*)?)$
          description: |-
            Stable Platform resource identity. Local absolute paths are forbidden,
             including drive-root forms after local schemes (e.g. file:C:/Windows).
        requestedAuthority:
          title: requested_authority
          $ref: '#/components/schemas/codex.v1.CodexAuthorityScope'
      title: CodexWorkRequest
      additionalProperties: false
      description: |+
        CodexWorkRequest is the typed payload for Slack, GitHub, Linear, CLI, IDE,
         and monitoring-triggered Codex work.
        resource_id must not be an absolute local path:
        ```
        this.resource_id == '' || (!this.resource_id.startsWith('/') && !this.resource_id.startsWith('\\') && !this.resource_id.matches('^[A-Za-z]:[/\\\\].*') && !this.resource_id.matches('^[A-Za-z][A-Za-z0-9+.-]*:[A-Za-z]:.*'))
        ```

    codex.v1.CodexWorkRequest.AttributesEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: AttributesEntry
      additionalProperties: false
    codex.v1.CodexWorkResult:
      type: object
      properties:
        outcome:
          type: string
          title: outcome
          maxLength: 256
          minLength: 1
        summary:
          type: string
          title: summary
          maxLength: 8192
          minLength: 1
        findings:
          type: array
          items:
            type: string
            maxLength: 1024
            maxItems: 64
          title: findings
          maxItems: 64
        changedFiles:
          type: array
          items:
