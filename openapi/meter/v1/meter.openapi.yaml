      description: |-
        WideEventAttributes declares every metadata key a wide event may carry.

         IngestWideEventRequest.metadata is a google.protobuf.Struct, so the wire
         format cannot constrain its keys. This message is the declaration of record:
         one field per allowed key, each carrying its data classification.
         scripts/gen-classification-manifest.py projects it into
         gen/classification/manifest.json, and the meter ingest path drops any
         metadata key the manifest does not name.

