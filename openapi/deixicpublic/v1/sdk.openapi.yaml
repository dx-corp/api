      type: object
      oneOf:
        - properties:
            artifact:
              title: artifact
              $ref: '#/components/schemas/deixicpublic.v1.BusinessArtifactReference'
          title: artifact
          required:
            - artifact
        - properties:
            boolean:
              type: boolean
              title: boolean
          title: boolean
          required:
            - boolean
        - properties:
            date:
              type: string
              title: date
          title: date
          required:
            - date
        - properties:
            decimal:
              type: string
              title: decimal
          title: decimal
          required:
            - decimal
        - properties:
            enumValue:
              type: string
              title: enum_value
          title: enum_value
          required:
            - enumValue
        - properties:
            integer:
              type:
                - integer
                - string
              title: integer
              format: int64
          title: integer
          required:
            - integer
        - properties:
            money:
              title: money
