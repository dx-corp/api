          title: text_list
          required:
            - textList
        - properties:
            timestamp:
              type: string
              title: timestamp
          title: timestamp
          required:
            - timestamp
      properties:
        artifact:
          title: artifact
          $ref: '#/components/schemas/deixicpublic.v1.BusinessArtifactReference'
        boolean:
          type: boolean
          title: boolean
        date:
          type: string
          title: date
