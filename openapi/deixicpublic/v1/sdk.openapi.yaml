          title: money
          required:
            - money
        - properties:
            reference:
              title: reference
              $ref: '#/components/schemas/deixicpublic.v1.BusinessObjectReference'
          title: reference
          required:
            - reference
        - properties:
            text:
              type: string
              title: text
          title: text
          required:
            - text
        - properties:
            textList:
              title: text_list
