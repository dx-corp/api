        - CLIENT_RULE_SCOPE_WORKSPACE
    deixicpublic.v1.EventKind:
      type: string
      title: EventKind
      enum:
        - EVENT_KIND_UNSPECIFIED
        - EVENT_KIND_TURN_ACCEPTED
        - EVENT_KIND_TURN_STARTED
        - EVENT_KIND_PROGRESS
        - EVENT_KIND_APPROVAL_REQUIRED
        - EVENT_KIND_INPUT_REQUIRED
        - EVENT_KIND_ARTIFACT_RECORDED
        - EVENT_KIND_TURN_COMPLETED
        - EVENT_KIND_TURN_FAILED
        - EVENT_KIND_TURN_INTERRUPTED
        - EVENT_KIND_CLIENT_TOOL_REQUIRED
        - EVENT_KIND_EXTERNAL_RETRY_REQUIRED
    deixicpublic.v1.MessageRole:
      type: string
      title: MessageRole
      enum:
        - MESSAGE_ROLE_UNSPECIFIED
        - MESSAGE_ROLE_USER
        - MESSAGE_ROLE_ASSISTANT
        - MESSAGE_ROLE_SYSTEM
    deixicpublic.v1.ModelNextAction:
      type: string
      title: ModelNextAction
      enum:
        - MODEL_NEXT_ACTION_UNSPECIFIED
        - MODEL_NEXT_ACTION_CONTACT_ADMINISTRATOR
        - MODEL_NEXT_ACTION_VIEW_FUNDING
        - MODEL_NEXT_ACTION_RETRY
    deixicpublic.v1.ModelReadinessState:
      type: string
      title: ModelReadinessState
      enum:
        - MODEL_READINESS_STATE_UNSPECIFIED
        - MODEL_READINESS_STATE_READY
        - MODEL_READINESS_STATE_ACTIVATION_REQUIRED
        - MODEL_READINESS_STATE_FUNDING_REQUIRED
        - MODEL_READINESS_STATE_LIMIT_REACHED
        - MODEL_READINESS_STATE_ACCESS_SUSPENDED
        - MODEL_READINESS_STATE_TEMPORARILY_UNAVAILABLE
      description: |-
        Model readiness is an application-level decision; billing and routing
         implementation details stay behind this projection.
    deixicpublic.v1.ReceiptState:
      type: string
      title: ReceiptState
      enum:
        - RECEIPT_STATE_UNSPECIFIED
        - RECEIPT_STATE_UNKNOWN
        - RECEIPT_STATE_PROPOSED
        - RECEIPT_STATE_QUEUED
        - RECEIPT_STATE_WAITING_APPROVAL
        - RECEIPT_STATE_BLOCKED
        - RECEIPT_STATE_NEEDS_INPUT
        - RECEIPT_STATE_UNAVAILABLE
        - RECEIPT_STATE_RUNNING
        - RECEIPT_STATE_SUCCEEDED
        - RECEIPT_STATE_VERIFIED
        - RECEIPT_STATE_DENIED
        - RECEIPT_STATE_CANCELLED
        - RECEIPT_STATE_FAILED
    deixicpublic.v1.RequestKind:
      type: string
      title: RequestKind
      enum:
        - REQUEST_KIND_UNSPECIFIED
        - REQUEST_KIND_APPROVAL
        - REQUEST_KIND_USER_INPUT
        - REQUEST_KIND_CLIENT_TOOL
        - REQUEST_KIND_EXTERNAL_RETRY
    deixicpublic.v1.ResponseAction:
      type: string
      title: ResponseAction
      enum:
        - RESPONSE_ACTION_UNSPECIFIED
        - RESPONSE_ACTION_APPROVE
        - RESPONSE_ACTION_DENY
        - RESPONSE_ACTION_ANSWER
        - RESPONSE_ACTION_RETRY
        - RESPONSE_ACTION_SKIP
        - RESPONSE_ACTION_ABORT
    deixicpublic.v1.TurnState:
      type: string
      title: TurnState
      enum:
        - TURN_STATE_UNSPECIFIED
        - TURN_STATE_ACCEPTED
        - TURN_STATE_RUNNING
        - TURN_STATE_WAITING
        - TURN_STATE_RESPONDED
        - TURN_STATE_COMPLETED
        - TURN_STATE_FAILED
        - TURN_STATE_INTERRUPTED
    deixicpublic.v1.WaitingReason:
      type: string
      title: WaitingReason
      enum:
        - WAITING_REASON_UNSPECIFIED
        - WAITING_REASON_APPROVAL
        - WAITING_REASON_USER_INPUT
        - WAITING_REASON_CLIENT_TOOL
        - WAITING_REASON_EXTERNAL_RETRY
    deixicpublic.v1.ArchiveThreadRequest:
      type: object
      properties:
        scope:
          title: scope
          $ref: '#/components/schemas/deixicpublic.v1.Scope'
        threadId:
          type: string
          title: thread_id
        archived:
          type: boolean
          title: archived
        idempotencyKey:
          type: string
          title: idempotency_key
      title: ArchiveThreadRequest
      additionalProperties: false
    deixicpublic.v1.ArchiveThreadResponse:
      type: object
      properties:
        thread:
          title: thread
