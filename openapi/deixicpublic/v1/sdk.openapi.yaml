        changed:
          type: boolean
          title: changed
        replayed:
          type: boolean
          title: replayed
      title: ArchiveThreadResponse
      additionalProperties: false
    deixicpublic.v1.AvailableModel:
      type: object
      properties:
        provider:
          type: string
          title: provider
        model:
          type: string
          title: model
        ready:
          type: boolean
          title: ready
        displayName:
          type: string
          title: display_name
      title: AvailableModel
      additionalProperties: false
    deixicpublic.v1.BusinessArtifactReference:
