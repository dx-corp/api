openapi: 3.1.0
info:
  title: orbcontrol.v1
paths:
  /orbcontrol.v1.OrbControlOwnerService/SubmitOrbCommand:
    post:
      tags:
        - orbcontrol.v1.OrbControlOwnerService
      summary: SubmitOrbCommand
      description: SubmitOrbCommand accepts or replays one exact lifecycle command.
      operationId: orbcontrol.v1.OrbControlOwnerService.SubmitOrbCommand
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orbcontrol.v1.SubmitOrbCommandRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orbcontrol.v1.SubmitOrbCommandResponse'
  /orbcontrol.v1.OrbControlOwnerService/GetOrbObservedState:
    post:
      tags:
        - orbcontrol.v1.OrbControlOwnerService
      summary: GetOrbObservedState
      description: GetOrbObservedState returns the runtime owner's current fenced projection.
      operationId: orbcontrol.v1.OrbControlOwnerService.GetOrbObservedState
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orbcontrol.v1.GetOrbObservedStateRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orbcontrol.v1.GetOrbObservedStateResponse'
  /orbcontrol.v1.OrbControlOwnerService/StreamOrbEvents:
    post:
      tags:
        - orbcontrol.v1.OrbControlOwnerService
      summary: StreamOrbEvents
      description: StreamOrbEvents returns a bounded page from the tenant-wide durable cursor.
      operationId: orbcontrol.v1.OrbControlOwnerService.StreamOrbEvents
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orbcontrol.v1.StreamOrbEventsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orbcontrol.v1.StreamOrbEventsResponse'
components:
  schemas:
    orbcontrol.v1.OrbCommandAcceptance:
      type: string
      title: OrbCommandAcceptance
      enum:
        - ORB_COMMAND_ACCEPTANCE_UNSPECIFIED
        - ORB_COMMAND_ACCEPTANCE_ACCEPTED
        - ORB_COMMAND_ACCEPTANCE_REPLAYED
        - ORB_COMMAND_ACCEPTANCE_REJECTED
      description: OrbCommandAcceptance distinguishes a new acceptance from an exact replay.
    orbcontrol.v1.OrbCommandKind:
      type: string
      title: OrbCommandKind
      enum:
        - ORB_COMMAND_KIND_UNSPECIFIED
        - ORB_COMMAND_KIND_WAKE
        - ORB_COMMAND_KIND_STOP
      description: OrbCommandKind is the first supported Platform-owned lifecycle command set.
    orbcontrol.v1.OrbControlEventKind:
      type: string
      title: OrbControlEventKind
      enum:
        - ORB_CONTROL_EVENT_KIND_UNSPECIFIED
        - ORB_CONTROL_EVENT_KIND_SNAPSHOT
        - ORB_CONTROL_EVENT_KIND_COMMAND_ACCEPTED
        - ORB_CONTROL_EVENT_KIND_LIFECYCLE_CHANGED
        - ORB_CONTROL_EVENT_KIND_COMMAND_COMPLETED
        - ORB_CONTROL_EVENT_KIND_COMMAND_FAILED
      description: OrbControlEventKind identifies durable owner observations.
    orbcontrol.v1.OrbObservedLifecycle:
      type: string
      title: OrbObservedLifecycle
      enum:
        - ORB_OBSERVED_LIFECYCLE_UNSPECIFIED
        - ORB_OBSERVED_LIFECYCLE_SLEEPING
        - ORB_OBSERVED_LIFECYCLE_WAKING
        - ORB_OBSERVED_LIFECYCLE_READY
        - ORB_OBSERVED_LIFECYCLE_WORKING
        - ORB_OBSERVED_LIFECYCLE_WAITING_FOR_YOU
        - ORB_OBSERVED_LIFECYCLE_RECOVERING
        - ORB_OBSERVED_LIFECYCLE_OFFLINE
      description: OrbObservedLifecycle is the runtime owner's customer-safe lifecycle state.
    google.protobuf.Timestamp:
      type: string
      examples:
        - 1s
        - 1.000340012s
      format: date-time
      description: |-
        A Timestamp represents a point in time independent of any time zone or local
         calendar, encoded as a count of seconds and fractions of seconds at
         nanosecond resolution. The count is relative to an epoch at UTC midnight on
         January 1, 1970, in the proleptic Gregorian calendar which extends the
         Gregorian calendar backwards to year one.

         All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
         second table is needed for interpretation, using a [24-hour linear
         smear](https://developers.google.com/time/smear).

         The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
         restricting to that range, we ensure that we can convert to and from [RFC
         3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

         # Examples

         Example 1: Compute Timestamp from POSIX `time()`.

             Timestamp timestamp;
             timestamp.set_seconds(time(NULL));
             timestamp.set_nanos(0);

         Example 2: Compute Timestamp from POSIX `gettimeofday()`.

             struct timeval tv;
             gettimeofday(&tv, NULL);

             Timestamp timestamp;
             timestamp.set_seconds(tv.tv_sec);
             timestamp.set_nanos(tv.tv_usec * 1000);

         Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

             FILETIME ft;
             GetSystemTimeAsFileTime(&ft);
             UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

             // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
             // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
             Timestamp timestamp;
             timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
             timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

         Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

             long millis = System.currentTimeMillis();

             Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                 .setNanos((int) ((millis % 1000) * 1000000)).build();

         Example 5: Compute Timestamp from Java `Instant.now()`.

             Instant now = Instant.now();

             Timestamp timestamp =
                 Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                     .setNanos(now.getNano()).build();

         Example 6: Compute Timestamp from current time in Python.

             timestamp = Timestamp()
             timestamp.GetCurrentTime()

         # JSON Mapping

         In JSON format, the Timestamp type is encoded as a string in the
         [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
         format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
         where {year} is always expressed using four digits while {month}, {day},
         {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
         seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
         are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
         is required. A proto3 JSON serializer should always use UTC (as indicated by
         "Z") when printing the Timestamp type and a proto3 JSON parser should be
         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
    orbcontrol.v1.GetOrbObservedStateRequest:
      type: object
      properties:
        organizationId:
          type: string
          title: organization_id
          minLength: 1
        workspaceId:
          type: string
          title: workspace_id
          minLength: 1
        targetId:
          type: string
          title: target_id
          minLength: 1
      title: GetOrbObservedStateRequest
      additionalProperties: false
      description: GetOrbObservedStateRequest selects one tenant-scoped runtime target.
    orbcontrol.v1.GetOrbObservedStateResponse:
      type: object
      properties:
        state:
          title: state
          $ref: '#/components/schemas/orbcontrol.v1.OrbObservedState'
      title: GetOrbObservedStateResponse
      required:
        - state
      additionalProperties: false
      description: GetOrbObservedStateResponse returns one authoritative runtime projection.
    orbcontrol.v1.OrbCommand:
      type: object
      properties:
        kind:
          not:
            enum:
              - 0
          title: kind
          $ref: '#/components/schemas/orbcontrol.v1.OrbCommandKind'
      title: OrbCommand
      additionalProperties: false
      description: OrbCommand is the normalized mutation payload persisted by both planes.
    orbcontrol.v1.OrbControlEvent:
      type: object
      properties:
        sequence:
          type:
            - integer
            - string
          title: sequence
          format: int64
        eventId:
          type: string
          title: event_id
        targetId:
          type: string
          title: target_id
        generation:
          type:
            - integer
            - string
          title: generation
          format: int64
        observedRevision:
          type:
            - integer
            - string
          title: observed_revision
          format: int64
        kind:
          title: kind
          $ref: '#/components/schemas/orbcontrol.v1.OrbControlEventKind'
        state:
          title: state
          $ref: '#/components/schemas/orbcontrol.v1.OrbObservedState'
        operationId:
          type: string
          title: operation_id
        commandId:
          type: string
          title: command_id
        reasonCode:
          type: string
          title: reason_code
        occurredAt:
          title: occurred_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: OrbControlEvent
      additionalProperties: false
      description: OrbControlEvent is one workspace-ordered observed-state transition.
    orbcontrol.v1.OrbObservedState:
      type: object
      properties:
        targetId:
          type: string
          title: target_id
        displayName:
          type: string
          title: display_name
        lifecycle:
          title: lifecycle
          $ref: '#/components/schemas/orbcontrol.v1.OrbObservedLifecycle'
        generation:
          type:
            - integer
            - string
          title: generation
          format: int64
        observedRevision:
          type:
            - integer
            - string
          title: observed_revision
          format: int64
        lastEventSequence:
          type:
            - integer
            - string
          title: last_event_sequence
          format: int64
        residentAgent:
          type: string
          title: resident_agent
        provisioner:
          type: string
          title: provisioner
        activeOperationId:
          type: string
          title: active_operation_id
        observedAt:
          title: observed_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: OrbObservedState
      additionalProperties: false
      description: OrbObservedState is the authoritative runtime projection for one target.
    orbcontrol.v1.StreamOrbEventsRequest:
      type: object
      properties:
        organizationId:
          type: string
          title: organization_id
          minLength: 1
        workspaceId:
          type: string
          title: workspace_id
          minLength: 1
        afterSequence:
          type:
            - integer
            - string
          title: after_sequence
          format: int64
        limit:
          type: integer
          title: limit
          maximum: 500
      title: StreamOrbEventsRequest
      additionalProperties: false
      description: StreamOrbEventsRequest resumes a tenant-wide cursor after one sequence.
    orbcontrol.v1.StreamOrbEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/orbcontrol.v1.OrbControlEvent'
          title: events
          maxItems: 500
        nextSequence:
          type:
            - integer
            - string
          title: next_sequence
          format: int64
        hasMore:
          type: boolean
          title: has_more
      title: StreamOrbEventsResponse
      additionalProperties: false
      description: StreamOrbEventsResponse is a bounded durable cursor page.
    orbcontrol.v1.SubmitOrbCommandRequest:
      type: object
      properties:
        organizationId:
          type: string
          title: organization_id
          minLength: 1
        workspaceId:
          type: string
          title: workspace_id
          minLength: 1
        targetId:
          type: string
          title: target_id
          minLength: 1
        idempotencyKey:
          type: string
          title: idempotency_key
          minLength: 1
        lineageId:
          type: string
          title: lineage_id
          minLength: 1
        operationId:
          type: string
          title: operation_id
          minLength: 1
        expectedGeneration:
          type:
            - integer
            - string
          title: expected_generation
          format: int64
        command:
          title: command
          $ref: '#/components/schemas/orbcontrol.v1.OrbCommand'
      title: SubmitOrbCommandRequest
      required:
        - command
      additionalProperties: false
      description: SubmitOrbCommandRequest carries one exact tenant-scoped owner command.
    orbcontrol.v1.SubmitOrbCommandResponse:
      type: object
      properties:
        acceptance:
          title: acceptance
          $ref: '#/components/schemas/orbcontrol.v1.OrbCommandAcceptance'
        commandId:
          type: string
          title: command_id
        operationId:
          type: string
          title: operation_id
        idempotencyKey:
          type: string
          title: idempotency_key
        acceptedGeneration:
          type:
            - integer
            - string
          title: accepted_generation
          format: int64
        observedRevision:
          type:
            - integer
            - string
          title: observed_revision
          format: int64
        eventSequence:
          type:
            - integer
            - string
          title: event_sequence
          format: int64
        reasonCode:
          type: string
          title: reason_code
      title: SubmitOrbCommandResponse
      additionalProperties: false
      description: SubmitOrbCommandResponse acknowledges ownership without claiming completion.
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        detail:
          $ref: '#/components/schemas/google.protobuf.Any'
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    google.protobuf.Any:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
          format: binary
        debug:
          type: object
          additionalProperties: true
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
security: []
tags:
  - name: orbcontrol.v1.OrbControlOwnerService
    description: |-
      OrbControlOwnerService is the narrow Platform-to-Orb runtime-owner boundary.
       Commands are idempotent and generation-fenced; completion is established by
       observed state and ordered events rather than by submission acknowledgement.
