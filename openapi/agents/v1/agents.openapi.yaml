      title: A2ADelegationTaskControlResult
      additionalProperties: false
    agents.v1.Agent:
      type: object
      properties:
        id:
          type: string
          title: id
        workspaceId:
          type: string
          title: workspace_id
        name:
          type: string
          title: name
        description:
          type: string
          title: description
        agentType:
          type: string
          title: agent_type
          description: |-
            agent_type aligns with identity/v1 IntrospectResponse.agent_type and
             IssueAgentTokenRequest.agent_type. Examples: "sdr", "support", "coding",
             "ops", "research".
        capabilities:
          type: array
          items:
            type: string
          title: capabilities
          description: |-
            capabilities aligns with identity/v1 IntrospectResponse.capabilities and
             IssueAgentTokenRequest.capabilities. Used by capability-based delegation
             routing. Examples: "hubspot-write", "email-send", "code-review".
        surfaces:
          type: array
          items:
            type: string
          title: surfaces
          description: |-
            surfaces this agent can operate on. Aligns with the surface field in
             meter/v1, objectives/v1, approvals/v1. Examples: "ensemble", "chat",
             "maestro", "conductor", "slack".
        status:
          title: status
          $ref: '#/components/schemas/agents.v1.AgentStatus'
        activeConfigVersion:
          type: integer
          title: active_config_version
          format: int32
        ownerId:
          type: string
          title: owner_id
        lastHeartbeatAt:
          title: last_heartbeat_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        surfaceTypes:
          type: array
          items:
            $ref: '#/components/schemas/common.v1.Surface'
          title: surface_types
        a2a:
          title: a2a
          description: |-
            a2a is the Platform-owned discovery projection for spec-native A2A peers.
             Remote agents use it to discover where to fetch the Agent Card, which
             transport/profile is supported, and which skills can be delegated to this
             agent or its child/subagent lanes.
          $ref: '#/components/schemas/agents.v1.AgentA2APeerProjection'
        capacity:
          title: capacity
          description: |-
            capacity is the registry-owned load projection used by fleet-scale
             delegation discovery and operator read models.
          $ref: '#/components/schemas/agents.v1.AgentCapacity'
      title: Agent
      additionalProperties: false
      description: |-
        Agent is the canonical agent definition record.
         The id field is the value stored in every agent_id / agent string field
         across the platform: meter/v1 RecordUsageRequest.agent_id,
         objectives/v1 Objective.agent_id, approvals/v1 ApprovalRequest.agent_id,
         governance/v1 EvaluateActionRequest.agent_id, memory/v1 Memory.agent,
         and events/v1 Change.actor_id when actor_type is "agent".
    agents.v1.AgentA2APeerProjection:
      type: object
      properties:
        publicEndpointUrl:
          type: string
          title: public_endpoint_url
        internalEndpointUrl:
          type: string
          title: internal_endpoint_url
        agentCardUrl:
          type: string
          title: agent_card_url
        protocolBinding:
          type: string
          title: protocol_binding
        protocolVersion:
          type: string
          title: protocol_version
        supportedExtensions:
          type: array
          items:
            type: string
          title: supported_extensions
        skills:
          type: array
          items:
            $ref: '#/components/schemas/agents.v1.AgentA2ASkill'
          title: skills
        securitySchemes:
          type: array
          items:
            type: string
          title: security_schemes
        agentCardObservedAt:
          title: agent_card_observed_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        agentCardEtag:
          type: string
          title: agent_card_etag
        agentCardHash:
          type: string
          title: agent_card_hash
        pushNotifications:
          type: boolean
          title: push_notifications
        attributes:
          type: object
          title: attributes
          additionalProperties:
            type: string
            title: value
      title: AgentA2APeerProjection
      additionalProperties: false
    agents.v1.AgentA2APeerProjection.AttributesEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: AttributesEntry
      additionalProperties: false
    agents.v1.AgentA2ASkill:
      type: object
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
        description:
          type: string
          title: description
        tags:
          type: array
          items:
            type: string
          title: tags
        inputModes:
          type: array
          items:
            type: string
          title: input_modes
        outputModes:
          type: array
          items:
            type: string
          title: output_modes
        requiredContextGrants:
          type: array
          items:
            type: string
          title: required_context_grants
        approvalPolicyRef:
          type: string
          title: approval_policy_ref
        maxAutonomy:
          type: string
          title: max_autonomy
        requiredArtifactKinds:
          type: array
          items:
            type: string
          title: required_artifact_kinds
        optionalArtifactKinds:
          type: array
          items:
            type: string
          title: optional_artifact_kinds
        allowedTaskClasses:
          type: array
          items:
            type: string
          title: allowed_task_classes
        deniedTaskClasses:
          type: array
          items:
            type: string
          title: denied_task_classes
        attributes:
          type: object
          title: attributes
          additionalProperties:
            type: string
            title: value
      title: AgentA2ASkill
      additionalProperties: false
    agents.v1.AgentA2ASkill.AttributesEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: AttributesEntry
      additionalProperties: false
    agents.v1.AgentCapacity:
      type: object
      properties:
        current:
          type: integer
          title: current
          format: int32
        max:
          type: integer
          title: max
          format: int32
        remaining:
          type: integer
          title: remaining
          format: int32
        reservedDelegationCount:
          type: integer
          title: reserved_delegation_count
          format: int32
      title: AgentCapacity
      additionalProperties: false
    agents.v1.AgentConfig:
      type: object
      properties:
        version:
          type: integer
          title: version
          format: int32
        agentId:
          type: string
          title: agent_id
        skillIds:
          type: array
          items:
            type: string
          title: skill_ids
          description: |-
            skill_ids reference skills/v1 Skill.id — the reusable capabilities
             this agent has loaded.
        promptBindings:
          type: object
          title: prompt_bindings
          additionalProperties:
            type: string
            title: value
          description: |-
            prompt_bindings maps prompt name to label (e.g., "sdr-outreach" -> "production").
             Aligns with prompts/v1 ResolveRequest.name and ResolveRequest.label.
        modelPreferences:
          type: object
          title: model_preferences
          additionalProperties:
            type: string
            title: value
          description: |-
            model_preferences maps surface to preferred model identifier
             (e.g., "ensemble" -> "claude-opus-4.6"). Aligns with meter/v1
             RecordUsageRequest.model and keys/v1 ResolveProviderRefRequest.provider.
        integrationIds:
          type: array
          items:
            type: string
          title: integration_ids
          description: |-
            integration_ids reference connectors/v1 Connection.id — the external
             system connections this agent is authorized to use.
        entityTypeScopes:
          type: array
          items:
            type: string
          title: entity_type_scopes
          description: |-
            entity_type_scopes restrict which entities/v1 EntityType values this
             agent can operate on. Empty means unrestricted.
        maxConcurrentObjectives:
          type: integer
          title: max_concurrent_objectives
          format: int32
          description: |-
            max_concurrent_objectives caps the number of objectives/v1 Objective
             records this agent can hold in RUNNING or BLOCKED state simultaneously.
        costBudgetUsd:
          type: number
          title: cost_budget_usd
          format: double
          description: |-
            cost_budget_usd is the per-period spend ceiling enforced against
             meter/v1 usage records for this agent.
        notificationChannel:
          type: string
          title: notification_channel
          description: |-
            notification_channel specifies the preferred notifications/v1
             DeliveryChannel for this agent's escalations. Stored as string to
             avoid cross-package import (e.g., "DELIVERY_CHANNEL_SLACK").
        parameters:
          title: parameters
          description: parameters holds arbitrary agent-specific tuning knobs.
          $ref: '#/components/schemas/google.protobuf.Struct'
        author:
          type: string
          title: author
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        entityTypeScopeEnums:
          type: array
          items:
            $ref: '#/components/schemas/common.v1.EntityType'
          title: entity_type_scope_enums
        notificationChannelEnum:
          title: notification_channel_enum
          $ref: '#/components/schemas/common.v1.DeliveryChannel'
        teammateProfile:
          title: teammate_profile
          $ref: '#/components/schemas/agents.v1.DigitalTeammateProfile'
      title: AgentConfig
      additionalProperties: false
      description: |-
        AgentConfig is an immutable snapshot of everything that shapes an agent's
         behavior. Promotion and rollback are both config version reassignments —
         the same pattern as prompts/v1 Label.
    agents.v1.AgentConfig.ModelPreferencesEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: ModelPreferencesEntry
      additionalProperties: false
    agents.v1.AgentConfig.PromptBindingsEntry:
      type: object
      properties:
