             capability-based routing through the registry.
        requiredCapability:
          type: string
          title: required_capability
        objectiveId:
          type: string
          title: objective_id
        workflowRunId:
          type: string
          title: workflow_run_id
        workflowStepId:
          type: string
          title: workflow_step_id
        contextPayload:
          type: string
          title: context_payload
          format: byte
        reason:
          type: string
          title: reason
        a2aSkillId:
          type: string
          title: a2a_skill_id
      title: DelegateRequest
      additionalProperties: false
    agents.v1.DelegateResponse:
      type: object
      properties:
        delegation:
          title: delegation
          $ref: '#/components/schemas/agents.v1.DelegationRecord'
      title: DelegateResponse
      additionalProperties: false
    agents.v1.DelegationRecord:
      type: object
      properties:
        id:
          type: string
          title: id
        workspaceId:
          type: string
          title: workspace_id
        fromAgentId:
          type: string
          title: from_agent_id
        toAgentId:
          type: string
          title: to_agent_id
        requiredCapability:
          type: string
          title: required_capability
        objectiveId:
          type: string
          title: objective_id
          description: |-
            objective_id links to the objectives/v1 Objective created for this
             delegated unit of work.
        workflowRunId:
          type: string
          title: workflow_run_id
          description: |-
            workflow_run_id and workflow_step_id link to workflows/v1 when this
             delegation occurs within a workflow execution.
        workflowStepId:
          type: string
          title: workflow_step_id
        status:
          title: status
          $ref: '#/components/schemas/agents.v1.DelegationStatus'
        contextPayload:
          type: string
          title: context_payload
          format: byte
        resultPayload:
          type: string
          title: result_payload
          format: byte
        reason:
          type: string
          title: reason
        errorMessage:
          type: string
          title: error_message
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        resolvedAt:
          title: resolved_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        a2aTaskId:
          type: string
          title: a2a_task_id
        a2aMessageId:
          type: string
          title: a2a_message_id
        a2aEndpointUrl:
          type: string
          title: a2a_endpoint_url
        a2aDispatchStatus:
          type: string
          title: a2a_dispatch_status
        a2aDispatchError:
          type: string
          title: a2a_dispatch_error
        a2aSkillId:
          type: string
          title: a2a_skill_id
        a2aDispatchedAt:
          title: a2a_dispatched_at
          description: |-
            a2a_dispatched_at is the server time when the remote A2A task was first
             accepted by the target transport.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        a2aLeaseRenewedAt:
          title: a2a_lease_renewed_at
          description: |-
            a2a_lease_renewed_at is the last server time Platform observed remote A2A
             progress for this delegation.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        a2aResumeWaitContracts:
          type: array
          items:
            $ref: '#/components/schemas/google.protobuf.Struct'
          title: a2a_resume_wait_contracts
          description: |-
            a2a_resume_wait_contracts are server-derived contracts that an origin
             runtime can use to park the parent run on typed remote A2A callback events
             after the target transport accepts the delegation.
        a2aRootDelegationId:
          type: string
