        requiredJoinKeys:
          type: array
          items:
            type: string
          title: required_join_keys
      title: CommitmentTemplate
      additionalProperties: false
      description: CommitmentTemplate maps a commitment kind to objective and wake templates.
    agents.v1.ControlA2ADelegationTaskRequest:
      type: object
      properties:
        delegationId:
          type: string
          title: delegation_id
          minLength: 1
        mode:
          not:
            enum:
              - 0
          title: mode
          $ref: '#/components/schemas/agents.v1.A2ADelegationTaskControlMode'
        message:
          type: string
          title: message
        idempotencyKey:
          type: string
          title: idempotency_key
        targetRunId:
          type: string
          title: target_run_id
          description: |-
            Optional target selectors allow Platform callers to control a remote
             subagent lane or child run while still fencing the command by the root
             remote task id stored on the delegation.
        childRunId:
          type: string
          title: child_run_id
        subagentLaneId:
          type: string
          title: subagent_lane_id
        workItemId:
          type: string
          title: work_item_id
        payload:
          title: payload
          $ref: '#/components/schemas/google.protobuf.Struct'
        metadata:
          title: metadata
          $ref: '#/components/schemas/google.protobuf.Struct'
      title: ControlA2ADelegationTaskRequest
      additionalProperties: false
    agents.v1.ControlA2ADelegationTaskResponse:
      type: object
