openapi: 3.1.0
info:
  title: agents.v1
paths:
  /agents.v1.AgentService/Register:
    post:
      tags:
        - agents.v1.AgentService
      summary: Register
      description: Register creates a new agent definition.
      operationId: agents.v1.AgentService.Register
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agents.v1.RegisterRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents.v1.RegisterResponse'
  /agents.v1.AgentService/Get:
    post:
      tags:
        - agents.v1.AgentService
      summary: Get
      description: Get retrieves an agent by ID.
      operationId: agents.v1.AgentService.Get
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agents.v1.GetRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents.v1.GetResponse'
  /agents.v1.AgentService/List:
    post:
      tags:
        - agents.v1.AgentService
      summary: List
      description: List returns agents matching the query filters.
      operationId: agents.v1.AgentService.List
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agents.v1.ListRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents.v1.ListResponse'
  /agents.v1.AgentService/Update:
    post:
      tags:
        - agents.v1.AgentService
      summary: Update
      description: Update modifies mutable agent metadata (name, description, surfaces).
      operationId: agents.v1.AgentService.Update
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agents.v1.UpdateRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents.v1.UpdateResponse'
  /agents.v1.AgentService/Deregister:
    post:
      tags:
        - agents.v1.AgentService
      summary: Deregister
      description: Deregister removes an agent from the registry.
      operationId: agents.v1.AgentService.Deregister
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agents.v1.DeregisterRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents.v1.DeregisterResponse'
  /agents.v1.AgentService/PushConfig:
    post:
      tags:
        - agents.v1.AgentService
      summary: PushConfig
      description: |-
        PushConfig creates a new immutable configuration version for an agent.
         The agent's active_config_version advances atomically.
      operationId: agents.v1.AgentService.PushConfig
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agents.v1.PushConfigRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents.v1.PushConfigResponse'
  /agents.v1.AgentService/GetConfig:
    post:
      tags:
        - agents.v1.AgentService
      summary: GetConfig
      description: GetConfig retrieves a specific configuration version.
      operationId: agents.v1.AgentService.GetConfig
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agents.v1.GetConfigRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents.v1.GetConfigResponse'
  /agents.v1.AgentService/ListConfigs:
    post:
      tags:
        - agents.v1.AgentService
      summary: ListConfigs
      description: ListConfigs returns all configuration versions for an agent.
      operationId: agents.v1.AgentService.ListConfigs
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agents.v1.ListConfigsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents.v1.ListConfigsResponse'
  /agents.v1.AgentService/RollbackConfig:
    post:
      tags:
        - agents.v1.AgentService
      summary: RollbackConfig
      description: RollbackConfig atomically reverts an agent to a prior configuration version.
      operationId: agents.v1.AgentService.RollbackConfig
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agents.v1.RollbackConfigRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents.v1.RollbackConfigResponse'
  /agents.v1.AgentService/Delegate:
    post:
      tags:
        - agents.v1.AgentService
      summary: Delegate
      description: |-
        Delegate requests that another agent (or any agent with a matching
         capability) accept a unit of work. The delegation is tracked as a
         DelegationRecord and linked to the originating objective and optional
         workflow step.
      operationId: agents.v1.AgentService.Delegate
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agents.v1.DelegateRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents.v1.DelegateResponse'
  /agents.v1.AgentService/ResolveDelegation:
    post:
      tags:
        - agents.v1.AgentService
      summary: ResolveDelegation
      description: ResolveDelegation records the outcome of a delegation.
      operationId: agents.v1.AgentService.ResolveDelegation
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agents.v1.ResolveDelegationRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents.v1.ResolveDelegationResponse'
  /agents.v1.AgentService/RenewDelegationLease:
    post:
      tags:
        - agents.v1.AgentService
      summary: RenewDelegationLease
      description: |-
        RenewDelegationLease records observed remote progress for an active
         delegation so reserved target capacity is not reaped while work is healthy.
      operationId: agents.v1.AgentService.RenewDelegationLease
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agents.v1.RenewDelegationLeaseRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents.v1.RenewDelegationLeaseResponse'
  /agents.v1.AgentService/ControlA2ADelegationTask:
    post:
      tags:
        - agents.v1.AgentService
      summary: ControlA2ADelegationTask
      description: |-
        ControlA2ADelegationTask sends a fenced operating-plane control request to
         the remote A2A task backing a Platform delegation. This is the Platform
         control surface for steering, collecting from, interrupting, or canceling
         a remote Maestro task or one of its subagent lanes.
      operationId: agents.v1.AgentService.ControlA2ADelegationTask
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agents.v1.ControlA2ADelegationTaskRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents.v1.ControlA2ADelegationTaskResponse'
  /agents.v1.AgentService/GetDelegation:
    post:
      tags:
        - agents.v1.AgentService
      summary: GetDelegation
      description: GetDelegation retrieves a delegation record by ID.
      operationId: agents.v1.AgentService.GetDelegation
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agents.v1.GetDelegationRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents.v1.GetDelegationResponse'
  /agents.v1.AgentService/ListDelegations:
    post:
      tags:
        - agents.v1.AgentService
      summary: ListDelegations
      description: ListDelegations returns delegations matching the query filters.
      operationId: agents.v1.AgentService.ListDelegations
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agents.v1.ListDelegationsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents.v1.ListDelegationsResponse'
  /agents.v1.AgentService/GetA2ADelegationGraph:
    post:
      tags:
        - agents.v1.AgentService
      summary: GetA2ADelegationGraph
      description: |-
        GetA2ADelegationGraph returns the server-owned swarm graph for a remote
         A2A delegation family. Callers may anchor the graph by root delegation id
         or by any child delegation id in the lineage.
      operationId: agents.v1.AgentService.GetA2ADelegationGraph
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agents.v1.GetA2ADelegationGraphRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents.v1.GetA2ADelegationGraphResponse'
  /agents.v1.AgentService/Heartbeat:
    post:
      tags:
        - agents.v1.AgentService
      summary: Heartbeat
      description: |-
        Heartbeat records agent liveness. The registry uses this to maintain
         presence state and route capability-based delegation requests.
      operationId: agents.v1.AgentService.Heartbeat
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agents.v1.HeartbeatRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents.v1.HeartbeatResponse'
components:
  schemas:
    agents.v1.A2ADelegationTaskControlMode:
      type: string
      title: A2ADelegationTaskControlMode
      enum:
        - A2A_DELEGATION_TASK_CONTROL_MODE_UNSPECIFIED
        - A2A_DELEGATION_TASK_CONTROL_MODE_STEER
        - A2A_DELEGATION_TASK_CONTROL_MODE_FOLLOWUP
        - A2A_DELEGATION_TASK_CONTROL_MODE_COLLECT
        - A2A_DELEGATION_TASK_CONTROL_MODE_INTERRUPT
        - A2A_DELEGATION_TASK_CONTROL_MODE_CANCEL
      description: |-
        A2ADelegationTaskControlMode describes the remote task-control action that
         Platform asks the target A2A peer to apply.
    agents.v1.AgentStatus:
      type: string
      title: AgentStatus
      enum:
        - AGENT_STATUS_UNSPECIFIED
        - AGENT_STATUS_ACTIVE
        - AGENT_STATUS_IDLE
        - AGENT_STATUS_BUSY
        - AGENT_STATUS_OFFLINE
        - AGENT_STATUS_DEGRADED
        - AGENT_STATUS_SUSPENDED
      description: AgentStatus describes the operational state of an agent.
    agents.v1.AutonomyAuthority:
      type: string
      title: AutonomyAuthority
      enum:
        - AUTONOMY_AUTHORITY_UNSPECIFIED
        - AUTONOMY_AUTHORITY_OWN
        - AUTONOMY_AUTHORITY_RECOMMEND
        - AUTONOMY_AUTHORITY_REQUIRE_APPROVAL
        - AUTONOMY_AUTHORITY_DENY
      description: AutonomyAuthority describes how independently a teammate may act.
    agents.v1.CommitmentKind:
      type: string
      title: CommitmentKind
      enum:
        - COMMITMENT_KIND_UNSPECIFIED
        - COMMITMENT_KIND_FOLLOW_UP
        - COMMITMENT_KIND_WATCH
        - COMMITMENT_KIND_RETRY
        - COMMITMENT_KIND_SUMMARIZE
        - COMMITMENT_KIND_MONITOR
        - COMMITMENT_KIND_REMEDIATE
        - COMMITMENT_KIND_HANDOFF
      description: CommitmentKind describes the durable commitments a teammate can accept.
    agents.v1.DelegationStatus:
      type: string
      title: DelegationStatus
      enum:
        - DELEGATION_STATUS_UNSPECIFIED
        - DELEGATION_STATUS_PENDING
        - DELEGATION_STATUS_ACCEPTED
        - DELEGATION_STATUS_REJECTED
        - DELEGATION_STATUS_COMPLETED
        - DELEGATION_STATUS_FAILED
        - DELEGATION_STATUS_TIMED_OUT
      description: DelegationStatus describes the lifecycle state of a delegation.
    agents.v1.InitiativeTriggerKind:
      type: string
      title: InitiativeTriggerKind
      enum:
        - INITIATIVE_TRIGGER_KIND_UNSPECIFIED
        - INITIATIVE_TRIGGER_KIND_SCHEDULE
        - INITIATIVE_TRIGGER_KIND_SLACK_EVENT
        - INITIATIVE_TRIGGER_KIND_PLATFORM_EVENT
        - INITIATIVE_TRIGGER_KIND_OBJECTIVE_WAKE
        - INITIATIVE_TRIGGER_KIND_WAIT_RESOLVED
        - INITIATIVE_TRIGGER_KIND_EVAL_REGRESSION
        - INITIATIVE_TRIGGER_KIND_STALLED_WORK
      description: |-
        InitiativeTriggerKind describes events that can let a teammate start work
         without a fresh direct human prompt.
    agents.v1.PresenceEvent:
      type: string
      title: PresenceEvent
      enum:
        - PRESENCE_EVENT_UNSPECIFIED
        - PRESENCE_EVENT_ACCEPTED
        - PRESENCE_EVENT_WAITING
        - PRESENCE_EVENT_PROGRESS
        - PRESENCE_EVENT_BLOCKED
        - PRESENCE_EVENT_COMPLETED
        - PRESENCE_EVENT_FAILED
        - PRESENCE_EVENT_ESCALATED
      description: PresenceEvent describes channel-visible teammate activity.
    agents.v1.TeammateChannelCapability:
      type: string
      title: TeammateChannelCapability
      enum:
        - TEAMMATE_CHANNEL_CAPABILITY_UNSPECIFIED
        - TEAMMATE_CHANNEL_CAPABILITY_INGEST
        - TEAMMATE_CHANNEL_CAPABILITY_RENDER
      description: |-
        TeammateChannelCapability describes what a channel adapter can do for a
         teammate profile.
    agents.v1.TeammateChannelEventKind:
      type: string
      title: TeammateChannelEventKind
      enum:
        - TEAMMATE_CHANNEL_EVENT_KIND_UNSPECIFIED
        - TEAMMATE_CHANNEL_EVENT_KIND_MESSAGE_CREATED
        - TEAMMATE_CHANNEL_EVENT_KIND_THREAD_REPLY_CREATED
        - TEAMMATE_CHANNEL_EVENT_KIND_COMMAND_INVOKED
        - TEAMMATE_CHANNEL_EVENT_KIND_ACTION_INVOKED
        - TEAMMATE_CHANNEL_EVENT_KIND_REACTION_ADDED
        - TEAMMATE_CHANNEL_EVENT_KIND_REACTION_REMOVED
        - TEAMMATE_CHANNEL_EVENT_KIND_ASSISTANT_THREAD_STARTED
        - TEAMMATE_CHANNEL_EVENT_KIND_ASSISTANT_THREAD_CONTEXT_CHANGED
        - TEAMMATE_CHANNEL_EVENT_KIND_EMAIL_RECEIVED
        - TEAMMATE_CHANNEL_EVENT_KIND_CALENDAR_EVENT_CHANGED
        - TEAMMATE_CHANNEL_EVENT_KIND_ISSUE_CHANGED
        - TEAMMATE_CHANNEL_EVENT_KIND_SCHEDULED_WAKE
        - TEAMMATE_CHANNEL_EVENT_KIND_WEBHOOK_RECEIVED
      description: |-
        TeammateChannelEventKind describes normalized inbound channel events that can
         become AgentRuntime triggers.
    agents.v1.TeammateChannelKind:
      type: string
      title: TeammateChannelKind
      enum:
        - TEAMMATE_CHANNEL_KIND_UNSPECIFIED
        - TEAMMATE_CHANNEL_KIND_SLACK
        - TEAMMATE_CHANNEL_KIND_EMAIL
        - TEAMMATE_CHANNEL_KIND_CALENDAR
        - TEAMMATE_CHANNEL_KIND_JIRA
        - TEAMMATE_CHANNEL_KIND_TEAMS
        - TEAMMATE_CHANNEL_KIND_WEB
        - TEAMMATE_CHANNEL_KIND_WEBHOOK
        - TEAMMATE_CHANNEL_KIND_WHATSAPP
        - TEAMMATE_CHANNEL_KIND_APPLE_MESSAGES
      description: |-
        TeammateChannelKind identifies a product or provider channel that can ingest
         user activity or render teammate runtime events. It intentionally lives in
         agents/v1 instead of agentruntime/v1 so teammate profiles can describe
         supported channels without creating a proto import cycle.
    agents.v1.TeammateLifecycle:
      type: string
      title: TeammateLifecycle
      enum:
        - TEAMMATE_LIFECYCLE_UNSPECIFIED
        - TEAMMATE_LIFECYCLE_DRAFT
        - TEAMMATE_LIFECYCLE_ACTIVE
        - TEAMMATE_LIFECYCLE_PAUSED
        - TEAMMATE_LIFECYCLE_DEPRECATED
      description: |-
        TeammateLifecycle describes whether a teammate profile can be used to
         initiate durable work.
    agents.v1.TeammateRuntimeRenderEventKind:
      type: string
      title: TeammateRuntimeRenderEventKind
      enum:
        - TEAMMATE_RUNTIME_RENDER_EVENT_KIND_UNSPECIFIED
        - TEAMMATE_RUNTIME_RENDER_EVENT_KIND_TRIGGER_ACCEPTED
        - TEAMMATE_RUNTIME_RENDER_EVENT_KIND_RUN_STARTED
        - TEAMMATE_RUNTIME_RENDER_EVENT_KIND_PROGRESS
        - TEAMMATE_RUNTIME_RENDER_EVENT_KIND_STEP_STARTED
        - TEAMMATE_RUNTIME_RENDER_EVENT_KIND_STEP_COMPLETED
        - TEAMMATE_RUNTIME_RENDER_EVENT_KIND_OBJECTIVE_UPDATED
        - TEAMMATE_RUNTIME_RENDER_EVENT_KIND_APPROVAL_REQUESTED
        - TEAMMATE_RUNTIME_RENDER_EVENT_KIND_APPROVAL_RESOLVED
        - TEAMMATE_RUNTIME_RENDER_EVENT_KIND_TOOL_PROPOSED
        - TEAMMATE_RUNTIME_RENDER_EVENT_KIND_TOOL_COMPLETED
        - TEAMMATE_RUNTIME_RENDER_EVENT_KIND_ARTIFACT_CREATED
        - TEAMMATE_RUNTIME_RENDER_EVENT_KIND_MEMORY_PROPOSED
        - TEAMMATE_RUNTIME_RENDER_EVENT_KIND_WAITING
        - TEAMMATE_RUNTIME_RENDER_EVENT_KIND_RESUMED
        - TEAMMATE_RUNTIME_RENDER_EVENT_KIND_COMPLETED
        - TEAMMATE_RUNTIME_RENDER_EVENT_KIND_FAILED
      description: |-
        TeammateRuntimeRenderEventKind describes Platform runtime events a channel
         adapter can project back into the provider surface.
    common.v1.DeliveryChannel:
      type: string
      title: DeliveryChannel
      enum:
        - DELIVERY_CHANNEL_UNSPECIFIED
        - DELIVERY_CHANNEL_SLACK
        - DELIVERY_CHANNEL_EMAIL
        - DELIVERY_CHANNEL_WEBHOOK
        - DELIVERY_CHANNEL_IN_APP
        - DELIVERY_CHANNEL_PUSH
      description: DeliveryChannel identifies the notification delivery channel.
    common.v1.EntityType:
      type: string
      title: EntityType
      enum:
        - ENTITY_TYPE_UNSPECIFIED
        - ENTITY_TYPE_CONTACT
        - ENTITY_TYPE_COMPANY
        - ENTITY_TYPE_DEAL
        - ENTITY_TYPE_TICKET
        - ENTITY_TYPE_CUSTOMER
        - ENTITY_TYPE_OPPORTUNITY
      description: EntityType identifies the kind of entity across systems.
    common.v1.RiskLevel:
      type: string
      title: RiskLevel
      enum:
        - RISK_LEVEL_UNSPECIFIED
        - RISK_LEVEL_LOW
        - RISK_LEVEL_MEDIUM
        - RISK_LEVEL_HIGH
        - RISK_LEVEL_CRITICAL
      description: RiskLevel classifies the risk of an action.
    common.v1.Surface:
      type: string
      title: Surface
      enum:
        - SURFACE_UNSPECIFIED
        - SURFACE_ENSEMBLE
        - SURFACE_CHAT
        - SURFACE_MAESTRO
        - SURFACE_CONDUCTOR
        - SURFACE_SLACK
        - SURFACE_EXTERNAL_AGENT
      description: |-
        Surface identifies the product or channel surface that originated a platform
         action. It is shared by runtime, audit, and product-facing services so
         callers do not invent drift-prone string labels.
    google.protobuf.NullValue:
      type: string
      title: NullValue
      enum:
        - NULL_VALUE
      description: |-
        `NullValue` is a singleton enumeration to represent the null value for the
         `Value` type union.

         The JSON representation for `NullValue` is JSON `null`.
    agents.v1.A2ADelegationGraphEdge:
