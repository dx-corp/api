          title: reason
        workspaceId:
          type: string
          title: workspace_id
        capability:
          type: string
          title: capability
        capabilities:
          type: array
          items:
            type: string
          title: capabilities
        agentType:
          type: string
          title: agent_type
        a2aSkillId:
          type: string
          title: a2a_skill_id
        taskClass:
          type: string
          title: task_class
        requireA2aDispatch:
          type: boolean
          title: require_a2a_dispatch
        surface:
          type: string
          title: surface
        status:
          type: string
          title: status
        candidateCount:
          type: integer
          title: candidate_count
          format: int32
        matchedCount:
          type: integer
          title: matched_count
          format: int32
        exclusions:
          type: array
          items:
            $ref: '#/components/schemas/agents.v1.AgentDiscoveryExclusion'
          title: exclusions
      title: AgentDiscoveryEvidence
      additionalProperties: false
      description: |-
        AgentDiscoveryEvidence is the safe, operator-auditable explanation for an
         A2A/delegation discovery query. It intentionally carries identifiers,
         counts, and policy labels, not task payloads or customer content.
    agents.v1.AgentDiscoveryExclusion:
      type: object
      properties:
        reason:
          type: string
          title: reason
        count:
          type: integer
          title: count
          format: int32
        sampleAgentIds:
          type: array
          items:
            type: string
          title: sample_agent_ids
        policyReasons:
          type: array
          items:
            type: string
          title: policy_reasons
        policyScopes:
          type: array
          items:
            type: string
          title: policy_scopes
        allowedTaskClasses:
          type: array
          items:
            type: string
          title: allowed_task_classes
        deniedTaskClasses:
          type: array
          items:
            type: string
          title: denied_task_classes
      title: AgentDiscoveryExclusion
      additionalProperties: false
      description: |-
        AgentDiscoveryExclusion summarizes why candidates did not appear in the
         discovery result. Samples are agent ids only, capped by the server.
    agents.v1.AutonomyPolicy:
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/agents.v1.AutonomyRule'
          title: rules
        defaultAuthority:
          title: default_authority
          $ref: '#/components/schemas/agents.v1.AutonomyAuthority'
        maxRiskWithoutApproval:
          title: max_risk_without_approval
          $ref: '#/components/schemas/common.v1.RiskLevel'
      title: AutonomyPolicy
      additionalProperties: false
      description: |-
        AutonomyPolicy describes the default authority and specific action rules
         that ToolExecution, Governance, and Approvals can enforce.
    agents.v1.AutonomyRule:
      type: object
      properties:
        actionType:
          type: string
          title: action_type
        toolCapability:
          type: string
          title: tool_capability
        maxRisk:
          title: max_risk
          $ref: '#/components/schemas/common.v1.RiskLevel'
        authority:
          not:
            enum:
              - 0
          title: authority
          $ref: '#/components/schemas/agents.v1.AutonomyAuthority'
        approvalPolicyRef:
          type: string
          title: approval_policy_ref
        governancePolicyRef:
          type: string
          title: governance_policy_ref
        rationale:
          type: string
          title: rationale
      title: AutonomyRule
      additionalProperties: false
      description: AutonomyRule constrains a class of actions or tool capabilities.
    agents.v1.CommitmentPolicy:
      type: object
      properties:
        allowedKinds:
          type: array
          items:
            $ref: '#/components/schemas/agents.v1.CommitmentKind'
          title: allowed_kinds
        templates:
          type: array
          items:
            $ref: '#/components/schemas/agents.v1.CommitmentTemplate'
          title: templates
        defaultDueSeconds:
          type: integer
          title: default_due_seconds
          format: int32
        maxOpenCommitments:
          type: integer
          title: max_open_commitments
          format: int32
        requireObjectiveForCommitment:
          type: boolean
          title: require_objective_for_commitment
      title: CommitmentPolicy
      additionalProperties: false
      description: |-
        CommitmentPolicy describes which durable objectives and wakes can be created
         from teammate commitments.
    agents.v1.CommitmentTemplate:
      type: object
      properties:
