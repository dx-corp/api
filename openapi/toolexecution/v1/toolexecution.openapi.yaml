openapi: 3.1.0
info:
  title: toolexecution.v1
paths:
  /toolexecution.v1.ToolExecutionService/ExecuteTool:
    post:
      tags:
        - toolexecution.v1.ToolExecutionService
      summary: ExecuteTool
      description: ExecuteTool starts or idempotently replays a governed tool execution.
      operationId: toolexecution.v1.ToolExecutionService.ExecuteTool
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/toolexecution.v1.ExecuteToolRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/toolexecution.v1.ExecuteToolResponse'
  /toolexecution.v1.ToolExecutionService/ResumeToolExecution:
    post:
      tags:
        - toolexecution.v1.ToolExecutionService
      summary: ResumeToolExecution
      description: |-
        ResumeToolExecution resumes an execution that was parked on an approval
         wait, preserving the original tool call context.
      operationId: toolexecution.v1.ToolExecutionService.ResumeToolExecution
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/toolexecution.v1.ResumeToolExecutionRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/toolexecution.v1.ResumeToolExecutionResponse'
  /toolexecution.v1.ToolExecutionService/RecordToolExecutionOutput:
    post:
      tags:
        - toolexecution.v1.ToolExecutionService
      summary: RecordToolExecutionOutput
      description: |-
        RecordToolExecutionOutput records an asynchronous executor result and
         finalizes audit, meter, and provenance metadata.
      operationId: toolexecution.v1.ToolExecutionService.RecordToolExecutionOutput
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/toolexecution.v1.RecordToolExecutionOutputRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/toolexecution.v1.RecordToolExecutionOutputResponse'
  /toolexecution.v1.ToolExecutionService/GetToolExecution:
    post:
      tags:
        - toolexecution.v1.ToolExecutionService
      summary: GetToolExecution
      description: |-
        GetToolExecution retrieves one tool execution by ID.
         When wait_timeout_ms is greater than zero, the owner may block until the
         execution is settled (terminal or WAITING_APPROVAL) or the timeout
         elapses. Zero is a snapshot and remains backward compatible.
      operationId: toolexecution.v1.ToolExecutionService.GetToolExecution
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/toolexecution.v1.GetToolExecutionRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/toolexecution.v1.GetToolExecutionResponse'
  /toolexecution.v1.ToolExecutionService/ListToolExecutions:
    post:
      tags:
        - toolexecution.v1.ToolExecutionService
      summary: ListToolExecutions
      description: |-
        ListToolExecutions lists executions by workspace, AgentRun, Objective,
         tool, connector, state, or approval request.
      operationId: toolexecution.v1.ToolExecutionService.ListToolExecutions
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/toolexecution.v1.ListToolExecutionsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/toolexecution.v1.ListToolExecutionsResponse'
components:
  schemas:
    common.v1.RiskLevel:
      type: string
      title: RiskLevel
      enum:
        - RISK_LEVEL_UNSPECIFIED
        - RISK_LEVEL_LOW
        - RISK_LEVEL_MEDIUM
        - RISK_LEVEL_HIGH
        - RISK_LEVEL_CRITICAL
      description: RiskLevel classifies the risk of an action.
    common.v1.Surface:
      type: string
      title: Surface
      enum:
        - SURFACE_UNSPECIFIED
        - SURFACE_ENSEMBLE
        - SURFACE_CHAT
        - SURFACE_MAESTRO
        - SURFACE_CONDUCTOR
        - SURFACE_SLACK
        - SURFACE_EXTERNAL_AGENT
      description: |-
        Surface identifies the product or channel surface that originated a platform
         action. It is shared by runtime, audit, and product-facing services so
         callers do not invent drift-prone string labels.
    google.protobuf.NullValue:
      type: string
      title: NullValue
      enum:
        - NULL_VALUE
      description: |-
        `NullValue` is a singleton enumeration to represent the null value for the
         `Value` type union.

         The JSON representation for `NullValue` is JSON `null`.
    platform.v1.ResourceKind:
      type: string
      title: ResourceKind
      enum:
        - RESOURCE_KIND_UNSPECIFIED
        - RESOURCE_KIND_AGENT
        - RESOURCE_KIND_TOOL
        - RESOURCE_KIND_REPO
        - RESOURCE_KIND_DATASET
        - RESOURCE_KIND_DATABASE
        - RESOURCE_KIND_CRM_OBJECT
        - RESOURCE_KIND_MODEL_ROUTE
        - RESOURCE_KIND_EXTERNAL
        - RESOURCE_KIND_VFS_OBJECT
        - RESOURCE_KIND_VFS_OBJECT_VERSION
        - RESOURCE_KIND_ARTIFACT
        - RESOURCE_KIND_ARTIFACT_VERSION
        - RESOURCE_KIND_GENERATED_ASSET
    toolexecution.v1.ToolExecutionFailureCode:
      type: string
      title: ToolExecutionFailureCode
      enum:
        - TOOL_EXECUTION_FAILURE_CODE_UNSPECIFIED
        - TOOL_EXECUTION_FAILURE_CODE_INVALID_REQUEST
        - TOOL_EXECUTION_FAILURE_CODE_UNSUPPORTED_TOOL
        - TOOL_EXECUTION_FAILURE_CODE_AUTHORITY_INVALID
        - TOOL_EXECUTION_FAILURE_CODE_DEPENDENCY_UNAVAILABLE
        - TOOL_EXECUTION_FAILURE_CODE_CONNECTOR_FAILED
        - TOOL_EXECUTION_FAILURE_CODE_SANDBOX_PROVISION_FAILED
        - TOOL_EXECUTION_FAILURE_CODE_SANDBOX_OPERATION_FAILED
        - TOOL_EXECUTION_FAILURE_CODE_RUNNER_LEDGER_REQUIRED
        - TOOL_EXECUTION_FAILURE_CODE_APPROVAL_DENIED
        - TOOL_EXECUTION_FAILURE_CODE_APPROVAL_EXPIRED
        - TOOL_EXECUTION_FAILURE_CODE_EXECUTION_ABANDONED
        - TOOL_EXECUTION_FAILURE_CODE_EXECUTION_CANCELLED
        - TOOL_EXECUTION_FAILURE_CODE_CALLER_REPORTED_FAILURE
      description: |-
        ToolExecutionFailureCode is the bounded, owner-assigned terminal failure
         taxonomy. It intentionally excludes provider prose, resource identifiers,
         and secret-bearing detail.
    toolexecution.v1.ToolExecutionPolicyDecision:
      type: string
      title: ToolExecutionPolicyDecision
      enum:
        - TOOL_EXECUTION_POLICY_DECISION_UNSPECIFIED
        - TOOL_EXECUTION_POLICY_DECISION_ALLOW
        - TOOL_EXECUTION_POLICY_DECISION_DENY
        - TOOL_EXECUTION_POLICY_DECISION_REQUIRE_APPROVAL
      description: |-
        ToolExecutionPolicyDecision is a normalized policy result from Gate,
         Governance, approval policy, or a connector capability check.
    toolexecution.v1.ToolExecutionProposalKind:
      type: string
      title: ToolExecutionProposalKind
      enum:
        - TOOL_EXECUTION_PROPOSAL_KIND_UNSPECIFIED
        - TOOL_EXECUTION_PROPOSAL_KIND_CHECKPOINT
        - TOOL_EXECUTION_PROPOSAL_KIND_ARTIFACT
        - TOOL_EXECUTION_PROPOSAL_KIND_MEMORY
      description: |-
        ToolExecutionProposalKind marks structured outputs that downstream runtime
         checkpoints, artifact proposals, and memory proposals may safely consume.
    toolexecution.v1.ToolExecutionStage:
      type: string
      title: ToolExecutionStage
      enum:
        - TOOL_EXECUTION_STAGE_UNSPECIFIED
        - TOOL_EXECUTION_STAGE_CAPABILITY_LOOKUP
        - TOOL_EXECUTION_STAGE_CREDENTIAL_RESOLUTION
        - TOOL_EXECUTION_STAGE_GATE_POLICY
        - TOOL_EXECUTION_STAGE_GOVERNANCE_POLICY
        - TOOL_EXECUTION_STAGE_APPROVAL
        - TOOL_EXECUTION_STAGE_EXECUTION
        - TOOL_EXECUTION_STAGE_AUDIT
        - TOOL_EXECUTION_STAGE_METER
        - TOOL_EXECUTION_STAGE_PROVENANCE
      description: ToolExecutionStage names each platform boundary crossed by ExecuteTool.
    toolexecution.v1.ToolExecutionState:
      type: string
      title: ToolExecutionState
      enum:
        - TOOL_EXECUTION_STATE_UNSPECIFIED
        - TOOL_EXECUTION_STATE_ACCEPTED
        - TOOL_EXECUTION_STATE_POLICY_EVALUATING
        - TOOL_EXECUTION_STATE_WAITING_APPROVAL
        - TOOL_EXECUTION_STATE_RUNNING
        - TOOL_EXECUTION_STATE_SUCCEEDED
        - TOOL_EXECUTION_STATE_FAILED
        - TOOL_EXECUTION_STATE_DENIED
        - TOOL_EXECUTION_STATE_CANCELLED
      description: ToolExecutionState is the durable lifecycle for one tool call.
    toolexecution.v1.ToolExecutionStepState:
      type: string
      title: ToolExecutionStepState
      enum:
        - TOOL_EXECUTION_STEP_STATE_UNSPECIFIED
        - TOOL_EXECUTION_STEP_STATE_SUCCEEDED
        - TOOL_EXECUTION_STEP_STATE_WAITING
        - TOOL_EXECUTION_STEP_STATE_DENIED
        - TOOL_EXECUTION_STEP_STATE_FAILED
        - TOOL_EXECUTION_STEP_STATE_SKIPPED
      description: ToolExecutionStepState describes the state of a platform boundary decision.
    google.protobuf.ListValue:
      type: object
      properties:
        values:
          type: array
          items:
            $ref: '#/components/schemas/google.protobuf.Value'
          title: values
          description: Repeated field of dynamically typed values.
      title: ListValue
      additionalProperties: false
      description: |-
        `ListValue` is a wrapper around a repeated field of values.

         The JSON representation for `ListValue` is JSON array.
    google.protobuf.Struct:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/google.protobuf.Value'
      description: |-
        `Struct` represents a structured data value, consisting of fields
         which map to dynamically typed values. In some languages, `Struct`
         might be supported by a native representation. For example, in
         scripting languages like JS a struct is represented as an
         object. The details of that representation are described together
         with the proto support for the language.

         The JSON representation for `Struct` is JSON object.
    google.protobuf.Struct.FieldsEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          title: value
          $ref: '#/components/schemas/google.protobuf.Value'
      title: FieldsEntry
      additionalProperties: false
    google.protobuf.Timestamp:
      type: string
      examples:
        - 1s
        - 1.000340012s
      format: date-time
      description: |-
        A Timestamp represents a point in time independent of any time zone or local
         calendar, encoded as a count of seconds and fractions of seconds at
         nanosecond resolution. The count is relative to an epoch at UTC midnight on
         January 1, 1970, in the proleptic Gregorian calendar which extends the
         Gregorian calendar backwards to year one.

         All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
         second table is needed for interpretation, using a [24-hour linear
         smear](https://developers.google.com/time/smear).

         The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
         restricting to that range, we ensure that we can convert to and from [RFC
         3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

         # Examples

         Example 1: Compute Timestamp from POSIX `time()`.

             Timestamp timestamp;
             timestamp.set_seconds(time(NULL));
             timestamp.set_nanos(0);

         Example 2: Compute Timestamp from POSIX `gettimeofday()`.

             struct timeval tv;
             gettimeofday(&tv, NULL);

             Timestamp timestamp;
             timestamp.set_seconds(tv.tv_sec);
             timestamp.set_nanos(tv.tv_usec * 1000);

         Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

             FILETIME ft;
             GetSystemTimeAsFileTime(&ft);
             UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

             // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
             // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
             Timestamp timestamp;
             timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
             timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

         Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

             long millis = System.currentTimeMillis();

             Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                 .setNanos((int) ((millis % 1000) * 1000000)).build();

         Example 5: Compute Timestamp from Java `Instant.now()`.

             Instant now = Instant.now();

             Timestamp timestamp =
                 Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                     .setNanos(now.getNano()).build();

         Example 6: Compute Timestamp from current time in Python.

             timestamp = Timestamp()
             timestamp.GetCurrentTime()

         # JSON Mapping

         In JSON format, the Timestamp type is encoded as a string in the
         [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
         format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
         where {year} is always expressed using four digits while {month}, {day},
         {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
         seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
         are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
         is required. A proto3 JSON serializer should always use UTC (as indicated by
         "Z") when printing the Timestamp type and a proto3 JSON parser should be
         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
    google.protobuf.Value:
      oneOf:
        - type: "null"
        - type: number
        - type: string
        - type: boolean
        - type: array
        - type: object
          additionalProperties: true
      description: |-
        `Value` represents a dynamically typed value which can be either
         null, a number, a string, a boolean, a recursive struct value, or a
         list of values. A producer of value is expected to set one of these
         variants. Absence of any variant indicates an error.

         The JSON representation for `Value` is JSON value.
    platform.v1.ResourceRef:
      type: object
      properties:
        resourceId:
          type: string
          title: resource_id
          minLength: 1
        kind:
          title: kind
          $ref: '#/components/schemas/platform.v1.ResourceKind'
        versionId:
          type: string
          title: version_id
          description: Stable immutable version identity, when the reference is version-bound.
        version:
          type: integer
          title: version
          format: int32
          description: |-
            Owner-defined monotonic version number. Zero means the latest version
             when version_id is empty; version_id wins when both are supplied.
      title: ResourceRef
      additionalProperties: false
      description: |-
        ResourceRef is the canonical structured pointer for durable Platform
         content. It is intentionally not a URI: callers carry organization and
         workspace authority in the surrounding request, while a resolver owned by
         the resource's service decides whether a reference yields metadata, VFS
         identity, or a short-lived byte-access grant.
    toolexecution.v1.CommandAuditReceipt:
      type: object
      properties:
        eventId:
          type: string
          title: event_id
        runnerSessionId:
          type: string
          title: runner_session_id
        sequence:
          type:
            - integer
            - string
          title: sequence
          format: int64
        eventType:
          type: string
          title: event_type
        occurredAt:
          title: occurred_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        payloadDigestSha256:
          type: string
          title: payload_digest_sha256
      title: CommandAuditReceipt
      additionalProperties: false
    toolexecution.v1.ConnectorRef:
      type: object
      properties:
        connectionId:
          type: string
          title: connection_id
        providerId:
          type: string
          title: provider_id
        resourceId:
          type: string
          title: resource_id
        resourceKind:
          type: string
          title: resource_kind
        credentialRef:
          type: string
          title: credential_ref
        credentialEnvironment:
          type: string
          title: credential_environment
      title: ConnectorRef
      additionalProperties: false
      description: |-
        ConnectorRef identifies the connector, resource, and credential namespace
         needed to execute an external tool call. MCP/internal tools may leave
         connection_id empty while still setting provider_id/resource metadata.
    toolexecution.v1.ExecuteToolRequest:
      type: object
      properties:
        linkage:
          title: linkage
          $ref: '#/components/schemas/toolexecution.v1.ToolExecutionLinkage'
        tool:
          title: tool
          $ref: '#/components/schemas/toolexecution.v1.ToolRef'
        connector:
          title: connector
          $ref: '#/components/schemas/toolexecution.v1.ConnectorRef'
        arguments:
          title: arguments
          $ref: '#/components/schemas/google.protobuf.Struct'
        riskLevel:
          title: risk_level
          $ref: '#/components/schemas/common.v1.RiskLevel'
        retryPolicy:
          title: retry_policy
          $ref: '#/components/schemas/toolexecution.v1.ToolRetryPolicy'
        idempotencyKey:
          type: string
          title: idempotency_key
          minLength: 1
        metadata:
          type: object
          title: metadata
          additionalProperties:
            type: string
            title: value
        traceContext:
          title: trace_context
          $ref: '#/components/schemas/toolexecution.v1.ToolExecutionTraceContext'
      title: ExecuteToolRequest
      required:
        - linkage
        - tool
      additionalProperties: false
    toolexecution.v1.ExecuteToolRequest.MetadataEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: MetadataEntry
      additionalProperties: false
    toolexecution.v1.ExecuteToolResponse:
      type: object
      properties:
        execution:
          title: execution
          $ref: '#/components/schemas/toolexecution.v1.ToolExecution'
        idempotentReplay:
          type: boolean
          title: idempotent_replay
      title: ExecuteToolResponse
      additionalProperties: false
    toolexecution.v1.GetToolExecutionRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          minLength: 1
        organizationId:
          type: string
          title: organization_id
          minLength: 1
        workspaceId:
          type: string
          title: workspace_id
          minLength: 1
        waitTimeoutMs:
          type: integer
          title: wait_timeout_ms
          maximum: 30000
          description: |-
            When greater than zero, the owner may block until the execution is
             settled (terminal or WAITING_APPROVAL) or this timeout elapses. Zero
             returns a snapshot and remains backward compatible.
      title: GetToolExecutionRequest
      additionalProperties: false
    toolexecution.v1.GetToolExecutionResponse:
      type: object
      properties:
        execution:
          title: execution
          $ref: '#/components/schemas/toolexecution.v1.ToolExecution'
      title: GetToolExecutionResponse
      additionalProperties: false
    toolexecution.v1.ListToolExecutionsRequest:
      type: object
      properties:
        workspaceId:
          type: string
          title: workspace_id
        runId:
          type: string
          title: run_id
        objectiveId:
          type: string
          title: objective_id
        agentId:
          type: string
          title: agent_id
        toolNamespace:
          type: string
          title: tool_namespace
        toolName:
          type: string
          title: tool_name
        connectionId:
          type: string
          title: connection_id
        approvalRequestId:
          type: string
          title: approval_request_id
        state:
          title: state
          $ref: '#/components/schemas/toolexecution.v1.ToolExecutionState'
        limit:
          type: integer
          title: limit
          format: int32
        offset:
          type: integer
          title: offset
          format: int32
        organizationId:
          type: string
          title: organization_id
        taskId:
          type: string
          title: task_id
      title: ListToolExecutionsRequest
      additionalProperties: false
    toolexecution.v1.ListToolExecutionsResponse:
      type: object
      properties:
        executions:
          type: array
          items:
            $ref: '#/components/schemas/toolexecution.v1.ToolExecution'
          title: executions
        total:
          type: integer
          title: total
          format: int32
        hasMore:
          type: boolean
          title: has_more
      title: ListToolExecutionsResponse
      additionalProperties: false
    toolexecution.v1.RecordToolExecutionOutputRequest:
      type: object
      properties:
        executionId:
          type: string
          title: execution_id
          minLength: 1
        output:
          title: output
          $ref: '#/components/schemas/toolexecution.v1.ToolExecutionOutput'
        metadata:
          type: object
          title: metadata
          additionalProperties:
            type: string
            title: value
        authority:
          title: authority
          $ref: '#/components/schemas/toolexecution.v1.ToolExecutionOutputAuthority'
      title: RecordToolExecutionOutputRequest
      required:
        - output
        - authority
      additionalProperties: false
    toolexecution.v1.RecordToolExecutionOutputRequest.MetadataEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: MetadataEntry
      additionalProperties: false
    toolexecution.v1.RecordToolExecutionOutputResponse:
      type: object
      properties:
        execution:
          title: execution
          $ref: '#/components/schemas/toolexecution.v1.ToolExecution'
      title: RecordToolExecutionOutputResponse
      additionalProperties: false
    toolexecution.v1.ResumeToolExecutionRequest:
      type: object
      properties:
        executionId:
          type: string
          title: execution_id
          minLength: 1
        approvalRequestId:
          type: string
          title: approval_request_id
          minLength: 1
        resumeToken:
          type: string
          title: resume_token
          minLength: 1
        approved:
          type: boolean
          title: approved
          deprecated: true
        decidedBy:
          type: string
          title: decided_by
          deprecated: true
        reason:
          type: string
          title: reason
          deprecated: true
        approvalDecisionId:
          type: string
          title: approval_decision_id
          minLength: 1
          description: |-
            Identity of the durable ApprovalService decision to verify. The
             deprecated decision fields above are ignored by production verification.
      title: ResumeToolExecutionRequest
      additionalProperties: false
    toolexecution.v1.ResumeToolExecutionResponse:
      type: object
      properties:
        execution:
          title: execution
          $ref: '#/components/schemas/toolexecution.v1.ToolExecution'
      title: ResumeToolExecutionResponse
      additionalProperties: false
    toolexecution.v1.ToolApprovalWait:
      type: object
      properties:
        id:
          type: string
          title: id
        approvalRequestId:
          type: string
          title: approval_request_id
        resumeToken:
          type: string
          title: resume_token
        reason:
          type: string
          title: reason
        requestedDecision:
          title: requested_decision
          $ref: '#/components/schemas/toolexecution.v1.ToolExecutionPolicyDecision'
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        resolvedAt:
          title: resolved_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        resolvedBy:
          type: string
          title: resolved_by
        expiresAt:
          title: expires_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: ToolApprovalWait
      additionalProperties: false
      description: |-
        ToolApprovalWait is stored when policy requires human approval. The
         resume_token and original request allow AgentRun to release compute and later
         resume without reconstructing or mutating the tool call.
    toolexecution.v1.ToolExecution:
      type: object
      properties:
        id:
          type: string
          title: id
        linkage:
          title: linkage
          $ref: '#/components/schemas/toolexecution.v1.ToolExecutionLinkage'
        tool:
          title: tool
          $ref: '#/components/schemas/toolexecution.v1.ToolRef'
        connector:
          title: connector
          $ref: '#/components/schemas/toolexecution.v1.ConnectorRef'
        arguments:
          title: arguments
          $ref: '#/components/schemas/google.protobuf.Struct'
        riskLevel:
          title: risk_level
          $ref: '#/components/schemas/common.v1.RiskLevel'
        retryPolicy:
          title: retry_policy
          $ref: '#/components/schemas/toolexecution.v1.ToolRetryPolicy'
        idempotencyKey:
          type: string
          title: idempotency_key
          minLength: 1
        state:
          title: state
          $ref: '#/components/schemas/toolexecution.v1.ToolExecutionState'
        attempt:
          type: integer
          title: attempt
          format: int32
        maxAttempts:
          type: integer
          title: max_attempts
          format: int32
        steps:
          type: array
          items:
            $ref: '#/components/schemas/toolexecution.v1.ToolExecutionStep'
          title: steps
        approvalWait:
          title: approval_wait
          $ref: '#/components/schemas/toolexecution.v1.ToolApprovalWait'
        output:
          title: output
          $ref: '#/components/schemas/toolexecution.v1.ToolExecutionOutput'
        provenance:
          title: provenance
          $ref: '#/components/schemas/toolexecution.v1.ToolExecutionProvenance'
        errorMessage:
          type: string
          title: error_message
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        completedAt:
          title: completed_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        traceContext:
          title: trace_context
          $ref: '#/components/schemas/toolexecution.v1.ToolExecutionTraceContext'
        failureCode:
          title: failure_code
          description: |-
            Stable machine-readable terminal failure reason when the owning execution
             boundary classified it. Human-readable detail remains in error_message
             and must never be parsed for routing or policy.
          $ref: '#/components/schemas/toolexecution.v1.ToolExecutionFailureCode'
        verifiedApprovalDecision:
          title: verified_approval_decision
          $ref: '#/components/schemas/toolexecution.v1.VerifiedApprovalDecision'
      title: ToolExecution
      required:
        - linkage
        - tool
      additionalProperties: false
      description: ToolExecution is the canonical durable record for one governed tool call.
    toolexecution.v1.ToolExecutionAttachmentMount:
      type: object
      properties:
        objectId:
          type: string
          title: object_id
          minLength: 1
        versionId:
          type: string
          title: version_id
          minLength: 1
        filename:
          type: string
          title: filename
          minLength: 1
        sha256:
          type: string
          title: sha256
          minLength: 1
        sizeBytes:
          exclusiveMinimum: 0
          type:
            - integer
            - string
          title: size_bytes
          maximum: 52428800
          format: int64
        destinationPath:
          type: string
          title: destination_path
          minLength: 1
        resourceRef:
          title: resource_ref
          $ref: '#/components/schemas/platform.v1.ResourceRef'
      title: ToolExecutionAttachmentMount
      additionalProperties: false
      description: |-
        ToolExecutionAttachmentMount is an immutable, server-authorized VFS version
         materialized read-only under the execution's attachment root.
    toolexecution.v1.ToolExecutionGitSnapshotFile:
      type: object
      properties:
        path:
          type: string
          title: path
        gitBlobSha:
          type: string
          title: git_blob_sha
        sizeBytes:
          type:
            - integer
            - string
          title: size_bytes
          format: int64
        executable:
          type: boolean
          title: executable
      title: ToolExecutionGitSnapshotFile
      additionalProperties: false
    toolexecution.v1.ToolExecutionGitSnapshotManifest:
      type: object
      properties:
        repositoryId:
          type:
            - integer
            - string
          title: repository_id
          format: int64
        fullName:
          type: string
          title: full_name
        defaultBranch:
          type: string
          title: default_branch
        commitSha:
          type: string
          title: commit_sha
        treeSha:
          type: string
          title: tree_sha
        files:
          type: array
          items:
            $ref: '#/components/schemas/toolexecution.v1.ToolExecutionGitSnapshotFile'
          title: files
        complete:
          type: boolean
          title: complete
      title: ToolExecutionGitSnapshotManifest
      additionalProperties: false
    toolexecution.v1.ToolExecutionLinkage:
      type: object
      properties:
        workspaceId:
          type: string
          title: workspace_id
          minLength: 1
        organizationId:
          type: string
          title: organization_id
          minLength: 1
        agentId:
          type: string
          title: agent_id
          minLength: 1
        runId:
          type: string
          title: run_id
        objectiveId:
          type: string
          title: objective_id
        stepId:
          type: string
          title: step_id
        actorId:
          type: string
          title: actor_id
        surface:
          type: string
          title: surface
          deprecated: true
        channelId:
          type: string
          title: channel_id
        correlationId:
          type: string
          title: correlation_id
        surfaceType:
          title: surface_type
          $ref: '#/components/schemas/common.v1.Surface'
        attachmentMounts:
          type: array
          items:
            $ref: '#/components/schemas/toolexecution.v1.ToolExecutionAttachmentMount'
          title: attachment_mounts
        applicationId:
          type: string
          title: application_id
          minLength: 1
          description: |-
            application_id is the immutable server-derived application authority.
             Callers must not populate it from browser-controlled application context.
        projectSource:
          title: project_source
          $ref: '#/components/schemas/toolexecution.v1.ToolExecutionProjectSource'
        projectImport:
          title: project_import
          $ref: '#/components/schemas/toolexecution.v1.ToolExecutionProjectImport'
        workspaceRecipe:
          title: workspace_recipe
          description: |-
            Exact Platform-admitted task recipe. Executor preparation is authorized
             from this typed linkage, never from caller-controlled metadata.
          $ref: '#/components/schemas/toolexecution.v1.ToolExecutionWorkspaceRecipe'
        taskId:
          type: string
          title: task_id
          description: Platform-admitted task identity used for tenant-scoped owner inspection.
      title: ToolExecutionLinkage
      additionalProperties: false
      description: |-
        ToolExecutionLinkage carries the shared identifiers used to authorize,
         partition, audit, and join a tool call back to agent runtime records.
    toolexecution.v1.ToolExecutionOutput:
      type: object
      properties:
        rawOutput:
          title: raw_output
          $ref: '#/components/schemas/google.protobuf.Struct'
        safeOutput:
          title: safe_output
          $ref: '#/components/schemas/google.protobuf.Struct'
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/toolexecution.v1.ToolOutputProposal'
          title: proposals
        redactions:
          type: array
          items:
            type: string
          title: redactions
        contentType:
          type: string
          title: content_type
        outputDigest:
          type: string
          title: output_digest
        durationMs:
          type:
            - integer
            - string
          title: duration_ms
          format: int64
        resourceRef:
          title: resource_ref
          $ref: '#/components/schemas/platform.v1.ResourceRef'
      title: ToolExecutionOutput
      additionalProperties: false
      description: |-
        ToolExecutionOutput is deliberately structured: safe_output can be fed to a
         run checkpoint, artifact proposal, or memory proposal without raw connector
         secrets or unredacted byproducts.
    toolexecution.v1.ToolExecutionOutputAuthority:
      type: object
      properties:
        applicationId:
          type: string
          title: application_id
          minLength: 1
        actor:
          type: string
          title: actor
          minLength: 1
        requestFingerprint:
          type: string
          title: request_fingerprint
          minLength: 1
        approvalDecisionId:
          type: string
          title: approval_decision_id
          minLength: 1
        dispatchAttempt:
          type: integer
          title: dispatch_attempt
          minimum: 1
          format: int32
        actionDigest:
          type: string
          title: action_digest
          minLength: 1
      title: ToolExecutionOutputAuthority
      additionalProperties: false
      description: |-
        ToolExecutionOutputAuthority binds a caller-dispatched terminal write to
         the authenticated application/actor, exact request and approval, and the
         currently leased dispatch attempt.
    toolexecution.v1.ToolExecutionProjectImport:
      type: object
      properties:
        projectResourceId:
          type: string
          title: project_resource_id
        connectionId:
          type: string
          title: connection_id
        expectedRefVersion:
          type:
            - integer
            - string
          title: expected_ref_version
          format: int64
          nullable: true
        manifest:
          title: manifest
          $ref: '#/components/schemas/toolexecution.v1.ToolExecutionGitSnapshotManifest'
        grantKeyId:
          type: string
          title: grant_key_id
        grantSignature:
          type: string
          title: grant_signature
      title: ToolExecutionProjectImport
      additionalProperties: false
      description: Server-admitted immutable import job; browser requests cannot choose a commit.
    toolexecution.v1.ToolExecutionProjectSource:
      type: object
      properties:
        projectResourceId:
          type: string
          title: project_resource_id
        acceptedRefName:
          type: string
          title: accepted_ref_name
        acceptedRefVersion:
          type:
            - integer
            - string
          title: accepted_ref_version
          format: int64
        acceptedSnapshotId:
          type: string
          title: accepted_snapshot_id
        sourceWorkspaceId:
          type: string
          title: source_workspace_id
        sourceWorkspaceVersion:
          type:
            - integer
            - string
          title: source_workspace_version
          format: int64
        files:
          type: array
          items:
            $ref: '#/components/schemas/toolexecution.v1.ToolExecutionProjectSourceFile'
          title: files
          maxItems: 1000
      title: ToolExecutionProjectSource
      additionalProperties: false
      description: Server-owned, pinned accepted source. Never a writable shared directory.
    toolexecution.v1.ToolExecutionProjectSourceFile:
      type: object
      properties:
        path:
          type: string
          title: path
        objectId:
          type: string
          title: object_id
        versionId:
          type: string
          title: version_id
        sha256:
          type: string
          title: sha256
        sizeBytes:
          type:
            - integer
            - string
          title: size_bytes
          format: int64
        executable:
          type: boolean
          title: executable
      title: ToolExecutionProjectSourceFile
      additionalProperties: false
      description: An immutable file restored below the private task workspace.
    toolexecution.v1.ToolExecutionProvenance:
      type: object
      properties:
        capabilityRef:
          type: string
          title: capability_ref
        credentialRef:
          type: string
          title: credential_ref
        gatePolicyRef:
          type: string
          title: gate_policy_ref
        governanceDecisionRef:
          type: string
          title: governance_decision_ref
        approvalRequestId:
          type: string
          title: approval_request_id
        executorRef:
          type: string
          title: executor_ref
        auditEventId:
          type: string
          title: audit_event_id
        meterRecordId:
          type: string
          title: meter_record_id
        provenanceRecordId:
          type: string
          title: provenance_record_id
        inputDigest:
          type: string
          title: input_digest
        outputDigest:
          type: string
          title: output_digest
        metadata:
          type: object
          title: metadata
          additionalProperties:
            type: string
            title: value
        commandAuditReceipt:
          title: command_audit_receipt
          description: |-
            Owner-persisted acknowledgement of a Runner Host event append. This
             binds a recording to the execution, not the producer of the event.
          $ref: '#/components/schemas/toolexecution.v1.CommandAuditReceipt'
      title: ToolExecutionProvenance
      additionalProperties: false
      description: |-
        ToolExecutionProvenance records non-secret references emitted by each
         boundary so audit, meter, AgentRun, Artifact, and Memory records can join on
         one tool_execution_id.
    toolexecution.v1.ToolExecutionProvenance.MetadataEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: MetadataEntry
      additionalProperties: false
    toolexecution.v1.ToolExecutionStep:
      type: object
      properties:
        id:
          type: string
          title: id
        stage:
          title: stage
          $ref: '#/components/schemas/toolexecution.v1.ToolExecutionStage'
        state:
          title: state
          $ref: '#/components/schemas/toolexecution.v1.ToolExecutionStepState'
        decision:
          title: decision
          $ref: '#/components/schemas/toolexecution.v1.ToolExecutionPolicyDecision'
        externalRef:
          type: string
          title: external_ref
        reasons:
          type: array
          items:
            type: string
          title: reasons
        attributes:
          type: object
          title: attributes
          additionalProperties:
            type: string
            title: value
        startedAt:
          title: started_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        endedAt:
          title: ended_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: ToolExecutionStep
      additionalProperties: false
      description: ToolExecutionStep records one boundary decision in the execution path.
    toolexecution.v1.ToolExecutionStep.AttributesEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: AttributesEntry
      additionalProperties: false
    toolexecution.v1.ToolExecutionTraceContext:
      type: object
      properties:
        traceId:
          type: string
          title: trace_id
        spanId:
          type: string
          title: span_id
        parentSpanId:
          type: string
          title: parent_span_id
        traceparent:
          type: string
          title: traceparent
        tracestate:
          type: string
          title: tracestate
      title: ToolExecutionTraceContext
      additionalProperties: false
      description: |-
        ToolExecutionTraceContext carries the W3C trace context that causally owns a
         tool call. It lets the AgentRun, ToolExecution, connector, and MCP spans stay
         on one distributed trace even when the execution is retried or parked.
    toolexecution.v1.ToolExecutionWorkspaceRecipe:
      type: object
      properties:
        schemaVersion:
          type: string
          title: schema_version
          const: deixic.workspace_recipe.v1
        recipeId:
          type: string
          title: recipe_id
          minLength: 1
        recipeVersion:
          type:
            - integer
            - string
          title: recipe_version
          minimum: 1
          format: int64
        recipeDigest:
          type: string
          title: recipe_digest
          minLength: 1
        sourceManifestDigest:
          type: string
          title: source_manifest_digest
          minLength: 1
        requiredRuntimes:
          type: array
          items:
            type: string
            maxLength: 64
            minLength: 1
            maxItems: 16
          title: required_runtimes
          maxItems: 16
        preparationTool:
          type: string
          title: preparation_tool
          const: computer.check_runtimes
        executionOwner:
          type: string
          title: execution_owner
          const: platform-api.dex
      title: ToolExecutionWorkspaceRecipe
      additionalProperties: false
      description: |-
        Versioned, server-owned preparation recipe for one task workspace. The
         recipe carries bounded declarative requirements; it cannot contain shell
         commands, repository hooks, credentials, or approval policy.
    toolexecution.v1.ToolOutputProposal:
      type: object
      properties:
        kind:
          title: kind
          $ref: '#/components/schemas/toolexecution.v1.ToolExecutionProposalKind'
        targetRef:
          type: string
          title: target_ref
        payload:
          title: payload
          $ref: '#/components/schemas/google.protobuf.Struct'
        metadata:
          type: object
          title: metadata
          additionalProperties:
            type: string
            title: value
      title: ToolOutputProposal
      additionalProperties: false
      description: ToolOutputProposal is a normalized downstream write suggestion from a tool.
    toolexecution.v1.ToolOutputProposal.MetadataEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: MetadataEntry
      additionalProperties: false
    toolexecution.v1.ToolRef:
      type: object
      properties:
        namespace:
          type: string
          title: namespace
          minLength: 1
        name:
          type: string
          title: name
          minLength: 1
        version:
          type: string
          title: version
        capability:
          type: string
          title: capability
          minLength: 1
        operation:
          type: string
          title: operation
        idempotent:
          type: boolean
          title: idempotent
        mutatesResource:
          type: boolean
          title: mutates_resource
      title: ToolRef
      additionalProperties: false
      description: ToolRef identifies the tool/capability the agent wants to invoke.
    toolexecution.v1.ToolRetryPolicy:
      type: object
      properties:
        maxAttempts:
          type: integer
          title: max_attempts
          format: int32
        initialDelayMs:
          type: integer
          title: initial_delay_ms
          format: int32
        maxDelayMs:
          type: integer
          title: max_delay_ms
          format: int32
        allowNonIdempotentRetry:
          type: boolean
          title: allow_non_idempotent_retry
      title: ToolRetryPolicy
      additionalProperties: false
      description: |-
        ToolRetryPolicy prevents blind retries for side-effecting tools. If a tool is
         not idempotent, callers must set allow_non_idempotent_retry and provide an
         idempotency_key before retries beyond the first attempt are honored.
    toolexecution.v1.VerifiedApprovalDecision:
      type: object
      properties:
        decisionId:
          type: string
          title: decision_id
        approvalRequestId:
          type: string
          title: approval_request_id
        decision:
          type: string
          title: decision
        decidedBy:
          type: string
          title: decided_by
        reason:
          type: string
          title: reason
        decidedAt:
          title: decided_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        verifiedAt:
          title: verified_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: VerifiedApprovalDecision
      additionalProperties: false
      description: |-
        VerifiedApprovalDecision is the immutable join to the authoritative
         ApprovalService decision used to release this execution. ToolExecutor
         derives every field from ApprovalService; callers provide only decision_id.
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        detail:
          $ref: '#/components/schemas/google.protobuf.Any'
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    google.protobuf.Any:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
          format: binary
        debug:
          type: object
          additionalProperties: true
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
security: []
tags:
  - name: toolexecution.v1.ToolExecutionService
    description: |-
      ToolExecutionService governs one normalized tool call across capability
       lookup, credential resolution, Gate and Governance policy, approval waits,
       execution, audit, meter, and provenance recording. AgentRun workers call this
       service instead of invoking external connectors, MCP tools, or internal tools
       directly.
