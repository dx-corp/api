openapi: 3.1.0
info:
  title: platform.v1
paths:
  /platform.v1.PlatformService/GetBootstrap:
    post:
      tags:
        - platform.v1.PlatformService
      summary: GetBootstrap
      description: GetBootstrap returns tenant-scoped platform capabilities for the frontend.
      operationId: platform.v1.PlatformService.GetBootstrap
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/platform.v1.GetBootstrapRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.v1.GetBootstrapResponse'
  /platform.v1.PlatformService/CreateWork:
    post:
      tags:
        - platform.v1.PlatformService
      summary: CreateWork
      description: CreateWork creates a stateful work owner record through an operation record.
      operationId: platform.v1.PlatformService.CreateWork
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/platform.v1.CreateWorkRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.v1.CreateWorkResponse'
  /platform.v1.PlatformService/ProposeAction:
    post:
      tags:
        - platform.v1.PlatformService
      summary: ProposeAction
      description: ProposeAction records an action intent even when execution is blocked.
      operationId: platform.v1.PlatformService.ProposeAction
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/platform.v1.ProposeActionRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.v1.ProposeActionResponse'
  /platform.v1.PlatformService/CreateArtifact:
    post:
      tags:
        - platform.v1.PlatformService
      summary: CreateArtifact
      description: CreateArtifact creates a versioned artifact through an operation record.
      operationId: platform.v1.PlatformService.CreateArtifact
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/platform.v1.CreateArtifactRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.v1.CreateArtifactResponse'
  /platform.v1.PlatformService/RecordEvidence:
    post:
      tags:
        - platform.v1.PlatformService
      summary: RecordEvidence
      description: RecordEvidence records audit, trace, usage, attestation, replay, or lineage evidence.
      operationId: platform.v1.PlatformService.RecordEvidence
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/platform.v1.RecordEvidenceRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.v1.RecordEvidenceResponse'
  /platform.v1.PlatformService/RecordScore:
    post:
      tags:
        - platform.v1.PlatformService
      summary: RecordScore
      description: RecordScore records a queryable eval score on the same operation spine.
      operationId: platform.v1.PlatformService.RecordScore
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/platform.v1.RecordScoreRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.v1.RecordScoreResponse'
  /platform.v1.PlatformService/ApplyRecommendation:
    post:
      tags:
        - platform.v1.PlatformService
      summary: ApplyRecommendation
      description: ApplyRecommendation closes the eval loop by recording a rollout decision.
      operationId: platform.v1.PlatformService.ApplyRecommendation
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
