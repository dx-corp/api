        - traces.v1.SpanIngestService
      summary: IngestSpans
      description: |-
        Append spans to a trace. MEDIUM because forged spans contaminate the
         observability record other reviewers and gates trust.
         Organization scope is enforced by trace handlers for multi-org writes
         because legacy single-scope SDK ingest may omit span.organization_id.
      operationId: traces.v1.SpanIngestService.IngestSpans
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/traces.v1.IngestSpansRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/traces.v1.IngestSpansResponse'
