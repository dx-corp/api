        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connectors.v1.CompleteOAuthFlowResponse'
  /connectors.v1.ConnectorService/InitiateMcpOAuthFlow:
    post:
      tags:
        - connectors.v1.ConnectorService
      summary: InitiateMcpOAuthFlow
      description: |-
        InitiateMcpOAuthFlow performs protected-resource (RFC 9728) and
         authorization-server (RFC 8414) discovery, then returns a PKCE-bound
         authorization URL. The connector owner persists the state binding and
         returns only metadata and opaque references; token material never crosses
         this contract.
      operationId: connectors.v1.ConnectorService.InitiateMcpOAuthFlow
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectors.v1.InitiateMcpOAuthFlowRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connectors.v1.InitiateMcpOAuthFlowResponse'
  /connectors.v1.ConnectorService/CompleteMcpOAuthFlow:
    post:
      tags:
        - connectors.v1.ConnectorService
      summary: CompleteMcpOAuthFlow
      description: |-
        CompleteMcpOAuthFlow consumes the one-time state/code binding and asks the
         configured secret broker to custody the resulting token set. The response
         contains only an opaque connection_ref and durable grant identity.
      operationId: connectors.v1.ConnectorService.CompleteMcpOAuthFlow
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectors.v1.CompleteMcpOAuthFlowRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connectors.v1.CompleteMcpOAuthFlowResponse'
  /connectors.v1.ConnectorService/RevokeMcpOAuthGrant:
    post:
