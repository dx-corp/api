    post:
      tags:
        - connectors.v1.ConnectorService
      summary: InitiateOAuthFlow
      description: |-
        InitiateOAuthFlow returns a provider authorize URL plus a server-issued
         state token. The UI launches the URL in a popup; the provider redirects
         back to /integrations/{provider}/oauth-callback with the auth code, and
         the UI then calls CompleteOAuthFlow.
      operationId: connectors.v1.ConnectorService.InitiateOAuthFlow
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
