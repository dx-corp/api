components:
  schemas:
    connectors.v1.AuthType:
      type: string
      title: AuthType
      enum:
        - AUTH_TYPE_UNSPECIFIED
        - AUTH_TYPE_OAUTH2
        - AUTH_TYPE_API_KEY
        - AUTH_TYPE_BASIC
        - AUTH_TYPE_MTLS
        - AUTH_TYPE_GITHUB_APP
      description: AuthType describes the authentication method for a connection.
    connectors.v1.ConnectorActionErrorKind:
      type: string
      title: ConnectorActionErrorKind
      enum:
        - CONNECTOR_ACTION_ERROR_KIND_UNSPECIFIED
        - CONNECTOR_ACTION_ERROR_KIND_RATE_LIMITED
        - CONNECTOR_ACTION_ERROR_KIND_PROVIDER
        - CONNECTOR_ACTION_ERROR_KIND_INVALID_AUTH
        - CONNECTOR_ACTION_ERROR_KIND_MISSING_SCOPE
        - CONNECTOR_ACTION_ERROR_KIND_INACCESSIBLE_CHANNEL
        - CONNECTOR_ACTION_ERROR_KIND_AMBIGUOUS
    connectors.v1.ConnectorActionExecutionState:
      type: string
      title: ConnectorActionExecutionState
      enum:
        - CONNECTOR_ACTION_EXECUTION_STATE_UNSPECIFIED
        - CONNECTOR_ACTION_EXECUTION_STATE_EXECUTING
        - CONNECTOR_ACTION_EXECUTION_STATE_SUCCEEDED
        - CONNECTOR_ACTION_EXECUTION_STATE_FAILED
    connectors.v1.ConnectorEvidenceKind:
      type: string
      title: ConnectorEvidenceKind
      enum:
        - CONNECTOR_EVIDENCE_KIND_UNSPECIFIED
        - CONNECTOR_EVIDENCE_KIND_PROBE
        - CONNECTOR_EVIDENCE_KIND_FIXTURE
        - CONNECTOR_EVIDENCE_KIND_CANARY
        - CONNECTOR_EVIDENCE_KIND_PRODUCTION
        - CONNECTOR_EVIDENCE_KIND_UNPROVABLE_UNAUTHENTICATED
      description: |-
        ConnectorEvidenceKind identifies the bounded evidence supporting a catalog
         verification level. It does not establish credential validity or transport
         availability.
    connectors.v1.ConnectorVerificationLevel:
      type: string
      title: ConnectorVerificationLevel
      enum:
        - CONNECTOR_VERIFICATION_LEVEL_UNSPECIFIED
        - CONNECTOR_VERIFICATION_LEVEL_DECLARED
        - CONNECTOR_VERIFICATION_LEVEL_SPEC_DERIVED
        - CONNECTOR_VERIFICATION_LEVEL_FIXTURE_VERIFIED
        - CONNECTOR_VERIFICATION_LEVEL_LIVE_VERIFIED
        - CONNECTOR_VERIFICATION_LEVEL_CONTINUOUSLY_VERIFIED
      description: |-
        ConnectorVerificationLevel is the fail-closed evidence ladder for a
         connector catalog subject. Higher levels require the canonical verification
         ledger to contain evidence that justifies the promotion.
    connectors.v1.CredentialState:
      type: string
      title: CredentialState
      enum:
        - CREDENTIAL_STATE_UNSPECIFIED
        - CREDENTIAL_STATE_READY
        - CREDENTIAL_STATE_MISSING
        - CREDENTIAL_STATE_REVOKED
    connectors.v1.HealthStatus:
      type: string
      title: HealthStatus
      enum:
        - HEALTH_STATUS_UNSPECIFIED
        - HEALTH_STATUS_HEALTHY
        - HEALTH_STATUS_DEGRADED
        - HEALTH_STATUS_UNHEALTHY
        - HEALTH_STATUS_UNKNOWN
      description: HealthStatus describes the health state of a connection.
    connectors.v1.OAuthActorMode:
      type: string
      title: OAuthActorMode
      enum:
        - O_AUTH_ACTOR_MODE_UNSPECIFIED
        - O_AUTH_ACTOR_MODE_USER
        - O_AUTH_ACTOR_MODE_APP
    connectors.v1.ProviderContentTrust:
      type: string
      title: ProviderContentTrust
      enum:
        - PROVIDER_CONTENT_TRUST_UNSPECIFIED
        - PROVIDER_CONTENT_TRUST_UNTRUSTED_PROVIDER_CONTENT
    connectors.v1.ProviderInstallationState:
      type: string
      title: ProviderInstallationState
      enum:
        - PROVIDER_INSTALLATION_STATE_UNSPECIFIED
        - PROVIDER_INSTALLATION_STATE_ACTIVE
        - PROVIDER_INSTALLATION_STATE_RECONNECT_REQUIRED
        - PROVIDER_INSTALLATION_STATE_REVOKED
      description: |-
        ProviderInstallationState is the lifecycle state of a provider-issued app
         installation. Only ACTIVE installations may resolve for event ingress.
    connectors.v1.ProviderQualificationState:
      type: string
      title: ProviderQualificationState
      enum:
        - PROVIDER_QUALIFICATION_STATE_UNSPECIFIED
        - PROVIDER_QUALIFICATION_STATE_PENDING
        - PROVIDER_QUALIFICATION_STATE_QUALIFIED
    connectors.v1.ProviderResourceLifecycleState:
      type: string
      title: ProviderResourceLifecycleState
      enum:
        - PROVIDER_RESOURCE_LIFECYCLE_STATE_UNSPECIFIED
        - PROVIDER_RESOURCE_LIFECYCLE_STATE_ACTIVE
        - PROVIDER_RESOURCE_LIFECYCLE_STATE_ARCHIVED
        - PROVIDER_RESOURCE_LIFECYCLE_STATE_DELETED
        - PROVIDER_RESOURCE_LIFECYCLE_STATE_CONNECTION_REVOKED
        - PROVIDER_RESOURCE_LIFECYCLE_STATE_QUARANTINED
    connectors.v1.ProviderResourceVisibilityClass:
      type: string
      title: ProviderResourceVisibilityClass
      enum:
        - PROVIDER_RESOURCE_VISIBILITY_CLASS_UNSPECIFIED
        - PROVIDER_RESOURCE_VISIBILITY_CLASS_WORKSPACE_PUBLIC
        - PROVIDER_RESOURCE_VISIBILITY_CLASS_EXPLICIT_PRINCIPALS
        - PROVIDER_RESOURCE_VISIBILITY_CLASS_GROUP_MEMBERSHIP
        - PROVIDER_RESOURCE_VISIBILITY_CLASS_CONNECTION_PRIVATE
    connectors.v1.ReplicationMode:
      type: string
      title: ReplicationMode
      enum:
        - REPLICATION_MODE_UNSPECIFIED
        - REPLICATION_MODE_FULL_REFRESH
        - REPLICATION_MODE_INCREMENTAL
      description: Mirrors connectors_cdk::ReplicationMode (crates/connectors-cdk/src/lib.rs).
    connectors.v1.SourceAuthorityFreshnessMethod:
      type: string
      title: SourceAuthorityFreshnessMethod
      enum:
        - SOURCE_AUTHORITY_FRESHNESS_METHOD_UNSPECIFIED
        - SOURCE_AUTHORITY_FRESHNESS_METHOD_NOT_OBSERVED
        - SOURCE_AUTHORITY_FRESHNESS_METHOD_INTROSPECTION
        - SOURCE_AUTHORITY_FRESHNESS_METHOD_WEBHOOK
        - SOURCE_AUTHORITY_FRESHNESS_METHOD_POLLING
        - SOURCE_AUTHORITY_FRESHNESS_METHOD_SHORT_TTL
        - SOURCE_AUTHORITY_FRESHNESS_METHOD_REFRESH_FAILURE
      description: |-
        SourceAuthorityFreshnessMethod identifies how the source observation was
         obtained. NOT_OBSERVED is the explicit default when no authoritative
         producer has supplied a response; it is not evidence of source access.
    connectors.v1.SourceAuthorityState:
      type: string
      title: SourceAuthorityState
      enum:
        - SOURCE_AUTHORITY_STATE_UNSPECIFIED
        - SOURCE_AUTHORITY_STATE_SUFFICIENT
        - SOURCE_AUTHORITY_STATE_INSUFFICIENT
        - SOURCE_AUTHORITY_STATE_UNKNOWN
        - SOURCE_AUTHORITY_STATE_REVOKED
      description: |-
        SourceAuthorityState is the external source system's authority posture for
         a connection. A locally active row is not source authority; callers must
         receive an explicit UNKNOWN observation until an authoritative producer
         reports otherwise.
    connectors.v1.SourceOfTruthArea:
      type: string
      title: SourceOfTruthArea
      enum:
        - SOURCE_OF_TRUTH_AREA_UNSPECIFIED
        - SOURCE_OF_TRUTH_AREA_CRM
        - SOURCE_OF_TRUTH_AREA_SUPPORT
        - SOURCE_OF_TRUTH_AREA_BILLING
        - SOURCE_OF_TRUTH_AREA_ANALYTICS
        - SOURCE_OF_TRUTH_AREA_HRIS
      description: SourceOfTruthArea identifies a functional domain for source-of-truth resolution.
    connectors.v1.UpcomingCallSourceState:
      type: string
      title: UpcomingCallSourceState
      enum:
        - UPCOMING_CALL_SOURCE_STATE_UNSPECIFIED
        - UPCOMING_CALL_SOURCE_STATE_AVAILABLE
        - UPCOMING_CALL_SOURCE_STATE_NOT_CONNECTED
      description: |-
        UpcomingCallSourceState distinguishes a connected calendar with no matching
         calls from a workspace that has not connected a supported calendar.
    connectors.v1.CompleteMcpOAuthFlowRequest:
      type: object
      properties:
        organizationId:
          type: string
          title: organization_id
          minLength: 1
        workspaceId:
          type: string
          title: workspace_id
          minLength: 1
        serverId:
          type: string
          title: server_id
          minLength: 1
        profileId:
          type: string
          title: profile_id
          minLength: 1
        state:
          type: string
          title: state
          minLength: 1
        code:
          type: string
          title: code
          description: |-
            Empty code is permitted only for a provider error response; the
             Connector validates the raw iss binding before acting on any error text.
        redirectUri:
          type: string
          title: redirect_uri
          format: uri
        idempotencyKey:
          type: string
          title: idempotency_key
          minLength: 1
        profileGeneration:
          exclusiveMinimum: 0
          type:
            - integer
            - string
          title: profile_generation
          format: int64
        authorizationResponseIss:
          type: string
          title: authorization_response_iss
          description: |-
            Raw RFC 9207 authorization response fields. These are additive so older
             callers continue to send the same request shape.
        providerError:
          type: string
          title: provider_error
        providerErrorDescription:
          type: string
          title: provider_error_description
        providerErrorUri:
          type: string
          title: provider_error_uri
      title: CompleteMcpOAuthFlowRequest
      additionalProperties: false
    connectors.v1.CompleteMcpOAuthFlowResponse:
      type: object
      properties:
        connectionRef:
          type: string
          title: connection_ref
        grantId:
          type: string
          title: grant_id
        scopes:
          type: array
          items:
            type: string
          title: scopes
        expiresAt:
          title: expires_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        grantVersion:
          type:
            - integer
            - string
          title: grant_version
          format: int64
        profileId:
          type: string
          title: profile_id
      title: CompleteMcpOAuthFlowResponse
      additionalProperties: false
    connectors.v1.CompleteOAuthFlowRequest:
      type: object
      properties:
        workspaceId:
          type: string
          title: workspace_id
          minLength: 1
        organizationId:
          type: string
          title: organization_id
          minLength: 1
        providerId:
          type: string
          title: provider_id
          minLength: 1
        state:
          type: string
          title: state
          minLength: 1
          description: State token returned from InitiateOAuthFlow.
        code:
          type: string
          title: code
          minLength: 1
          description: Authorization code returned by the provider on the redirect.
        redirectUri:
          type: string
          title: redirect_uri
          minLength: 1
          description: Same redirect_uri passed to InitiateOAuthFlow; providers verify it.
        displayName:
          type: string
          title: display_name
          description: Human-friendly label persisted on the connection record.
        idempotencyKey:
          type: string
          title: idempotency_key
        githubInstallationId:
          type:
            - integer
            - string
          title: github_installation_id
          format: int64
          description: |-
            Untrusted GitHub callback coordinate; verified against the authenticated
             provider user and configured product App before connection registration.
      title: CompleteOAuthFlowRequest
      additionalProperties: false
    connectors.v1.CompleteOAuthFlowResponse:
      type: object
      properties:
        connection:
          title: connection
          $ref: '#/components/schemas/connectors.v1.Connection'
      title: CompleteOAuthFlowResponse
      additionalProperties: false
    connectors.v1.Connection:
      type: object
      properties:
        id:
          type: string
          title: id
        workspaceId:
          type: string
          title: workspace_id
        providerId:
          type: string
          title: provider_id
        displayName:
          type: string
          title: display_name
        authType:
          title: auth_type
          $ref: '#/components/schemas/connectors.v1.AuthType'
        scopes:
          type: array
          items:
            type: string
          title: scopes
        healthStatus:
          title: health_status
          $ref: '#/components/schemas/connectors.v1.HealthStatus'
        lastHealthyAt:
          title: last_healthy_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        credentialRefs:
          type: object
          title: credential_refs
          additionalProperties:
            type: string
            title: value
          description: |-
            credential_refs mirrors non-secret credential references such as vault or
             secret-manager handles. Raw credential material must not be returned here.
        organizationId:
          type: string
          title: organization_id
        healthReason:
          type: string
          title: health_reason
          description: |-
            health_reason is a short, human-readable explanation of the current
             health_status — "token refreshed 2m ago", "auth failed: token revoked",
             "rate-limited by upstream". The UI surfaces it on tiles and the active
             card so operators don't have to dig into logs to find out why a
             connection is degraded. Empty when there's nothing meaningful to add.
        credentialExpiresAt:
          title: credential_expires_at
          description: |-
            Expiry of the connection's stored OAuth credential, when known. Unset for
             API-key/basic/mtls connections and for providers that do not report it.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        revision:
          type:
            - integer
            - string
          title: revision
          format: int64
          description: Connection-owner custody revision. Zero is an unpersisted or legacy snapshot.
      title: Connection
      additionalProperties: false
      description: Connection is the canonical external integration connection record.
    connectors.v1.Connection.CredentialRefsEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: CredentialRefsEntry
      additionalProperties: false
    connectors.v1.ConnectionHealth:
      type: object
      properties:
        status:
          title: status
          $ref: '#/components/schemas/connectors.v1.HealthStatus'
        latencyMs:
          type: integer
          title: latency_ms
          format: int32
        lastCheckAt:
          title: last_check_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        errorMessage:
          type: string
          title: error_message
        reason:
          type: string
          title: reason
          description: |-
            reason mirrors Connection.health_reason but for the live GetHealth
             response. Empty when status==healthy and there's nothing to surface.
      title: ConnectionHealth
      additionalProperties: false
      description: ConnectionHealth provides detailed health information for a connection.
    connectors.v1.ConnectionStream:
      type: object
      properties:
        streamId:
          type: string
          title: stream_id
        stableId:
          type: string
