              schema:
                $ref: '#/components/schemas/connectors.v1.RevokeMcpOAuthGrantResponse'
  /connectors.v1.ConnectorService/TriggerSync:
    post:
      tags:
        - connectors.v1.ConnectorService
      summary: TriggerSync
      description: |-
        TriggerSync enqueues a sync run for a connection's resource stream on the
         connectors owner's durable run queue. Enqueue is idempotent on
         (connection_id, idempotency_key): replaying the same key returns the
         existing queue row rather than creating a duplicate run.
      operationId: connectors.v1.ConnectorService.TriggerSync
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectors.v1.TriggerSyncRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connectors.v1.TriggerSyncResponse'
  /connectors.v1.ConnectorService/ListConnectionStreams:
