        oauthSupported:
          type: boolean
          title: oauth_supported
          description: |-
            oauth_supported is true when the connectors backend can run the OAuth
             flow for this provider — i.e. the provider is in oauthProviderRegistry
             and its OAuth client_id/secret are present in the OAuth catalog. The
             UI uses this instead of a hardcoded list to decide whether to show
             the Authorize launcher or the catalog-runbook notice; that means
             adding a provider in Go automatically flips it on for the UI.
        catalogCategories:
          type: array
          items:
            type: string
          title: catalog_categories
          description: |-
            catalog_categories are backend-authored tags such as "ai" or
             "governance" used by UI filtering and operator copy.
        runtime:
          title: runtime
          description: runtime is set when the provider has an executable inventory/read runtime.
          $ref: '#/components/schemas/connectors.v1.ConnectorRuntime'
        stableId:
          type: string
          title: stable_id
        aliases:
          type: array
          items:
            type: string
          title: aliases
        provenance:
