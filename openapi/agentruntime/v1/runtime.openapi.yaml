  /agentruntime.v1.AgentRuntimeService/RecordRunCheckpoint:
    post:
      tags:
        - agentruntime.v1.AgentRuntimeService
      summary: RecordRunCheckpoint
      description: |-
        RecordRunCheckpoint stores an opaque resume snapshot. Checkpoints are the
         source of truth for resuming work; deterministic replay is not required.
      operationId: agentruntime.v1.AgentRuntimeService.RecordRunCheckpoint
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agentruntime.v1.RecordRunCheckpointRequest'
        required: true
      responses:
