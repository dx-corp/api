        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agentruntime.v1.ListRunWorkItemsResponse'
  /agentruntime.v1.AgentRuntimeService/YieldRun:
    post:
      tags:
        - agentruntime.v1.AgentRuntimeService
      summary: YieldRun
      description: |-
        YieldRun ends the current leased run step while keeping the autonomous
         session alive. Inline yields enqueue a successor AgentRun immediately;
         end-session yields close the run without enqueueing more autonomous work.
         Timer, approval, input, and event blocking use WaitRun/ResumeRun.
      operationId: agentruntime.v1.AgentRuntimeService.YieldRun
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agentruntime.v1.YieldRunRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agentruntime.v1.YieldRunResponse'
  /agentruntime.v1.AgentRuntimeService/WaitRun:
    post:
      tags:
        - agentruntime.v1.AgentRuntimeService
      summary: WaitRun
      description: |-
        WaitRun parks the run on an approval, input, timer, or event wait and
         clears the worker lease so no compute is held while blocked.
      operationId: agentruntime.v1.AgentRuntimeService.WaitRun
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
