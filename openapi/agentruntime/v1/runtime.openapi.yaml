            application/json:
              schema:
                $ref: '#/components/schemas/agentruntime.v1.RenewRunLeaseResponse'
  /agentruntime.v1.AgentRuntimeService/RecordRunStep:
    post:
      tags:
        - agentruntime.v1.AgentRuntimeService
