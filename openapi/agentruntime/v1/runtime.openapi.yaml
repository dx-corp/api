  /agentruntime.v1.AgentRuntimeService/RecordRunStreamCursor:
    post:
      tags:
        - agentruntime.v1.AgentRuntimeService
      summary: RecordRunStreamCursor
      description: RecordRunStreamCursor stores a consumer cursor into the run event stream.
      operationId: agentruntime.v1.AgentRuntimeService.RecordRunStreamCursor
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agentruntime.v1.RecordRunStreamCursorRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
