          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agentruntime.v1.RecordRunStreamCursorResponse'
  /agentruntime.v1.AgentRuntimeService/RecordRunEvent:
    post:
      tags:
        - agentruntime.v1.AgentRuntimeService
      summary: RecordRunEvent
      description: |-
        RecordRunEvent appends an adapter-observed lifecycle event to an existing
         AgentRun without requiring a worker lease. Channel adapters use this to
         attach Slack/Teams/email delivery, approval, model, and tool milestones
         while Platform remains the durable source of truth for the run timeline.
      operationId: agentruntime.v1.AgentRuntimeService.RecordRunEvent
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agentruntime.v1.RecordRunEventRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agentruntime.v1.RecordRunEventResponse'
  /agentruntime.v1.AgentRuntimeService/ControlRun:
    post:
      tags:
        - agentruntime.v1.AgentRuntimeService
      summary: ControlRun
      description: |-
        ControlRun records a human, channel, scheduler, or system control against
         the active autonomous run/session. Controls are durable steering input; the
         Slack adapter is not responsible for keeping the agent alive turn by turn.
      operationId: agentruntime.v1.AgentRuntimeService.ControlRun
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agentruntime.v1.ControlRunRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agentruntime.v1.ControlRunResponse'
  /agentruntime.v1.AgentRuntimeService/RecordRunWorkItem:
    post:
      tags:
        - agentruntime.v1.AgentRuntimeService
      summary: RecordRunWorkItem
      description: |-
        RecordRunWorkItem creates or replaces one node in the autonomous work graph.
         Work items, not VFS projections, are the canonical state for long-horizon
         goals, child runs, waits, tool activity, blockers, and completion gates.
      operationId: agentruntime.v1.AgentRuntimeService.RecordRunWorkItem
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agentruntime.v1.RecordRunWorkItemRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agentruntime.v1.RecordRunWorkItemResponse'
  /agentruntime.v1.AgentRuntimeService/UpdateRunWorkItem:
    post:
      tags:
        - agentruntime.v1.AgentRuntimeService
