          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agentruntime.v1.UpdateRunWorkItemResponse'
  /agentruntime.v1.AgentRuntimeService/ListRunWorkItems:
    post:
      tags:
        - agentruntime.v1.AgentRuntimeService
      summary: ListRunWorkItems
      description: ListRunWorkItems returns the typed work graph for one run or work envelope.
      operationId: agentruntime.v1.AgentRuntimeService.ListRunWorkItems
