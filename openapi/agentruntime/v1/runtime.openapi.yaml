openapi: 3.1.0
info:
  title: agentruntime.v1
paths:
  /agentruntime.v1.AgentRuntimeService/HandleTrigger:
    post:
      tags:
        - agentruntime.v1.AgentRuntimeService
      summary: HandleTrigger
      description: |-
        HandleTrigger receives a normalized product or integration trigger,
         resolves agent/objective context, records an AgentRun, and dispatches it.
      operationId: agentruntime.v1.AgentRuntimeService.HandleTrigger
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agentruntime.v1.HandleTriggerRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agentruntime.v1.HandleTriggerResponse'
  /agentruntime.v1.AgentRuntimeService/AdmitOperatingChannelEvent:
    post:
      tags:
        - agentruntime.v1.AgentRuntimeService
      summary: AdmitOperatingChannelEvent
      description: |-
        AdmitOperatingChannelEvent accepts provider-issued coordinates from a
         channel edge that cannot know tenant ownership. Platform resolves the
         installation and external actor before durably admitting the event.
      operationId: agentruntime.v1.AgentRuntimeService.AdmitOperatingChannelEvent
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agentruntime.v1.AdmitOperatingChannelEventRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agentruntime.v1.AdmitOperatingChannelEventResponse'
  /agentruntime.v1.AgentRuntimeService/AdmitSurfaceInvocation:
    post:
      tags:
        - agentruntime.v1.AgentRuntimeService
      summary: AdmitSurfaceInvocation
      description: |-
        AdmitSurfaceInvocation accepts a provider-neutral invocation from a
         verified surface adapter. Platform resolves installation ownership and
         the external actor before binding the provider object to an operating
         thread and durably admitting work.
      operationId: agentruntime.v1.AgentRuntimeService.AdmitSurfaceInvocation
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agentruntime.v1.AdmitSurfaceInvocationRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agentruntime.v1.AdmitSurfaceInvocationResponse'
  /agentruntime.v1.AgentRuntimeService/EnsureOrganizationEmail:
    post:
      tags:
        - agentruntime.v1.AgentRuntimeService
      summary: EnsureOrganizationEmail
      description: |-
        Identity reconciles one approved organization and its active default workspace.
         Caller scope is service-only; this request cannot select provider credentials.
      operationId: agentruntime.v1.AgentRuntimeService.EnsureOrganizationEmail
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agentruntime.v1.EnsureOrganizationEmailRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agentruntime.v1.EnsureOrganizationEmailResponse'
  /agentruntime.v1.AgentRuntimeService/ClaimNextRun:
    post:
      tags:
        - agentruntime.v1.AgentRuntimeService
      summary: ClaimNextRun
      description: |-
        ClaimNextRun atomically leases the next queued or retry-ready run for a
         worker. A claim transitions the run to RUNNING and increments attempt.
      operationId: agentruntime.v1.AgentRuntimeService.ClaimNextRun
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agentruntime.v1.ClaimNextRunRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agentruntime.v1.ClaimNextRunResponse'
  /agentruntime.v1.AgentRuntimeService/HeartbeatRun:
    post:
      tags:
        - agentruntime.v1.AgentRuntimeService
      summary: HeartbeatRun
      description: |-
        HeartbeatRun extends an active worker lease. Expired leases are eligible
         to be reclaimed by another worker from the last checkpoint.
      operationId: agentruntime.v1.AgentRuntimeService.HeartbeatRun
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agentruntime.v1.HeartbeatRunRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agentruntime.v1.HeartbeatRunResponse'
  /agentruntime.v1.AgentRuntimeService/RenewRunLease:
    post:
      tags:
        - agentruntime.v1.AgentRuntimeService
      summary: RenewRunLease
      description: |-
        RenewRunLease recovers a still-owned worker lease after it has expired but
         before the run has been parked, completed, or otherwise taken over.
      operationId: agentruntime.v1.AgentRuntimeService.RenewRunLease
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
