      tags:
        - agentruntime.v1.AgentRuntimeService
      summary: CancelRun
      description: CancelRun cancels a run before it reaches a terminal success/failure.
      operationId: agentruntime.v1.AgentRuntimeService.CancelRun
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agentruntime.v1.CancelRunRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
