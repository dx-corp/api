syntax = "proto3";

package agentruntime.v1;

import "agents/v1/agents.proto";
import "buf/validate/validate.proto";
import "codex/v1/codex.proto";
import "common/v1/authz.proto";
import "common/v1/risk.proto";
import "common/v1/surface.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "objectives/v1/objectives.proto";

option go_package = "github.com/evalops/platform/gen/go/agentruntime/v1;agentruntimev1";

// AgentRuntimeService accepts normalized triggers and manages durable
// AgentRun execution attempts. Workers claim runs by lease, checkpoint their
// progress, release compute while waiting for human/input/event gates, and
// resume from checkpoints rather than replaying LLM or tool calls.
service AgentRuntimeService {
  // HandleTrigger receives a normalized product or integration trigger,
  // resolves agent/objective context, records an AgentRun, and dispatches it.
  rpc HandleTrigger(HandleTriggerRequest) returns (HandleTriggerResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.organization_scope_field) = "trigger.organization_id";
    option (common.v1.workspace_scope_field) = "trigger.workspace_id";

    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // AdmitOperatingChannelEvent accepts provider-issued coordinates from a
  // channel edge that cannot know tenant ownership. Platform resolves the
  // installation and external actor before durably admitting the event.
  rpc AdmitOperatingChannelEvent(AdmitOperatingChannelEventRequest) returns (AdmitOperatingChannelEventResponse) {
    option (common.v1.required_scopes) = "channel-edge:admit";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // AdmitSurfaceInvocation accepts a provider-neutral invocation from a
  // verified surface adapter. Platform resolves installation ownership and
  // the external actor before binding the provider object to an operating
  // thread and durably admitting work.
  rpc AdmitSurfaceInvocation(AdmitSurfaceInvocationRequest) returns (AdmitSurfaceInvocationResponse) {
    option (common.v1.required_scopes) = "surface-edge:admit";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // Identity reconciles one approved organization and its active default workspace.
  // Caller scope is service-only; this request cannot select provider credentials.
  rpc EnsureOrganizationEmail(EnsureOrganizationEmailRequest) returns (EnsureOrganizationEmailResponse) {
    option (common.v1.required_scopes) = "organization-email:provision";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // ClaimNextRun atomically leases the next queued or retry-ready run for a
  // worker. A claim transitions the run to RUNNING and increments attempt.
  rpc ClaimNextRun(ClaimNextRunRequest) returns (ClaimNextRunResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // HeartbeatRun extends an active worker lease. Expired leases are eligible
  // to be reclaimed by another worker from the last checkpoint.
  rpc HeartbeatRun(HeartbeatRunRequest) returns (HeartbeatRunResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // RenewRunLease recovers a still-owned worker lease after it has expired but
  // before the run has been parked, completed, or otherwise taken over.
  rpc RenewRunLease(RenewRunLeaseRequest) returns (RenewRunLeaseResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // RecordRunStep upserts the durable record for one execution step.
  rpc RecordRunStep(RecordRunStepRequest) returns (RecordRunStepResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // RecordRunCheckpoint stores an opaque resume snapshot. Checkpoints are the
  // source of truth for resuming work; deterministic replay is not required.
  rpc RecordRunCheckpoint(RecordRunCheckpointRequest) returns (RecordRunCheckpointResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // RecordRunArtifact links a produced artifact to the run and optional step.
  rpc RecordRunArtifact(RecordRunArtifactRequest) returns (RecordRunArtifactResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // RecordRunCost links metering/cost data to the run and optional step.
  rpc RecordRunCost(RecordRunCostRequest) returns (RecordRunCostResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // RecordRunStreamCursor stores a consumer cursor into the run event stream.
  rpc RecordRunStreamCursor(RecordRunStreamCursorRequest) returns (RecordRunStreamCursorResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // RecordRunEvent appends an adapter-observed lifecycle event to an existing
  // AgentRun without requiring a worker lease. Channel adapters use this to
  // attach Slack/Teams/email delivery, approval, model, and tool milestones
  // while Platform remains the durable source of truth for the run timeline.
  rpc RecordRunEvent(RecordRunEventRequest) returns (RecordRunEventResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // ControlRun records a human, channel, scheduler, or system control against
  // the active autonomous run/session. Controls are durable steering input; the
  // Slack adapter is not responsible for keeping the agent alive turn by turn.
  rpc ControlRun(ControlRunRequest) returns (ControlRunResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // RecordRunWorkItem creates or replaces one node in the autonomous work graph.
  // Work items, not VFS projections, are the canonical state for long-horizon
  // goals, child runs, waits, tool activity, blockers, and completion gates.
  rpc RecordRunWorkItem(RecordRunWorkItemRequest) returns (RecordRunWorkItemResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // UpdateRunWorkItem patches progress for one autonomous work graph node.
  rpc UpdateRunWorkItem(UpdateRunWorkItemRequest) returns (UpdateRunWorkItemResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // ListRunWorkItems returns the typed work graph for one run or work envelope.
  rpc ListRunWorkItems(ListRunWorkItemsRequest) returns (ListRunWorkItemsResponse) {
    option (common.v1.required_scopes) = "agentruntime:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // YieldRun ends the current leased run step while keeping the autonomous
  // session alive. Inline yields enqueue a successor AgentRun immediately;
  // end-session yields close the run without enqueueing more autonomous work.
  // Timer, approval, input, and event blocking use WaitRun/ResumeRun.
  rpc YieldRun(YieldRunRequest) returns (YieldRunResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // WaitRun parks the run on an approval, input, timer, or event wait and
  // clears the worker lease so no compute is held while blocked.
  rpc WaitRun(WaitRunRequest) returns (WaitRunResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // ResumeRun resolves a wait and requeues the run from its latest checkpoint.
  rpc ResumeRun(ResumeRunRequest) returns (ResumeRunResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // CompleteRun marks the run successful and releases any active lease.
  rpc CompleteRun(CompleteRunRequest) returns (CompleteRunResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // FailRun records a failed attempt. Retryable failures can move to RETRYING;
  // exhausted attempts stay FAILED until they are moved to the dead letter set.
  rpc FailRun(FailRunRequest) returns (FailRunResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // CancelRun cancels a run before it reaches a terminal success/failure.
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // RetryRun explicitly schedules a failed run for another attempt.
  rpc RetryRun(RetryRunRequest) returns (RetryRunResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // DeadLetterRun moves an exhausted or poison run out of normal scheduling.
  rpc DeadLetterRun(DeadLetterRunRequest) returns (DeadLetterRunResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // GetRun retrieves an AgentRun by ID.
  rpc GetRun(GetRunRequest) returns (GetRunResponse) {
    option (common.v1.required_scopes) = "agentruntime:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // GetTeammateWorkLedger retrieves the durable teammate work projection for
  // one run. It joins run state, waits, memory citations, connector grants,
  // VFS state, proactive policy, and channel-visible status into the compact
  // read model workers and operator consoles use for long-horizon handoff.
  rpc GetTeammateWorkLedger(GetTeammateWorkLedgerRequest) returns (GetTeammateWorkLedgerResponse) {
    option (common.v1.required_scopes) = "agentruntime:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // ListRunsByWorkEnvelope retrieves newest runs that belong to one durable
  // channel work envelope, such as a Slack thread or future email/Jira/Teams object.
  rpc ListRunsByWorkEnvelope(ListRunsByWorkEnvelopeRequest) returns (ListRunsByWorkEnvelopeResponse) {
    option (common.v1.required_scopes) = "agentruntime:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // GetChannelThreadAdoption resolves whether a channel thread has been
  // explicitly adopted by an agent and can receive no-mention continuations.
  rpc GetChannelThreadAdoption(GetChannelThreadAdoptionRequest) returns (GetChannelThreadAdoptionResponse) {
    option (common.v1.required_scopes) = "agentruntime:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // RecordChannelThreadAdoption durably records an adapter-observed channel
  // thread adoption without requiring the adapter to create a new AgentRun.
  rpc RecordChannelThreadAdoption(RecordChannelThreadAdoptionRequest) returns (RecordChannelThreadAdoptionResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // ListChannelThreadAdoptions returns the durable adoption projection for
  // operator/debug surfaces and channel-adapter reconciliation.
  rpc ListChannelThreadAdoptions(ListChannelThreadAdoptionsRequest) returns (ListChannelThreadAdoptionsResponse) {
    option (common.v1.required_scopes) = "agentruntime:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // ListRunWaits returns a pending-work projection over parked AgentRun waits
  // without requiring clients to replay runtime events or read full run
  // snapshots.
  rpc ListRunWaits(ListRunWaitsRequest) returns (ListRunWaitsResponse) {
    option (common.v1.required_scopes) = "agentruntime:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // RecordChannelActionReceipt durably records an interactive channel action,
  // such as a Slack approval button or slash command, before any side effects
  // resume runtime work.
  rpc RecordChannelActionReceipt(RecordChannelActionReceiptRequest) returns (RecordChannelActionReceiptResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // GetChannelActionReceipt retrieves one recorded channel action receipt.
  rpc GetChannelActionReceipt(GetChannelActionReceiptRequest) returns (GetChannelActionReceiptResponse) {
    option (common.v1.required_scopes) = "agentruntime:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // ListChannelActionReceipts returns durable channel action receipts for
  // audit, idempotency, and channel adapter reconciliation.
  rpc ListChannelActionReceipts(ListChannelActionReceiptsRequest) returns (ListChannelActionReceiptsResponse) {
    option (common.v1.required_scopes) = "agentruntime:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // ListRunEvents returns the append-only event log for an AgentRun.
  rpc ListRunEvents(ListRunEventsRequest) returns (ListRunEventsResponse) {
    option (common.v1.required_scopes) = "agentruntime:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // ListRunVirtualFiles lists the durable read model of a run's virtual
  // filesystem, including context files and agent-authored proposal files.
  rpc ListRunVirtualFiles(ListRunVirtualFilesRequest) returns (ListRunVirtualFilesResponse) {
    option (common.v1.required_scopes) = "agentruntime:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // ReadRunVirtualFile reads a bounded slice of one run virtual file. Workers
  // should use this instead of loading every virtual file into model context.
  rpc ReadRunVirtualFile(ReadRunVirtualFileRequest) returns (ReadRunVirtualFileResponse) {
    option (common.v1.required_scopes) = "agentruntime:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // StatRunVirtualFile returns the typed, content-free VFS projection for one
  // run virtual file by path.
  rpc StatRunVirtualFile(StatRunVirtualFileRequest) returns (StatRunVirtualFileResponse) {
    option (common.v1.required_scopes) = "agentruntime:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // WatchRunVirtualFiles streams a resumable VFS timeline for local agent
  // development and inspectors without polling the full VFS projection.
  rpc WatchRunVirtualFiles(WatchRunVirtualFilesRequest) returns (stream WatchRunVirtualFilesResponse) {
    option (common.v1.required_scopes) = "agentruntime:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // BatchReadRunVirtualFiles reads multiple bounded VFS slices in one request
  // while making per-file and total-budget truncation explicit.
  rpc BatchReadRunVirtualFiles(BatchReadRunVirtualFilesRequest) returns (BatchReadRunVirtualFilesResponse) {
    option (common.v1.required_scopes) = "agentruntime:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // BuildRunVirtualFileContextPack returns an ordered, cited set of VFS
  // snippets for a task or query so workers can hydrate model context without
  // hand-rolling list/search/read loops.
  rpc BuildRunVirtualFileContextPack(BuildRunVirtualFileContextPackRequest) returns (BuildRunVirtualFileContextPackResponse) {
    option (common.v1.required_scopes) = "agentruntime:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // SearchRunVirtualFiles performs bounded literal or regex search over text
  // virtual files projected for an AgentRun.
  rpc SearchRunVirtualFiles(SearchRunVirtualFilesRequest) returns (SearchRunVirtualFilesResponse) {
    option (common.v1.required_scopes) = "agentruntime:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // RecordRunVirtualFileProposal writes an agent-authored file into the
  // proposal/workspace side of the VFS. Source mounts such as /context remain
  // read-only; promotion to real side effects happens through reviewers or
  // downstream services.
  rpc RecordRunVirtualFileProposal(RecordRunVirtualFileProposalRequest) returns (RecordRunVirtualFileProposalResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // RecordRunVirtualFileTransaction atomically stages a multi-file VFS change
  // set as durable proposal artifacts with shared revision and review metadata.
  rpc RecordRunVirtualFileTransaction(RecordRunVirtualFileTransactionRequest) returns (RecordRunVirtualFileTransactionResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // PromoteRunVirtualFileTransaction records a reviewed transaction as the
  // accepted workspace view. Promotion is idempotent by transaction and keeps
  // proposal artifacts intact for audit.
  rpc PromoteRunVirtualFileTransaction(PromoteRunVirtualFileTransactionRequest) returns (PromoteRunVirtualFileTransactionResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }

  // DiffRunVirtualFileTransaction previews a staged VFS transaction as
  // per-file stats, hunks, conflicts, and unified diff text.
  rpc DiffRunVirtualFileTransaction(DiffRunVirtualFileTransactionRequest) returns (DiffRunVirtualFileTransactionResponse) {
    option (common.v1.required_scopes) = "agentruntime:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // ApplyRunVirtualFileTransaction applies a transaction when the diff is
  // clean, and otherwise returns structured conflicts without mutating state.
  rpc ApplyRunVirtualFileTransaction(ApplyRunVirtualFileTransactionRequest) returns (ApplyRunVirtualFileTransactionResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }

  // RebaseRunVirtualFileTransaction restages a clean transaction on top of the
  // latest accepted VFS revisions while preserving proposed content metadata.
  rpc RebaseRunVirtualFileTransaction(RebaseRunVirtualFileTransactionRequest) returns (RebaseRunVirtualFileTransactionResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // HydrateRunVirtualFileMount resolves a lazy connector mount into bounded
  // run-scoped VFS files without exposing credentials to the worker.
  rpc HydrateRunVirtualFileMount(HydrateRunVirtualFileMountRequest) returns (HydrateRunVirtualFileMountResponse) {
    option (common.v1.required_scopes) = "agentruntime:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // InspectRunVirtualFiles returns a debug projection over mounts,
  // transactions, content addresses, and Cerebro indexing readiness.
  rpc InspectRunVirtualFiles(InspectRunVirtualFilesRequest) returns (InspectRunVirtualFilesResponse) {
    option (common.v1.required_scopes) = "agentruntime:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
}

// AgentRunState describes the runtime lifecycle of one durable attempt.
enum AgentRunState {
  AGENT_RUN_STATE_UNSPECIFIED = 0;
  AGENT_RUN_STATE_ACCEPTED = 1;
  AGENT_RUN_STATE_QUEUED = 2;
  AGENT_RUN_STATE_RUNNING = 3;
  AGENT_RUN_STATE_WAITING = 4;
  AGENT_RUN_STATE_SUCCEEDED = 5;
  AGENT_RUN_STATE_FAILED = 6;
  AGENT_RUN_STATE_CANCELLED = 7;
  AGENT_RUN_STATE_RETRYING = 8;
  AGENT_RUN_STATE_DEAD_LETTERED = 9;
}

// AgentRunStepState describes progress for a single durable step record.
enum AgentRunStepState {
  AGENT_RUN_STEP_STATE_UNSPECIFIED = 0;
  AGENT_RUN_STEP_STATE_PENDING = 1;
  AGENT_RUN_STEP_STATE_RUNNING = 2;
  AGENT_RUN_STEP_STATE_WAITING = 3;
  AGENT_RUN_STEP_STATE_SUCCEEDED = 4;
  AGENT_RUN_STEP_STATE_FAILED = 5;
  AGENT_RUN_STEP_STATE_CANCELLED = 6;
  AGENT_RUN_STEP_STATE_SKIPPED = 7;
}

// AgentRunStepKind classifies the durable work represented by a run step.
enum AgentRunStepKind {
  AGENT_RUN_STEP_KIND_UNSPECIFIED = 0;
  AGENT_RUN_STEP_KIND_MODEL_CALL = 1;
  AGENT_RUN_STEP_KIND_TOOL_CALL_INTENT = 2;
  AGENT_RUN_STEP_KIND_TOOL_RESULT = 3;
  AGENT_RUN_STEP_KIND_APPROVAL_WAIT = 4;
  AGENT_RUN_STEP_KIND_ERROR = 5;
  AGENT_RUN_STEP_KIND_SYSTEM = 6;
  AGENT_RUN_STEP_KIND_CONTEXT_ENRICHMENT = 7;
  AGENT_RUN_STEP_KIND_PLAN = 8;
  AGENT_RUN_STEP_KIND_PATCH = 9;
  AGENT_RUN_STEP_KIND_TEST = 10;
  AGENT_RUN_STEP_KIND_PULL_REQUEST_SYNC = 11;
  AGENT_RUN_STEP_KIND_REVIEW_SYNC = 12;
}

// AgentRunWaitType describes why a run released its worker lease.
enum AgentRunWaitType {
  AGENT_RUN_WAIT_TYPE_UNSPECIFIED = 0;
  AGENT_RUN_WAIT_TYPE_APPROVAL = 1;
  AGENT_RUN_WAIT_TYPE_INPUT = 2;
  AGENT_RUN_WAIT_TYPE_EVENT = 3;
  AGENT_RUN_WAIT_TYPE_TIMER = 4;
}

// AgentRunWaitState describes the read-model state of a parked wait.
enum AgentRunWaitState {
  AGENT_RUN_WAIT_STATE_UNSPECIFIED = 0;
  AGENT_RUN_WAIT_STATE_PENDING = 1;
  AGENT_RUN_WAIT_STATE_RESOLVED = 2;
  AGENT_RUN_WAIT_STATE_EXPIRED = 3;
  AGENT_RUN_WAIT_STATE_CANCELLED = 4;
}

// AgentRunArtifactKind classifies durable output produced by a run or step.
enum AgentRunArtifactKind {
  AGENT_RUN_ARTIFACT_KIND_UNSPECIFIED = 0;
  AGENT_RUN_ARTIFACT_KIND_TOOL_RESULT = 1;
  AGENT_RUN_ARTIFACT_KIND_CHART = 2;
  AGENT_RUN_ARTIFACT_KIND_REPORT = 3;
  AGENT_RUN_ARTIFACT_KIND_FILE = 4;
  AGENT_RUN_ARTIFACT_KIND_TRANSCRIPT = 5;
  AGENT_RUN_ARTIFACT_KIND_APPROVAL_PLAN = 6;
  AGENT_RUN_ARTIFACT_KIND_SYSTEM = 7;
  AGENT_RUN_ARTIFACT_KIND_PATCH = 8;
  AGENT_RUN_ARTIFACT_KIND_PULL_REQUEST = 9;
  AGENT_RUN_ARTIFACT_KIND_PULL_REQUEST_COMMENT = 10;
  AGENT_RUN_ARTIFACT_KIND_CI_STATUS = 11;
  AGENT_RUN_ARTIFACT_KIND_RUN_PANEL = 12;
  AGENT_RUN_ARTIFACT_KIND_EVALUATION_EXAMPLE = 13;
}

// RuntimeEventType classifies append-only AgentRun events.
enum RuntimeEventType {
  RUNTIME_EVENT_TYPE_UNSPECIFIED = 0;
  RUNTIME_EVENT_TYPE_TRIGGER_ACCEPTED = 1;
  RUNTIME_EVENT_TYPE_AGENT_CONFIG_RESOLVED = 2;
  RUNTIME_EVENT_TYPE_OBJECTIVE_RESOLVED = 3;
  RUNTIME_EVENT_TYPE_CONTEXT_BUILT = 4;
  RUNTIME_EVENT_TYPE_WORKER_DISPATCHED = 5;
  RUNTIME_EVENT_TYPE_RUN_FAILED = 6;
  RUNTIME_EVENT_TYPE_RUN_QUEUED = 7;
  RUNTIME_EVENT_TYPE_RUN_CLAIMED = 8;
  RUNTIME_EVENT_TYPE_LEASE_HEARTBEAT = 9;
  RUNTIME_EVENT_TYPE_STEP_RECORDED = 10;
  RUNTIME_EVENT_TYPE_CHECKPOINT_RECORDED = 11;
  RUNTIME_EVENT_TYPE_ARTIFACT_RECORDED = 12;
  RUNTIME_EVENT_TYPE_COST_RECORDED = 13;
  RUNTIME_EVENT_TYPE_RUN_WAITING = 14;
  RUNTIME_EVENT_TYPE_RUN_RESUMED = 15;
  RUNTIME_EVENT_TYPE_RUN_SUCCEEDED = 16;
  RUNTIME_EVENT_TYPE_RUN_CANCELLED = 17;
  RUNTIME_EVENT_TYPE_RUN_RETRY_SCHEDULED = 18;
  RUNTIME_EVENT_TYPE_RUN_DEAD_LETTERED = 19;
  RUNTIME_EVENT_TYPE_STREAM_CURSOR_RECORDED = 20;
  RUNTIME_EVENT_TYPE_CODEX_INTERACTION_REQUESTED = 21;
  RUNTIME_EVENT_TYPE_CODEX_INTERACTION_RESOLVED = 22;
  RUNTIME_EVENT_TYPE_CODEX_PROGRESS_RECORDED = 23;
  RUNTIME_EVENT_TYPE_CODEX_OUTPUT_SYNCED = 24;
  RUNTIME_EVENT_TYPE_CODEX_OUTCOME_OBSERVED = 25;
  RUNTIME_EVENT_TYPE_CHANNEL_MESSAGE_RECORDED = 26;
  RUNTIME_EVENT_TYPE_MODEL_RESPONSE_RECORDED = 27;
  RUNTIME_EVENT_TYPE_TOOL_CALL_RECORDED = 28;
  RUNTIME_EVENT_TYPE_TOOL_RESULT_RECORDED = 29;
  RUNTIME_EVENT_TYPE_APPROVAL_REQUESTED = 30;
  RUNTIME_EVENT_TYPE_APPROVAL_RESOLVED = 31;
  RUNTIME_EVENT_TYPE_AGENT_PROGRESS_RECORDED = 32;
  RUNTIME_EVENT_TYPE_RUN_CONTROL_RECORDED = 33;
  RUNTIME_EVENT_TYPE_WORK_ITEM_RECORDED = 34;
  RUNTIME_EVENT_TYPE_WORK_ITEM_UPDATED = 35;
  RUNTIME_EVENT_TYPE_PROCESSING_PRESENCE_RECORDED = 36;
  RUNTIME_EVENT_TYPE_AUTONOMY_SESSION_RECORDED = 37;
