  // required marks a skill whose absence a client must report to the operator.
  bool required = 4;
}

// McpServerRef names one MCP server in a managed MCP policy.
message McpServerRef {
  // name is the client-side MCP server name the policy decides on.
  string name = 1;
  // url_pattern matches the server endpoint for URL-based transports.
  string url_pattern = 2;
  // transport is the MCP transport label, such as `stdio` or `http`.
  string transport = 3;
}

// McpPolicy is the organization decision about which MCP servers an agent
// client may connect to.
message McpPolicy {
  // mode selects allowlist, denylist, or open handling of unlisted servers.
  McpPolicyMode mode = 1;
  // servers are the entries the mode decides on.
  repeated McpServerRef servers = 2;
}

// ManagedSetup is the organization-owned agent client configuration document.
// Administrators author it once in Deixic; every agent client fetches it and
// enforces it locally.
message ManagedSetup {
  // version increases monotonically per tenant on every accepted write.
  uint64 version = 1;
  // issued_at is when the platform served this revision.
  google.protobuf.Timestamp issued_at = 2;
  // rules are injected into the client's system prompt.
  repeated ManagedRule rules = 3;
  // skills are the skills the organization expects clients to have.
  repeated ManagedSkillRef skills = 4;
  // mcp is the MCP server connection policy.
  McpPolicy mcp = 5;
  // sandbox_policy_toml is the serialized sandbox policy document. The platform
  // validates only that it parses as TOML; the client owns its semantics.
  string sandbox_policy_toml = 6;
  // organization_id is the tenant that owns this document.
  string organization_id = 7;
