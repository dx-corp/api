  int64 object_revision = 3;
}
message BusinessProcessRequirement {
  string requirement_id = 1;
  string label = 2;
  string role_id = 3;
  // Equality uses the declared schema's typed value. No expression strings.
  BusinessFieldValue expected = 4;
  // Zero disables age checking; positive ages apply to the record's updated_at.
  int64 max_age_seconds = 5;
  // Requires a populated field instead of equality; expected carries only field_id.
  bool require_present = 6;
}
message BusinessProcessTransition {
  string transition_id = 1;
  string name = 2;
  string from_state = 3;
  string to_state = 4;
  repeated BusinessProcessRequirement requirements = 5;
  // Requires the instance's assigned human decision maker to accept explicitly.
  bool requires_decision = 6;
  // Follow-up obligations are durable child processes admitted atomically.
  repeated BusinessProcessFollowUp follow_ups = 7;
}
message BusinessProcessFollowUp {
  string definition_id = 1;
  int64 definition_revision = 2;
  // Child roles map by stable role ID to this process's participants.
  string subject_role_id = 3;
}
message BusinessProcessDefinition {
  string definition_id = 1;
  int64 revision = 2;
  string name = 3;
  repeated BusinessProcessParticipantType participants = 4;
  string subject_role_id = 5;
  repeated string states = 6;
  string initial_state = 7;
  repeated string terminal_states = 8;
  repeated BusinessProcessTransition transitions = 9;
  string organization_id = 10;
  string workspace_id = 11;
}
message BusinessProcessReceipt {
  string operation_id = 1;
  string transition_id = 2;
  string from_state = 3;
  string to_state = 4;
  int64 revision = 5;
  string actor_id = 6;
  bool decision_accepted = 7;
  repeated BusinessProcessParticipant evidence = 8;
  repeated string follow_up_process_ids = 9;
  string recorded_at = 10;
}
