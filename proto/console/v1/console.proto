// GetManagedSetupRequest selects the tenant whose managed setup to return.
message GetManagedSetupRequest {
  string organization_id = 1 [(buf.validate.field).string.min_len = 1];
  // workspace_id selects the workspace document, falling back to the
  // organization document when the workspace has none. Leave empty to read the
  // organization document directly.
  string workspace_id = 2;
}

// SetManagedSetupRequest replaces the managed setup document for one tenant.
message SetManagedSetupRequest {
  string organization_id = 1 [(buf.validate.field).string.min_len = 1];
  // workspace_id writes a workspace override. Leave empty to write the
  // organization document.
  string workspace_id = 2;
  // setup carries the document body. Its version, issued_at, organization_id,
  // and workspace_id fields are server-owned and ignored on write.
  ManagedSetup setup = 3 [(buf.validate.field).required = true];
}

// ManagedSetupService serves the organization-owned agent client configuration
// that administrators define once and every agent client enforces. Reads are
// available to members so a running client can refresh; writes are an
// administrative action.
service ManagedSetupService {
  // GetManagedSetup returns the effective managed setup document for a tenant,
  // preferring the workspace override over the organization document.
  rpc GetManagedSetup(GetManagedSetupRequest) returns (ManagedSetup) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // SetManagedSetup replaces the managed setup document for a tenant and
  // returns the stored revision with its new version.
  rpc SetManagedSetup(SetManagedSetupRequest) returns (ManagedSetup) {
    option (common.v1.required_scopes) = "console:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }
}

