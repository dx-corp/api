    option (common.v1.required_scopes) = "prospecting.write";
    option (common.v1.organization_scope_field) = "query.organization_id";
    option (common.v1.workspace_scope_field) = "query.workspace_id";
    option (common.v1.staff_account_required) = true;
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }
  // ListProspectingDrafts returns bounded Radar outreach drafts for an exact
  // provider organization and workspace.
  rpc ListProspectingDrafts(ListProspectingDraftsRequest) returns (ListProspectingDraftsResponse) {
    option (common.v1.required_scopes) = "prospecting.read";
    option (common.v1.organization_scope_field) = "query.organization_id";
    option (common.v1.workspace_scope_field) = "query.workspace_id";
    option (common.v1.staff_account_required) = true;
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // ReviewProspectingDraft records an approval or rejection against an exact
  // draft revision. Approval is a review decision and is never delivery
  // authority.
  rpc ReviewProspectingDraft(ReviewProspectingDraftRequest) returns (ReviewProspectingDraftResponse) {
    option (common.v1.required_scopes) = "prospecting.write";
    option (common.v1.organization_scope_field) = "query.organization_id";
    option (common.v1.workspace_scope_field) = "query.workspace_id";
    option (common.v1.staff_account_required) = true;
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }
  // RecordOperatingHomepageSuggestionFeedback changes only the authenticated
  // principal's short-lived homepage projection. It never deletes the source
  // conversation or Cerebro evidence. Declared last to avoid renumbering
  // unrelated generated RPC descriptors.
  rpc RecordOperatingHomepageSuggestionFeedback(RecordOperatingHomepageSuggestionFeedbackRequest) returns (RecordOperatingHomepageSuggestionFeedbackResponse) {
    option (common.v1.required_scopes) = "console:write";
    option (common.v1.workspace_scope_field) = "query.workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
}

// WorkspaceKeyService manages workspace-level managed-credential key custody.
// The external ID is write-only and is never present in a response.
service WorkspaceKeyService {
  // GetWorkspaceKeyConfig returns the effective custody configuration.
  rpc GetWorkspaceKeyConfig(GetWorkspaceKeyConfigRequest) returns (WorkspaceKeyConfigResponse) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // PutWorkspaceKeyConfig selects the provider and key for future managed-credential uploads.
  rpc PutWorkspaceKeyConfig(PutWorkspaceKeyConfigRequest) returns (WorkspaceKeyConfigResponse) {
    option (common.v1.required_scopes) = "console:write";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }
  // DeleteWorkspaceKeyConfig returns the workspace to platform-managed custody.
  rpc DeleteWorkspaceKeyConfig(DeleteWorkspaceKeyConfigRequest) returns (WorkspaceKeyConfigResponse) {
    option (common.v1.required_scopes) = "console:write";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }
}

