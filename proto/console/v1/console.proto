syntax = "proto3";

package console.v1;

import "agentruntime/v1/runtime.proto";
import "buf/validate/validate.proto";
import "common/v1/authz.proto";
import "common/v1/classification.proto";
import "common/v1/risk.proto";
import "connectors/v1/connectors.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "memory/v1/memory.proto";
import "meter/v1/meter.proto";
import "orbcontrol/v1/orb_control.proto";
import "platform/v1/platform.proto";
import "remoterunner/v1/remoterunner.proto";
import "toolexecution/v1/toolexecution.proto";
import "traces/v1/traces.proto";
import "vfs/v1/filesystem.proto";

option go_package = "github.com/evalops/platform/gen/go/console/v1;consolev1";

// ConsoleService provides the product-facing AI operations read model for the
// EvalOps web console. It composes agent inventory, traces, approvals,
// governance, usage, integrations, and posture without exposing protocol
// details such as MCP as the primary product contract.
service ConsoleService {
  // Lists built-in native business blueprints available to every authorized tenant.
  rpc ListBusinessBlueprints(ListBusinessBlueprintsRequest) returns (ListBusinessBlueprintsResponse) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // Clones a pinned built-in blueprint into editable tenant-owned definitions and a draft form.
  rpc CloneBusinessBlueprint(CloneBusinessBlueprintRequest) returns (CloneBusinessBlueprintResponse) {
    option (common.v1.required_scopes) = "console:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // GetBusinessProcessDefinition reads immutable process definitions within the tenant.
  rpc GetBusinessProcessDefinition(GetBusinessProcessDefinitionRequest) returns (GetBusinessProcessDefinitionResponse) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // ListBusinessProcessDefinitions reads immutable process definitions within the tenant.
  rpc ListBusinessProcessDefinitions(ListBusinessProcessDefinitionsRequest) returns (ListBusinessProcessDefinitionsResponse) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // DefineBusinessProcess accesses the durable object-bound process owner.
  rpc DefineBusinessProcess(DefineBusinessProcessRequest) returns (DefineBusinessProcessResponse) {
    option (common.v1.required_scopes) = "console:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  // StartBusinessProcess accesses the durable object-bound process owner.
  rpc StartBusinessProcess(StartBusinessProcessRequest) returns (StartBusinessProcessResponse) {
    option (common.v1.required_scopes) = "console:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  // GetBusinessProcess accesses the durable object-bound process owner.
  rpc GetBusinessProcess(GetBusinessProcessRequest) returns (GetBusinessProcessResponse) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // ListBusinessProcesses accesses the durable object-bound process owner.
  rpc ListBusinessProcesses(ListBusinessProcessesRequest) returns (ListBusinessProcessesResponse) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // TransitionBusinessProcess accesses the durable object-bound process owner.
  rpc TransitionBusinessProcess(TransitionBusinessProcessRequest) returns (TransitionBusinessProcessResponse) {
    option (common.v1.required_scopes) = "console:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // Checks source-authority readiness without changing accepted state.
  rpc PrepareBusinessObjectAuthorityTransfer(PrepareBusinessObjectAuthorityTransferRequest) returns (PrepareBusinessObjectAuthorityTransferResponse) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // Checks source-authority readiness without changing accepted state.
  rpc FinalizeBusinessObjectAuthorityTransfer(FinalizeBusinessObjectAuthorityTransferRequest) returns (FinalizeBusinessObjectAuthorityTransferResponse) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // DefineBusinessObjectType uses tenant-scoped durable business object state.
  rpc DefineBusinessObjectType(DefineBusinessObjectTypeRequest) returns (DefineBusinessObjectTypeResponse) {
    option (common.v1.required_scopes) = "console:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // GetBusinessObjectType reads an exact immutable published schema revision.
  rpc GetBusinessObjectType(GetBusinessObjectTypeRequest) returns (GetBusinessObjectTypeResponse) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // ListBusinessObjectTypes uses tenant-scoped durable business object state.
  rpc ListBusinessObjectTypes(ListBusinessObjectTypesRequest) returns (ListBusinessObjectTypesResponse) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // CreateBusinessObject uses tenant-scoped durable business object state.
  rpc CreateBusinessObject(CreateBusinessObjectRequest) returns (CreateBusinessObjectResponse) {
    option (common.v1.required_scopes) = "console:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // GetBusinessObject uses tenant-scoped durable business object state.
  rpc GetBusinessObject(GetBusinessObjectRequest) returns (GetBusinessObjectResponse) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // ListBusinessObjects uses tenant-scoped durable business object state.
  rpc ListBusinessObjects(ListBusinessObjectsRequest) returns (ListBusinessObjectsResponse) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // UpdateBusinessObject uses tenant-scoped durable business object state.
  rpc UpdateBusinessObject(UpdateBusinessObjectRequest) returns (UpdateBusinessObjectResponse) {
    option (common.v1.required_scopes) = "console:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // DeleteBusinessObject uses tenant-scoped durable business object state.
  rpc DeleteBusinessObject(DeleteBusinessObjectRequest) returns (DeleteBusinessObjectResponse) {
    option (common.v1.required_scopes) = "console:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }

  // ListBusinessObjectRevisions uses tenant-scoped durable business object state.
  rpc ListBusinessObjectRevisions(ListBusinessObjectRevisionsRequest) returns (ListBusinessObjectRevisionsResponse) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // BindBusinessObjectSource uses tenant-scoped durable business object state.
  rpc BindBusinessObjectSource(BindBusinessObjectSourceRequest) returns (BindBusinessObjectSourceResponse) {
    option (common.v1.required_scopes) = "console:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // AdmitBusinessObjectObservation uses tenant-scoped durable business object state.
  rpc AdmitBusinessObjectObservation(AdmitBusinessObjectObservationRequest) returns (AdmitBusinessObjectObservationResponse) {
    option (common.v1.required_scopes) = "console:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // ListBusinessObjectRelationships uses tenant-scoped durable business object state.
  rpc ListBusinessObjectRelationships(ListBusinessObjectRelationshipsRequest) returns (ListBusinessObjectRelationshipsResponse) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // CreateBusinessObjectRelationship uses tenant-scoped durable business object state.
  rpc CreateBusinessObjectRelationship(CreateBusinessObjectRelationshipRequest) returns (CreateBusinessObjectRelationshipResponse) {
    option (common.v1.required_scopes) = "console:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // DeleteBusinessObjectRelationship uses tenant-scoped durable business object state.
  rpc DeleteBusinessObjectRelationship(DeleteBusinessObjectRelationshipRequest) returns (DeleteBusinessObjectRelationshipResponse) {
    option (common.v1.required_scopes) = "console:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // CreateCaptureForm creates a draft with its first immutable form version.
  // The version pins the target BusinessObjectType revision and all typed
  // controls/mappings used by later public submissions.
  rpc CreateCaptureForm(CreateCaptureFormRequest) returns (CreateCaptureFormResponse) {
    option (common.v1.required_scopes) = "console:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // ListCaptureForms returns the tenant's durable form identities and current
  // publication pointers so an administrator can rediscover state after a
  // reload without relying on browser-local drafts.
  rpc ListCaptureForms(ListCaptureFormsRequest) returns (ListCaptureFormsResponse) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // GetCaptureForm reads a tenant-scoped form and, when requested, one exact
  // immutable version. It never silently substitutes the latest version for a
  // caller-provided version id.
  rpc GetCaptureForm(GetCaptureFormRequest) returns (GetCaptureFormResponse) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // UpdateCaptureForm appends a new immutable form version. Accepted or
  // published versions are never edited in place.
  rpc UpdateCaptureForm(UpdateCaptureFormRequest) returns (UpdateCaptureFormResponse) {
    option (common.v1.required_scopes) = "console:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // PublishCaptureForm exposes one exact immutable version through a scoped
  // public publication. The server derives the tenant and object target from
  // that publication; callers cannot choose them through public input.
  rpc PublishCaptureForm(PublishCaptureFormRequest) returns (PublishCaptureFormResponse) {
    option (common.v1.required_scopes) = "console:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }

  // RevokeCaptureFormPublication closes a public publication while retaining
  // its immutable form history and durable submissions.
  rpc RevokeCaptureFormPublication(RevokeCaptureFormPublicationRequest) returns (RevokeCaptureFormPublicationResponse) {
    option (common.v1.required_scopes) = "console:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }

  // CreateCaptureFormInvitation uses recipient verification at the Capture Forms owner.
  rpc CreateCaptureFormInvitation(CreateCaptureFormInvitationRequest) returns (CreateCaptureFormInvitationResponse) {
    option (common.v1.required_scopes) = "console:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }

  // RevokeCaptureFormInvitation uses recipient verification at the Capture Forms owner.
  rpc RevokeCaptureFormInvitation(RevokeCaptureFormInvitationRequest) returns (RevokeCaptureFormInvitationResponse) {
    option (common.v1.required_scopes) = "console:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }

  // GetInvitedCaptureForm uses recipient verification at the Capture Forms owner.
  rpc GetInvitedCaptureForm(GetInvitedCaptureFormRequest) returns (GetInvitedCaptureFormResponse) {
    option (common.v1.public) = true;
  }

  // SubmitInvitedCaptureForm uses recipient verification at the Capture Forms owner.
  rpc SubmitInvitedCaptureForm(SubmitInvitedCaptureFormRequest) returns (SubmitInvitedCaptureFormResponse) {
    option (common.v1.public) = true;
  }

  // GetPublishedCaptureForm resolves one active publication using its opaque,
  // server-issued publication id. The id is the reusable public capability in
  // the form URL; public callers provide no tenant or workspace coordinates.
  rpc GetPublishedCaptureForm(GetPublishedCaptureFormRequest) returns (GetPublishedCaptureFormResponse) {
    option (common.v1.public) = true;
  }

  // GetPublishedCaptureFormBrandingAsset serves one fixed-role asset from the
  // exact immutable version pinned by a live publication. The publication id
  // is the only capability input; callers cannot select a tenant, object, or
  // VFS version.
  rpc GetPublishedCaptureFormBrandingAsset(GetPublishedCaptureFormBrandingAssetRequest) returns (GetPublishedCaptureFormBrandingAssetResponse) {
    option (common.v1.public) = true;
  }

  // SubmitPublishedCaptureForm accepts typed answers through one active,
  // publication-scoped public capability. The owner resolves the tenant,
  // pinned version, and object target from that publication id, validates every
  // answer, and persists a durable submission before any object mapping.
  rpc SubmitPublishedCaptureForm(SubmitPublishedCaptureFormRequest) returns (SubmitPublishedCaptureFormResponse) {
    option (common.v1.public) = true;
  }

  // BeginPublishedCaptureFormUpload reserves one server-owned VFS upload
  // grant for a FILE input on the live publication. The publication resolves
  // tenant, form, version, and upload constraints; public callers cannot
  // choose any of those coordinates.
  rpc BeginPublishedCaptureFormUpload(BeginPublishedCaptureFormUploadRequest) returns (BeginPublishedCaptureFormUploadResponse) {
    option (common.v1.public) = true;
  }

  // CompletePublishedCaptureFormUpload commits the exact VFS lease reserved
  // for one publication/input pair. The completed object/version is the only
  // file asset accepted in a later typed form answer.
  rpc CompletePublishedCaptureFormUpload(CompletePublishedCaptureFormUploadRequest) returns (CompletePublishedCaptureFormUploadResponse) {
    option (common.v1.public) = true;
  }

  // GetCaptureFormSubmission reads one tenant-scoped durable submission and
  // its accepted BusinessObject linkage, if review has accepted it.
  rpc GetCaptureFormSubmission(GetCaptureFormSubmissionRequest) returns (GetCaptureFormSubmissionResponse) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // ListCaptureFormSubmissions lists bounded durable submissions for one form.
  rpc ListCaptureFormSubmissions(ListCaptureFormSubmissionsRequest) returns (ListCaptureFormSubmissionsResponse) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // ReviewCaptureFormSubmission accepts or rejects one durable submission.
  // Acceptance creates exactly one mapped BusinessObject through the existing
  // BusinessObject owner and returns its durable identity.
  rpc ReviewCaptureFormSubmission(ReviewCaptureFormSubmissionRequest) returns (ReviewCaptureFormSubmissionResponse) {
    option (common.v1.required_scopes) = "console:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }

  // GetInferenceCreditAutoRefill uses authorized workspace billing consent.
  rpc GetInferenceCreditAutoRefill(GetInferenceCreditAutoRefillRequest) returns (GetInferenceCreditAutoRefillResponse) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // UpdateInferenceCreditAutoRefill uses authorized workspace billing consent.
  rpc UpdateInferenceCreditAutoRefill(UpdateInferenceCreditAutoRefillRequest) returns (UpdateInferenceCreditAutoRefillResponse) {
    option (common.v1.required_scopes) = "billing:admin";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  // CompleteInferenceCreditAutoRefill uses authorized workspace billing consent.
  rpc CompleteInferenceCreditAutoRefill(CompleteInferenceCreditAutoRefillRequest) returns (CompleteInferenceCreditAutoRefillResponse) {
    option (common.v1.required_scopes) = "billing:admin";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  // ListInferenceCreditReceipts returns verified payments for the authorized workspace.
  rpc ListInferenceCreditReceipts(ListInferenceCreditReceiptsRequest) returns (ListInferenceCreditReceiptsResponse) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // GetOverview returns the first-screen AI operations summary.
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.workspace_scope_field) = "query.workspace_id";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // GetConsoleBootSnapshot returns the projected first-paint console state.
  rpc GetConsoleBootSnapshot(GetConsoleBootSnapshotRequest) returns (GetConsoleBootSnapshotResponse) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.workspace_scope_field) = "query.workspace_id";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // ListAssets returns AI agents, provider keys, model surfaces, and
  // integrations visible to the current workspace.
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.workspace_scope_field) = "query.workspace_id";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // GetAsset returns a single AI estate asset and related resources.
  rpc GetAsset(GetAssetRequest) returns (GetAssetResponse) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.workspace_scope_field) = "workspace_id";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // ListActivity returns normalized run, trace, approval, eval, risk, and cost
  // events for the console timeline.
  rpc ListActivity(ListActivityRequest) returns (ListActivityResponse) {
    option (common.v1.required_scopes) = "console:read";
    option (common.v1.workspace_scope_field) = "query.workspace_id";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // SearchStaffWorkspaceDirectory returns a bounded, metadata-only workspace directory for staff.
  rpc SearchStaffWorkspaceDirectory(SearchStaffWorkspaceDirectoryRequest) returns (SearchStaffWorkspaceDirectoryResponse) {
    option (common.v1.staff_account_required) = true;
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // GetStaffWorkspaceContext returns redacted operational summaries under an exact active grant.
  rpc GetStaffWorkspaceContext(GetStaffWorkspaceContextRequest) returns (GetStaffWorkspaceContextResponse) {
    option (common.v1.required_scopes) = "support_access.manage";
    option (common.v1.staff_account_required) = true;
    option (common.v1.staff_cross_tenant) = true;
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // Administrative composition over the existing Meter GetPrepaidCreditBalance owner.
  rpc GetStaffManagedInferenceFunding(GetStaffManagedInferenceFundingRequest) returns (meter.v1.GetPrepaidCreditBalanceResponse) {
    option (common.v1.required_scopes) = "support_access.manage";
    option (common.v1.required_scopes) = "managed_inference:admin";
    option (common.v1.required_scopes) = "meter:read";
    option (common.v1.staff_account_required) = true;
    option (common.v1.staff_cross_tenant) = true;
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // Administrative composition over the existing Meter GrantDevelopmentCredits owner.
  rpc GrantStaffManagedInferenceCredits(GrantStaffManagedInferenceCreditsRequest) returns (meter.v1.GrantDevelopmentCreditsResponse) {
    option (common.v1.required_scopes) = "support_access.manage";
    option (common.v1.required_scopes) = "managed_inference:admin";
    option (common.v1.required_scopes) = "meter:credits:grant-development";
    option (common.v1.staff_account_required) = true;
    option (common.v1.staff_cross_tenant) = true;
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }
  // Administrative composition over the existing Meter QueryUsage owner.
  rpc GetStaffManagedInferenceUsage(GetStaffManagedInferenceUsageRequest) returns (meter.v1.QueryUsageResponse) {
    option (common.v1.required_scopes) = "support_access.manage";
    option (common.v1.required_scopes) = "managed_inference:admin";
    option (common.v1.required_scopes) = "meter:read";
    option (common.v1.staff_account_required) = true;
    option (common.v1.staff_cross_tenant) = true;
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // Administrative composition over the existing Meter GetBudgetDashboard owner.
  rpc GetStaffManagedInferenceBudget(GetStaffManagedInferenceBudgetRequest) returns (meter.v1.GetBudgetDashboardResponse) {
    option (common.v1.required_scopes) = "support_access.manage";
    option (common.v1.required_scopes) = "managed_inference:admin";
    option (common.v1.required_scopes) = "meter:read";
