// lifecycle; UNKNOWN means the owner holds lifecycle evidence it cannot name,
// and clients must not present such work as finished.
enum ReceiptLifecycleState {
  RECEIPT_LIFECYCLE_STATE_UNSPECIFIED = 0;
  RECEIPT_LIFECYCLE_STATE_UNKNOWN = 1;
  RECEIPT_LIFECYCLE_STATE_PROPOSED = 2;
  RECEIPT_LIFECYCLE_STATE_QUEUED = 3;
  RECEIPT_LIFECYCLE_STATE_WAITING_APPROVAL = 4;
  RECEIPT_LIFECYCLE_STATE_BLOCKED = 5;
  RECEIPT_LIFECYCLE_STATE_NEEDS_INPUT = 6;
  RECEIPT_LIFECYCLE_STATE_UNAVAILABLE = 7;
  RECEIPT_LIFECYCLE_STATE_RUNNING = 8;
  RECEIPT_LIFECYCLE_STATE_SUCCEEDED = 9;
  RECEIPT_LIFECYCLE_STATE_VERIFIED = 10;
  RECEIPT_LIFECYCLE_STATE_DENIED = 11;
  RECEIPT_LIFECYCLE_STATE_CANCELLED = 12;
  RECEIPT_LIFECYCLE_STATE_FAILED = 13;
}

// OperatingReceipt is the mini-app object rendered inline in chat and expanded
// in the inspector. Display payloads must be safe for UI rendering and must not
// include raw prompts, tool arguments, credentials, tokens, connector payloads,
// VFS bytes, or model responses.
message OperatingReceipt {
  string id = 1;
  string kind = 2;
  string title = 3;
