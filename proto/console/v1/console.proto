  repeated OperatingReceiptAction allowed_actions = 14;
  repeated RelatedResource evidence_refs = 15;
  google.protobuf.Struct payload = 16;
  // Owner-resolved lifecycle. Thread responses strip receipt payloads, so this
  // is the only lifecycle statement a client can read there.
  ReceiptLifecycleState lifecycle_state = 17 [(buf.validate.field).enum.defined_only = true];
  // Set only by the fenced coding completion owner; absent until evaluated.
  OperatingCodingAcceptance coding_acceptance = 18;
}

