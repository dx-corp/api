// A process has its own lifecycle; its subject's ordinary fields do not own state.
message BusinessProcessParticipantType {
  string role_id = 1;
  string type_id = 2;
  int64 schema_revision = 3;
}
message BusinessProcessParticipant {
  string role_id = 1;
  string object_id = 2;
