// client can tell an organization-wide rule from a workspace override.
enum RuleScope {
  // RULE_SCOPE_UNSPECIFIED is treated as organization scope by readers.
  RULE_SCOPE_UNSPECIFIED = 0;
  // RULE_SCOPE_ORGANIZATION applies to every workspace in the organization.
  RULE_SCOPE_ORGANIZATION = 1;
  // RULE_SCOPE_WORKSPACE applies only to the workspace that authored it.
  RULE_SCOPE_WORKSPACE = 2;
}

// McpPolicyMode selects how a client treats an MCP server that is not named
// by the policy.
enum McpPolicyMode {
  // MCP_POLICY_MODE_UNSPECIFIED is rejected by SetManagedSetup.
  MCP_POLICY_MODE_UNSPECIFIED = 0;
  // MCP_POLICY_MODE_OPEN permits every MCP server; `servers` is advisory.
  MCP_POLICY_MODE_OPEN = 1;
  // MCP_POLICY_MODE_ALLOWLIST permits only the listed servers.
  MCP_POLICY_MODE_ALLOWLIST = 2;
  // MCP_POLICY_MODE_DENYLIST permits every server except the listed ones.
  MCP_POLICY_MODE_DENYLIST = 3;
}

// ManagedRule is one operator-authored instruction block that agent clients
// inject into the model's system prompt.
message ManagedRule {
