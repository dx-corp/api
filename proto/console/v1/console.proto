// TenantPrivacyMode is how much of a tenant's data this system may copy into
// systems other than the store that owns it. It is the wire spelling of
// platform_core_types::PrivacyMode.
enum TenantPrivacyMode {
  // No mode was supplied. Reads never return this; writes reject it.
  TENANT_PRIVACY_MODE_UNSPECIFIED = 0;
  // Shipped default, and the mode a tenant with no stored row runs under.
  TENANT_PRIVACY_MODE_STANDARD = 1;
  // Content stays inside the owning store: persisted and returned to the
  // tenant, never copied into logs or analytics.
  TENANT_PRIVACY_MODE_NO_TRAINING = 2;
  // Only classification-safe values leave the owning store at all.
  TENANT_PRIVACY_MODE_RESTRICTED = 3;
}

