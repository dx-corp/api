// Secrets are write-only; callers can only observe whether one is configured.
// Credential, OAuth, and connector values are owner reference identities; no
// credential material ever appears on this projection.
message DexMcpServer {
  string server_id = 1;
  string name = 2;
  string base_url = 3;
  string transport = 4;
  string auth_kind = 5;
  bool has_token = 6;
  bool enabled = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string created_by = 10;
  string updated_by = 11;
  // Negotiated MCP protocol version from the latest discovery.
  string protocol_version = 12;
  // Last observed health state from the owning discovery store.
  string health_state = 13;
  // Digest of the latest persisted catalog snapshot.
  string catalog_digest = 14;
  // Secret reference identity for the configured credential, if any.
  string credential_ref = 15;
  // OAuth connection reference identity owned by the Connector owner.
  string oauth_connection_ref = 16;
  // Private connector session reference identity used for routing, if any.
