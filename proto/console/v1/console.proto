  string definition_id = 4;
  int64 definition_revision = 5;
  int64 revision = 6;
  string state_id = 7;
  string subject_object_id = 8;
  repeated BusinessProcessParticipant participants = 9;
  string decision_principal_id = 10;
  string parent_process_id = 11;
  string created_at = 12;
  string updated_at = 13;
  repeated BusinessProcessReceipt receipts = 14;
