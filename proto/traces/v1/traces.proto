syntax = "proto3";

package traces.v1;

option go_package = "github.com/evalops/platform/gen/go/traces/v1;tracesv1";

import "buf/validate/validate.proto";
import "common/v1/analytics.proto";
import "common/v1/authz.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// SpanIngestService records and queries agent execution traces.
service SpanIngestService {
  // Append spans to a trace. MEDIUM because forged spans contaminate the
  // observability record other reviewers and gates trust.
  // Organization scope is enforced by trace handlers for multi-org writes
  // because legacy single-scope SDK ingest may omit span.organization_id.
  rpc IngestSpans(IngestSpansRequest) returns (IngestSpansResponse) {
    option (common.v1.required_scopes) = "traces:write";
    option (common.v1.workspace_scope_field) = "spans.workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  rpc GetTrace(GetTraceRequest) returns (GetTraceResponse) {
    option (common.v1.required_scopes) = "traces:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc ListTraces(ListTracesRequest) returns (ListTracesResponse) {
    option (common.v1.required_scopes) = "traces:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc GetSpanTree(GetSpanTreeRequest) returns (GetSpanTreeResponse) {
    option (common.v1.required_scopes) = "traces:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc GetSpanContext(GetSpanContextRequest) returns (GetSpanContextResponse) {
    option (common.v1.required_scopes) = "traces:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // Returns the recorded prompt + response payload of a single span.
  // MEDIUM because the payload often contains user-supplied PII;
  // the caller authz check enforces tenant scope but the data fan-out
  // is wider than a normal read.
  rpc GetSpanPayload(GetSpanPayloadRequest) returns (GetSpanPayloadResponse) {
    option (common.v1.required_scopes) = "traces:read";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  rpc SearchTrace(SearchTraceRequest) returns (SearchTraceResponse) {
    option (common.v1.required_scopes) = "traces:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // Attaches a reviewer note to a trace. MEDIUM because the note becomes
  // part of the evidence shown to other reviewers and can be misused to
  // shape future approval defaults.
  rpc AnnotateTrace(AnnotateTraceRequest) returns (AnnotateTraceResponse) {
    option (common.v1.required_scopes) = "traces:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  rpc DeleteTraceAnnotation(DeleteTraceAnnotationRequest) returns (DeleteTraceAnnotationResponse) {
    option (common.v1.required_scopes) = "traces:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  rpc BulkAnnotateTrace(BulkAnnotateTraceRequest) returns (BulkAnnotateTraceResponse) {
    option (common.v1.required_scopes) = "traces:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  rpc ListTraceAnnotations(ListTraceAnnotationsRequest) returns (ListTraceAnnotationsResponse) {
    option (common.v1.required_scopes) = "traces:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc GetTraceReviewBundle(GetTraceReviewBundleRequest) returns (GetTraceReviewBundleResponse) {
    option (common.v1.required_scopes) = "traces:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // Records a quality label (good / bad / regression) that feeds the eval
  // ranking surface. MEDIUM because the label drives later auto-approve
  // decisions in the reviewing pipeline.
  rpc AnnotateTraceQuality(AnnotateTraceQualityRequest) returns (AnnotateTraceQualityResponse) {
    option (common.v1.required_scopes) = "traces:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  rpc ListTraceQualityAnnotations(ListTraceQualityAnnotationsRequest) returns (ListTraceQualityAnnotationsResponse) {
    option (common.v1.required_scopes) = "traces:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // Streams a replay bundle (full prompts, responses, attachments) for
  // a single run. HIGH because the bundle reconstitutes the original
  // session including any user-supplied secrets that survived sanitisation.
  rpc ExportReplayBundle(ExportReplayBundleRequest) returns (ExportReplayBundleResponse) {
    option (common.v1.required_scopes) = "traces:read";
    option (common.v1.required_scopes) = "traces.payload.raw";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }
  rpc SummarizeMaestroSelfTelemetry(SummarizeMaestroSelfTelemetryRequest) returns (SummarizeMaestroSelfTelemetryResponse) {
    option (common.v1.required_scopes) = "traces:read";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
}

enum SpanStatus {
  SPAN_STATUS_UNSPECIFIED = 0;
  SPAN_STATUS_OK = 1;
  SPAN_STATUS_ERROR = 2;
  SPAN_STATUS_CANCELLED = 3;
}

enum GovernanceDecision {
  GOVERNANCE_DECISION_UNSPECIFIED = 0;
  GOVERNANCE_DECISION_ALLOW = 1;
  GOVERNANCE_DECISION_DENY = 2;
  GOVERNANCE_DECISION_REQUIRE_APPROVAL = 3;
  GOVERNANCE_DECISION_AUTO_APPROVED = 4;
}

message Span {
  string trace_id = 1 [(buf.validate.field).string.min_len = 1];
  string span_id = 2 [(buf.validate.field).string.min_len = 1];
  string parent_span_id = 3;
  string workspace_id = 4 [(buf.validate.field).string.min_len = 1];
  string organization_id = 5;
  string agent_id = 6;
  string surface = 7;
  string name = 8 [(buf.validate.field).string.min_len = 1];
  string kind = 9;
  string model = 10;
  string provider = 11;
  int64 token_input = 12;
  int64 token_output = 13;
  int64 latency_ms = 14;
  SpanStatus status = 15;
  GovernanceDecision governance_decision = 16;
  double cost_usd = 17;
  google.protobuf.Struct attributes = 18;
  google.protobuf.Timestamp started_at = 19;
  google.protobuf.Timestamp ended_at = 20;
  string user_id = 21;
}

message TraceSummary {
  string trace_id = 1;
  string workspace_id = 2;
  string organization_id = 3;
  string agent_id = 4;
  string surface = 5;
  string root_span_name = 6;
  int32 total_spans = 7;
  int64 total_token_input = 8;
  int64 total_token_output = 9;
  double total_cost_usd = 10;
  int64 total_latency_ms = 11;
  google.protobuf.Timestamp started_at = 12;
  google.protobuf.Timestamp ended_at = 13;
  string user_id = 14;
}

enum TraceAnnotationKind {
  TRACE_ANNOTATION_KIND_UNSPECIFIED = 0;
  TRACE_ANNOTATION_KIND_NOTE = 1;
  TRACE_ANNOTATION_KIND_ISSUE = 2;
  TRACE_ANNOTATION_KIND_GOOD = 3;
}

enum TraceAnnotationStatus {
  TRACE_ANNOTATION_STATUS_UNSPECIFIED = 0;
  TRACE_ANNOTATION_STATUS_ACTIVE = 1;
  TRACE_ANNOTATION_STATUS_RESOLVED = 2;
  TRACE_ANNOTATION_STATUS_DISMISSED = 3;
  TRACE_ANNOTATION_STATUS_ARCHIVED = 4;
}

message TraceAnnotation {
  string annotation_id = 1;
  string trace_id = 2 [(buf.validate.field).string.min_len = 1];
  string span_id = 3;
  TraceAnnotationKind kind = 4;
  string note = 5;
  repeated string labels = 6;
  string source = 7;
  google.protobuf.Struct metadata = 8;
  google.protobuf.Timestamp created_at = 9;
  TraceAnnotationStatus status = 10;
  google.protobuf.Timestamp updated_at = 11;
  google.protobuf.Timestamp resolved_at = 12;
  string resolved_by = 13;
}

message AssertionResult {
  string assertion_id = 1;
  string name = 2;
  bool passed = 3;
  double score = 4;
  string reason = 5;
  google.protobuf.Struct metadata = 6;
}

message GovernanceScore {
  GovernanceDecision decision = 1;
  double confidence = 2;
  repeated string reasons = 3;
}

enum ConversationalSignalKind {
  CONVERSATIONAL_SIGNAL_KIND_UNSPECIFIED = 0;
  CONVERSATIONAL_SIGNAL_KIND_FRUSTRATION = 1;
  CONVERSATIONAL_SIGNAL_KIND_CONFUSION = 2;
  CONVERSATIONAL_SIGNAL_KIND_DISSATISFACTION = 3;
}

enum ConversationalSignalLabel {
  CONVERSATIONAL_SIGNAL_LABEL_UNSPECIFIED = 0;
  CONVERSATIONAL_SIGNAL_LABEL_LOW = 1;
  CONVERSATIONAL_SIGNAL_LABEL_MEDIUM = 2;
  CONVERSATIONAL_SIGNAL_LABEL_HIGH = 3;
}

message ConversationalSignal {
  ConversationalSignalKind kind = 1;
  double score = 2;
  ConversationalSignalLabel label = 3;
  string rationale = 4;
  repeated string evidence_span_ids = 5;
}

message TraceQualityAnnotation {
  string trace_id = 1 [(buf.validate.field).string.min_len = 1];
  string span_id = 2;
  double composite_score = 3;
  repeated AssertionResult assertions = 4;
  GovernanceScore governance = 5;
  common.v1.Money cost = 6;
  double quality_per_dollar = 7;
  string eval_suite_id = 8;
  google.protobuf.Timestamp scored_at = 9;
  string scorer = 10;
  google.protobuf.Struct metadata = 11;
  repeated ConversationalSignal conversational_signals = 12;
}

message IngestSpansRequest {
  repeated Span spans = 1 [(buf.validate.field).repeated.min_items = 1];
}

message IngestSpansResponse {
  int32 ingested_count = 1;
  repeated TraceSummary traces = 2;
}

message GetTraceRequest {
  string trace_id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetTraceResponse {
  TraceSummary trace = 1;
  repeated Span spans = 2;
  repeated TraceQualityAnnotation quality_annotations = 3;
  repeated TraceAnnotation annotations = 4;
}

message ReplayContext {
  string organization_id = 1;
  string workspace_id = 2;
  string agent_id = 3;
  string surface = 4;
  string user_id = 5;
}

message ReplayToolCall {
  string span_id = 1;
  string name = 2;
  string input = 3;
  string output = 4;
  string status = 5;
}

message TraceReplayBundle {
  string trace_id = 1;
  ReplayContext context = 2;
  string input = 3;
  string model = 4;
  string provider = 5;
  string prompt_config = 6;
  repeated ReplayToolCall tool_calls = 7;
  repeated TraceQualityAnnotation quality_annotations = 8;
  bool redaction_applied = 9;
}

message TraceEvalCandidate {
  string candidate_id = 1;
  string trace_id = 2;
  string span_id = 3;
  string annotation_id = 4;
  string eval_suite_id = 5;
  string case_kind = 6;
  repeated string labels = 7;
  string title = 8;
  string rationale = 9;
  double cost_usd = 10;
  int64 token_input = 11;
  int64 token_output = 12;
  GovernanceDecision governance_decision = 13;
  bool approval_required = 14;
  bool redaction_applied = 15;
  TraceReplayBundle replay_bundle = 16;
  google.protobuf.Struct metadata = 17;
}

message ListTracesRequest {
  string workspace_id = 1;
  string agent_id = 2;
  string surface = 3;
  google.protobuf.Timestamp start_time = 4;
  google.protobuf.Timestamp end_time = 5;
  int32 limit = 6 [(buf.validate.field).int32.gte = 0];
  int32 offset = 7 [(buf.validate.field).int32.gte = 0];
  string organization_id = 8;
  string user_id = 9;
}

message ListTracesResponse {
  repeated TraceSummary traces = 1;
  int32 total = 2;
  bool has_more = 3;
}

message GetSpanTreeRequest {
  string trace_id = 1 [(buf.validate.field).string.min_len = 1];
}

message SpanNode {
  Span span = 1;
  repeated SpanNode children = 2;
}

message GetSpanTreeResponse {
  TraceSummary trace = 1;
  repeated SpanNode roots = 2;
}

message GetSpanContextRequest {
  string trace_id = 1 [(buf.validate.field).string.min_len = 1];
  string span_id = 2 [(buf.validate.field).string.min_len = 1];
  int32 before = 3 [(buf.validate.field).int32.gte = 0];
  int32 after = 4 [(buf.validate.field).int32.gte = 0];
  bool include_parent = 5;
}

message GetSpanContextResponse {
  Span span = 1;
  Span parent = 2;
  repeated Span before = 3;
  repeated Span after = 4;
}

enum SpanPayloadTarget {
  SPAN_PAYLOAD_TARGET_UNSPECIFIED = 0;
  SPAN_PAYLOAD_TARGET_INPUT = 1;
  SPAN_PAYLOAD_TARGET_OUTPUT = 2;
  SPAN_PAYLOAD_TARGET_ATTRIBUTES = 3;
  // Normalized LLM conversation messages, including OpenTelemetry GenAI and
  // OpenInference-style message attributes when present.
  SPAN_PAYLOAD_TARGET_LLM_MESSAGES = 4;
  // Tool invocation arguments captured before execution.
  SPAN_PAYLOAD_TARGET_TOOL_ARGS = 5;
  // Tool execution result captured after execution.
  SPAN_PAYLOAD_TARGET_TOOL_RESULT = 6;
  // Span lifecycle events captured by OTLP or EvalOps exporters.
  SPAN_PAYLOAD_TARGET_EVENTS = 7;
}

enum SpanPayloadRedactionMode {
  SPAN_PAYLOAD_REDACTION_MODE_UNSPECIFIED = 0;
  SPAN_PAYLOAD_REDACTION_MODE_SAFE = 1;
  SPAN_PAYLOAD_REDACTION_MODE_RAW = 2;
}

message GetSpanPayloadRequest {
  string trace_id = 1 [(buf.validate.field).string.min_len = 1];
  string span_id = 2 [(buf.validate.field).string.min_len = 1];
  SpanPayloadTarget target = 3;
  int32 offset = 4 [(buf.validate.field).int32.gte = 0];
  int32 max_chars = 5 [(buf.validate.field).int32.gte = 0];
  SpanPayloadRedactionMode redaction_mode = 6;
}

message GetSpanPayloadResponse {
  string content = 1;
  int32 next_offset = 2;
  bool has_more = 3;
  string source = 4;
  bool redaction_applied = 5;
}

message SearchTraceRequest {
  string trace_id = 1 [(buf.validate.field).string.min_len = 1];
  string pattern = 2 [(buf.validate.field).string.min_len = 1];
  bool case_sensitive = 3;
  string span_kind = 4;
  int32 context_chars = 5 [(buf.validate.field).int32.gte = 0];
  int32 limit = 6 [(buf.validate.field).int32.gte = 0];
  repeated string scopes = 7;
  SpanStatus span_status = 8;
  string model = 9;
  string provider = 10;
  GovernanceDecision governance_decision = 11;
  string label = 12;
  TraceAnnotationStatus annotation_status = 13;
}

message TraceSearchMatch {
  string trace_id = 1;
  string span_id = 2;
  string span_name = 3;
  string scope = 4;
  int32 start = 5;
  int32 end = 6;
  string snippet = 7;
}

message SearchTraceResponse {
  repeated TraceSearchMatch matches = 1;
  int32 total = 2;
  bool has_more = 3;
}

message AnnotateTraceRequest {
  TraceAnnotation annotation = 1 [(buf.validate.field).required = true];
}

message AnnotateTraceResponse {
  TraceAnnotation annotation = 1;
}

message DeleteTraceAnnotationRequest {
  string trace_id = 1 [(buf.validate.field).string.min_len = 1];
  string annotation_id = 2 [(buf.validate.field).string.min_len = 1];
}

message DeleteTraceAnnotationResponse {
  TraceAnnotation annotation = 1;
}

message BulkAnnotateTraceRequest {
  string trace_id = 1 [(buf.validate.field).string.min_len = 1];
  repeated string span_ids = 2;
  TraceAnnotation annotation = 3 [(buf.validate.field).required = true];
}

message BulkAnnotateTraceResponse {
  repeated TraceAnnotation annotations = 1;
  int32 total = 2 [(buf.validate.field).int32.gte = 0];
}

message ListTraceAnnotationsRequest {
  string trace_id = 1 [(buf.validate.field).string.min_len = 1];
  string span_id = 2;
  TraceAnnotationKind kind = 3;
  string label = 4;
  int32 limit = 5 [(buf.validate.field).int32.gte = 0];
  int32 offset = 6 [(buf.validate.field).int32.gte = 0];
  TraceAnnotationStatus status = 7;
}

message ListTraceAnnotationsResponse {
  repeated TraceAnnotation annotations = 1;
  int32 total = 2;
  bool has_more = 3;
}

enum TraceEvidenceState {
  TRACE_EVIDENCE_STATE_UNSPECIFIED = 0;
  TRACE_EVIDENCE_STATE_AVAILABLE = 1;
  TRACE_EVIDENCE_STATE_WITHHELD = 2;
  TRACE_EVIDENCE_STATE_MISSING = 3;
  TRACE_EVIDENCE_STATE_PERMISSION_BLOCKED = 4;
  TRACE_EVIDENCE_STATE_EXPIRED = 5;
}

message TraceEvidenceRef {
  string evidence_id = 1;
  string label = 2;
  string resource_type = 3;
  string uri = 4;
  TraceEvidenceState state = 5;
  string reason = 6;
  bool redaction_applied = 7;
  google.protobuf.Timestamp expires_at = 8;
  google.protobuf.Struct metadata = 9;
  repeated string span_ids = 10;
}

message TraceEvidenceBundleRef {
  string bundle_id = 1;
  string uri = 2;
  string retention = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Struct provenance = 6;
}

message TraceRecoveryAction {
  string action_id = 1;
  string title = 2;
  string detail = 3;
  string severity = 4;
  repeated string evidence_ids = 5;
  string source = 6;
}

message TraceReview {
  string status = 1;
  string headline = 2;
  string summary = 3;
  int32 evidence_gap_count = 4;
  bool metadata_only = 5;
  string review_url = 6;
  repeated TraceEvidenceRef evidence_refs = 7;
  repeated TraceRecoveryAction recovery_actions = 8;
  repeated TraceEvidenceBundleRef evidence_bundles = 9;
  repeated SpanNode span_tree = 10;
  repeated string suggested_labels = 11;
  google.protobuf.Struct provenance = 12;
}

message TraceReviewBundle {
  TraceSummary trace = 1;
  repeated Span spans = 2;
  repeated TraceAnnotation annotations = 3;
  repeated TraceQualityAnnotation quality_annotations = 4;
  repeated TraceSearchMatch matches = 5;
  repeated string suggested_labels = 6;
  string summary = 7;
  repeated TraceEvalCandidate eval_candidates = 8;
  TraceReview trace_review = 9;
}

message GetTraceReviewBundleRequest {
  string trace_id = 1 [(buf.validate.field).string.min_len = 1];
  string search = 2;
  string label = 3;
  int32 max_matches = 4 [(buf.validate.field).int32.gte = 0];
}

message GetTraceReviewBundleResponse {
  TraceReviewBundle bundle = 1;
}

message AnnotateTraceQualityRequest {
  TraceQualityAnnotation annotation = 1 [(buf.validate.field).required = true];
}

message AnnotateTraceQualityResponse {
  TraceQualityAnnotation annotation = 1;
}

message ListTraceQualityAnnotationsRequest {
  string trace_id = 1 [(buf.validate.field).string.min_len = 1];
  string span_id = 2;
  int32 limit = 3 [(buf.validate.field).int32.gte = 0];
  int32 offset = 4 [(buf.validate.field).int32.gte = 0];
  ConversationalSignalKind signal_kind = 5;
}

message ListTraceQualityAnnotationsResponse {
  repeated TraceQualityAnnotation annotations = 1;
  int32 total = 2;
  bool has_more = 3;
}

message ExportReplayBundleRequest {
  string trace_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ExportReplayBundleResponse {
  TraceReplayBundle bundle = 1;
}

message SummarizeMaestroSelfTelemetryRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  string organization_id = 2;
  string agent_id = 3;
  string surface = 4;
  google.protobuf.Timestamp start_time = 5;
  google.protobuf.Timestamp end_time = 6;
  int32 trace_limit = 7 [(buf.validate.field).int32.gte = 0];
}

message MaestroSelfTelemetrySummary {
  int32 trace_count = 1;
  int32 span_count = 2;
  int32 permission_denials = 3;
  int32 context_compactions = 4;
  int32 subagent_spawns = 5;
  int32 self_diagnostics = 6;
  double permission_denial_rate = 7;
  double compaction_rate = 8;
  double subagent_fanout = 9;
}

message SummarizeMaestroSelfTelemetryResponse {
  MaestroSelfTelemetrySummary summary = 1;
}
