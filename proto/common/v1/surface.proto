syntax = "proto3";

package common.v1;

option go_package = "github.com/evalops/platform/gen/go/common/v1;commonv1";

// Surface identifies the product or channel surface that originated a platform
// action. It is shared by runtime, audit, and product-facing services so
// callers do not invent drift-prone string labels.
enum Surface {
  SURFACE_UNSPECIFIED = 0;
  SURFACE_ENSEMBLE = 1;
  SURFACE_CHAT = 2;
  SURFACE_MAESTRO = 3;
  SURFACE_CONDUCTOR = 4;
  SURFACE_SLACK = 5;
  // SURFACE_EXTERNAL_AGENT identifies a third-party coding agent (Claude
  // Code, Cursor, or another external agent) driving Platform through a
  // non-Deixic surface. It is additive and wire-compatible: existing
  // callers keep matching on SURFACE_ENSEMBLE/CHAT/MAESTRO/CONDUCTOR/SLACK,
  // and every exhaustive Rust match must handle it deliberately rather than
  // fall through to SURFACE_UNSPECIFIED.
  SURFACE_EXTERNAL_AGENT = 6;
}
