syntax = "proto3";

package common.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/evalops/platform/gen/go/common/v1;commonv1";

// DataClassification declares what kind of data a field is allowed to carry.
// It is declared once, on the field, and is the input to lint enforcement
// (scripts/check-proto-classification.py) and to the generated attribute
// manifest consumed by runtime validators.
enum DataClassification {
  // Not declared. Fields carrying free-form text must not use this value.
  DATA_CLASSIFICATION_UNSPECIFIED = 0;
  // Bounded, non-tenant-identifying values: enum-like strings, model names,
  // provider names, surface names, units, status codes.
  DATA_CLASSIFICATION_SAFE = 1;
  // Values that identify a tenant, principal, or record: organization ids,
  // workspace ids, user ids, request ids, idempotency keys, cursors.
  DATA_CLASSIFICATION_IDENTIFIER = 2;
  // Filesystem paths, URLs, repository refs, and other location strings.
  DATA_CLASSIFICATION_PATH = 3;
  // Operator- or model-authored free text and binary payloads: message bodies,
  // corrections, tool output, attachment bytes.
  DATA_CLASSIFICATION_CONTENT = 4;
  // Secret material: tokens, keys, passwords, signed bearer values. Fields with
  // this classification must never be persisted or logged in cleartext.
  DATA_CLASSIFICATION_CREDENTIAL = 5;
}

// classification declares the data classification of a single field.
//
// Extension number 51008 continues the common.v1 option range that starts at
// 51001 in common/v1/authz.proto. Unlike the options in that file, this one
// extends FieldOptions rather than MethodOptions.
extend google.protobuf.FieldOptions {
  DataClassification classification = 51008;
}
