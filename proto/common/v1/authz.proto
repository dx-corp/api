syntax = "proto3";

package common.v1;

import "common/v1/risk.proto";
import "google/protobuf/descriptor.proto";

option go_package = "github.com/evalops/platform/gen/go/common/v1;commonv1";

// required_scopes declares the authorization scopes required to invoke an RPC.
extend google.protobuf.MethodOptions {
  repeated string required_scopes = 51001;
}

// workspace_scope_field names the request string field path that must match the caller workspace.
// Repeated message paths are allowed; every resolved value must match.
extend google.protobuf.MethodOptions {
  string workspace_scope_field = 51002;
}

// organization_scope_field names the request string field path that must match the caller organization.
// Repeated message paths are allowed; every resolved value must match.
extend google.protobuf.MethodOptions {
  string organization_scope_field = 51005;
}

// risk_level classifies the operational risk of invoking an RPC.
extend google.protobuf.MethodOptions {
  RiskLevel risk_level = 51003;
}

// public marks an RPC that intentionally bypasses authenticated principal checks.
extend google.protobuf.MethodOptions {
  bool public = 51004;
}

// staff_account_required declares an authenticated RPC authorized by the durable staff claim.
extend google.protobuf.MethodOptions {
  bool staff_account_required = 51006;
}

// staff_cross_tenant declares an intentionally cross-tenant staff RPC.
// It is classification metadata and never bypasses staff authorization.
extend google.protobuf.MethodOptions {
  bool staff_cross_tenant = 51007;
}
