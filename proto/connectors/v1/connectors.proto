  // Raw RFC 9207 authorization response fields. These are additive so older
  // callers continue to send the same request shape.
  string authorization_response_iss = 10;
  string provider_error = 11;
  string provider_error_description = 12;
  string provider_error_uri = 13;
}

message CompleteMcpOAuthFlowResponse {
  string connection_ref = 1;
  string grant_id = 2;
  repeated string scopes = 3;
  google.protobuf.Timestamp expires_at = 4;
  int64 grant_version = 5;
  string profile_id = 6;
}

message RevokeMcpOAuthGrantRequest {
  string organization_id = 1 [(buf.validate.field).string.min_len = 1];
  string workspace_id = 2 [(buf.validate.field).string.min_len = 1];
  string grant_id = 3 [(buf.validate.field).string.min_len = 1];
  string connection_ref = 4 [(buf.validate.field).string.min_len = 1];
  string reason_code = 5 [(buf.validate.field).string.min_len = 1];
  string profile_id = 6;
  int64 profile_generation = 7 [(buf.validate.field).int64.gt = 0];
}

message RevokeMcpOAuthGrantResponse {
  bool revoked = 1;
  string grant_id = 2;
}

// TriggerSyncRequest enqueues one sync run. Field numbers mirror the
// connectors-rs owner proto exactly; the connectors service is the
// authoritative owner of this contract.
message TriggerSyncRequest {
  string connection_id = 1 [(buf.validate.field).string.min_len = 1];
  // Free-text run classification (for example "manual", "scheduled",
  // "initial"). The connectors service defaults to "manual" when empty.
  string run_type = 2;
  string idempotency_key = 3 [(buf.validate.field).string.min_len = 1];
  // Stable resource stream to execute. Required.
  string stream_id = 4 [(buf.validate.field).string.min_len = 1];
}

message TriggerSyncResponse {
  string queue_id = 1;
  string connection_id = 2;
  string run_type = 3;
  // The queue row's actual status after the call: "queued" for a new or
  // revived row, or the in-flight/terminal status ("leased", "completed",
  // "failed", "cancelled") of an existing row the call did not disturb.
  string status = 4;
  // Durable stream identity stored on the queue row.
  string stream_id = 5;
}

message ExecuteConnectorActionRequest {
  string organization_id = 1 [(buf.validate.field).string.min_len = 1];
  string workspace_id = 2 [(buf.validate.field).string.min_len = 1];
  string connection_id = 3 [(buf.validate.field).string.min_len = 1];
  string action_id = 4 [(buf.validate.field).string.min_len = 1];
  string idempotency_key = 5 [(buf.validate.field).string.min_len = 1];
  string approval_request_id = 6;
  string action_digest = 7 [(buf.validate.field).string.min_len = 1];
  string body_json = 8;
  string expected_provider_revision = 9;
  // Routine server-owned channel actions use a bounded authority grant rather
  // than manufacturing an approval request. Exactly one authority field is
  // accepted by ConnectorService.
  string authority_grant_id = 10;
  // Canonical owner: evalops/connectors-rs. This opaque Identity remote-work
  // token attests one exact action delegated by the authority-checking
  // caller (tool-executor's direct connector adapter or platform-worker's
  // proactive action dispatch). Connectors must verify both this token and
  // every exact request binding; neither the ordinary RPC bearer nor this
  // field alone is sufficient authorization.
  string execution_authority_token = 11;
  // Canonical digest of the exact action, catalog revision, authority,
  // expected provider revision, and normalized body. action_digest remains
  // the catalog digest.
  string canonical_request_digest = 12;
}

message ExecuteConnectorActionResponse {
  string connector_action_execution_id = 1;
  // Deprecated compatibility projection. New consumers must use action_state.
  string state = 2 [deprecated = true];
  string provider_object_id = 3;
  string provider_revision = 4;
  bool idempotent_replay = 5;
  string redacted_result_json = 6;
  ConnectorActionExecutionState action_state = 7 [(buf.validate.field).enum.defined_only = true];
  ConnectorActionErrorKind error_kind = 8;
  string error_code = 9;
  bool retry_eligible = 10;
  optional uint64 retry_after_seconds = 11;
  string operator_detail = 12;
  string provider_channel_id = 13;
  string provider_message_ts = 14;
  bool reconciliation_required = 15;
}

enum ConnectorActionExecutionState {
  CONNECTOR_ACTION_EXECUTION_STATE_UNSPECIFIED = 0;
  CONNECTOR_ACTION_EXECUTION_STATE_EXECUTING = 1;
  CONNECTOR_ACTION_EXECUTION_STATE_SUCCEEDED = 2;
  CONNECTOR_ACTION_EXECUTION_STATE_FAILED = 3;
}

enum ConnectorActionErrorKind {
  CONNECTOR_ACTION_ERROR_KIND_UNSPECIFIED = 0;
  CONNECTOR_ACTION_ERROR_KIND_RATE_LIMITED = 1;
  CONNECTOR_ACTION_ERROR_KIND_PROVIDER = 2;
  CONNECTOR_ACTION_ERROR_KIND_INVALID_AUTH = 3;
  CONNECTOR_ACTION_ERROR_KIND_MISSING_SCOPE = 4;
  CONNECTOR_ACTION_ERROR_KIND_INACCESSIBLE_CHANNEL = 5;
  CONNECTOR_ACTION_ERROR_KIND_AMBIGUOUS = 6;
}

// ---- Stream state ---------------------------------------------------------

message StreamCursorState {
  string stream_id = 1;
  string stable_id = 2;
  bool has_cursor = 3;
  string cursor_value = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message StreamRunSummary {
  string connector_run_id = 1;
  string status = 2;
  string outcome = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp finished_at = 5;
  string error_detail = 6;
}

message ConnectionStream {
  string stream_id = 1;
  string stable_id = 2;
  ReplicationMode replication_mode = 3;
  bool selected_by_default = 4;
  repeated string primary_key = 5;
  string cursor_field = 6;
  StreamCursorState cursor = 7;
  StreamRunSummary last_run = 8;
}

message ListConnectionStreamsRequest {
  string connection_id = 1;
}

message ListConnectionStreamsResponse {
  repeated ConnectionStream streams = 1;
}

message SyncPartitionState {
  string partition_key = 1;
  string cursor_value_json = 2;
  string high_watermark_json = 3;
  string signpost_value_json = 4;
  string state_status = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message GetStreamStateRequest {
  string connection_id = 1;
  string stream_id = 2;
}

message GetStreamStateResponse {
  ConnectionStream stream = 1;
  repeated SyncPartitionState partitions = 2;
  int64 dead_letter_count = 3;
}

message ResetStreamStateRequest {
  string connection_id = 1;
  string stream_id = 2;
  optional string cursor_value = 3;
  string idempotency_key = 4;
}

message ResetStreamStateResponse {
  StreamCursorState cursor = 1;
}

// ---- Sync schedules -------------------------------------------------------

message SyncSchedule {
  string connection_id = 1;
  string stream_id = 2;
  string organization_id = 3;
  string workspace_id = 4;
  string run_type = 5;
  int32 interval_seconds = 6;
  bool enabled = 7;
  google.protobuf.Timestamp last_scheduled_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  google.protobuf.Timestamp last_completed_at = 11;
}

message CreateSyncScheduleRequest {
  string organization_id = 1;
  string workspace_id = 2;
  string connection_id = 3;
  string stream_id = 4;
  int32 interval_seconds = 5;
  bool enabled = 6;
  string idempotency_key = 7;
}

message CreateSyncScheduleResponse {
  SyncSchedule schedule = 1;
  bool idempotent_replay = 2;
}

message ListSyncSchedulesRequest {
  string connection_id = 1;
}

message ListSyncSchedulesResponse {
  repeated SyncSchedule schedules = 1;
}

// ---- Provider-resource ownership and lifecycle ---------------------------

enum ProviderResourceVisibilityClass {
  PROVIDER_RESOURCE_VISIBILITY_CLASS_UNSPECIFIED = 0;
  PROVIDER_RESOURCE_VISIBILITY_CLASS_WORKSPACE_PUBLIC = 1;
  PROVIDER_RESOURCE_VISIBILITY_CLASS_EXPLICIT_PRINCIPALS = 2;
  PROVIDER_RESOURCE_VISIBILITY_CLASS_GROUP_MEMBERSHIP = 3;
  PROVIDER_RESOURCE_VISIBILITY_CLASS_CONNECTION_PRIVATE = 4;
}

enum ProviderResourceLifecycleState {
  PROVIDER_RESOURCE_LIFECYCLE_STATE_UNSPECIFIED = 0;
  PROVIDER_RESOURCE_LIFECYCLE_STATE_ACTIVE = 1;
  PROVIDER_RESOURCE_LIFECYCLE_STATE_ARCHIVED = 2;
  PROVIDER_RESOURCE_LIFECYCLE_STATE_DELETED = 3;
  PROVIDER_RESOURCE_LIFECYCLE_STATE_CONNECTION_REVOKED = 4;
  PROVIDER_RESOURCE_LIFECYCLE_STATE_QUARANTINED = 5;
}

enum ProviderContentTrust {
  PROVIDER_CONTENT_TRUST_UNSPECIFIED = 0;
  PROVIDER_CONTENT_TRUST_UNTRUSTED_PROVIDER_CONTENT = 1;
}

message ProviderResourceEnvelope {
  string schema_version = 1;
  string stable_resource_id = 2;
  string organization_id = 3;
  string workspace_id = 4;
  string provider_id = 5;
  string connection_id = 6;
  string source_family_id = 7;
  string originating_principal_id = 8;
  string resource_kind = 9;
  string parent_resource_id = 10;
  ProviderResourceVisibilityClass visibility_class = 11;
  repeated string visibility_principal_ids = 12;
  string visibility_membership_ref = 13;
  ProviderContentTrust content_trust = 14;
  string payload_sha256 = 15;
  string provider_revision = 16;
  ProviderResourceLifecycleState lifecycle_state = 17;
  uint64 lifecycle_generation = 18;
  string purge_correlation_id = 19;
}

// Coordinates of a current Connector-owned observation; never caller-provided facts.
message GetBusinessSourceRecordRequest {
  string organization_id = 1 [(buf.validate.field).string.min_len = 1];
  string workspace_id = 2 [(buf.validate.field).string.min_len = 1];
  string connection_id = 3 [(buf.validate.field).string.min_len = 1];
  string family_stable_id = 4 [(buf.validate.field).string.min_len = 1];
  string record_id = 5 [(buf.validate.field).string.min_len = 1];
}

message GetBusinessSourceRecordResponse {
  ProviderResourceEnvelope envelope = 1;
  string last_event_id = 2;
  string external_id = 3;
  // Present only when a supported provider mapping supplies a display name.
  string display_name = 4;
  // Time this observation entered the current projection, not source effective time.
  google.protobuf.Timestamp observed_at = 5;
  // Optional canonical website supplied by a supported provider mapping.
  string website = 6;
}
