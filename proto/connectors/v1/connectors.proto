syntax = "proto3";

package connectors.v1;

import "buf/validate/validate.proto";
import "common/v1/authz.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/evalops/platform/gen/go/connectors/v1;connectorsv1";

// Canonical source for the co-located Platform and Connectors connectors.v1
// contract. Connector consumers compile this file through their local build
// adapter; there must not be a second connectors/v1/connectors.proto source
// under platform/connectors. Keep authorization, scope, and risk annotations
// here because they are part of the Platform-facing contract even though they
// are removed by the standalone connectors crate's wire-only codegen adapter.
// `ConnectorRuntime.provider_actions` is the stable generated API name for
// field 10. It is wire-compatible with the historical connectors-rs name
// `actions`; connector consumers use this canonical name after codegen.

// ConnectorService manages external integration connections.
service ConnectorService {
  rpc RegisterConnection(RegisterConnectionRequest) returns (RegisterConnectionResponse) {
    option (common.v1.required_scopes) = "connectors:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";

    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }
  rpc GetConnection(GetConnectionRequest) returns (GetConnectionResponse) {
    option (common.v1.required_scopes) = "connectors:read";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // Reads one validated, caller-authorized source observation for business objects.
  // Private/group-scoped resources are not widened into workspace records.
  rpc GetBusinessSourceRecord(GetBusinessSourceRecordRequest) returns (GetBusinessSourceRecordResponse) {
    option (common.v1.required_scopes) = "connectors:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse) {
    option (common.v1.required_scopes) = "connectors:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // ListUpcomingCalls projects tenant-owned Google Calendar event resources
  // into provider-neutral calls. Raw provider payloads and connection IDs
  // remain inside ConnectorService.
  rpc ListUpcomingCalls(ListUpcomingCallsRequest) returns (ListUpcomingCallsResponse) {
    option (common.v1.required_scopes) = "connectors:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse) {
    option (common.v1.required_scopes) = "connectors:read";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // Lists catalog providers that are installed in the active revision but
  // remain hidden from ListProviders until their generated-canary family
  // proofs are complete. This surface intentionally omits setup, auth, and
  // runtime details so callers cannot register an unqualified provider.
  rpc ListProviderPreviews(ListProviderPreviewsRequest) returns (ListProviderPreviewsResponse) {
    option (common.v1.required_scopes) = "connectors:read";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc PreviewCustomConnector(PreviewCustomConnectorRequest) returns (PreviewCustomConnectorResponse) {
    option (common.v1.required_scopes) = "connectors:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  rpc CreateCustomConnector(CreateCustomConnectorRequest) returns (CreateCustomConnectorResponse) {
    option (common.v1.required_scopes) = "connectors:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }
  rpc GetCustomConnector(GetCustomConnectorRequest) returns (GetCustomConnectorResponse) {
    option (common.v1.required_scopes) = "connectors:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc ListCustomConnectors(ListCustomConnectorsRequest) returns (ListCustomConnectorsResponse) {
    option (common.v1.required_scopes) = "connectors:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc UpdateCustomConnector(UpdateCustomConnectorRequest) returns (UpdateCustomConnectorResponse) {
    option (common.v1.required_scopes) = "connectors:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  rpc DeleteCustomConnector(DeleteCustomConnectorRequest) returns (DeleteCustomConnectorResponse) {
    option (common.v1.required_scopes) = "connectors:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }
  // ResolveProviderInstallation maps provider-issued installation coordinates
  // to exactly one active, tenant-bound connection. It never returns credential
  // material and callers must not infer tenant scope from a provider workspace.
  rpc ResolveProviderInstallation(ResolveProviderInstallationRequest) returns (ResolveProviderInstallationResponse) {
    option (common.v1.required_scopes) = "connectors:read";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // EnrollSurfaceTarget selects one exact provider object for background
  // observation. Provider-specific adapters verify current read access before
  // a durable target is created; this call never grants connector authority.
  rpc EnrollSurfaceTarget(EnrollSurfaceTargetRequest) returns (EnrollSurfaceTargetResponse) {
    option (common.v1.required_scopes) = "connectors:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }
  rpc VerifyConnectionActive(VerifyConnectionActiveRequest) returns (VerifyConnectionActiveResponse) {
    option (common.v1.required_scopes) = "connectors:connection-active:verify";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc RefreshConnection(RefreshConnectionRequest) returns (RefreshConnectionResponse) {
    option (common.v1.required_scopes) = "connectors:write";

    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  rpc RevokeConnection(RevokeConnectionRequest) returns (RevokeConnectionResponse) {
    option (common.v1.required_scopes) = "connectors:write";

    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse) {
    option (common.v1.required_scopes) = "connectors:read";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc ResolveSourceOfTruth(ResolveSourceOfTruthRequest) returns (ResolveSourceOfTruthResponse) {
    option (common.v1.required_scopes) = "connectors:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc GetDegradedReadPolicy(GetDegradedReadPolicyRequest) returns (GetDegradedReadPolicyResponse) {
    option (common.v1.required_scopes) = "connectors:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc SetSourceOfTruthPolicy(SetSourceOfTruthPolicyRequest) returns (SetSourceOfTruthPolicyResponse) {
    option (common.v1.required_scopes) = "connectors:write";
    option (common.v1.organization_scope_field) = "policy.organization_id";
    option (common.v1.workspace_scope_field) = "policy.workspace_id";

    option (common.v1.risk_level) = RISK_LEVEL_CRITICAL;
  }
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse) {
    option (common.v1.required_scopes) = "connectors:read";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  // InitiateOAuthFlow returns a provider authorize URL plus a server-issued
  // state token. The UI launches the URL in a popup; the provider redirects
  // back to /integrations/{provider}/oauth-callback with the auth code, and
  // the UI then calls CompleteOAuthFlow.
  rpc InitiateOAuthFlow(InitiateOAuthFlowRequest) returns (InitiateOAuthFlowResponse) {
    option (common.v1.required_scopes) = "connectors:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";

    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  // CompleteOAuthFlow exchanges the authorization code for access/refresh
  // tokens and registers the connection in one call.
  rpc CompleteOAuthFlow(CompleteOAuthFlowRequest) returns (CompleteOAuthFlowResponse) {
    option (common.v1.required_scopes) = "connectors:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";

    option (common.v1.risk_level) = RISK_LEVEL_CRITICAL;
  }
  // InitiateMcpOAuthFlow performs protected-resource (RFC 9728) and
  // authorization-server (RFC 8414) discovery, then returns a PKCE-bound
  // authorization URL. The connector owner persists the state binding and
  // returns only metadata and opaque references; token material never crosses
  // this contract.
  rpc InitiateMcpOAuthFlow(InitiateMcpOAuthFlowRequest) returns (InitiateMcpOAuthFlowResponse) {
    option (common.v1.required_scopes) = "connectors:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";

    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  // CompleteMcpOAuthFlow consumes the one-time state/code binding and asks the
  // configured secret broker to custody the resulting token set. The response
  // contains only an opaque connection_ref and durable grant identity.
  rpc CompleteMcpOAuthFlow(CompleteMcpOAuthFlowRequest) returns (CompleteMcpOAuthFlowResponse) {
    option (common.v1.required_scopes) = "connectors:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";

    option (common.v1.risk_level) = RISK_LEVEL_CRITICAL;
  }
  rpc RevokeMcpOAuthGrant(RevokeMcpOAuthGrantRequest) returns (RevokeMcpOAuthGrantResponse) {
    option (common.v1.required_scopes) = "connectors:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";

    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }
  // TriggerSync enqueues a sync run for a connection's resource stream on the
  // connectors owner's durable run queue. Enqueue is idempotent on
  // (connection_id, idempotency_key): replaying the same key returns the
  // existing queue row rather than creating a duplicate run.
  rpc TriggerSync(TriggerSyncRequest) returns (TriggerSyncResponse) {
    option (common.v1.required_scopes) = "connectors:write";

    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  rpc ListConnectionStreams(ListConnectionStreamsRequest) returns (ListConnectionStreamsResponse) {
    option (common.v1.required_scopes) = "connectors:read";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc GetStreamState(GetStreamStateRequest) returns (GetStreamStateResponse) {
    option (common.v1.required_scopes) = "connectors:read";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc ResetStreamState(ResetStreamStateRequest) returns (ResetStreamStateResponse) {
    option (common.v1.required_scopes) = "connectors:write";

    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  rpc ExecuteConnectorAction(ExecuteConnectorActionRequest) returns (ExecuteConnectorActionResponse) {
    option (common.v1.required_scopes) = "connectors:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";

    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }
  rpc CreateSyncSchedule(CreateSyncScheduleRequest) returns (CreateSyncScheduleResponse) {
    option (common.v1.required_scopes) = "connectors:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";

    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  rpc ListSyncSchedules(ListSyncSchedulesRequest) returns (ListSyncSchedulesResponse) {
    option (common.v1.required_scopes) = "connectors:read";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
}

// AuthType describes the authentication method for a connection.
enum AuthType {
  AUTH_TYPE_UNSPECIFIED = 0;
  AUTH_TYPE_OAUTH2 = 1;
  AUTH_TYPE_API_KEY = 2;
  AUTH_TYPE_BASIC = 3;
  AUTH_TYPE_MTLS = 4;
  AUTH_TYPE_GITHUB_APP = 5;
}

// HealthStatus describes the health state of a connection.
enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_HEALTHY = 1;
  HEALTH_STATUS_DEGRADED = 2;
  HEALTH_STATUS_UNHEALTHY = 3;
  HEALTH_STATUS_UNKNOWN = 4;
}

// ProviderInstallationState is the lifecycle state of a provider-issued app
// installation. Only ACTIVE installations may resolve for event ingress.
enum ProviderInstallationState {
  PROVIDER_INSTALLATION_STATE_UNSPECIFIED = 0;
  PROVIDER_INSTALLATION_STATE_ACTIVE = 1;
  PROVIDER_INSTALLATION_STATE_RECONNECT_REQUIRED = 2;
  PROVIDER_INSTALLATION_STATE_REVOKED = 3;
}

enum CredentialState {
  CREDENTIAL_STATE_UNSPECIFIED = 0;
  CREDENTIAL_STATE_READY = 1;
  CREDENTIAL_STATE_MISSING = 2;
  CREDENTIAL_STATE_REVOKED = 3;
}

// SourceAuthorityState is the external source system's authority posture for
// a connection. A locally active row is not source authority; callers must
// receive an explicit UNKNOWN observation until an authoritative producer
// reports otherwise.
enum SourceAuthorityState {
  SOURCE_AUTHORITY_STATE_UNSPECIFIED = 0;
  SOURCE_AUTHORITY_STATE_SUFFICIENT = 1;
  SOURCE_AUTHORITY_STATE_INSUFFICIENT = 2;
  SOURCE_AUTHORITY_STATE_UNKNOWN = 3;
  SOURCE_AUTHORITY_STATE_REVOKED = 4;
}

// SourceAuthorityFreshnessMethod identifies how the source observation was
// obtained. NOT_OBSERVED is the explicit default when no authoritative
// producer has supplied a response; it is not evidence of source access.
enum SourceAuthorityFreshnessMethod {
  SOURCE_AUTHORITY_FRESHNESS_METHOD_UNSPECIFIED = 0;
  SOURCE_AUTHORITY_FRESHNESS_METHOD_NOT_OBSERVED = 1;
  SOURCE_AUTHORITY_FRESHNESS_METHOD_INTROSPECTION = 2;
  SOURCE_AUTHORITY_FRESHNESS_METHOD_WEBHOOK = 3;
  SOURCE_AUTHORITY_FRESHNESS_METHOD_POLLING = 4;
  SOURCE_AUTHORITY_FRESHNESS_METHOD_SHORT_TTL = 5;
  SOURCE_AUTHORITY_FRESHNESS_METHOD_REFRESH_FAILURE = 6;
}

// SourceOfTruthArea identifies a functional domain for source-of-truth resolution.
enum SourceOfTruthArea {
  SOURCE_OF_TRUTH_AREA_UNSPECIFIED = 0;
  SOURCE_OF_TRUTH_AREA_CRM = 1;
  SOURCE_OF_TRUTH_AREA_SUPPORT = 2;
  SOURCE_OF_TRUTH_AREA_BILLING = 3;
  SOURCE_OF_TRUTH_AREA_ANALYTICS = 4;
  SOURCE_OF_TRUTH_AREA_HRIS = 5;
}

// Mirrors connectors_cdk::ReplicationMode (crates/connectors-cdk/src/lib.rs).
enum ReplicationMode {
  REPLICATION_MODE_UNSPECIFIED = 0;
  REPLICATION_MODE_FULL_REFRESH = 1;
  REPLICATION_MODE_INCREMENTAL = 2;
}

// Connection is the canonical external integration connection record.
message Connection {
  string id = 1;
  string workspace_id = 2;
  string provider_id = 3;
  string display_name = 4;
  AuthType auth_type = 5;
  repeated string scopes = 6;
  HealthStatus health_status = 7;
  google.protobuf.Timestamp last_healthy_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // credential_refs mirrors non-secret credential references such as vault or
  // secret-manager handles. Raw credential material must not be returned here.
  map<string, string> credential_refs = 11;
  string organization_id = 12;
  // health_reason is a short, human-readable explanation of the current
  // health_status — "token refreshed 2m ago", "auth failed: token revoked",
  // "rate-limited by upstream". The UI surfaces it on tiles and the active
  // card so operators don't have to dig into logs to find out why a
  // connection is degraded. Empty when there's nothing meaningful to add.
  string health_reason = 13;
  // Expiry of the connection's stored OAuth credential, when known. Unset for
  // API-key/basic/mtls connections and for providers that do not report it.
  google.protobuf.Timestamp credential_expires_at = 14;
  // Connection-owner custody revision. Zero is an unpersisted or legacy snapshot.
  uint64 revision = 15;
}

// ProviderInstallation is a credential-free projection of provider-issued
// installation identity and its owning Platform tenant.
message ProviderInstallation {
  string connection_id = 1 [(buf.validate.field).string.min_len = 1];
  string organization_id = 2 [(buf.validate.field).string.min_len = 1];
  string workspace_id = 3 [(buf.validate.field).string.min_len = 1];
  string provider_id = 4 [(buf.validate.field).string.min_len = 1];
  string app_id = 5 [(buf.validate.field).string.min_len = 1];
  string provider_workspace_id = 6 [(buf.validate.field).string.min_len = 1];
  string provider_enterprise_id = 7;
  string provider_bot_user_id = 8;
  ProviderInstallationState install_state = 9;
  HealthStatus health_status = 10;
  repeated string granted_scopes = 11;
  google.protobuf.Timestamp installed_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  google.protobuf.Timestamp revoked_at = 14;
}

message ResolveProviderInstallationRequest {
  string provider_id = 1 [(buf.validate.field).string.min_len = 1];
  string app_id = 2 [(buf.validate.field).string.min_len = 1];
  string provider_workspace_id = 3 [(buf.validate.field).string.min_len = 1];
  string provider_enterprise_id = 4;
}

message ResolveProviderInstallationResponse {
  Connection connection = 1;
  ProviderInstallation installation = 2;
}

message EnrollSurfaceTargetRequest {
  string organization_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string workspace_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string connection_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string provider_id = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string target_kind = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string external_id = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1024
  }];
  string canonical_url = 7 [(buf.validate.field).string.max_len = 4096];
  string idempotency_key = 8 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
}

message EnrollSurfaceTargetResponse {
  string connection_id = 1;
  string provider_id = 2;
  string target_kind = 3;
  string external_id = 4;
  string state = 5;
  bool idempotent_replay = 6;
}

message VerifyConnectionActiveRequest {
  string organization_id = 1 [(buf.validate.field).string.min_len = 1];
  string workspace_id = 2 [(buf.validate.field).string.min_len = 1];
  string connection_id = 3 [(buf.validate.field).string.min_len = 1];
}

message VerifyConnectionActiveResponse {
  string connection_id = 1 [(buf.validate.field).string.min_len = 1];
  string organization_id = 2 [(buf.validate.field).string.min_len = 1];
  string workspace_id = 3 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp state_updated_at = 4;
  google.protobuf.Timestamp verified_at = 5;
  // Completed source-owner verification supplies this observation. A local
  // active row alone remains UNKNOWN/NOT_OBSERVED.
  SourceAuthorityObservation source_authority = 6;
  // Monotonic Connection-owner revision, including credential-reference and
  // OAuth installation mutations. Zero means no revision evidence was supplied.
  uint64 connection_revision = 7;
}

// SourceAuthorityObservation is credential-free evidence from the external
// source owner. Empty optional timestamps/reference fields mean that the
// owner has not supplied that evidence; they must not be inferred locally.
message SourceAuthorityObservation {
  SourceAuthorityState state = 1 [(buf.validate.field).enum.defined_only = true];
  string reason = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  SourceAuthorityFreshnessMethod freshness_method = 3 [(buf.validate.field).enum.defined_only = true];
  google.protobuf.Timestamp observed_at = 4;
  google.protobuf.Timestamp last_confirmed_at = 5;
  // Opaque owner reference only; never a token, secret, private key, or raw
  // provider response body.
  string owner_snapshot_reference = 6 [(buf.validate.field).string.max_len = 256];
}

// ConnectionHealth provides detailed health information for a connection.
message ConnectionHealth {
  HealthStatus status = 1;
  int32 latency_ms = 2;
  google.protobuf.Timestamp last_check_at = 3;
  string error_message = 4;
  // reason mirrors Connection.health_reason but for the live GetHealth
  // response. Empty when status==healthy and there's nothing to surface.
  string reason = 5;
}

// ConnectorCredentialField describes the credential reference slots accepted
// by a managed provider. Values are reference handles such as vault:// or
// gsm:// URIs, never raw credential material.
message ConnectorCredentialField {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string label = 2;
  bool required = 3;
  bool secret = 4;
  repeated string accepted_reference_schemes = 5;
  string credential_type = 6;
  bool versioned = 7;
  bool rotatable = 8;
  bool revocable = 9;
  bool expires = 10;
  string stable_id = 11 [(buf.validate.field).string.min_len = 1];
  ConnectorCatalogProvenance provenance = 12;
}

// ConnectorCredentialLifecyclePolicy describes the generic credential lifecycle
// operations the platform can drive for a provider.
message ConnectorCredentialLifecyclePolicy {
  repeated string supported_credential_types = 1;
  bool supports_versioning = 2;
  bool supports_rotation = 3;
  bool supports_revocation = 4;
  int32 rotation_notice_days = 5 [(buf.validate.field).int32.gte = 0];
}

// ConnectorRuntime describes the read runtime a managed provider exposes.
// The connectors backend uses this to advertise concrete upstream resources
// that can be inventoried, including child resources whose path parameters
// must be bound from parent records.
message ConnectorRuntime {
  // base_url is the provider API origin or templated origin, e.g.
  // "https://api.openai.com/v1" or "https://bedrock.{region}.amazonaws.com".
  string base_url = 1;
  // verification_path is the endpoint the backend can probe to validate
  // credentials before deeper resource reads.
  string verification_path = 2;
  repeated ConnectorResourceFamily resource_families = 3;
  repeated ConnectorChildResource child_resources = 4;
  // Provider-level rate-limit defaults. Unset (all three absent) means the
  // provider runs unthrottled. A ConnectorResourceFamily may override any of
  // these three per resource family. This field replaces a previously
  // vestigial `repeated ConnectorActionDefinition actions = 5` that no
  // platform code ever populated or read (evalops/platform#5124); the tag-5
  // wire type it now carries (VARINT) matches connectors-rs, the service
  // that actually produces these bytes.
  optional uint32 requests_per_window = 5;
  optional uint32 window_seconds = 6;
  optional uint32 max_concurrency = 7;
  // Non-secret constant headers/query params applied to every request for
  // this runtime. Never redacted: these are not credential material.
  repeated ConnectorStaticHeader static_headers = 8;
  // Explicit origin templates authorized to receive this runtime's
  // credentials. Request execution rejects URLs outside this set before
  // resolving header/query credentials.
  repeated string credential_destination_origins = 9;
  // ConnectorService, the catalog owner, publishes its authoritative action
  // inventory here. Named `provider_actions` instead of connectors-rs's
  // `actions` -- see the naming-debt note at the top of this file.
  repeated ConnectorActionDefinition provider_actions = 10;
  // Optional DNS suffix constraints for credential-bearing destinations whose
  // hostname is supplied by connection configuration. Hosts must equal a
  // suffix or be its dot-delimited subdomain; ports, IP literals, userinfo,
  // trailing dots, and encoded lookalikes are rejected before auth resolves.
  repeated string credential_destination_host_suffixes = 11;
}

// ConnectorActionDefinition declares one provider-native operation.
message ConnectorActionDefinition {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string capability = 2 [(buf.validate.field).string.min_len = 1];
  string http_method = 3 [(buf.validate.field).string.min_len = 1];
  string path = 4 [(buf.validate.field).string.min_len = 1];
  bool approval_required = 5;
  bool destructive = 6;
  string stable_id = 7 [(buf.validate.field).string.min_len = 1];
  ConnectorCatalogProvenance provenance = 8;
  string base_url = 9 [(buf.validate.field).string.uri = true];
  repeated string required_scopes = 10;
  string input_schema_json = 11;
  string digest = 12;
  // Canonical semantic effect for this action. Empty/unspecified is
  // fail-closed: only an explicit `read` effect may enter a governed
  // read-only execution path. This is independent of the provider HTTP
  // method because some read APIs (for example Tavily search) use POST.
  string effect = 13;
  // Catalog-owned tool metadata. Presence does not grant execution authority.
  ConnectorGovernedAction governed = 14;
  // This action may be emitted by a registered object-surface projector.
  // Presence is descriptive only; installation authority is still required.
  bool surface_projection = 15;
}

// ConnectorGovernedAction preserves published tool descriptions, schemas, and
// examples across compiled and durable catalog projections. Execution still
// requires the connection's granted scopes and the action's effect policy.
message ConnectorGovernedAction {
  string tool_name = 1;
  uint32 version = 2;
  repeated string compatibility_aliases = 3;
  string description = 4;
  bool mention_default = 5;
  repeated string mention_keywords = 6;
  string output_schema_json = 7;
  string input_example_json = 8;
  string output_example_json = 9;
}

// ConnectorVerificationLevel is the fail-closed evidence ladder for a
// connector catalog subject. Higher levels require the canonical verification
// ledger to contain evidence that justifies the promotion.
enum ConnectorVerificationLevel {
  CONNECTOR_VERIFICATION_LEVEL_UNSPECIFIED = 0;
  CONNECTOR_VERIFICATION_LEVEL_DECLARED = 1;
  CONNECTOR_VERIFICATION_LEVEL_SPEC_DERIVED = 2;
  CONNECTOR_VERIFICATION_LEVEL_FIXTURE_VERIFIED = 3;
  CONNECTOR_VERIFICATION_LEVEL_LIVE_VERIFIED = 4;
  CONNECTOR_VERIFICATION_LEVEL_CONTINUOUSLY_VERIFIED = 5;
}

// ConnectorEvidenceKind identifies the bounded evidence supporting a catalog
// verification level. It does not establish credential validity or transport
// availability.
enum ConnectorEvidenceKind {
  CONNECTOR_EVIDENCE_KIND_UNSPECIFIED = 0;
  CONNECTOR_EVIDENCE_KIND_PROBE = 1;
  CONNECTOR_EVIDENCE_KIND_FIXTURE = 2;
  CONNECTOR_EVIDENCE_KIND_CANARY = 3;
  CONNECTOR_EVIDENCE_KIND_PRODUCTION = 4;
  CONNECTOR_EVIDENCE_KIND_UNPROVABLE_UNAUTHENTICATED = 5;
}

// ConnectorCatalogProvenance records where a catalog-derived value came from
// (for example an OpenAPI spec import), when it was last verified, and the
// bounded evidence behind its current verification level.
message ConnectorCatalogProvenance {
  string basis = 1;
  string source_url = 2;
  string last_verified_at = 3;
  ConnectorVerificationLevel verification_level = 4;
  ConnectorEvidenceKind evidence_kind = 5;
}

