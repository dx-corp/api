  AuthType default_auth_type = 3 [(buf.validate.field).enum.defined_only = true];
  repeated string default_scopes = 4;
  repeated string capabilities = 5;
  bool supports_pkce = 6;
  bool supports_refresh = 7;
  repeated ConnectorCredentialField credential_fields = 8;
  ConnectorCredentialLifecyclePolicy credential_lifecycle_policy = 9;
  // oauth_supported is true when the connectors backend can run the OAuth
  // flow for this provider — i.e. the provider is in oauthProviderRegistry
  // and its OAuth client_id/secret are present in the OAuth catalog. The
  // UI uses this instead of a hardcoded list to decide whether to show
  // the Authorize launcher or the catalog-runbook notice; that means
  // adding a provider in Go automatically flips it on for the UI.
  bool oauth_supported = 10;
  // catalog_categories are backend-authored tags such as "ai" or
  // "governance" used by UI filtering and operator copy.
  repeated string catalog_categories = 11;
  // runtime is set when the provider has an executable inventory/read runtime.
  ConnectorRuntime runtime = 12;
  string stable_id = 13;
  repeated string aliases = 14;
  ConnectorCatalogProvenance provenance = 15;
  repeated ConnectorAuthBinding auth_bindings = 16;
  // tier is derived by the catalog compiler from the executable runtime
  // shape. It is not an authored readiness or verification claim.
  string tier = 17;
  // rollout_kind controls durable catalog exposure. Machine imports use
  // generated_canary until every required family has visible proof.
  string rollout_kind = 18;
  // Immutable source/import cohort used to bind generated-canary proof.
  // Empty for built-in and tenant-owned custom providers.
  string canary_cohort_sha256 = 19;
  // Customer-facing source description. Empty means the catalog has no
  // authoritative description.
  string description = 20;
