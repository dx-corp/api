syntax = "proto3";

package agents.v1;

import "buf/validate/validate.proto";
import "common/v1/authz.proto";
import "common/v1/delivery.proto";
import "common/v1/entity.proto";
import "common/v1/risk.proto";
import "common/v1/surface.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/evalops/platform/gen/go/agents/v1;agentsv1";

// AgentService manages agent definitions, versioned configuration, and
// cross-agent delegation. Every string agent_id in the platform (meter,
// objectives, approvals, governance, memory) resolves to an Agent record
// owned by this service.
service AgentService {
  // Register creates a new agent definition.
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (common.v1.required_scopes) = "agent-registry:write";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // Get retrieves an agent by ID.
  rpc Get(GetRequest) returns (GetResponse) {
    option (common.v1.required_scopes) = "agent-registry:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // List returns agents matching the query filters.
  rpc List(ListRequest) returns (ListResponse) {
    option (common.v1.required_scopes) = "agent-registry:read";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // Update modifies mutable agent metadata (name, description, surfaces).
  rpc Update(UpdateRequest) returns (UpdateResponse) {
    option (common.v1.required_scopes) = "agent-registry:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // Deregister removes an agent from the registry.
  rpc Deregister(DeregisterRequest) returns (DeregisterResponse) {
    option (common.v1.required_scopes) = "agent-registry:write";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }

  // PushConfig creates a new immutable configuration version for an agent.
  // The agent's active_config_version advances atomically.
  rpc PushConfig(PushConfigRequest) returns (PushConfigResponse) {
    option (common.v1.required_scopes) = "agent-registry:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // GetConfig retrieves a specific configuration version.
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse) {
    option (common.v1.required_scopes) = "agent-registry:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // ListConfigs returns all configuration versions for an agent.
  rpc ListConfigs(ListConfigsRequest) returns (ListConfigsResponse) {
    option (common.v1.required_scopes) = "agent-registry:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // RollbackConfig atomically reverts an agent to a prior configuration version.
  rpc RollbackConfig(RollbackConfigRequest) returns (RollbackConfigResponse) {
    option (common.v1.required_scopes) = "agent-registry:write";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }

  // Delegate requests that another agent (or any agent with a matching
  // capability) accept a unit of work. The delegation is tracked as a
  // DelegationRecord and linked to the originating objective and optional
  // workflow step.
  rpc Delegate(DelegateRequest) returns (DelegateResponse) {
    option (common.v1.required_scopes) = "agent-registry:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // ResolveDelegation records the outcome of a delegation.
  rpc ResolveDelegation(ResolveDelegationRequest) returns (ResolveDelegationResponse) {
    option (common.v1.required_scopes) = "agent-registry:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // RenewDelegationLease records observed remote progress for an active
  // delegation so reserved target capacity is not reaped while work is healthy.
  rpc RenewDelegationLease(RenewDelegationLeaseRequest) returns (RenewDelegationLeaseResponse) {
    option (common.v1.required_scopes) = "agent-registry:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // ControlA2ADelegationTask sends a fenced operating-plane control request to
  // the remote A2A task backing a Platform delegation. This is the Platform
  // control surface for steering, collecting from, interrupting, or canceling
  // a remote Maestro task or one of its subagent lanes.
  rpc ControlA2ADelegationTask(ControlA2ADelegationTaskRequest) returns (ControlA2ADelegationTaskResponse) {
    option (common.v1.required_scopes) = "agent-registry:write";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }

  // GetDelegation retrieves a delegation record by ID.
  rpc GetDelegation(GetDelegationRequest) returns (GetDelegationResponse) {
    option (common.v1.required_scopes) = "agent-registry:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // ListDelegations returns delegations matching the query filters.
  rpc ListDelegations(ListDelegationsRequest) returns (ListDelegationsResponse) {
    option (common.v1.required_scopes) = "agent-registry:read";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // GetA2ADelegationGraph returns the server-owned swarm graph for a remote
  // A2A delegation family. Callers may anchor the graph by root delegation id
  // or by any child delegation id in the lineage.
  rpc GetA2ADelegationGraph(GetA2ADelegationGraphRequest) returns (GetA2ADelegationGraphResponse) {
    option (common.v1.required_scopes) = "agent-registry:read";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // Heartbeat records agent liveness. The registry uses this to maintain
  // presence state and route capability-based delegation requests.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse) {
    option (common.v1.required_scopes) = "agent-registry:write";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
}

// AgentStatus describes the operational state of an agent.
enum AgentStatus {
  AGENT_STATUS_UNSPECIFIED = 0;
  AGENT_STATUS_ACTIVE = 1;
  AGENT_STATUS_IDLE = 2;
  AGENT_STATUS_BUSY = 3;
  AGENT_STATUS_OFFLINE = 4;
  AGENT_STATUS_DEGRADED = 5;
  AGENT_STATUS_SUSPENDED = 6;
}

// DelegationStatus describes the lifecycle state of a delegation.
enum DelegationStatus {
  DELEGATION_STATUS_UNSPECIFIED = 0;
  DELEGATION_STATUS_PENDING = 1;
  DELEGATION_STATUS_ACCEPTED = 2;
  DELEGATION_STATUS_REJECTED = 3;
  DELEGATION_STATUS_COMPLETED = 4;
  DELEGATION_STATUS_FAILED = 5;
  DELEGATION_STATUS_TIMED_OUT = 6;
}

// A2ADelegationTaskControlMode describes the remote task-control action that
// Platform asks the target A2A peer to apply.
enum A2ADelegationTaskControlMode {
  A2A_DELEGATION_TASK_CONTROL_MODE_UNSPECIFIED = 0;
  A2A_DELEGATION_TASK_CONTROL_MODE_STEER = 1;
  A2A_DELEGATION_TASK_CONTROL_MODE_FOLLOWUP = 2;
  A2A_DELEGATION_TASK_CONTROL_MODE_COLLECT = 3;
  A2A_DELEGATION_TASK_CONTROL_MODE_INTERRUPT = 4;
  A2A_DELEGATION_TASK_CONTROL_MODE_CANCEL = 5;
}

// Agent is the canonical agent definition record.
// The id field is the value stored in every agent_id / agent string field
// across the platform: meter/v1 RecordUsageRequest.agent_id,
// objectives/v1 Objective.agent_id, approvals/v1 ApprovalRequest.agent_id,
// governance/v1 EvaluateActionRequest.agent_id, memory/v1 Memory.agent,
// and events/v1 Change.actor_id when actor_type is "agent".
message Agent {
  string id = 1;
  string workspace_id = 2;
  string name = 3;
  string description = 4;

  // agent_type aligns with identity/v1 IntrospectResponse.agent_type and
  // IssueAgentTokenRequest.agent_type. Examples: "sdr", "support", "coding",
  // "ops", "research".
  string agent_type = 5;

  // capabilities aligns with identity/v1 IntrospectResponse.capabilities and
  // IssueAgentTokenRequest.capabilities. Used by capability-based delegation
  // routing. Examples: "hubspot-write", "email-send", "code-review".
  repeated string capabilities = 6;

  // surfaces this agent can operate on. Aligns with the surface field in
  // meter/v1, objectives/v1, approvals/v1. Examples: "ensemble", "chat",
  // "maestro", "conductor", "slack".
  repeated string surfaces = 7;

  AgentStatus status = 8;
  int32 active_config_version = 9;
  string owner_id = 10;
  google.protobuf.Timestamp last_heartbeat_at = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  repeated common.v1.Surface surface_types = 14 [(buf.validate.field).repeated.items.enum = {
    defined_only: true
    not_in: [0]
  }];

  // a2a is the Platform-owned discovery projection for spec-native A2A peers.
  // Remote agents use it to discover where to fetch the Agent Card, which
  // transport/profile is supported, and which skills can be delegated to this
  // agent or its child/subagent lanes.
  AgentA2APeerProjection a2a = 15;

  // capacity is the registry-owned load projection used by fleet-scale
  // delegation discovery and operator read models.
  AgentCapacity capacity = 16;
}

message AgentCapacity {
  int32 current = 1;
  int32 max = 2;
  int32 remaining = 3;
  int32 reserved_delegation_count = 4;
}

message AgentA2APeerProjection {
  string public_endpoint_url = 1;
  string internal_endpoint_url = 2;
  string agent_card_url = 3;
  string protocol_binding = 4;
  string protocol_version = 5;
  repeated string supported_extensions = 6;
  repeated AgentA2ASkill skills = 7;
  repeated string security_schemes = 8;
  google.protobuf.Timestamp agent_card_observed_at = 9;
  string agent_card_etag = 10;
  string agent_card_hash = 11;
  bool push_notifications = 12;
  map<string, string> attributes = 13;
}

message AgentA2ASkill {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string tags = 4;
  repeated string input_modes = 5;
  repeated string output_modes = 6;
  repeated string required_context_grants = 7;
  string approval_policy_ref = 8;
  string max_autonomy = 9;
  repeated string required_artifact_kinds = 10;
  repeated string optional_artifact_kinds = 11;
  repeated string allowed_task_classes = 12;
  repeated string denied_task_classes = 13;
  map<string, string> attributes = 14;
}

// AgentConfig is an immutable snapshot of everything that shapes an agent's
// behavior. Promotion and rollback are both config version reassignments —
// the same pattern as prompts/v1 Label.
message AgentConfig {
  int32 version = 1;
  string agent_id = 2;

  // skill_ids reference skills/v1 Skill.id — the reusable capabilities
  // this agent has loaded.
  repeated string skill_ids = 3;

  // prompt_bindings maps prompt name to label (e.g., "sdr-outreach" -> "production").
  // Aligns with prompts/v1 ResolveRequest.name and ResolveRequest.label.
  map<string, string> prompt_bindings = 4;

  // model_preferences maps surface to preferred model identifier
  // (e.g., "ensemble" -> "claude-opus-4.6"). Aligns with meter/v1
  // RecordUsageRequest.model and keys/v1 ResolveProviderRefRequest.provider.
  map<string, string> model_preferences = 5;

  // integration_ids reference connectors/v1 Connection.id — the external
  // system connections this agent is authorized to use.
  repeated string integration_ids = 6;

  // entity_type_scopes restrict which entities/v1 EntityType values this
  // agent can operate on. Empty means unrestricted.
  repeated string entity_type_scopes = 7;

  // max_concurrent_objectives caps the number of objectives/v1 Objective
  // records this agent can hold in RUNNING or BLOCKED state simultaneously.
  int32 max_concurrent_objectives = 8;

  // cost_budget_usd is the per-period spend ceiling enforced against
  // meter/v1 usage records for this agent.
  double cost_budget_usd = 9;

  // notification_channel specifies the preferred notifications/v1
  // DeliveryChannel for this agent's escalations. Stored as string to
  // avoid cross-package import (e.g., "DELIVERY_CHANNEL_SLACK").
  string notification_channel = 10;

  // parameters holds arbitrary agent-specific tuning knobs.
  google.protobuf.Struct parameters = 11;

  string author = 12;
  google.protobuf.Timestamp created_at = 13;
  repeated common.v1.EntityType entity_type_scope_enums = 14;
  common.v1.DeliveryChannel notification_channel_enum = 15;
  DigitalTeammateProfile teammate_profile = 16;
}

// TeammateLifecycle describes whether a teammate profile can be used to
// initiate durable work.
enum TeammateLifecycle {
  TEAMMATE_LIFECYCLE_UNSPECIFIED = 0;
  TEAMMATE_LIFECYCLE_DRAFT = 1;
  TEAMMATE_LIFECYCLE_ACTIVE = 2;
  TEAMMATE_LIFECYCLE_PAUSED = 3;
  TEAMMATE_LIFECYCLE_DEPRECATED = 4;
}

// CommitmentKind describes the durable commitments a teammate can accept.
enum CommitmentKind {
  COMMITMENT_KIND_UNSPECIFIED = 0;
  COMMITMENT_KIND_FOLLOW_UP = 1;
  COMMITMENT_KIND_WATCH = 2;
  COMMITMENT_KIND_RETRY = 3;
  COMMITMENT_KIND_SUMMARIZE = 4;
  COMMITMENT_KIND_MONITOR = 5;
  COMMITMENT_KIND_REMEDIATE = 6;
  COMMITMENT_KIND_HANDOFF = 7;
}

// InitiativeTriggerKind describes events that can let a teammate start work
// without a fresh direct human prompt.
enum InitiativeTriggerKind {
  INITIATIVE_TRIGGER_KIND_UNSPECIFIED = 0;
  INITIATIVE_TRIGGER_KIND_SCHEDULE = 1;
  INITIATIVE_TRIGGER_KIND_SLACK_EVENT = 2;
  INITIATIVE_TRIGGER_KIND_PLATFORM_EVENT = 3;
  INITIATIVE_TRIGGER_KIND_OBJECTIVE_WAKE = 4;
  INITIATIVE_TRIGGER_KIND_WAIT_RESOLVED = 5;
  INITIATIVE_TRIGGER_KIND_EVAL_REGRESSION = 6;
  INITIATIVE_TRIGGER_KIND_STALLED_WORK = 7;
}

// AutonomyAuthority describes how independently a teammate may act.
enum AutonomyAuthority {
  AUTONOMY_AUTHORITY_UNSPECIFIED = 0;
  AUTONOMY_AUTHORITY_OWN = 1;
  AUTONOMY_AUTHORITY_RECOMMEND = 2;
  AUTONOMY_AUTHORITY_REQUIRE_APPROVAL = 3;
  AUTONOMY_AUTHORITY_DENY = 4;
}

// PresenceEvent describes channel-visible teammate activity.
enum PresenceEvent {
  PRESENCE_EVENT_UNSPECIFIED = 0;
  PRESENCE_EVENT_ACCEPTED = 1;
  PRESENCE_EVENT_WAITING = 2;
  PRESENCE_EVENT_PROGRESS = 3;
  PRESENCE_EVENT_BLOCKED = 4;
  PRESENCE_EVENT_COMPLETED = 5;
  PRESENCE_EVENT_FAILED = 6;
  PRESENCE_EVENT_ESCALATED = 7;
}

// TeammateChannelKind identifies a product or provider channel that can ingest
// user activity or render teammate runtime events. It intentionally lives in
// agents/v1 instead of agentruntime/v1 so teammate profiles can describe
// supported channels without creating a proto import cycle.
enum TeammateChannelKind {
  TEAMMATE_CHANNEL_KIND_UNSPECIFIED = 0;
  TEAMMATE_CHANNEL_KIND_SLACK = 1;
  TEAMMATE_CHANNEL_KIND_EMAIL = 2;
  TEAMMATE_CHANNEL_KIND_CALENDAR = 3;
  TEAMMATE_CHANNEL_KIND_JIRA = 4;
  TEAMMATE_CHANNEL_KIND_TEAMS = 5;
  TEAMMATE_CHANNEL_KIND_WEB = 6;
  TEAMMATE_CHANNEL_KIND_WEBHOOK = 7;
  TEAMMATE_CHANNEL_KIND_WHATSAPP = 8;
  TEAMMATE_CHANNEL_KIND_APPLE_MESSAGES = 9;
}

// TeammateChannelCapability describes what a channel adapter can do for a
// teammate profile.
enum TeammateChannelCapability {
  TEAMMATE_CHANNEL_CAPABILITY_UNSPECIFIED = 0;
  TEAMMATE_CHANNEL_CAPABILITY_INGEST = 1;
  TEAMMATE_CHANNEL_CAPABILITY_RENDER = 2;
}

// TeammateChannelEventKind describes normalized inbound channel events that can
// become AgentRuntime triggers.
enum TeammateChannelEventKind {
  TEAMMATE_CHANNEL_EVENT_KIND_UNSPECIFIED = 0;
  TEAMMATE_CHANNEL_EVENT_KIND_MESSAGE_CREATED = 1;
  TEAMMATE_CHANNEL_EVENT_KIND_THREAD_REPLY_CREATED = 2;
  TEAMMATE_CHANNEL_EVENT_KIND_COMMAND_INVOKED = 3;
  TEAMMATE_CHANNEL_EVENT_KIND_ACTION_INVOKED = 4;
  TEAMMATE_CHANNEL_EVENT_KIND_REACTION_ADDED = 5;
  TEAMMATE_CHANNEL_EVENT_KIND_REACTION_REMOVED = 6;
  TEAMMATE_CHANNEL_EVENT_KIND_ASSISTANT_THREAD_STARTED = 7;
  TEAMMATE_CHANNEL_EVENT_KIND_ASSISTANT_THREAD_CONTEXT_CHANGED = 8;
  TEAMMATE_CHANNEL_EVENT_KIND_EMAIL_RECEIVED = 9;
  TEAMMATE_CHANNEL_EVENT_KIND_CALENDAR_EVENT_CHANGED = 10;
  TEAMMATE_CHANNEL_EVENT_KIND_ISSUE_CHANGED = 11;
  TEAMMATE_CHANNEL_EVENT_KIND_SCHEDULED_WAKE = 12;
  TEAMMATE_CHANNEL_EVENT_KIND_WEBHOOK_RECEIVED = 13;
}

// TeammateRuntimeRenderEventKind describes Platform runtime events a channel
// adapter can project back into the provider surface.
enum TeammateRuntimeRenderEventKind {
  TEAMMATE_RUNTIME_RENDER_EVENT_KIND_UNSPECIFIED = 0;
  TEAMMATE_RUNTIME_RENDER_EVENT_KIND_TRIGGER_ACCEPTED = 1;
  TEAMMATE_RUNTIME_RENDER_EVENT_KIND_RUN_STARTED = 2;
  TEAMMATE_RUNTIME_RENDER_EVENT_KIND_PROGRESS = 3;
  TEAMMATE_RUNTIME_RENDER_EVENT_KIND_STEP_STARTED = 4;
  TEAMMATE_RUNTIME_RENDER_EVENT_KIND_STEP_COMPLETED = 5;
  TEAMMATE_RUNTIME_RENDER_EVENT_KIND_OBJECTIVE_UPDATED = 6;
  TEAMMATE_RUNTIME_RENDER_EVENT_KIND_APPROVAL_REQUESTED = 7;
  TEAMMATE_RUNTIME_RENDER_EVENT_KIND_APPROVAL_RESOLVED = 8;
  TEAMMATE_RUNTIME_RENDER_EVENT_KIND_TOOL_PROPOSED = 9;
  TEAMMATE_RUNTIME_RENDER_EVENT_KIND_TOOL_COMPLETED = 10;
  TEAMMATE_RUNTIME_RENDER_EVENT_KIND_ARTIFACT_CREATED = 11;
  TEAMMATE_RUNTIME_RENDER_EVENT_KIND_MEMORY_PROPOSED = 12;
  TEAMMATE_RUNTIME_RENDER_EVENT_KIND_WAITING = 13;
  TEAMMATE_RUNTIME_RENDER_EVENT_KIND_RESUMED = 14;
  TEAMMATE_RUNTIME_RENDER_EVENT_KIND_COMPLETED = 15;
  TEAMMATE_RUNTIME_RENDER_EVENT_KIND_FAILED = 16;
}

// DigitalTeammateProfile is the versioned contract for how an AgentConfig acts
// as a durable teammate across objectives, workflows, tools, memory, evals, and
// Slack or other delivery surfaces.
message DigitalTeammateProfile {
  string id = 1;
  int32 version = 2;
  string workspace_id = 3;
  string agent_id = 4;

  string display_name = 5;
  string role = 6;
  string purpose = 7;
  string owner_user_id = 8;
  string owner_team_id = 9;

  repeated common.v1.Surface surface_types = 10 [(buf.validate.field).repeated.items.enum = {
    defined_only: true
    not_in: [0]
  }];
  TeammateLifecycle lifecycle = 11 [(buf.validate.field).enum.defined_only = true];

  repeated TeammateResponsibility responsibilities = 12;
  CommitmentPolicy commitment_policy = 13;
  InitiativePolicy initiative_policy = 14;
  AutonomyPolicy autonomy_policy = 15;
  MemoryPolicy memory_policy = 16;
  PresencePolicy presence_policy = 17;
  OutputPolicy output_policy = 18;
  EvalPolicy eval_policy = 19;
  EscalationPolicy escalation_policy = 20;

  map<string, string> labels = 21;
  google.protobuf.Struct parameters = 22;
  google.protobuf.Timestamp created_at = 23;
  google.protobuf.Timestamp updated_at = 24;
  repeated TeammateChannelManifest channel_manifests = 25;
}

// TeammateChannelManifest describes one channel adapter supported by a
// teammate profile. Durable execution remains owned by AgentRuntime; this
// manifest lets product surfaces declare the provider-specific ingress and
// rendering coverage they can project.
message TeammateChannelManifest {
  TeammateChannelKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string label = 2;
  common.v1.DeliveryChannel delivery_channel = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  common.v1.Surface platform_surface = 4 [(buf.validate.field).enum.defined_only = true];
  string channel_id = 5;
  repeated TeammateChannelCapability capabilities = 6 [(buf.validate.field).repeated.items.enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated TeammateChannelEventKind inbound_events = 7 [(buf.validate.field).repeated.items.enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated TeammateRuntimeRenderEventKind runtime_events = 8 [(buf.validate.field).repeated.items.enum = {
    defined_only: true
    not_in: [0]
  }];
  map<string, string> attributes = 9;
}

// TeammateResponsibility binds a role claim to capabilities, entities, prompts,
// skills, and measurable outcomes.
message TeammateResponsibility {
  string id = 1;
  string title = 2;
  string description = 3;
  repeated string capability_refs = 4;
  repeated common.v1.EntityType owned_entity_types = 5 [(buf.validate.field).repeated.items.enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated string default_skill_ids = 6;
  repeated string prompt_names = 7;
  repeated string success_metric_refs = 8;
}

// CommitmentPolicy describes which durable objectives and wakes can be created
// from teammate commitments.
message CommitmentPolicy {
  repeated CommitmentKind allowed_kinds = 1 [(buf.validate.field).repeated.items.enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated CommitmentTemplate templates = 2;
  int32 default_due_seconds = 3 [(buf.validate.field).int32.gte = 0];
  int32 max_open_commitments = 4 [(buf.validate.field).int32.gte = 0];
  bool require_objective_for_commitment = 5;
}

// CommitmentTemplate maps a commitment kind to objective and wake templates.
message CommitmentTemplate {
  CommitmentKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string objective_title_template = 2;
  string objective_description_template = 3;
  string wake_reason_template = 4;
  repeated string required_join_keys = 5;
}

// InitiativePolicy describes bounded conditions where a teammate can start or
// resume work proactively.
message InitiativePolicy {
  repeated InitiativeTrigger triggers = 1;
  int32 max_initiated_runs_per_day = 2 [(buf.validate.field).int32.gte = 0];
  bool require_human_seed = 3;
}

// InitiativeTrigger binds a proactive trigger to workflow or objective state.
message InitiativeTrigger {
  InitiativeTriggerKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string trigger_ref = 2;
  string filter_expr = 3;
  string workflow_definition_id = 4;
  string objective_template_id = 5;
}

// AutonomyPolicy describes the default authority and specific action rules
// that ToolExecution, Governance, and Approvals can enforce.
message AutonomyPolicy {
  repeated AutonomyRule rules = 1;
  AutonomyAuthority default_authority = 2 [(buf.validate.field).enum.defined_only = true];
  common.v1.RiskLevel max_risk_without_approval = 3 [(buf.validate.field).enum.defined_only = true];
}

// AutonomyRule constrains a class of actions or tool capabilities.
message AutonomyRule {
  string action_type = 1;
  string tool_capability = 2;
  common.v1.RiskLevel max_risk = 3 [(buf.validate.field).enum.defined_only = true];
  AutonomyAuthority authority = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string approval_policy_ref = 5;
  string governance_policy_ref = 6;
  string rationale = 7;
}

// MemoryPolicy describes what a teammate may recall or propose remembering.
message MemoryPolicy {
  repeated string allowed_scope_refs = 1;
  bool allow_user_memory = 2;
  bool allow_team_memory = 3;
  bool allow_agent_memory = 4;
  bool require_review_for_new_memory = 5;
  int32 default_retention_days = 6 [(buf.validate.field).int32.gte = 0];
  repeated string required_source_types = 7;
  bool allow_cross_channel_recall = 8;
}

// PresencePolicy describes how a teammate reports work back to Slack or other
// delivery channels.
message PresencePolicy {
  common.v1.DeliveryChannel primary_channel = 1 [(buf.validate.field).enum.defined_only = true];
  string primary_channel_id = 2;
  string default_thread_policy = 3;
  int32 progress_update_interval_seconds = 4 [(buf.validate.field).int32.gte = 0];
  repeated PresenceEvent visible_events = 5 [(buf.validate.field).repeated.items.enum = {
    defined_only: true
    not_in: [0]
  }];
  bool post_action_receipts = 6;
  bool post_blocker_updates = 7;
}

// OutputPolicy describes durable work products and channel-safe renderings.
message OutputPolicy {
  repeated string required_artifact_kinds = 1;
  repeated string optional_artifact_kinds = 2;
  bool render_channel_cards = 3;
  string default_visibility = 4;
}

// EvalPolicy binds production behavior to loop and eval scoring.
message EvalPolicy {
  repeated EvalBinding bindings = 1;
  string loop_definition_id = 2;
  int32 production_sample_rate_basis_points = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 10000
  }];
}

// EvalBinding describes one score that should gate or monitor teammate quality.
message EvalBinding {
  string suite_name = 1;
  string metric_name = 2;
  double minimum_score = 3;
  string failure_action = 4;
}

// EscalationPolicy describes who must be contacted when the teammate blocks or
// needs approval.
message EscalationPolicy {
  repeated string approver_user_ids = 1;
  repeated string approver_team_ids = 2;
  int32 escalate_after_seconds = 3 [(buf.validate.field).int32.gte = 0];
  common.v1.DeliveryChannel fallback_channel = 4 [(buf.validate.field).enum.defined_only = true];
}

// DelegationRecord tracks a typed hand-off between agents. The from_agent_id
// creates an objective (objectives/v1) or references a workflow step
// (workflows/v1 StepRun) and delegates execution to another agent resolved
// by ID or by capability through the registry.
message DelegationRecord {
  string id = 1;
  string workspace_id = 2;
  string from_agent_id = 3;
  string to_agent_id = 4;
  string required_capability = 5;

  // objective_id links to the objectives/v1 Objective created for this
  // delegated unit of work.
  string objective_id = 6;

  // workflow_run_id and workflow_step_id link to workflows/v1 when this
  // delegation occurs within a workflow execution.
  string workflow_run_id = 7;
  string workflow_step_id = 8;

  DelegationStatus status = 9;
  bytes context_payload = 10;
  bytes result_payload = 11;
  string reason = 12;
  string error_message = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp resolved_at = 15;
  string a2a_task_id = 16;
  string a2a_message_id = 17;
  string a2a_endpoint_url = 18;
  string a2a_dispatch_status = 19;
  string a2a_dispatch_error = 20;
  string a2a_skill_id = 21;

  // a2a_dispatched_at is the server time when the remote A2A task was first
  // accepted by the target transport.
  google.protobuf.Timestamp a2a_dispatched_at = 22;

  // a2a_lease_renewed_at is the last server time Platform observed remote A2A
  // progress for this delegation.
  google.protobuf.Timestamp a2a_lease_renewed_at = 23;

  // a2a_resume_wait_contracts are server-derived contracts that an origin
  // runtime can use to park the parent run on typed remote A2A callback events
  // after the target transport accepts the delegation.
  repeated google.protobuf.Struct a2a_resume_wait_contracts = 24;

  // a2a_root_delegation_id identifies the root Platform delegation in an A2A
  // swarm chain. Root delegations use their own delegation id.
  string a2a_root_delegation_id = 25;

  // a2a_parent_delegation_id identifies the immediate parent Platform
  // delegation when this record was spawned by another remote A2A worker.
  string a2a_parent_delegation_id = 26;

  // a2a_delegation_chain is the ordered Platform delegation lineage from root
  // to this delegation.
  repeated string a2a_delegation_chain = 27;
}

// ---------------------------------------------------------------------------
// RPC request/response messages
// ---------------------------------------------------------------------------

message RegisterRequest {
  string workspace_id = 1;
  string name = 2;
  string description = 3;
  string agent_type = 4;
  repeated string capabilities = 5 [(buf.validate.field).repeated.min_items = 1];
  repeated string surfaces = 6;
  string owner_id = 7;
  string id = 8;
  repeated common.v1.Surface surface_types = 9 [(buf.validate.field).repeated.items.enum = {
    defined_only: true
    not_in: [0]
  }];
  AgentA2APeerProjection a2a = 10;
}

message RegisterResponse {
  Agent agent = 1;
}

message GetRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetResponse {
  Agent agent = 1;
}

message ListRequest {
  string workspace_id = 1;
  string agent_type = 2;
  string capability = 3;
  string surface = 4;
  AgentStatus status = 5;
  int32 limit = 6 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  int32 offset = 7 [(buf.validate.field).int32.gte = 0];
  common.v1.Surface surface_type = 8 [(buf.validate.field).enum.defined_only = true];
  // A2A skill ID required for fleet-scale delegation discovery.
  string a2a_skill_id = 9;
  // Task class that must be allowed by the matched peer or skill policy.
  string task_class = 10;
  // Require peers to expose a dispatchable A2A HTTP+JSON endpoint.
  bool require_a2a_dispatch = 11;
  // Use delegation-eligible discovery semantics even when only generic filters are supplied.
  bool eligible_for_delegation = 12;
}

message ListResponse {
  repeated Agent agents = 1;
  int32 total = 2;
  AgentDiscoveryEvidence discovery_evidence = 3;
}

// AgentDiscoveryEvidence is the safe, operator-auditable explanation for an
// A2A/delegation discovery query. It intentionally carries identifiers,
// counts, and policy labels, not task payloads or customer content.
message AgentDiscoveryEvidence {
  string schema = 1;
  string decision = 2;
  string reason = 3;
  string workspace_id = 4;
  string capability = 5;
  repeated string capabilities = 6;
  string agent_type = 7;
  string a2a_skill_id = 8;
  string task_class = 9;
  bool require_a2a_dispatch = 10;
  string surface = 11;
  string status = 12;
  int32 candidate_count = 13;
  int32 matched_count = 14;
  repeated AgentDiscoveryExclusion exclusions = 15;
}

// AgentDiscoveryExclusion summarizes why candidates did not appear in the
// discovery result. Samples are agent ids only, capped by the server.
message AgentDiscoveryExclusion {
  string reason = 1;
  int32 count = 2;
  repeated string sample_agent_ids = 3;
  repeated string policy_reasons = 4;
  repeated string policy_scopes = 5;
  repeated string allowed_task_classes = 6;
  repeated string denied_task_classes = 7;
}

message UpdateRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2;
  string description = 3;
  repeated string capabilities = 4;
  repeated string surfaces = 5;
  repeated common.v1.Surface surface_types = 6 [(buf.validate.field).repeated.items.enum = {
    defined_only: true
    not_in: [0]
  }];
  AgentA2APeerProjection a2a = 7;
}

message UpdateResponse {
  Agent agent = 1;
}

message DeregisterRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string reason = 2;
}

message DeregisterResponse {}

message PushConfigRequest {
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
  repeated string skill_ids = 2;
  map<string, string> prompt_bindings = 3;
  map<string, string> model_preferences = 4;
  repeated string integration_ids = 5;
  repeated string entity_type_scopes = 6;
  int32 max_concurrent_objectives = 7;
  double cost_budget_usd = 8;
  string notification_channel = 9;
  google.protobuf.Struct parameters = 10;
  string author = 11;
  repeated common.v1.EntityType entity_type_scope_enums = 12;
  common.v1.DeliveryChannel notification_channel_enum = 13;
  DigitalTeammateProfile teammate_profile = 14;
}

message PushConfigResponse {
  AgentConfig config = 1;
  Agent agent = 2;
}

message GetConfigRequest {
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
  int32 version = 2 [(buf.validate.field).int32.gt = 0];
}

message GetConfigResponse {
  AgentConfig config = 1;
}

message ListConfigsRequest {
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
  int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  int32 offset = 3 [(buf.validate.field).int32.gte = 0];
}

message ListConfigsResponse {
  repeated AgentConfig configs = 1;
  int32 total = 2;
  bool has_more = 3;
}

message RollbackConfigRequest {
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
  int32 target_version = 2 [(buf.validate.field).int32.gt = 0];
  string actor = 3;
  string reason = 4;
}

message RollbackConfigResponse {
  AgentConfig config = 1;
  Agent agent = 2;
}

message DelegateRequest {
  string from_agent_id = 1 [(buf.validate.field).string.min_len = 1];
  // Specify to_agent_id for direct delegation, or required_capability for
  // capability-based routing through the registry.
  string to_agent_id = 2;
  string required_capability = 3;
  string objective_id = 4;
  string workflow_run_id = 5;
  string workflow_step_id = 6;
  bytes context_payload = 7;
  string reason = 8;
  string a2a_skill_id = 9;
}

message DelegateResponse {
  DelegationRecord delegation = 1;
}

message ResolveDelegationRequest {
  string delegation_id = 1 [(buf.validate.field).string.min_len = 1];
  DelegationStatus status = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  bytes result_payload = 3;
  string error_message = 4;
}

message ResolveDelegationResponse {
  DelegationRecord delegation = 1;
}

message RenewDelegationLeaseRequest {
  string delegation_id = 1 [(buf.validate.field).string.min_len = 1];
}

message RenewDelegationLeaseResponse {
  DelegationRecord delegation = 1;
}

message ControlA2ADelegationTaskRequest {
  string delegation_id = 1 [(buf.validate.field).string.min_len = 1];
  A2ADelegationTaskControlMode mode = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string message = 3;
  string idempotency_key = 4;

  // Optional target selectors allow Platform callers to control a remote
  // subagent lane or child run while still fencing the command by the root
  // remote task id stored on the delegation.
  string target_run_id = 5;
  string child_run_id = 6;
  string subagent_lane_id = 7;
  string work_item_id = 8;
  google.protobuf.Struct payload = 9;
  google.protobuf.Struct metadata = 10;
}

message A2ADelegationTaskControlResult {
  string task_id = 1;
  string state = 2;
  string control_id = 3;
  string control_mode = 4;
  bool cancelled = 5;
  bool queued_for_worker = 6;
  string parent_task_id = 7;
  string target_run_id = 8;
  string applied_run_id = 9;
  bool target_external = 10;
  string subagent_lane_id = 11;
  string work_item_id = 12;
  google.protobuf.Timestamp observed_at = 13;
  bool raw_payload_withheld = 14;
}

message ControlA2ADelegationTaskResponse {
  DelegationRecord delegation = 1;
  A2ADelegationTaskControlResult remote_task = 2;
}

message GetDelegationRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetDelegationResponse {
  DelegationRecord delegation = 1;
}

message ListDelegationsRequest {
  string workspace_id = 1;
  string from_agent_id = 2;
  string to_agent_id = 3;
  DelegationStatus status = 4;
  string workflow_run_id = 5;
  int32 limit = 6;
  int32 offset = 7;
  // A2A remote task id returned by the target peer.
  string a2a_task_id = 8;
  // A2A message id used for dispatch/callback correlation.
  string a2a_message_id = 9;
  // A2A skill id requested for the delegation.
  string a2a_skill_id = 10;
  // A2A transport dispatch status recorded by Platform.
  string a2a_dispatch_status = 11;
  // Root Platform delegation id for a remote A2A swarm chain.
  string a2a_root_delegation_id = 12;
  // Immediate parent Platform delegation id for a remote A2A swarm chain.
  string a2a_parent_delegation_id = 13;
  // Limit results to delegations that have A2A transport or swarm lineage.
  bool a2a_only = 14;
}

message ListDelegationsResponse {
  repeated DelegationRecord delegations = 1;
  int32 total = 2;
}

message GetA2ADelegationGraphRequest {
  string workspace_id = 1;
  // Root Platform delegation id for the swarm graph.
  string root_delegation_id = 2;
  // Any Platform delegation id in the swarm graph. If provided without
  // root_delegation_id, the server derives the root from recorded lineage.
  string delegation_id = 3;
  // Maximum child depth to return from the root. Zero means no depth limit.
  int32 max_depth = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  // Maximum graph nodes to return. Zero uses the server default.
  int32 limit = 5 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
}

message A2ADelegationGraphNode {
  DelegationRecord delegation = 1;
  int32 depth = 2;
  int32 child_count = 3;
  bool terminal = 4;
}

message A2ADelegationGraphEdge {
  string parent_delegation_id = 1;
  string child_delegation_id = 2;
}

message GetA2ADelegationGraphResponse {
  string root_delegation_id = 1;
  repeated A2ADelegationGraphNode nodes = 2;
  repeated A2ADelegationGraphEdge edges = 3;
  int32 total = 4;
  bool truncated = 5;
  repeated string missing_parent_delegation_ids = 6;
}

message HeartbeatRequest {
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
  AgentStatus status = 2;
  // current_objective_ids lists the objectives/v1 Objective.id values this
  // agent currently holds. Used for capacity-aware delegation routing.
  repeated string current_objective_ids = 3;
  string surface = 4;
  common.v1.Surface surface_type = 5 [(buf.validate.field).enum.defined_only = true];
  AgentA2APeerProjection a2a = 6;
}

message HeartbeatResponse {
  google.protobuf.Timestamp next_heartbeat_by = 1;
}
