syntax = "proto3";

package codex.v1;

option go_package = "github.com/evalops/platform/gen/go/codex/v1;codexv1";

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// CodexActionType describes the user intent that should shape prompting,
// permissions, routing, and output expectations for a Codex run.
enum CodexActionType {
  CODEX_ACTION_TYPE_UNSPECIFIED = 0;
  CODEX_ACTION_TYPE_START_WORK = 1;
  CODEX_ACTION_TYPE_FOLLOW_UP = 2;
  CODEX_ACTION_TYPE_INVESTIGATE = 3;
  CODEX_ACTION_TYPE_FIX = 4;
  CODEX_ACTION_TYPE_REVIEW = 5;
  CODEX_ACTION_TYPE_TEST = 6;
  CODEX_ACTION_TYPE_EXPLAIN = 7;
  CODEX_ACTION_TYPE_RETRY = 8;
  CODEX_ACTION_TYPE_FORK = 9;
}

// CodexBackend identifies the execution backend selected for a run.
enum CodexBackend {
  CODEX_BACKEND_UNSPECIFIED = 0;
  CODEX_BACKEND_APP_SERVER = 1;
  CODEX_BACKEND_CODEX_SDK = 2;
  CODEX_BACKEND_CLAUDE_CODE = 3;
  CODEX_BACKEND_INTERNAL_AGENT = 4;
  CODEX_BACKEND_MODEL_TRIAGE = 5;
}

// CodexExecutionIntent captures the expected risk and write profile.
enum CodexExecutionIntent {
  CODEX_EXECUTION_INTENT_UNSPECIFIED = 0;
  CODEX_EXECUTION_INTENT_READ_ONLY_DIAGNOSIS = 1;
  CODEX_EXECUTION_INTENT_PATCH_AND_VERIFY = 2;
  CODEX_EXECUTION_INTENT_REVIEW_ONLY = 3;
  CODEX_EXECUTION_INTENT_TEST_AUTHORING = 4;
  CODEX_EXECUTION_INTENT_EXPLANATION = 5;
}

// CodexInteractivityMode controls how much of the run is projected back to a
// human conversation surface.
enum CodexInteractivityMode {
  CODEX_INTERACTIVITY_MODE_UNSPECIFIED = 0;
  CODEX_INTERACTIVITY_MODE_BACKGROUND = 1;
  CODEX_INTERACTIVITY_MODE_THREAD_CONVERSATION = 2;
  CODEX_INTERACTIVITY_MODE_HUMAN_APPROVAL_GATED = 3;
}

// CodexAuthorityScope is the maximum local filesystem authority requested for
// delegated work. Platform policy, device mappings, and native confirmation
// may only narrow this value.
enum CodexAuthorityScope {
  CODEX_AUTHORITY_SCOPE_UNSPECIFIED = 0;
  CODEX_AUTHORITY_SCOPE_DISCUSS_ONLY = 1;
  CODEX_AUTHORITY_SCOPE_READ_ONLY = 2;
  CODEX_AUTHORITY_SCOPE_WORKSPACE_WRITE = 3;
}

// CodexVerificationStatus records whether the bounded result was verified.
enum CodexVerificationStatus {
  CODEX_VERIFICATION_STATUS_UNSPECIFIED = 0;
  CODEX_VERIFICATION_STATUS_NOT_RUN = 1;
  CODEX_VERIFICATION_STATUS_PASSED = 2;
  CODEX_VERIFICATION_STATUS_FAILED = 3;
  CODEX_VERIFICATION_STATUS_PARTIAL = 4;
}

// CodexGitState records the repository state without embedding branch prose.
enum CodexGitState {
  CODEX_GIT_STATE_UNSPECIFIED = 0;
  CODEX_GIT_STATE_UNCHANGED = 1;
  CODEX_GIT_STATE_DIRTY = 2;
  CODEX_GIT_STATE_COMMITTED = 3;
}

// CodexInteractionType describes a channel-native control action.
enum CodexInteractionType {
  CODEX_INTERACTION_TYPE_UNSPECIFIED = 0;
  CODEX_INTERACTION_TYPE_APPROVE_PLAN = 1;
  CODEX_INTERACTION_TYPE_REJECT_PLAN = 2;
  CODEX_INTERACTION_TYPE_APPLY_PATCH = 3;
  CODEX_INTERACTION_TYPE_DISCARD_PATCH = 4;
  CODEX_INTERACTION_TYPE_STOP_TURN = 5;
  CODEX_INTERACTION_TYPE_RETRY_TURN = 6;
  CODEX_INTERACTION_TYPE_FORK_THREAD = 7;
  CODEX_INTERACTION_TYPE_APPROVE_COMMAND = 8;
  CODEX_INTERACTION_TYPE_PROVIDE_INPUT = 9;
}

// CodexContextSourceKind names a structured context source enriched before a
// run reaches the worker.
enum CodexContextSourceKind {
  CODEX_CONTEXT_SOURCE_KIND_UNSPECIFIED = 0;
  CODEX_CONTEXT_SOURCE_KIND_SLACK_MESSAGE = 1;
  CODEX_CONTEXT_SOURCE_KIND_SLACK_THREAD = 2;
  CODEX_CONTEXT_SOURCE_KIND_GITHUB_PULL_REQUEST = 3;
  CODEX_CONTEXT_SOURCE_KIND_GITHUB_ISSUE = 4;
  CODEX_CONTEXT_SOURCE_KIND_LINEAR_TICKET = 5;
  CODEX_CONTEXT_SOURCE_KIND_JIRA_TICKET = 6;
  CODEX_CONTEXT_SOURCE_KIND_SENTRY_EVENT = 7;
  CODEX_CONTEXT_SOURCE_KIND_DATADOG_DASHBOARD = 8;
  CODEX_CONTEXT_SOURCE_KIND_LOG_SNIPPET = 9;
  CODEX_CONTEXT_SOURCE_KIND_SCREENSHOT = 10;
  CODEX_CONTEXT_SOURCE_KIND_MEMORY = 11;
  CODEX_CONTEXT_SOURCE_KIND_URL = 12;
  CODEX_CONTEXT_SOURCE_KIND_CEREBRO_THING = 13;
  CODEX_CONTEXT_SOURCE_KIND_CEREBRO_FACT = 14;
  CODEX_CONTEXT_SOURCE_KIND_CEREBRO_EVENT = 15;
  CODEX_CONTEXT_SOURCE_KIND_CEREBRO_ACTION = 16;
  CODEX_CONTEXT_SOURCE_KIND_CEREBRO_PREDICTION = 17;
  CODEX_CONTEXT_SOURCE_KIND_GRANOLA_MEETING = 18;
  CODEX_CONTEXT_SOURCE_KIND_GOOGLE_EMAIL_THREAD = 19;
  CODEX_CONTEXT_SOURCE_KIND_GOOGLE_DRIVE_FILE = 20;
  CODEX_CONTEXT_SOURCE_KIND_GOOGLE_CALENDAR_EVENT = 21;
  CODEX_CONTEXT_SOURCE_KIND_DEPLOYMENT = 22;
  CODEX_CONTEXT_SOURCE_KIND_BUILD = 23;
}

// CodexMemoryScopeKind identifies the retrieval scope for prior run memory.
enum CodexMemoryScopeKind {
  CODEX_MEMORY_SCOPE_KIND_UNSPECIFIED = 0;
  CODEX_MEMORY_SCOPE_KIND_THREAD = 1;
  CODEX_MEMORY_SCOPE_KIND_REPOSITORY = 2;
  CODEX_MEMORY_SCOPE_KIND_TEAM = 3;
  CODEX_MEMORY_SCOPE_KIND_WORKSPACE = 4;
}

// CodexOutputKind classifies an artifact or external object the run should
// create or synchronize.
enum CodexOutputKind {
  CODEX_OUTPUT_KIND_UNSPECIFIED = 0;
  CODEX_OUTPUT_KIND_THREAD_MESSAGE = 1;
  CODEX_OUTPUT_KIND_PULL_REQUEST = 2;
  CODEX_OUTPUT_KIND_PULL_REQUEST_COMMENT = 3;
  CODEX_OUTPUT_KIND_ARTIFACT = 4;
  CODEX_OUTPUT_KIND_RUN_PANEL = 5;
  CODEX_OUTPUT_KIND_EVALUATION_EXAMPLE = 6;
  CODEX_OUTPUT_KIND_DRAFT_MESSAGE = 7;
  CODEX_OUTPUT_KIND_DECISION_BRIEF = 8;
  CODEX_OUTPUT_KIND_PREPARED_FUTURE = 9;
  CODEX_OUTPUT_KIND_ISSUE = 10;
}

// CodexProgressStage classifies user-visible run progress.
enum CodexProgressStage {
  CODEX_PROGRESS_STAGE_UNSPECIFIED = 0;
  CODEX_PROGRESS_STAGE_ACCEPTED = 1;
  CODEX_PROGRESS_STAGE_CONTEXT_ENRICHING = 2;
  CODEX_PROGRESS_STAGE_PLANNING = 3;
  CODEX_PROGRESS_STAGE_WAITING_FOR_APPROVAL = 4;
  CODEX_PROGRESS_STAGE_EDITING = 5;
  CODEX_PROGRESS_STAGE_TESTING = 6;
  CODEX_PROGRESS_STAGE_CREATING_OUTPUT = 7;
  CODEX_PROGRESS_STAGE_WATCHING_CI = 8;
  CODEX_PROGRESS_STAGE_COMPLETED = 9;
  CODEX_PROGRESS_STAGE_FAILED = 10;
  CODEX_PROGRESS_STAGE_CANCELLED = 11;
}

// CodexConversationRef carries durable session coordinates across turns.
message CodexConversationRef {
  string session_id = 1;
  string app_server_thread_id = 2;
  string previous_run_id = 3;
  string parent_run_id = 4;
  string followup_to_turn_id = 5;
  string channel_thread_id = 6;
  string channel_message_id = 7;
  bool keep_session_alive = 8;
  map<string, string> attributes = 9;
}

// CodexRoutingPolicy captures backend and worker selection.
message CodexRoutingPolicy {
  CodexBackend backend = 1;
  string worker_queue = 2;
  string model_tier = 3;
  string preferred_agent_id = 4;
  map<string, string> attributes = 5;
}

// CodexBudgetPolicy defines per-run resource limits.
message CodexBudgetPolicy {
  int64 max_input_tokens = 1 [(buf.validate.field).int64.gte = 0];
  int64 max_output_tokens = 2 [(buf.validate.field).int64.gte = 0];
  int64 max_total_tokens = 3 [(buf.validate.field).int64.gte = 0];
  int64 max_cost_micros = 4 [(buf.validate.field).int64.gte = 0];
  int32 max_run_seconds = 5 [(buf.validate.field).int32.gte = 0];
  int32 max_tool_calls = 6 [(buf.validate.field).int32.gte = 0];
  int32 max_retries = 7 [(buf.validate.field).int32.gte = 0];
}

// CodexApprovalPolicy captures governance controls before a worker performs
// write, network, or otherwise sensitive operations.
message CodexApprovalPolicy {
  bool dry_run = 1;
  bool allow_writes = 2;
  bool require_plan_approval = 3;
  bool require_patch_approval = 4;
  bool require_command_approval = 5;
  repeated string protected_path_globs = 6;
  repeated string approver_entity_ids = 7;
  repeated string network_egress_allowlist = 8;
  bool scrub_secrets_from_outputs = 9;
  string sandbox_mode = 10;
  map<string, string> attributes = 11;
}

// CodexContextItem is a single enriched context object available to the run.
message CodexContextItem {
  CodexContextSourceKind source_kind = 1;
  string id = 2;
  string uri = 3;
  string title = 4;
  string text = 5;
  string content_type = 6;
  string digest = 7;
  map<string, string> attributes = 8;
}

// CodexMemoryScope describes what prior run knowledge should be retrieved.
message CodexMemoryScope {
  CodexMemoryScopeKind kind = 1;
  string key = 2;
  int32 retention_days = 3 [(buf.validate.field).int32.gte = 0];
  map<string, string> attributes = 4;
}

// CodexOutputTarget describes a desired or produced external output.
message CodexOutputTarget {
  CodexOutputKind kind = 1;
  string id = 2;
  string uri = 3;
  string title = 4;
  bool draft = 5;
  map<string, string> attributes = 6;
}

// CodexPreparedFutureRef ties a Codex run to the reviewable next move it is
// preparing. It is a grouping contract, not an approval or execution grant.
message CodexPreparedFutureRef {
  string prepared_future_id = 1;
  string cerebro_action_id = 2;
  string cerebro_prediction_id = 3;
  repeated string cerebro_fact_ids = 4;
  repeated string source_record_ids = 5;
  repeated string artifact_ids = 6;
  repeated string approval_request_ids = 7;
  string evidence_uri = 8;
  string source_health = 9;
  string risk_level = 10;
  map<string, string> attributes = 11;
}

// CodexWorkRequest is the typed payload for Slack, GitHub, Linear, CLI, IDE,
// and monitoring-triggered Codex work.
message CodexWorkRequest {
  option (buf.validate.message).cel = {
    id: "codex.v1.work_request.resource_id_not_local_absolute"
    message: "resource_id must not be an absolute local path"
    expression: "this.resource_id == '' || (!this.resource_id.startsWith('/') && !this.resource_id.startsWith('\\\\') && !this.resource_id.matches('^[A-Za-z]:[/\\\\\\\\].*') && !this.resource_id.matches('^[A-Za-z][A-Za-z0-9+.-]*:[A-Za-z]:.*'))"
  };

  CodexActionType action_type = 1;
  CodexExecutionIntent execution_intent = 2;
  string prompt = 3;
  string repo = 4;
  string cwd = 5;
  string branch = 6;
  string base_branch = 7;
  string tenant_id = 8;
  string reason = 9;
  CodexConversationRef conversation = 10;
  CodexRoutingPolicy routing = 11;
  CodexBudgetPolicy budget = 12;
  CodexApprovalPolicy approval_policy = 13;
  CodexInteractivityMode interactivity_mode = 14;
  repeated CodexContextItem context_items = 15;
  repeated CodexOutputTarget desired_outputs = 16;
  repeated CodexMemoryScope memory_scopes = 17;
  map<string, string> attributes = 18;
  CodexPreparedFutureRef prepared_future = 19;
  // Stable Platform resource identity. Local absolute paths are forbidden,
  // including drive-root forms after local schemes (e.g. file:C:/Windows).
  string resource_id = 20 [(buf.validate.field).string = {
    max_len: 512
    pattern: "^$|^[^/\\\\:][^\\\\:]*$|^[A-Za-z][A-Za-z0-9+.-]+:([^A-Za-z/\\\\][^\\\\]*|[A-Za-z]([^:\\\\][^\\\\]*)?)$"
  }];
  CodexAuthorityScope requested_authority = 21 [(buf.validate.field).enum.defined_only = true];
}

// CodexWorkResult is the bounded, channel-safe completion projection for a
// delegated Codex run. changed_files are relative to resource_id's mapped root.
message CodexWorkResult {
  option (buf.validate.message).cel = {
    id: "codex.v1.work_result.changed_files_workspace_relative"
    message: "changed_files entries must be normalized workspace-relative paths"
    expression: "this.changed_files.all(path, path != '' && !path.startsWith('/') && !path.contains('\\\\') && !path.matches('^[A-Za-z]:.*') && !path.matches('(^|/)\\\\.{1,2}(/|$)') && !path.contains('//') && !path.endsWith('/'))"
  };

  string outcome = 1 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
  string summary = 2 [(buf.validate.field).string = {min_len: 1, max_len: 8192}];
  repeated string findings = 3 [
    (buf.validate.field).repeated.max_items = 64,
    (buf.validate.field).repeated.items.string.max_len = 1024
  ];
  repeated string changed_files = 4 [
    (buf.validate.field).repeated.max_items = 256,
    (buf.validate.field).repeated.items.string = {
      max_len: 1024
      pattern: "^([^./\\\\:][^/\\\\:]*|\\.[^./\\\\:][^/\\\\:]*|\\.\\.[^/\\\\:][^/\\\\:]*)(/([^./\\\\:][^/\\\\:]*|\\.[^./\\\\:][^/\\\\:]*|\\.\\.[^/\\\\:][^/\\\\:]*))*$"
    }
  ];
  repeated string tests_run = 5 [
    (buf.validate.field).repeated.max_items = 128,
    (buf.validate.field).repeated.items.string.max_len = 2048
  ];
  CodexVerificationStatus verification_status = 6 [(buf.validate.field).enum.defined_only = true];
  repeated string evidence_refs = 7 [
    (buf.validate.field).repeated.max_items = 128,
    (buf.validate.field).repeated.items.string.max_len = 2048
  ];
  string owner_input_required = 8 [(buf.validate.field).string.max_len = 2048];
  string codex_thread_id = 9 [(buf.validate.field).string.max_len = 256];
  CodexGitState git_state = 10 [(buf.validate.field).enum.defined_only = true];
}

// CodexInteractionRequest describes a pending human decision projected to a
// channel surface.
message CodexInteractionRequest {
  CodexInteractionType interaction_type = 1;
  string run_id = 2;
  string wait_id = 3;
  string step_id = 4;
  string artifact_id = 5;
  string patch_id = 6;
  string prompt = 7;
  repeated string choices = 8;
  google.protobuf.Struct payload = 9;
  google.protobuf.Timestamp expires_at = 10;
  map<string, string> attributes = 11;
}

// CodexInteractionDecision captures the user's response to a Codex control.
message CodexInteractionDecision {
  CodexInteractionType interaction_type = 1;
  string decision = 2;
  string reason = 3;
  string actor_entity_id = 4;
  string selected_choice = 5;
  google.protobuf.Struct payload = 6;
  map<string, string> attributes = 7;
}

// CodexRunProgress is the compact, user-visible progress projection.
message CodexRunProgress {
  CodexProgressStage stage = 1;
  string safe_summary = 2;
  int32 progress_percent = 3 [(buf.validate.field).int32 = { gte: 0, lte: 100 }];
  int32 files_read = 4 [(buf.validate.field).int32.gte = 0];
  int32 files_changed = 5 [(buf.validate.field).int32.gte = 0];
  int32 commands_run = 6 [(buf.validate.field).int32.gte = 0];
  int64 input_tokens = 7 [(buf.validate.field).int64.gte = 0];
  int64 output_tokens = 8 [(buf.validate.field).int64.gte = 0];
  int64 estimated_cost_micros = 9 [(buf.validate.field).int64.gte = 0];
  google.protobuf.Timestamp updated_at = 10;
  map<string, string> attributes = 11;
}

// CodexOutcomeSignal feeds evaluation and routing loops after the run.
message CodexOutcomeSignal {
  string run_id = 1;
  string pull_request_url = 2;
  bool merged = 3;
  bool reverted = 4;
  bool human_edited = 5;
  string channel_reaction = 6;
  string review_outcome = 7;
  google.protobuf.Timestamp observed_at = 8;
  map<string, string> attributes = 9;
}
