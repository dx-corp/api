syntax = "proto3";

package vfs.v1;

import "buf/validate/validate.proto";
import "common/v1/authz.proto";
import "google/protobuf/timestamp.proto";
import "platform/v1/platform.proto";

option go_package = "github.com/evalops/platform/gen/go/vfs/v1;vfsv1";

// VirtualFilesystemService is the durable file plane for agents,
// integrations, tool execution, memory evidence, and channel handoffs.
service VirtualFilesystemService {
  // PutObject writes bytes directly to a workspace path and creates the first
  // immutable version or appends a new version to an existing path.
  rpc PutObject(PutObjectRequest) returns (PutObjectResponse) {
    option (common.v1.required_scopes) = "vfs:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // GetObject returns metadata and an optional ranged byte slice for one
  // object, selected by object ID or path.
  rpc GetObject(GetObjectRequest) returns (GetObjectResponse) {
    option (common.v1.required_scopes) = "vfs:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // ListObjects lists path metadata within a workspace and optional prefix.
  rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse) {
    option (common.v1.required_scopes) = "vfs:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // StatObject returns metadata and optional version history without bytes.
  rpc StatObject(StatObjectRequest) returns (StatObjectResponse) {
    option (common.v1.required_scopes) = "vfs:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // DeleteObject tombstones a path while retaining metadata and versions.
  rpc DeleteObject(DeleteObjectRequest) returns (DeleteObjectResponse) {
    option (common.v1.required_scopes) = "vfs:delete";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }

  // CopyObject creates a new path with independent metadata over copied bytes.
  rpc CopyObject(CopyObjectRequest) returns (CopyObjectResponse) {
    option (common.v1.required_scopes) = "vfs:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // LinkObject creates another path entry pointing at the same content hash.
  rpc LinkObject(LinkObjectRequest) returns (LinkObjectResponse) {
    option (common.v1.required_scopes) = "vfs:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // CreateLease reserves a path for a long-running upload.
  rpc CreateLease(CreateLeaseRequest) returns (CreateLeaseResponse) {
    option (common.v1.required_scopes) = "vfs:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // CompleteLease completes a lease and publishes an immutable object version.
  rpc CompleteLease(CompleteLeaseRequest) returns (CompleteLeaseResponse) {
    option (common.v1.required_scopes) = "vfs:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // GrantObject replaces or appends capability grants for one object.
  rpc GrantObject(GrantObjectRequest) returns (GrantObjectResponse) {
    option (common.v1.required_scopes) = "vfs:grant";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }

  // SearchMetadata searches object metadata, tags, paths, and titles without
  // returning file bytes.
  rpc SearchMetadata(SearchMetadataRequest) returns (SearchMetadataResponse) {
    option (common.v1.required_scopes) = "vfs:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
}

enum VfsObjectState {
  VFS_OBJECT_STATE_UNSPECIFIED = 0;
  VFS_OBJECT_STATE_ACTIVE = 1;
  VFS_OBJECT_STATE_TOMBSTONED = 2;
}

enum VfsRedactionState {
  VFS_REDACTION_STATE_UNSPECIFIED = 0;
  VFS_REDACTION_STATE_RAW = 1;
  VFS_REDACTION_STATE_REDACTED = 2;
  VFS_REDACTION_STATE_PREVIEW_ONLY = 3;
  VFS_REDACTION_STATE_DENIED = 4;
}

enum VfsLeaseState {
  VFS_LEASE_STATE_UNSPECIFIED = 0;
  VFS_LEASE_STATE_OPEN = 1;
  VFS_LEASE_STATE_COMMITTED = 2;
  VFS_LEASE_STATE_EXPIRED = 3;
  VFS_LEASE_STATE_CANCELLED = 4;
}

message VfsObject {
  string id = 1;
  string workspace_id = 2 [(buf.validate.field).string.min_len = 1];
  string path = 3 [(buf.validate.field).string.min_len = 1];
  VfsObjectState state = 4 [(buf.validate.field).enum.defined_only = true];
  int32 current_version = 5 [(buf.validate.field).int32.gte = 0];
  string current_version_id = 6;
  string content_type = 7;
  int64 size_bytes = 8 [(buf.validate.field).int64.gte = 0];
  string sha256 = 9;
  string etag = 10;
  string owner_id = 11;
  string creator_id = 12;
  string source_service = 13;
  string run_id = 14;
  string tool_execution_id = 15;
  string connector_id = 16;
  string connection_id = 17;
  string sensitivity = 18;
  string retention_class = 19;
  VfsRedactionState redaction_state = 20 [(buf.validate.field).enum.defined_only = true];
  repeated string tags = 21;
  map<string, string> metadata = 22;
  repeated VfsGrant grants = 23;
  google.protobuf.Timestamp created_at = 24;
  google.protobuf.Timestamp updated_at = 25;
  google.protobuf.Timestamp deleted_at = 26;
  string deleted_by = 27;
  string delete_reason = 28;
  string organization_id = 29 [(buf.validate.field).string.min_len = 1];
  platform.v1.ResourceRef resource_ref = 30;
}

message VfsObjectVersion {
  string id = 1;
  string object_id = 2;
  int32 version = 3 [(buf.validate.field).int32.gte = 0];
  string content_ref = 4;
  string content_type = 5;
  int64 size_bytes = 6 [(buf.validate.field).int64.gte = 0];
  string sha256 = 7;
  string etag = 8;
  string created_by = 9;
  string source_service = 10;
  map<string, string> metadata = 11;
  google.protobuf.Timestamp created_at = 12;
  string organization_id = 13 [(buf.validate.field).string.min_len = 1];
  string workspace_id = 14 [(buf.validate.field).string.min_len = 1];
  platform.v1.ResourceRef resource_ref = 15;
}

message VfsGrant {
  string principal = 1 [(buf.validate.field).string.min_len = 1];
  repeated string permissions = 2;
  string path_prefix = 3;
  string sensitivity = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp granted_at = 6;
  string granted_by = 7;
}

message VfsLease {
  string id = 1;
  string workspace_id = 2 [(buf.validate.field).string.min_len = 1];
  string path = 3 [(buf.validate.field).string.min_len = 1];
  string token = 4;
  VfsLeaseState state = 5 [(buf.validate.field).enum.defined_only = true];
  string content_type = 6;
  map<string, string> metadata = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp expires_at = 9;
  string created_by = 10;
  string organization_id = 11 [(buf.validate.field).string.min_len = 1];
  int64 fencing_token = 12 [(buf.validate.field).int64.gte = 1];
}

message VfsEvent {
  string id = 1;
  string type = 2;
  string workspace_id = 3;
  string object_id = 4;
  string path = 5;
  string version_id = 6;
  int32 version = 7 [(buf.validate.field).int32.gte = 0];
  string sha256 = 8;
  int64 size_bytes = 9 [(buf.validate.field).int64.gte = 0];
  string content_type = 10;
  string source_service = 11;
  string run_id = 12;
  string tool_execution_id = 13;
  string connector_id = 14;
  string connection_id = 15;
  string sensitivity = 16;
  string retention_class = 17;
  map<string, string> metadata = 18;
  google.protobuf.Timestamp occurred_at = 19;
  VfsRedactionState redaction_state = 20 [(buf.validate.field).enum.defined_only = true];
  string organization_id = 21 [(buf.validate.field).string.min_len = 1];
}

message PutObjectRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  string path = 2 [(buf.validate.field).string.min_len = 1];
  bytes content = 3;
  string content_type = 4;
  string owner_id = 5;
  string creator_id = 6;
  string source_service = 7;
  string run_id = 8;
  string tool_execution_id = 9;
  string connector_id = 10;
  string connection_id = 11;
  string sensitivity = 12;
  string retention_class = 13;
  VfsRedactionState redaction_state = 14 [(buf.validate.field).enum.defined_only = true];
  repeated string tags = 15;
  map<string, string> metadata = 16;
  string idempotency_key = 17;
  string organization_id = 18 [(buf.validate.field).string.min_len = 1];
  int32 expected_version = 19 [(buf.validate.field).int32.gte = 0];
  string lease_token = 20;
  int64 fencing_token = 21 [(buf.validate.field).int64.gte = 0];
}

message PutObjectResponse {
  VfsObject object = 1;
  VfsObjectVersion version = 2;
  VfsEvent event = 3;
}

message GetObjectRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  string object_id = 2;
  string path = 3;
  string version_id = 4;
  int64 offset = 5 [(buf.validate.field).int64.gte = 0];
  int64 limit = 6 [(buf.validate.field).int64.gte = 0];
  bool include_content = 7;
  string organization_id = 8 [(buf.validate.field).string.min_len = 1];
}

message GetObjectResponse {
  VfsObject object = 1;
  VfsObjectVersion version = 2;
  bytes content = 3;
  int64 offset = 4 [(buf.validate.field).int64.gte = 0];
  int64 next_offset = 5 [(buf.validate.field).int64.gte = 0];
  bool eof = 6;
}

message ListObjectsRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  string path_prefix = 2;
  bool include_tombstones = 3;
  repeated string tags = 4;
  int32 limit = 5 [(buf.validate.field).int32.gte = 0];
  int32 offset = 6 [(buf.validate.field).int32.gte = 0];
  string organization_id = 7 [(buf.validate.field).string.min_len = 1];
}

message ListObjectsResponse {
  repeated VfsObject objects = 1;
  int32 total = 2 [(buf.validate.field).int32.gte = 0];
  bool has_more = 3;
}

message StatObjectRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  string object_id = 2;
  string path = 3;
  bool include_versions = 4;
  string organization_id = 5 [(buf.validate.field).string.min_len = 1];
}

message StatObjectResponse {
  VfsObject object = 1;
  repeated VfsObjectVersion versions = 2;
}

message DeleteObjectRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  string object_id = 2;
  string path = 3;
  string deleted_by = 4;
  string reason = 5;
  string organization_id = 6 [(buf.validate.field).string.min_len = 1];
}

message DeleteObjectResponse {
  VfsObject object = 1;
  VfsEvent event = 2;
}

message CopyObjectRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  string source_object_id = 2;
  string source_path = 3;
  string destination_path = 4 [(buf.validate.field).string.min_len = 1];
  string creator_id = 5;
  string source_service = 6;
  map<string, string> metadata = 7;
  string organization_id = 8 [(buf.validate.field).string.min_len = 1];
}

message CopyObjectResponse {
  VfsObject object = 1;
  VfsObjectVersion version = 2;
  VfsEvent event = 3;
}

message LinkObjectRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  string source_object_id = 2;
  string source_path = 3;
  string link_path = 4 [(buf.validate.field).string.min_len = 1];
  string creator_id = 5;
  map<string, string> metadata = 6;
  string organization_id = 7 [(buf.validate.field).string.min_len = 1];
}

message LinkObjectResponse {
  VfsObject object = 1;
  VfsObjectVersion version = 2;
  VfsEvent event = 3;
}

message CreateLeaseRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  string path = 2 [(buf.validate.field).string.min_len = 1];
  int32 lease_seconds = 3 [(buf.validate.field).int32.gte = 0];
  string content_type = 4;
  string creator_id = 5;
  map<string, string> metadata = 6;
  string organization_id = 7 [(buf.validate.field).string.min_len = 1];
  int64 expected_size_bytes = 8 [(buf.validate.field).int64 = {
    gt: 0
    lte: 52428800
  }];
  string expected_sha256 = 9;
  string idempotency_key = 10 [(buf.validate.field).string.min_len = 1];
}

message CreateLeaseResponse {
  VfsLease lease = 1;
  VfsUploadTarget upload = 2;
}

message VfsUploadTarget {
  string url = 1;
  string method = 2 [(buf.validate.field).string.min_len = 1];
  map<string, string> headers = 3;
  google.protobuf.Timestamp expires_at = 4;
  int64 max_size_bytes = 5 [(buf.validate.field).int64 = {
    gt: 0
    lte: 52428800
  }];
  repeated VfsUploadPartTarget parts = 6;
}

message VfsUploadPartTarget {
  int32 part_number = 1 [(buf.validate.field).int32.gt = 0];
  int64 offset = 2 [(buf.validate.field).int64.gte = 0];
  int64 size_bytes = 3 [(buf.validate.field).int64.gt = 0];
  string url = 4 [(buf.validate.field).string.min_len = 1];
  string method = 5 [(buf.validate.field).string.min_len = 1];
  map<string, string> headers = 6;
  google.protobuf.Timestamp expires_at = 7;
}

message VfsCompletedUploadPart {
  int32 part_number = 1 [(buf.validate.field).int32.gt = 0];
  string etag = 2 [(buf.validate.field).string.min_len = 1];
}

message CompleteLeaseRequest {
  string lease_id = 1 [(buf.validate.field).string.min_len = 1];
  string lease_token = 2 [(buf.validate.field).string.min_len = 1];
  bytes content = 3;
  string created_by = 4;
  map<string, string> metadata = 5;
  string organization_id = 6 [(buf.validate.field).string.min_len = 1];
  string workspace_id = 7 [(buf.validate.field).string.min_len = 1];
  int64 fencing_token = 8 [(buf.validate.field).int64.gte = 1];
  int64 size_bytes = 9 [(buf.validate.field).int64 = {
    gt: 0
    lte: 52428800
  }];
  string sha256 = 10 [(buf.validate.field).string.min_len = 1];
  string storage_etag = 11;
  string idempotency_key = 12 [(buf.validate.field).string.min_len = 1];
}

message CompleteLeaseResponse {
  VfsObject object = 1;
  VfsObjectVersion version = 2;
  VfsEvent event = 3;
}

message GrantObjectRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  string object_id = 2;
  string path = 3;
  VfsGrant grant = 4 [(buf.validate.field).required = true];
  bool append = 5;
  string organization_id = 6 [(buf.validate.field).string.min_len = 1];
}

message GrantObjectResponse {
  VfsObject object = 1;
  VfsEvent event = 2;
}

message SearchMetadataRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  string query = 2;
  string path_prefix = 3;
  repeated string tags = 4;
  map<string, string> metadata = 5;
  bool include_tombstones = 6;
  int32 limit = 7 [(buf.validate.field).int32.gte = 0];
  string organization_id = 8 [(buf.validate.field).string.min_len = 1];
}

message SearchMetadataResponse {
  repeated VfsObject objects = 1;
}
