  DevelopmentCreditProgramPolicy enrollment_policy = 9;
}

// Billing's accepted immutable grant receipt. The authenticated issuer is server-derived.
message DevelopmentCreditGrant {
  string organization_id = 1 [(common.v1.classification) = DATA_CLASSIFICATION_IDENTIFIER];
  string workspace_id = 2 [(common.v1.classification) = DATA_CLASSIFICATION_IDENTIFIER];
  string program_id = 3 [(common.v1.classification) = DATA_CLASSIFICATION_IDENTIFIER];
  string grant_id = 4 [(common.v1.classification) = DATA_CLASSIFICATION_IDENTIFIER];
  int64 credit_micros = 5;
  google.protobuf.Timestamp expires_at = 6;
  string reason = 7 [(common.v1.classification) = DATA_CLASSIFICATION_CONTENT];
  string provenance = 8 [(common.v1.classification) = DATA_CLASSIFICATION_CONTENT];
  string actor_subject = 9 [(common.v1.classification) = DATA_CLASSIFICATION_IDENTIFIER];
  google.protobuf.Timestamp created_at = 10;
  // Server-configured organization-wide daily spend ceiling, including outstanding holds.
  int64 daily_budget_micros = 11 [(buf.validate.field).int64.gt = 0];
  // Server-configured Identity user receiving operational alerts, independent of the grant issuer.
  string alert_recipient_id = 12 [(common.v1.classification) = DATA_CLASSIFICATION_IDENTIFIER];
}
