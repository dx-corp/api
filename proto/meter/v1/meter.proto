// Prepaid credits are USD amounts in integer millionths of a dollar.
// Meter owns funding, reservations, settlement, and the available balance.
message PrepaidCreditBalance {
  // Enrolled development programs cannot consume paid credits or trigger paid refill.
  bool development_credit_only = 12;
  // Non-cash development funding, kept separate from purchased credits.
  int64 granted_micros = 8 [(buf.validate.field).int64.gte = 0];
  int64 expired_grant_micros = 9 [(buf.validate.field).int64.gte = 0];
  int64 grant_spent_micros = 10 [(buf.validate.field).int64.gte = 0];
  int64 grant_reserved_micros = 11 [(buf.validate.field).int64.gte = 0];
  bool admission_suspended = 7;
  int64 reversed_micros = 5 [(buf.validate.field).int64.gte = 0];
  int64 debt_micros = 6 [(buf.validate.field).int64.gte = 0];
  int64 purchased_micros = 1 [(buf.validate.field).int64.gte = 0];
  int64 spent_micros = 2 [(buf.validate.field).int64.gte = 0];
  int64 reserved_micros = 3 [(buf.validate.field).int64.gte = 0];
  int64 available_micros = 4 [(buf.validate.field).int64.gte = 0];
}
message GetPrepaidCreditBalanceRequest {
  string run_id = 2 [
    (buf.validate.field).string.max_len = 256,
    (common.v1.classification) = DATA_CLASSIFICATION_IDENTIFIER
  ];
  string workspace_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (common.v1.classification) = DATA_CLASSIFICATION_IDENTIFIER
  ];
}
message GetPrepaidCreditBalanceResponse {
  PrepaidCreditBalance balance = 1;
  // Absent when no account exists or an older Meter serves this response.
  PrepaidCreditReconciliation reconciliation = 2;
  // Absent for missing attribution or older servers, never an inferred zero.
  PrepaidRunBalance run_balance = 3;
  // Immutable owner enrollment limits; absent for legacy or unenrolled programs.
  DevelopmentCreditProgramPolicy development_program_policy = 4;
  string development_program_id = 5 [(common.v1.classification) = DATA_CLASSIFICATION_IDENTIFIER];
}
message PrepaidRunBalance {
  string run_id = 1;
  int64 settled_cost_micros = 2;
  int64 reserved_micros = 3;
  int64 pending_request_count = 4;
  int64 settled_request_count = 5;
  google.protobuf.Timestamp oldest_pending_at = 6;
}
message PrepaidCreditReconciliation {
  int64 granted_difference_micros = 10;
  int64 invalid_grant_allocation_count = 11 [(buf.validate.field).int64.gte = 0];
  // A comparison of materialized counters with source rows in one snapshot.
  bool balanced = 1;
  int64 purchased_difference_micros = 2;
  int64 reversed_difference_micros = 3;
  int64 spent_difference_micros = 4;
  int64 reserved_difference_micros = 5;
  int64 dispute_count_difference = 6;
  int64 pending_reservation_count = 7 [(buf.validate.field).int64.gte = 0];
  google.protobuf.Timestamp oldest_pending_at = 8;
  int64 unfunded_payment_count = 9 [(buf.validate.field).int64.gte = 0];
}

// Immutable sponsored program limits. Enrollment is accepted atomically with its
// first grant and requires meter:credits:enroll-development in addition to issuance.
message DevelopmentCreditProgramPolicy {
  int64 max_grant_micros = 1 [(buf.validate.field).int64.gt = 0];
  int64 program_budget_micros = 2 [(buf.validate.field).int64.gt = 0];
  int64 daily_budget_micros = 3 [(buf.validate.field).int64.gt = 0];
  int64 max_lifetime_seconds = 4 [(buf.validate.field).int64.gt = 0];
  string alert_recipient_id = 5 [(common.v1.classification) = DATA_CLASSIFICATION_IDENTIFIER];
}

// Grant identities and provenance are immutable across retries. Expiry requires microsecond precision.
message GrantDevelopmentCreditsRequest {
  string organization_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (common.v1.classification) = DATA_CLASSIFICATION_IDENTIFIER
  ];
  string workspace_id = 2 [
    (buf.validate.field).string.min_len = 1,
    (common.v1.classification) = DATA_CLASSIFICATION_IDENTIFIER
  ];
  string program_id = 3 [
    (buf.validate.field).string.min_len = 1,
    (common.v1.classification) = DATA_CLASSIFICATION_IDENTIFIER
  ];
  string grant_id = 4 [
    (buf.validate.field).string.min_len = 1,
    (common.v1.classification) = DATA_CLASSIFICATION_IDENTIFIER
  ];
  int64 credit_micros = 5 [(buf.validate.field).int64.gt = 0];
  google.protobuf.Timestamp expires_at = 6 [(buf.validate.field).required = true];
  string reason = 7 [
    (buf.validate.field).string.min_len = 1,
    (common.v1.classification) = DATA_CLASSIFICATION_CONTENT
  ];
  string provenance = 8 [
    (buf.validate.field).string.min_len = 1,
    (common.v1.classification) = DATA_CLASSIFICATION_CONTENT
  ];
