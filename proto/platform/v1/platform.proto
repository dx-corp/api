syntax = "proto3";

package platform.v1;

import "buf/validate/validate.proto";
import "common/v1/authz.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/evalops/platform/gen/go/platform/v1;platformv1";

// PlatformService is the product-facing primitive API for the Rust platform
// core. It is Protobuf-first; JSON is only a protobuf mapping for tooling and
// debug surfaces, not the source of truth.
service PlatformService {
  // GetBootstrap returns tenant-scoped platform capabilities for the frontend.
  rpc GetBootstrap(GetBootstrapRequest) returns (GetBootstrapResponse) {
    option (common.v1.required_scopes) = "platform:read";
    option (common.v1.workspace_scope_field) = "scope.workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // CreateWork creates a stateful work owner record through an operation record.
  rpc CreateWork(CreateWorkRequest) returns (CreateWorkResponse) {
    option (common.v1.required_scopes) = "platform:write";
    option (common.v1.workspace_scope_field) = "context.scope.workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // ProposeAction records an action intent even when execution is blocked.
  rpc ProposeAction(ProposeActionRequest) returns (ProposeActionResponse) {
    option (common.v1.required_scopes) = "platform:write";
    option (common.v1.workspace_scope_field) = "context.scope.workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }

  // CreateArtifact creates a versioned artifact through an operation record.
  rpc CreateArtifact(CreateArtifactRequest) returns (CreateArtifactResponse) {
    option (common.v1.required_scopes) = "platform:write";
    option (common.v1.workspace_scope_field) = "context.scope.workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // RecordEvidence records audit, trace, usage, attestation, replay, or lineage evidence.
  rpc RecordEvidence(RecordEvidenceRequest) returns (RecordEvidenceResponse) {
    option (common.v1.required_scopes) = "platform:write";
    option (common.v1.workspace_scope_field) = "context.scope.workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // RecordScore records a queryable eval score on the same operation spine.
  rpc RecordScore(RecordScoreRequest) returns (RecordScoreResponse) {
    option (common.v1.required_scopes) = "platform:write";
    option (common.v1.workspace_scope_field) = "context.scope.workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // ApplyRecommendation closes the eval loop by recording a rollout decision.
  rpc ApplyRecommendation(ApplyRecommendationRequest) returns (ApplyRecommendationResponse) {
    option (common.v1.required_scopes) = "platform:write";
    option (common.v1.workspace_scope_field) = "context.scope.workspace_id";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }
}

