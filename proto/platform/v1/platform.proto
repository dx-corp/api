enum ResourceKind {
  RESOURCE_KIND_UNSPECIFIED = 0;
  RESOURCE_KIND_AGENT = 1;
  RESOURCE_KIND_TOOL = 2;
  RESOURCE_KIND_REPO = 3;
  RESOURCE_KIND_DATASET = 4;
  RESOURCE_KIND_DATABASE = 5;
  RESOURCE_KIND_CRM_OBJECT = 6;
  RESOURCE_KIND_MODEL_ROUTE = 7;
  RESOURCE_KIND_EXTERNAL = 8;
  // Durable content identities are transport-safe references. Their tenant
  // authority is supplied by the enclosing request, never encoded here.
  RESOURCE_KIND_VFS_OBJECT = 9;
  RESOURCE_KIND_VFS_OBJECT_VERSION = 10;
  RESOURCE_KIND_ARTIFACT = 11;
  RESOURCE_KIND_ARTIFACT_VERSION = 12;
  RESOURCE_KIND_GENERATED_ASSET = 13;
}

// ResourceRef is the canonical structured pointer for durable Platform
// content. It is intentionally not a URI: callers carry organization and
// workspace authority in the surrounding request, while a resolver owned by
// the resource's service decides whether a reference yields metadata, VFS
// identity, or a short-lived byte-access grant.
message ResourceRef {
  string resource_id = 1 [(buf.validate.field).string.min_len = 1];
  ResourceKind kind = 2 [(buf.validate.field).enum.defined_only = true];
  // Stable immutable version identity, when the reference is version-bound.
  string version_id = 3;
  // Owner-defined monotonic version number. Zero means the latest version
  // when version_id is empty; version_id wins when both are supplied.
  int32 version = 4 [(buf.validate.field).int32.gte = 0];
}

// RecordKind identifies an authoritative operational record without copying
// that record into a read model. The enclosing request supplies exact tenant
// authority; the kind selects the owner resolver for record_id.
enum RecordKind {
  RECORD_KIND_UNSPECIFIED = 0;
  RECORD_KIND_RUN = 1;
  RECORD_KIND_MODEL_RUN = 2;
  RECORD_KIND_TOOL_EXECUTION = 3;
  RECORD_KIND_POLICY_DECISION = 4;
  RECORD_KIND_APPROVAL = 5;
  RECORD_KIND_CREDENTIAL = 6;
  RECORD_KIND_CONNECTOR = 7;
  RECORD_KIND_CONNECTOR_SESSION = 8;
  RECORD_KIND_ARTIFACT = 9;
  RECORD_KIND_USAGE = 10;
  RECORD_KIND_RECEIPT = 11;
  RECORD_KIND_EVIDENCE = 12;
  RECORD_KIND_EVAL_RUN = 13;
}

// RecordRef is the canonical, content-free pointer used by customer read
// models to join independently owned operational records. It is correlation,
// never authority: consumers must resolve it through the owning service under
// the authenticated tenant carried by the enclosing request.
message RecordRef {
  RecordKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string record_id = 2 [(buf.validate.field).string.min_len = 1];
  // Owner-defined immutable revision or digest when the reference is pinned.
  string revision = 3;
}

