syntax = "proto3";

package memory.v1;

import "buf/validate/validate.proto";
import "common/v1/authz.proto";
import "google/protobuf/timestamp.proto";
import "platform/v1/platform.proto";

option go_package = "github.com/evalops/platform/gen/go/memory/v1;memoryv1";

// MemoryService provides semantic memory storage and recall.
// Canonical contract for evalops/memory, replacing hand-written structs
// in chat (externalmemory/client.go) and ensemble (src/lib/memory/).
service MemoryService {
  rpc Store(StoreRequest) returns (StoreResponse) {
    option (common.v1.required_scopes) = "memories:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  rpc StoreBatch(StoreBatchRequest) returns (StoreBatchResponse) {
    option (common.v1.required_scopes) = "memories:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  rpc Recall(RecallRequest) returns (RecallResponse) {
    option (common.v1.required_scopes) = "memories:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc RecallKnowledge(RecallKnowledgeRequest) returns (RecallKnowledgeResponse) {
    option (common.v1.required_scopes) = "memories:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc GetMemory(GetMemoryRequest) returns (GetMemoryResponse) {
    option (common.v1.required_scopes) = "memories:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc ExplainMemory(ExplainMemoryRequest) returns (ExplainMemoryResponse) {
    option (common.v1.required_scopes) = "memories:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc ClusterMemories(ClusterMemoriesRequest) returns (ClusterMemoriesResponse) {
    option (common.v1.required_scopes) = "memories:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc Update(UpdateRequest) returns (UpdateResponse) {
    option (common.v1.required_scopes) = "memories:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  // PromoteReviewedLearning atomically approves an exact proposed memory and
  // persists the immutable planner-impact receipt that authorized activation.
  rpc PromoteReviewedLearning(PromoteReviewedLearningRequest) returns (PromoteReviewedLearningResponse) {
    option (common.v1.required_scopes) = "memories:write";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }
  rpc Delete(DeleteRequest) returns (DeleteResponse) {
    option (common.v1.required_scopes) = "memories:write";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }
  rpc List(ListRequest) returns (ListResponse) {
    option (common.v1.required_scopes) = "memories:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc LinkMemories(LinkMemoriesRequest) returns (LinkMemoriesResponse) {
    option (common.v1.required_scopes) = "memories:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  rpc ListMemoryRelationships(ListMemoryRelationshipsRequest) returns (ListMemoryRelationshipsResponse) {
    option (common.v1.required_scopes) = "memories:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc DeleteMemoryRelationship(DeleteMemoryRelationshipRequest) returns (DeleteMemoryRelationshipResponse) {
    option (common.v1.required_scopes) = "memories:write";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }
  rpc GetOperatingRules(GetOperatingRulesRequest) returns (GetOperatingRulesResponse) {
    option (common.v1.required_scopes) = "memories:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc Consolidate(ConsolidateRequest) returns (ConsolidateResponse) {
    option (common.v1.required_scopes) = "memories:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
}

// Scope controls memory visibility.
enum Scope {
  SCOPE_UNSPECIFIED = 0;
  SCOPE_USER = 1;
  SCOPE_TEAM = 2;
  SCOPE_ORGANIZATION = 3;
  SCOPE_AGENT = 4;
  SCOPE_PROJECT = 5;
}

// MemoryReviewStatus controls whether a memory is active for recall or still
// reviewable as a proposal.
enum MemoryReviewStatus {
  MEMORY_REVIEW_STATUS_UNSPECIFIED = 0;
  MEMORY_REVIEW_STATUS_APPROVED = 1;
  MEMORY_REVIEW_STATUS_PROPOSED = 2;
  MEMORY_REVIEW_STATUS_REJECTED = 3;
}

enum MemoryLifecycleState {
  MEMORY_LIFECYCLE_STATE_UNSPECIFIED = 0;
  MEMORY_LIFECYCLE_STATE_ACTIVE = 1;
  MEMORY_LIFECYCLE_STATE_FORGOTTEN = 2;
}

enum MemoryLifecycleEventType {
  MEMORY_LIFECYCLE_EVENT_TYPE_UNSPECIFIED = 0;
  MEMORY_LIFECYCLE_EVENT_TYPE_CREATED = 1;
  MEMORY_LIFECYCLE_EVENT_TYPE_CORRECTED = 2;
  MEMORY_LIFECYCLE_EVENT_TYPE_FORGOTTEN = 3;
  MEMORY_LIFECYCLE_EVENT_TYPE_REVIEWED = 4;
}

// SourceReference captures structured provenance for a memory.
message SourceReference {
  string uri = 1;
  string title = 2;
  string type = 3;
  map<string, string> metadata = 4;
  platform.v1.ResourceRef resource_ref = 5;
}

// Memory is the canonical memory record.
// Unifies chat's Memory proto and ensemble's TypeScript memory types.
message Memory {
  string id = 1;
  Scope scope = 2;
  string content = 3;
  string type = 4;
  string source = 5;
  float confidence = 6;
  bool pinned = 7;

  // Packed float encoding — ~4x smaller than JSON float arrays.
  repeated float embedding = 8 [packed = true];

  string workspace_id = 9;
  string user_id = 10;
  string project_id = 11;
  string team_id = 12;
  string repository = 13;
  string agent = 14;
  bool is_policy = 15;

  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
  repeated string tags = 18;
  string agent_id = 19;
  repeated SourceReference source_references = 20;
  google.protobuf.Timestamp expires_at = 21;
  string supersedes_memory_id = 22;
  string superseded_by_memory_id = 23;
  MemoryReviewStatus review_status = 24;
  string proposed_by = 25;
  string proposal_reason = 26;
  repeated string entity_ids = 27;
  int64 revision = 28;
  MemoryLifecycleState lifecycle_state = 29;
}

// MemoryLifecycleEvent is a content-free, immutable owner receipt. The
// content digests bind an explanation to a revision without copying forgotten
// memory content into the explanation response.
message MemoryLifecycleEvent {
  string event_id = 1;
  string memory_id = 2;
  int64 revision = 3;
  MemoryLifecycleEventType event_type = 4;
  string previous_content_digest = 5;
  string content_digest = 6;
  string actor_id = 7;
  string policy_ref = 8;
  string provenance_ref = 9;
  string use_reason = 10;
  string idempotency_key = 11;
  google.protobuf.Timestamp recorded_at = 12;
}

// MemoryRelationship links two memories into a queryable memory graph.
message MemoryRelationship {
  string id = 1;
  string source_memory_id = 2;
  string target_memory_id = 3;
  string type = 4;
  float confidence = 5;
  google.protobuf.Timestamp valid_from = 6;
  google.protobuf.Timestamp valid_until = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string organization_id = 10;
}

message StoreRequest {
  Scope scope = 1 [(buf.validate.field).enum.defined_only = true];
  string content = 2 [(buf.validate.field).string.min_len = 1];
  string type = 3 [(buf.validate.field).string.min_len = 1];
  string source = 4;
  float confidence = 5;
  string project_id = 6;
  string team_id = 7;
  string repository = 8;
  string agent = 9;
  bool is_policy = 10;
  repeated string tags = 11;
  string id = 12;
  string agent_id = 13;
  string user_id = 14;
  bool pinned = 15;
  repeated SourceReference source_references = 16;
  google.protobuf.Timestamp expires_at = 17;
  string supersedes_memory_id = 18;
  MemoryReviewStatus review_status = 19;
  string proposed_by = 20;
  string proposal_reason = 21;
  repeated string entity_ids = 22;
}

message StoreResponse {
  Memory memory = 1;
}

message StoreBatchRequest {
  repeated StoreRequest memories = 1 [(buf.validate.field).repeated.min_items = 1];
  bool continue_on_error = 2;
}

message StoreBatchResponse {
  repeated StoreBatchResult results = 1;
}

message StoreBatchResult {
  int32 index = 1;
  Memory memory = 2;
  string error = 3;
}

message RecallRequest {
  string query = 1;
  Scope scope = 2 [(buf.validate.field).enum.defined_only = true];
  int32 top_k = 3 [(buf.validate.field).int32.gte = 0];
  float min_similarity = 4;
  string project_id = 5;
  string team_id = 6;
  string repository = 7;
  string agent = 8;
  string type = 9;
  string agent_id = 10;
  string user_id = 11;
  MemoryReviewStatus review_status = 12;
  repeated string entity_ids = 13;
  int32 relationship_depth = 14 [(buf.validate.field).int32.gte = 0];
  repeated string relationship_types = 15;
  google.protobuf.Timestamp as_of = 16;
}

message RecallKnowledgeRequest {
  repeated string conditions = 1;
  Scope scope = 2 [(buf.validate.field).enum.defined_only = true];
  int32 top_k = 3 [(buf.validate.field).int32.gte = 0];
  string project_id = 4;
  string team_id = 5;
  string repository = 6;
  string agent = 7;
  string agent_id = 8;
  string user_id = 9;
  MemoryReviewStatus review_status = 10;
}

message GetMemoryRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetMemoryResponse {
  Memory memory = 1;
}

message ExplainMemoryRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message ExplainMemoryResponse {
  repeated MemoryLifecycleEvent events = 1;
}

message RecallResponse {
  repeated RecallResult results = 1;
}

message RecallKnowledgeResponse {
  repeated RecallResult results = 1;
}

message ClusterMemoriesRequest {
  Scope scope = 1 [(buf.validate.field).enum.defined_only = true];
  string project_id = 2;
  string team_id = 3;
  string repository = 4;
  string agent = 5;
  string type = 6;
  string agent_id = 7;
  string user_id = 8;
  MemoryReviewStatus review_status = 9;
  int32 max_clusters = 10 [(buf.validate.field).int32.gte = 0];
  int32 limit_per_cluster = 11 [(buf.validate.field).int32.gte = 0];
  float min_similarity = 12;
}

message ClusterMemoriesResponse {
  repeated MemoryCluster clusters = 1;
}

message MemoryCluster {
  string id = 1;
  string topic = 2;
  repeated RecallResult results = 3;
  repeated float centroid = 4 [packed = true];
  float similarity = 5;
}

message RecallResult {
  Memory memory = 1;
  float similarity = 2;
  int32 graph_distance = 3;
  repeated MemoryRelationship relationship_path = 4;
}

message UpdateRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Leave empty for review-only updates; the server preserves existing content
  // and tags.
  string content = 2;
  string type = 3;
  float confidence = 4;
  repeated string tags = 5;
  string source = 6;
  bool pinned = 7;
  bool is_policy = 8;
  repeated SourceReference source_references = 9;
  google.protobuf.Timestamp expires_at = 10;
  MemoryReviewStatus review_status = 11;
  string proposed_by = 12;
  string proposal_reason = 13;
  repeated string entity_ids = 14;
  optional int64 expected_revision = 15 [(buf.validate.field).int64.gte = 1];
  string idempotency_key = 16;
  string actor_id = 17;
  string policy_ref = 18;
  string provenance_ref = 19;
  string use_reason = 20;
}

message UpdateResponse {
  Memory memory = 1;
}

// ReviewedLearningImpact is the aggregate, content-free output of the
// dex-core reviewed-learning decision. MemoryService verifies that the
// candidate digest still matches the proposed row before activation.
message ReviewedLearningImpact {
  string candidate_digest_sha256 = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
  string review_id = 2 [(buf.validate.field).string.min_len = 1];
  string reviewer_id = 3 [(buf.validate.field).string.min_len = 1];
  string evaluation_id = 4 [(buf.validate.field).string.min_len = 1];
  string evaluator_id = 5 [(buf.validate.field).string.min_len = 1];
  string evaluation_suite_id = 6 [(buf.validate.field).string.min_len = 1];
  string evaluation_suite_version = 7 [(buf.validate.field).string.min_len = 1];
  string task_set_digest_sha256 = 8 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
  string baseline_planner_version = 9 [(buf.validate.field).string.min_len = 1];
  string treatment_planner_version = 10 [(buf.validate.field).string.min_len = 1];
  uint32 sample_count = 11 [(buf.validate.field).uint32.gte = 1];
  int32 baseline_score_basis_points = 12 [(buf.validate.field).int32 = {
    gte: 0
    lte: 10000
  }];
  int32 treatment_score_basis_points = 13 [(buf.validate.field).int32 = {
    gte: 0
    lte: 10000
  }];
  int32 confidence_lower_bound_basis_points = 14 [(buf.validate.field).int32 = {
    gte: -10000
    lte: 10000
  }];
  uint32 guardrail_regression_count = 15;
  repeated string source_replay_artifact_digests_sha256 = 16 [(buf.validate.field).repeated.min_items = 1];
  repeated string evidence_refs = 17 [(buf.validate.field).repeated.min_items = 1];
}

message PromoteReviewedLearningRequest {
  string memory_id = 1 [(buf.validate.field).string.min_len = 1];
  optional int64 expected_revision = 2 [(buf.validate.field).int64.gte = 1];
  string idempotency_key = 3 [(buf.validate.field).string.min_len = 1];
  string actor_id = 4 [(buf.validate.field).string.min_len = 1];
  string policy_ref = 5 [(buf.validate.field).string.min_len = 1];
  string provenance_ref = 6 [(buf.validate.field).string.min_len = 1];
  string use_reason = 7 [(buf.validate.field).string.min_len = 1];
  ReviewedLearningImpact impact = 8 [(buf.validate.field).required = true];
}

// ReviewedLearningPromotionReceipt is immutable evidence that one exact
// proposal revision became recallable under one measured planner evaluation.
message ReviewedLearningPromotionReceipt {
  string receipt_id = 1;
  string memory_id = 2;
  int64 memory_revision = 3;
  string lifecycle_event_id = 4;
  ReviewedLearningImpact impact = 5;
  string actor_id = 6;
  string policy_ref = 7;
  string provenance_ref = 8;
  string use_reason = 9;
  google.protobuf.Timestamp recorded_at = 10;
}

message PromoteReviewedLearningResponse {
  Memory memory = 1;
  ReviewedLearningPromotionReceipt receipt = 2;
}

message DeleteRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  optional int64 expected_revision = 2 [(buf.validate.field).int64.gte = 1];
  string idempotency_key = 3;
  string actor_id = 4;
  string policy_ref = 5;
  string provenance_ref = 6;
  string use_reason = 7;
}

message DeleteResponse {}

message ListRequest {
  Scope scope = 1 [(buf.validate.field).enum.defined_only = true];
  string project_id = 2;
  string team_id = 3;
  string repository = 4;
  string agent = 5;
  int32 limit = 6 [(buf.validate.field).int32.gte = 0];
  int32 offset = 7 [(buf.validate.field).int32.gte = 0];
  string type = 8;
  string agent_id = 9;
  string user_id = 10;
  MemoryReviewStatus review_status = 11;
  repeated string entity_ids = 12;
  string source = 13;
  string source_prefix = 14;
}

message LinkMemoriesRequest {
  string source_memory_id = 1 [(buf.validate.field).string.min_len = 1];
  string target_memory_id = 2 [(buf.validate.field).string.min_len = 1];
  string type = 3 [(buf.validate.field).string.min_len = 1];
  float confidence = 4;
  google.protobuf.Timestamp valid_from = 5;
  google.protobuf.Timestamp valid_until = 6;
  string id = 7;
}

message LinkMemoriesResponse {
  MemoryRelationship relationship = 1;
}

message ListMemoryRelationshipsRequest {
  string memory_id = 1;
  string source_memory_id = 2;
  string target_memory_id = 3;
  repeated string types = 4;
  google.protobuf.Timestamp as_of = 5;
  int32 limit = 6 [(buf.validate.field).int32.gte = 0];
  int32 offset = 7 [(buf.validate.field).int32.gte = 0];
}

message ListMemoryRelationshipsResponse {
  repeated MemoryRelationship relationships = 1;
  int32 total = 2;
  bool has_more = 3;
}

message DeleteMemoryRelationshipRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message DeleteMemoryRelationshipResponse {}

message GetOperatingRulesRequest {
  Scope scope = 1 [(buf.validate.field).enum.defined_only = true];
  string project_id = 2;
  string team_id = 3;
  string repository = 4;
  string agent = 5;
  int32 limit = 6 [(buf.validate.field).int32.gte = 0];
  int32 offset = 7 [(buf.validate.field).int32.gte = 0];
  string agent_id = 8;
  string user_id = 9;
  MemoryReviewStatus review_status = 10;
}

message ListResponse {
  repeated Memory memories = 1;
  int32 total = 2;
  bool has_more = 3;
}

message GetOperatingRulesResponse {
  repeated Memory memories = 1;
  int32 total = 2;
  bool has_more = 3;
}

message ConsolidateRequest {
  Scope scope = 1 [(buf.validate.field).enum.defined_only = true];
  string project_id = 2;
  string type = 3;
  string source_prefix = 4;
}

message ConsolidateResponse {
  int32 merged = 1;
  int32 pruned = 2;
}
