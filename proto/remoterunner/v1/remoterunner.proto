syntax = "proto3";

package remoterunner.v1;

import "buf/validate/validate.proto";
import "common/v1/authz.proto";
import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/evalops/platform/gen/go/remoterunner/v1;remoterunnerv1";

// RemoteRunnerService owns account-scoped hosted Maestro runner sessions.
service RemoteRunnerService {
  rpc ListRunnerProfiles(ListRunnerProfilesRequest) returns (ListRunnerProfilesResponse) {
    option (google.api.http) = {get: "/v1/runner-profiles"};

    option (common.v1.required_scopes) = "remote-runner:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  rpc CreateRunnerSession(CreateRunnerSessionRequest) returns (CreateRunnerSessionResponse) {
    option (google.api.http) = {
      post: "/v1/runner-sessions"
      body: "*"
    };

    option (common.v1.required_scopes) = "remote-runner:write";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }

  rpc AdoptRunnerSessionForComputerMission(AdoptRunnerSessionForComputerMissionRequest) returns (AdoptRunnerSessionForComputerMissionResponse) {
    option (google.api.http) = {
      post: "/v1/runner-sessions/{runner_session_id}/adopt-computer-mission"
      body: "*"
    };

    option (common.v1.required_scopes) = "remote-runner:write";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }

  rpc GetRunnerSession(GetRunnerSessionRequest) returns (GetRunnerSessionResponse) {
    option (google.api.http) = {get: "/v1/runner-sessions/{session_id}"};

    option (common.v1.required_scopes) = "remote-runner:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  rpc ListRunnerSessions(ListRunnerSessionsRequest) returns (ListRunnerSessionsResponse) {
    option (google.api.http) = {get: "/v1/runner-sessions"};

    option (common.v1.required_scopes) = "remote-runner:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  rpc CreateRunnerRestore(CreateRunnerRestoreRequest) returns (CreateRunnerRestoreResponse) {
    option (google.api.http) = {
      post: "/v1/runner-restores"
      body: "*"
    };

    option (common.v1.required_scopes) = "remote-runner:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  rpc GetRunnerRestore(GetRunnerRestoreRequest) returns (GetRunnerRestoreResponse) {
    option (google.api.http) = {get: "/v1/runner-restores/{restore_id}"};

    option (common.v1.required_scopes) = "remote-runner:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  rpc ListRunnerRestores(ListRunnerRestoresRequest) returns (ListRunnerRestoresResponse) {
    option (google.api.http) = {get: "/v1/runner-restores"};

    option (common.v1.required_scopes) = "remote-runner:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  rpc StopRunnerSession(StopRunnerSessionRequest) returns (StopRunnerSessionResponse) {
    option (google.api.http) = {
      post: "/v1/runner-sessions/{session_id}/stop"
      body: "*"
    };

    option (common.v1.required_scopes) = "remote-runner:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  rpc ExtendRunnerSession(ExtendRunnerSessionRequest) returns (ExtendRunnerSessionResponse) {
    option (google.api.http) = {
      post: "/v1/runner-sessions/{session_id}/extend"
      body: "*"
    };

    option (common.v1.required_scopes) = "remote-runner:write";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  rpc MintAttachToken(MintAttachTokenRequest) returns (MintAttachTokenResponse) {
    option (google.api.http) = {
      post: "/v1/runner-sessions/{session_id}/attach-token"
      body: "*"
    };

    option (common.v1.required_scopes) = "remote-runner:write";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }

  rpc RevokeAttachToken(RevokeAttachTokenRequest) returns (RevokeAttachTokenResponse) {
    option (google.api.http) = {
      post: "/v1/runner-sessions/{session_id}/attach-tokens/{token_id}/revoke"
      body: "*"
    };

    option (common.v1.required_scopes) = "remote-runner:write";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }

  rpc ListRunnerSessionEvents(ListRunnerSessionEventsRequest) returns (ListRunnerSessionEventsResponse) {
    option (google.api.http) = {get: "/v1/runner-sessions/{session_id}/events"};

    option (common.v1.required_scopes) = "remote-runner:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  rpc RecordRunnerSessionArtifactLifecycle(RecordRunnerSessionArtifactLifecycleRequest) returns (RecordRunnerSessionArtifactLifecycleResponse) {
    option (google.api.http) = {
      post: "/v1/runner-sessions/{session_id}/artifact-lifecycle"
      body: "*"
    };

    option (common.v1.required_scopes) = "remote-runner:admin";
    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  rpc ExecuteRunnerSessionStep(ExecuteRunnerSessionStepRequest) returns (ExecuteRunnerSessionStepResponse) {
    option (google.api.http) = {
      post: "/v1/runner-sessions/{session_id}/steps"
      body: "*"
    };
    option (common.v1.required_scopes) = "remote-runner:execute";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }

  rpc CreateRunnerSessionCheckpoint(CreateRunnerSessionCheckpointRequest) returns (CreateRunnerSessionCheckpointResponse) {
    option (google.api.http) = {
      post: "/v1/runner-sessions/{session_id}/checkpoints"
      body: "*"
    };
    option (common.v1.required_scopes) = "remote-runner:write";
    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }

  rpc GetRunnerAccountPolicy(GetRunnerAccountPolicyRequest) returns (GetRunnerAccountPolicyResponse) {
    option (google.api.http) = {get: "/v1/runner-account-policies/{organization_id}"};

    option (common.v1.required_scopes) = "remote-runner:admin";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  rpc UpsertRunnerAccountPolicy(UpsertRunnerAccountPolicyRequest) returns (UpsertRunnerAccountPolicyResponse) {
    option (google.api.http) = {
      put: "/v1/runner-account-policies/{organization_id}"
      body: "*"
    };

    option (common.v1.required_scopes) = "remote-runner:admin";
    option (common.v1.risk_level) = RISK_LEVEL_CRITICAL;
  }

  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {
    option (google.api.http) = {get: "/v1/remote-runner/status"};

    option (common.v1.required_scopes) = "remote-runner:read";
    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
}

message RunnerSessionOwnerBinding {
  string mission_id = 1 [(buf.validate.field).string.min_len = 1];
  string runtime_run_id = 2 [(buf.validate.field).string.min_len = 1];
  string authority_grant_id = 3 [(buf.validate.field).string.min_len = 1];
  string contract_version = 4 [(buf.validate.field).string.min_len = 1];
  string runner_profile = 5 [(buf.validate.field).string.min_len = 1];
  string policy_version = 6;
  string decision_route = 7;
  string selected_candidate_id = 8;
  string decision_ref = 9;
  string decision_digest_sha256 = 10;
}

message AdoptRunnerSessionForComputerMissionRequest {
  string organization_id = 1 [(buf.validate.field).string.min_len = 1];
  string workspace_id = 2 [(buf.validate.field).string.min_len = 1];
  string reservation_id = 3 [(buf.validate.field).string.min_len = 1];
  string runner_session_id = 4 [(buf.validate.field).string.min_len = 1];
  string mission_id = 5 [(buf.validate.field).string.min_len = 1];
  string runtime_run_id = 6 [(buf.validate.field).string.min_len = 1];
}

message AdoptRunnerSessionForComputerMissionResponse {
  RunnerSession session = 1 [(buf.validate.field).required = true];
  RunnerSessionOwnerBinding owner_binding = 2 [(buf.validate.field).required = true];
  bool replayed = 3;
}

message ExecuteRunnerSessionStepRequest {
  string organization_id = 1 [(buf.validate.field).string.min_len = 1];
  string workspace_id = 2 [(buf.validate.field).string.min_len = 1];
  string session_id = 3 [(buf.validate.field).string.min_len = 1];
  string idempotency_key = 4 [(buf.validate.field).string.min_len = 1];
  repeated string argv = 5 [(buf.validate.field).repeated.max_items = 64];
  string cwd = 6;
  uint32 timeout_seconds = 7 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 3600
  }];
  optional RunnerSessionOwnerBinding owner_binding = 8;
  RunnerSessionStepOperation operation = 9;
  bytes stdin = 10 [(buf.validate.field).bytes.max_len = 1048576];
  string expected_snapshot_id = 11;
  string expected_sandbox_session_id = 12;
  string expected_sandbox_id = 13;
  string expected_runner_session_id = 14;
  string expected_checkpoint_id = 15;
  string instruction_artifact_ref = 16;
  string instruction_digest_sha256 = 17;
  uint64 instruction_byte_count = 18;
  uint64 claim_lease_generation = 19;
}

enum RunnerSessionStepOperation {
  RUNNER_SESSION_STEP_OPERATION_UNSPECIFIED = 0;
  RUNNER_SESSION_STEP_OPERATION_GENERIC = 1;
  RUNNER_SESSION_STEP_OPERATION_APEX_HYDRATE = 2;
  RUNNER_SESSION_STEP_OPERATION_APEX_DISCOVER = 3;
  RUNNER_SESSION_STEP_OPERATION_APEX_FREEZE = 4;
  RUNNER_SESSION_STEP_OPERATION_APEX_GRADE = 5;
  RUNNER_SESSION_STEP_OPERATION_APEX_MCP_CALL = 6;
  RUNNER_SESSION_STEP_OPERATION_APEX_STAGE_INPUTS = 7;
  RUNNER_SESSION_STEP_OPERATION_APEX_STAGE_GRADING = 8;
  RUNNER_SESSION_STEP_OPERATION_APEX_TASK_INSTRUCTIONS = 9;
  reserved 10, 11, 12;
  reserved "RUNNER_SESSION_STEP_OPERATION_COMPUTER_SHELL", "RUNNER_SESSION_STEP_OPERATION_COMPUTER_READ_FILE", "RUNNER_SESSION_STEP_OPERATION_COMPUTER_WRITE_FILE";
}

message RunnerProviderProof {
  string provider = 1;
  string provider_mode = 2;
  string worker_id = 3;
  string runtime_image_digest = 4;
}

message RunnerSessionStepReceipt {
  string command_id = 1;
  int32 exit_code = 2;
  string stdout = 3;
  string stderr = 4;
  bool replayed = 5;
  RunnerProviderProof provider_proof = 6;
  string stdin_sha256 = 7;
  bool output_unavailable = 8;
  string output_digest_sha256 = 9;
  uint64 output_byte_count = 10;
}

message ExecuteRunnerSessionStepResponse {
  RunnerSessionStepReceipt receipt = 1;
  RunnerSessionEvent event = 2;
  // Bounded output for fixed APEX MCP/discover/grade operations. MCP output is
  // transient; schema-validated discover/grade control output is replayable.
  bytes apex_mcp_output = 3 [(buf.validate.field).bytes.max_len = 1048576];
  // Live-only bytes for the fixed APEX task-instruction read. This field is
  // always empty on replay and is never copied into a receipt or event.
  bytes ephemeral_output = 4 [(buf.validate.field).bytes.max_len = 1048576];
}

message CreateRunnerSessionCheckpointRequest {
  string organization_id = 1 [(buf.validate.field).string.min_len = 1];
  string workspace_id = 2 [(buf.validate.field).string.min_len = 1];
  string session_id = 3 [(buf.validate.field).string.min_len = 1];
  string idempotency_key = 4 [(buf.validate.field).string.min_len = 1];
  optional RunnerSessionOwnerBinding owner_binding = 5;
}

message RunnerSessionCheckpointReceipt {
  string checkpoint_id = 1;
  string source_session_id = 2;
  bool replayed = 3;
}

message CreateRunnerSessionCheckpointResponse {
  RunnerSessionCheckpointReceipt receipt = 1;
  RunnerSessionEvent event = 2;
}

enum RunnerSessionState {
  RUNNER_SESSION_STATE_UNSPECIFIED = 0;
  RUNNER_SESSION_STATE_REQUESTED = 1;
  RUNNER_SESSION_STATE_PROVISIONING = 2;
  RUNNER_SESSION_STATE_RUNNING = 3;
  RUNNER_SESSION_STATE_IDLE = 4;
  RUNNER_SESSION_STATE_STOPPING = 5;
  RUNNER_SESSION_STATE_STOPPED = 6;
  RUNNER_SESSION_STATE_EXPIRED = 7;
  RUNNER_SESSION_STATE_FAILED = 8;
  RUNNER_SESSION_STATE_LOST = 9;
}

enum RunnerAttachRole {
  RUNNER_ATTACH_ROLE_UNSPECIFIED = 0;
  RUNNER_ATTACH_ROLE_VIEWER = 1;
  RUNNER_ATTACH_ROLE_CONTROLLER = 2;
  RUNNER_ATTACH_ROLE_ADMIN = 3;
}

enum RunnerSessionRestoreState {
  RUNNER_SESSION_RESTORE_STATE_UNSPECIFIED = 0;
  RUNNER_SESSION_RESTORE_STATE_REQUESTED = 1;
  RUNNER_SESSION_RESTORE_STATE_ARTIFACTS_HYDRATING = 2;
  RUNNER_SESSION_RESTORE_STATE_PROVIDER_STARTING = 3;
  RUNNER_SESSION_RESTORE_STATE_IDENTITY_READY = 4;
  RUNNER_SESSION_RESTORE_STATE_ATTACHABLE = 5;
  RUNNER_SESSION_RESTORE_STATE_FAILED = 6;
  RUNNER_SESSION_RESTORE_STATE_EXPIRED = 7;
}

enum RunnerSessionRestoreFailurePolicy {
  RUNNER_SESSION_RESTORE_FAILURE_POLICY_UNSPECIFIED = 0;
  RUNNER_SESSION_RESTORE_FAILURE_POLICY_FAIL_SESSION = 1;
  RUNNER_SESSION_RESTORE_FAILURE_POLICY_COLD_START = 2;
}

message RunnerSessionRestoreSpec {
  string source_runner_session_id = 1;
  string source_maestro_session_id = 2;
  string snapshot_artifact_uri = 3;
  string snapshot_manifest_path = 4;
  string snapshot_manifest_protocol_version = 5;
  string artifact_digest = 6;
  RunnerSessionRestoreFailurePolicy failure_policy = 7;
  google.protobuf.Struct metadata = 8;
}

message RunnerSessionRestoreStatus {
  RunnerSessionRestoreState state = 1;
  string local_manifest_path = 2;
  string hydrated_artifact_uri = 3;
  string failure_reason = 4;
  string failure_message = 5;
  google.protobuf.Timestamp updated_at = 6;
}

enum RunnerRestoreState {
  RUNNER_RESTORE_STATE_UNSPECIFIED = 0;
  RUNNER_RESTORE_STATE_REQUESTED = 1;
  RUNNER_RESTORE_STATE_ARTIFACTS_HYDRATING = 2;
  RUNNER_RESTORE_STATE_PROVIDER_STARTING = 3;
  RUNNER_RESTORE_STATE_IDENTITY_READY = 4;
  RUNNER_RESTORE_STATE_ATTACHABLE = 5;
  RUNNER_RESTORE_STATE_FAILED = 6;
  RUNNER_RESTORE_STATE_EXPIRED = 7;
}

enum RunnerRestoreFailureCode {
  RUNNER_RESTORE_FAILURE_CODE_UNSPECIFIED = 0;
  RUNNER_RESTORE_FAILURE_CODE_MISSING_ARTIFACT = 1;
  RUNNER_RESTORE_FAILURE_CODE_INVALID_MANIFEST = 2;
  RUNNER_RESTORE_FAILURE_CODE_WORKSPACE_ESCAPE = 3;
  RUNNER_RESTORE_FAILURE_CODE_PROVIDER_TIMEOUT = 4;
  RUNNER_RESTORE_FAILURE_CODE_RUNTIME_NOT_READY = 5;
  RUNNER_RESTORE_FAILURE_CODE_OWNER_MISMATCH = 6;
  RUNNER_RESTORE_FAILURE_CODE_HYDRATION_UNAVAILABLE = 7;
  RUNNER_RESTORE_FAILURE_CODE_POLICY_DENIED = 8;
  RUNNER_RESTORE_FAILURE_CODE_SESSION_CREATE_FAILED = 9;
}

enum RunnerArtifactClass {
  RUNNER_ARTIFACT_CLASS_UNSPECIFIED = 0;
  RUNNER_ARTIFACT_CLASS_CONTROL_PLANE_METADATA = 1;
  RUNNER_ARTIFACT_CLASS_WORKSPACE_EXPORT = 2;
  RUNNER_ARTIFACT_CLASS_RUNTIME_SNAPSHOT = 3;
  RUNNER_ARTIFACT_CLASS_RUNTIME_LOGS = 4;
}

enum RunnerArtifactLifecycleState {
  RUNNER_ARTIFACT_LIFECYCLE_STATE_UNSPECIFIED = 0;
  RUNNER_ARTIFACT_LIFECYCLE_STATE_UPLOAD_REQUESTED = 1;
  RUNNER_ARTIFACT_LIFECYCLE_STATE_UPLOADED = 2;
  RUNNER_ARTIFACT_LIFECYCLE_STATE_UPLOAD_SKIPPED = 3;
  RUNNER_ARTIFACT_LIFECYCLE_STATE_RETENTION_EXPIRED = 4;
  RUNNER_ARTIFACT_LIFECYCLE_STATE_DELETE_REQUESTED = 5;
  RUNNER_ARTIFACT_LIFECYCLE_STATE_DELETED = 6;
  RUNNER_ARTIFACT_LIFECYCLE_STATE_CLEANUP_FAILED = 7;
}

message RunnerSession {
  string id = 1;
  string organization_id = 2;
  string workspace_id = 3;
  string user_id = 4;
  string agent_run_id = 5;
  string maestro_session_id = 6;
  RunnerSessionState state = 7;
  string runner_profile = 8;
  string runner_image = 9;
  string workspace_source = 10;
  string repo_url = 11;
  string branch = 12;
  string model = 13;
  // Platform-minted runtime owner generation. Hosted runtimes must echo this
  // value on the remote-runner identity endpoint before new attach requests are
  // proxied.
  string owner_instance_id = 14;
  string runner_pod_namespace = 15;
  string runner_pod_name = 16;
  string runner_service_name = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp started_at = 19;
  google.protobuf.Timestamp expires_at = 20;
  google.protobuf.Timestamp idle_expires_at = 21;
  google.protobuf.Timestamp stopped_at = 22;
  string stop_reason = 23;
  google.protobuf.Timestamp last_heartbeat_at = 24;
  int64 used_runner_seconds = 25;
  int64 used_idle_seconds = 26;
  int64 estimated_cost_micros = 27;
  google.protobuf.Struct metadata = 28;
  int64 reserved_runner_seconds = 29;
  int64 reserved_cost_micros = 30;
  RunnerProfile resolved_profile = 31;
  RunnerSessionRestoreSpec restore = 32;
  RunnerSessionRestoreStatus restore_status = 33;
  RunnerSessionApexAuthorityState apex_authority_state = 34;
  string apex_reservation_id = 35;
}

enum RunnerSessionApexAuthorityState {
  RUNNER_SESSION_APEX_AUTHORITY_STATE_UNSPECIFIED = 0;
  RUNNER_SESSION_APEX_AUTHORITY_STATE_NOT_REQUIRED = 1;
  RUNNER_SESSION_APEX_AUTHORITY_STATE_PENDING_RESERVATION = 2;
  RUNNER_SESSION_APEX_AUTHORITY_STATE_RESERVATION_VALIDATED = 3;
  RUNNER_SESSION_APEX_AUTHORITY_STATE_MISSION_ADOPTED = 4;
}

message RunnerSessionEvent {
  string id = 1;
  string session_id = 2;
  int64 sequence = 3;
  string event_type = 4;
  google.protobuf.Timestamp occurred_at = 5;
  google.protobuf.Struct payload = 6;
}

message RunnerAttachToken {
  string id = 1;
  string session_id = 2;
  string subject_id = 3;
  repeated RunnerAttachRole roles = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp revoked_at = 7;
}

message RunnerRestore {
  string id = 1;
  string organization_id = 2;
  string workspace_id = 3;
  string source_session_id = 4;
  string target_session_id = 5;
  string maestro_session_id = 6;
  RunnerRestoreState state = 7;
  string artifact_ref = 8;
  string manifest_path = 9;
  string runner_profile = 10;
  string runner_image = 11;
  string workspace_source = 12;
  string repo_url = 13;
  string branch = 14;
  string model = 15;
  int32 ttl_minutes = 16;
  int32 idle_ttl_minutes = 17;
  string owner_instance_id = 18;
  RunnerRestoreFailureCode failure_code = 19;
  string failure_message = 20;
  google.protobuf.Timestamp requested_at = 21;
  google.protobuf.Timestamp hydrated_at = 22;
  google.protobuf.Timestamp provider_started_at = 23;
  google.protobuf.Timestamp identity_ready_at = 24;
  google.protobuf.Timestamp attachable_at = 25;
  google.protobuf.Timestamp failed_at = 26;
  google.protobuf.Timestamp expires_at = 27;
  google.protobuf.Struct metadata = 28;
}

message RunnerAccountPolicy {
  int32 max_concurrent_sessions = 1 [(buf.validate.field).int32.gte = 0];
  int32 max_session_ttl_minutes = 2 [(buf.validate.field).int32.gte = 0];
  int32 max_idle_ttl_minutes = 3 [(buf.validate.field).int32.gte = 0];
  int64 monthly_runner_minutes = 4 [(buf.validate.field).int64.gte = 0];
  int64 monthly_spend_cap_micros = 5 [(buf.validate.field).int64.gte = 0];
  int64 runner_minute_cost_micros = 6 [(buf.validate.field).int64.gte = 0];
  repeated string allowed_runner_profiles = 7;
  repeated string allowed_models = 8;
  repeated string allowed_workspace_sources = 9;
  string operator_override_scope = 10;
  bool workspace_scoped_usage_budgets = 11;
}

message RunnerAccountPolicyRecord {
  string organization_id = 1;
  string workspace_id = 2;
  RunnerAccountPolicy policy = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  string source = 6;
}

message RunnerProfile {
  string id = 1;
  string display_name = 2;
  bool enabled = 3;
  int32 default_ttl_minutes = 4;
  int32 max_ttl_minutes = 5;
  int32 default_idle_ttl_minutes = 6;
  int32 max_idle_ttl_minutes = 7;
  string isolation_level = 8;
  string interruption = 9;
  string workspace_persistence = 10;
  string cost_class = 11;
  int64 metering_multiplier_micros = 12;
  bool experimental = 13;
  bool production_eligible = 14;
}

message RunnerProfileAvailability {
  RunnerProfile profile = 1;
  bool available = 2;
  string unavailable_reason = 3;
  string policy_source = 4;
}

message ListRunnerProfilesRequest {
  string organization_id = 1 [(buf.validate.field).string.min_len = 1];
  string workspace_id = 2 [(buf.validate.field).string.min_len = 1];
  bool include_unavailable = 3;
}

message ListRunnerProfilesResponse {
  repeated RunnerProfileAvailability profiles = 1;
}

// Immutable workspace authority signed by Platform for Runner Host admission.
// Acceptance proves only the exact coordinates below; materialization remains
// a separate owner operation.
message WorkspaceHydrationClaims {
  uint32 schema_version = 1;
  string envelope_id = 2;
  string organization_id = 3;
  string workspace_id = 4;
  string source_workspace_id = 5;
  string source_workspace_version = 6;
  string source_revision_id = 7;
  string immutable_snapshot_id = 8;
  string immutable_snapshot_digest = 9;
  string workspace_skill_set_digest = 10;
  string capability_set_digest = 11;
  string runner_session_id = 12;
  string maestro_session_id = 13;
  uint64 runtime_generation = 14;
  uint64 activation_generation = 15;
  string audience = 16;
  int64 issued_at_ms = 17;
  int64 not_before_ms = 18;
  int64 expires_at_ms = 19;
  string replay_nonce = 20;
  string extraction_policy_version = 21;
  string policy_version = 22;
  string artifact_ref = 23;
  string signer_identity = 24;
  string key_id = 25;
  uint64 max_files = 26;
  uint64 max_bytes = 27;
}

message WorkspaceHydrationEnvelope {
  WorkspaceHydrationClaims claims = 1 [(buf.validate.field).required = true];
  string signature = 2 [(buf.validate.field).string.min_len = 1];
}

message CreateRunnerSessionRequest {
  string organization_id = 1 [(buf.validate.field).string.min_len = 1];
  string workspace_id = 2 [(buf.validate.field).string.min_len = 1];
  string user_id = 3;
  string idempotency_key = 4 [(buf.validate.field).string.min_len = 1];
  string runner_profile = 5 [(buf.validate.field).string.min_len = 1];
  string runner_image = 6;
  string workspace_source = 7;
  string repo_url = 8;
  string branch = 9;
  string model = 10;
  int32 ttl_minutes = 11 [(buf.validate.field).int32 = {
    gte: 1
    lte: 1440
  }];
  int32 idle_ttl_minutes = 12 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1440
  }];
  google.protobuf.Struct metadata = 13;
  RunnerSessionRestoreSpec restore = 14;
  string agent_run_id = 15;
  string maestro_session_id = 16;
  string apex_reservation_id = 17;
  string runner_session_id = 18;
  uint64 runtime_generation = 19;
  uint64 activation_generation = 20;
  WorkspaceHydrationEnvelope workspace_hydration_envelope = 21;
}

message CreateRunnerSessionResponse {
  RunnerSession session = 1;
  repeated RunnerSessionEvent events = 2;
  bool replayed = 3;
}

message GetRunnerSessionRequest {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetRunnerSessionResponse {
  RunnerSession session = 1;
}

message ListRunnerSessionsRequest {
  string organization_id = 1 [(buf.validate.field).string.min_len = 1];
  string workspace_id = 2 [(buf.validate.field).string.min_len = 1];
  RunnerSessionState state = 3;
  int32 limit = 4 [(buf.validate.field).int32 = {
