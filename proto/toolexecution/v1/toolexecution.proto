syntax = "proto3";

package toolexecution.v1;

import "buf/validate/validate.proto";
import "common/v1/authz.proto";
import "common/v1/risk.proto";
import "common/v1/surface.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "platform/v1/platform.proto";

option go_package = "github.com/evalops/platform/gen/go/toolexecution/v1;toolexecutionv1";

// ToolExecutionService governs one normalized tool call across capability
// lookup, credential resolution, Gate and Governance policy, approval waits,
// execution, audit, meter, and provenance recording. AgentRun workers call this
// service instead of invoking external connectors, MCP tools, or internal tools
// directly.
service ToolExecutionService {
  // ExecuteTool starts or idempotently replays a governed tool execution.
  rpc ExecuteTool(ExecuteToolRequest) returns (ExecuteToolResponse) {
    option (common.v1.required_scopes) = "tool-execution:write";
    option (common.v1.workspace_scope_field) = "linkage.workspace_id";
    option (common.v1.organization_scope_field) = "linkage.organization_id";

    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }

  // ResumeToolExecution resumes an execution that was parked on an approval
  // wait, preserving the original tool call context.
  rpc ResumeToolExecution(ResumeToolExecutionRequest) returns (ResumeToolExecutionResponse) {
    option (common.v1.required_scopes) = "tool-execution:write";

    option (common.v1.risk_level) = RISK_LEVEL_HIGH;
  }

  // RecordToolExecutionOutput records an asynchronous executor result and
  // finalizes audit, meter, and provenance metadata.
  rpc RecordToolExecutionOutput(RecordToolExecutionOutputRequest) returns (RecordToolExecutionOutputResponse) {
    option (common.v1.required_scopes) = "tool-execution:write";

    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }

  // GetToolExecution retrieves one tool execution by ID.
  // When wait_timeout_ms is greater than zero, the owner may block until the
  // execution is settled (terminal or WAITING_APPROVAL) or the timeout
  // elapses. Zero is a snapshot and remains backward compatible.
  rpc GetToolExecution(GetToolExecutionRequest) returns (GetToolExecutionResponse) {
    option (common.v1.required_scopes) = "tool-execution:read";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }

  // ListToolExecutions lists executions by workspace, AgentRun, Objective,
  // tool, connector, state, or approval request.
  rpc ListToolExecutions(ListToolExecutionsRequest) returns (ListToolExecutionsResponse) {
    option (common.v1.required_scopes) = "tool-execution:read";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
}

// ToolExecutionState is the durable lifecycle for one tool call.
enum ToolExecutionState {
  TOOL_EXECUTION_STATE_UNSPECIFIED = 0;
  TOOL_EXECUTION_STATE_ACCEPTED = 1;
  TOOL_EXECUTION_STATE_POLICY_EVALUATING = 2;
  TOOL_EXECUTION_STATE_WAITING_APPROVAL = 3;
  TOOL_EXECUTION_STATE_RUNNING = 4;
  TOOL_EXECUTION_STATE_SUCCEEDED = 5;
  TOOL_EXECUTION_STATE_FAILED = 6;
  TOOL_EXECUTION_STATE_DENIED = 7;
  TOOL_EXECUTION_STATE_CANCELLED = 8;
}

// ToolExecutionStage names each platform boundary crossed by ExecuteTool.
enum ToolExecutionStage {
  TOOL_EXECUTION_STAGE_UNSPECIFIED = 0;
  TOOL_EXECUTION_STAGE_CAPABILITY_LOOKUP = 1;
  TOOL_EXECUTION_STAGE_CREDENTIAL_RESOLUTION = 2;
  TOOL_EXECUTION_STAGE_GATE_POLICY = 3;
  TOOL_EXECUTION_STAGE_GOVERNANCE_POLICY = 4;
  TOOL_EXECUTION_STAGE_APPROVAL = 5;
  TOOL_EXECUTION_STAGE_EXECUTION = 6;
  TOOL_EXECUTION_STAGE_AUDIT = 7;
  TOOL_EXECUTION_STAGE_METER = 8;
  TOOL_EXECUTION_STAGE_PROVENANCE = 9;
}

// ToolExecutionStepState describes the state of a platform boundary decision.
enum ToolExecutionStepState {
  TOOL_EXECUTION_STEP_STATE_UNSPECIFIED = 0;
  TOOL_EXECUTION_STEP_STATE_SUCCEEDED = 1;
  TOOL_EXECUTION_STEP_STATE_WAITING = 2;
  TOOL_EXECUTION_STEP_STATE_DENIED = 3;
  TOOL_EXECUTION_STEP_STATE_FAILED = 4;
  TOOL_EXECUTION_STEP_STATE_SKIPPED = 5;
}

// ToolExecutionPolicyDecision is a normalized policy result from Gate,
// Governance, approval policy, or a connector capability check.
enum ToolExecutionPolicyDecision {
  TOOL_EXECUTION_POLICY_DECISION_UNSPECIFIED = 0;
  TOOL_EXECUTION_POLICY_DECISION_ALLOW = 1;
  TOOL_EXECUTION_POLICY_DECISION_DENY = 2;
  TOOL_EXECUTION_POLICY_DECISION_REQUIRE_APPROVAL = 3;
}

// ToolExecutionProposalKind marks structured outputs that downstream runtime
// checkpoints, artifact proposals, and memory proposals may safely consume.
enum ToolExecutionProposalKind {
  TOOL_EXECUTION_PROPOSAL_KIND_UNSPECIFIED = 0;
  TOOL_EXECUTION_PROPOSAL_KIND_CHECKPOINT = 1;
  TOOL_EXECUTION_PROPOSAL_KIND_ARTIFACT = 2;
  TOOL_EXECUTION_PROPOSAL_KIND_MEMORY = 3;
}

// ToolExecutionLinkage carries the shared identifiers used to authorize,
// partition, audit, and join a tool call back to agent runtime records.
message ToolExecutionLinkage {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  string organization_id = 2 [(buf.validate.field).string.min_len = 1];
  string agent_id = 3 [(buf.validate.field).string.min_len = 1];
  string run_id = 4;
  string objective_id = 5;
  string step_id = 6;
  string actor_id = 7;
  string surface = 8 [deprecated = true];
  string channel_id = 9;
  string correlation_id = 10;
  common.v1.Surface surface_type = 11 [(buf.validate.field).enum.defined_only = true];
  repeated ToolExecutionAttachmentMount attachment_mounts = 12;
  // application_id is the immutable server-derived application authority.
  // Callers must not populate it from browser-controlled application context.
  string application_id = 13 [(buf.validate.field).string.min_len = 1];
  ToolExecutionProjectSource project_source = 14;
  ToolExecutionProjectImport project_import = 15;
  // Exact Platform-admitted task recipe. Executor preparation is authorized
  // from this typed linkage, never from caller-controlled metadata.
  ToolExecutionWorkspaceRecipe workspace_recipe = 16;
  // Platform-admitted task identity used for tenant-scoped owner inspection.
  string task_id = 17;
}

// Versioned, server-owned preparation recipe for one task workspace. The
// recipe carries bounded declarative requirements; it cannot contain shell
// commands, repository hooks, credentials, or approval policy.
message ToolExecutionWorkspaceRecipe {
  string schema_version = 1 [(buf.validate.field).string.const = "deixic.workspace_recipe.v1"];
  string recipe_id = 2 [(buf.validate.field).string.min_len = 1];
  uint64 recipe_version = 3 [(buf.validate.field).uint64.gte = 1];
  string recipe_digest = 4 [(buf.validate.field).string.min_len = 1];
  string source_manifest_digest = 5 [(buf.validate.field).string.min_len = 1];
  repeated string required_runtimes = 6 [(buf.validate.field).repeated = {
    max_items: 16
    items: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
  }];
  string preparation_tool = 7 [(buf.validate.field).string.const = "computer.check_runtimes"];
  // Skills, MCP tools, approvals, and credentials remain authorized through
  // their existing admitted contracts; this recipe carries no such authority.
  reserved 8, 9;
  string execution_owner = 10 [(buf.validate.field).string.const = "platform-api.dex"];
}

// ToolExecutionAttachmentMount is an immutable, server-authorized VFS version
// materialized read-only under the execution's attachment root.
message ToolExecutionAttachmentMount {
  string object_id = 1 [(buf.validate.field).string.min_len = 1];
  string version_id = 2 [(buf.validate.field).string.min_len = 1];
  string filename = 3 [(buf.validate.field).string.min_len = 1];
  string sha256 = 4 [(buf.validate.field).string.min_len = 1];
  int64 size_bytes = 5 [(buf.validate.field).int64 = {
    gt: 0
    lte: 52428800
  }];
  string destination_path = 6 [(buf.validate.field).string.min_len = 1];
  platform.v1.ResourceRef resource_ref = 7;
}

// ToolExecutionTraceContext carries the W3C trace context that causally owns a
// tool call. It lets the AgentRun, ToolExecution, connector, and MCP spans stay
// on one distributed trace even when the execution is retried or parked.
message ToolExecutionTraceContext {
  string trace_id = 1;
  string span_id = 2;
  string parent_span_id = 3;
  string traceparent = 4;
  string tracestate = 5;
}

// ToolRef identifies the tool/capability the agent wants to invoke.
message ToolRef {
  string namespace = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  string version = 3;
  string capability = 4 [(buf.validate.field).string.min_len = 1];
  string operation = 5;
  bool idempotent = 6;
  bool mutates_resource = 7;
}

// ConnectorRef identifies the connector, resource, and credential namespace
// needed to execute an external tool call. MCP/internal tools may leave
// connection_id empty while still setting provider_id/resource metadata.
message ConnectorRef {
  string connection_id = 1;
  string provider_id = 2;
  string resource_id = 3;
  string resource_kind = 4;
  string credential_ref = 5;
  string credential_environment = 6;
}

// ToolRetryPolicy prevents blind retries for side-effecting tools. If a tool is
// not idempotent, callers must set allow_non_idempotent_retry and provide an
// idempotency_key before retries beyond the first attempt are honored.
message ToolRetryPolicy {
  int32 max_attempts = 1 [(buf.validate.field).int32.gte = 0];
  int32 initial_delay_ms = 2 [(buf.validate.field).int32.gte = 0];
  int32 max_delay_ms = 3 [(buf.validate.field).int32.gte = 0];
  bool allow_non_idempotent_retry = 4;
}

// ToolExecutionStep records one boundary decision in the execution path.
message ToolExecutionStep {
  string id = 1;
  ToolExecutionStage stage = 2 [(buf.validate.field).enum.defined_only = true];
  ToolExecutionStepState state = 3 [(buf.validate.field).enum.defined_only = true];
  ToolExecutionPolicyDecision decision = 4;
  string external_ref = 5;
  repeated string reasons = 6;
  map<string, string> attributes = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp ended_at = 9;
}

// ToolApprovalWait is stored when policy requires human approval. The
// resume_token and original request allow AgentRun to release compute and later
// resume without reconstructing or mutating the tool call.
message ToolApprovalWait {
  string id = 1;
  string approval_request_id = 2;
  string resume_token = 3;
  string reason = 4;
  ToolExecutionPolicyDecision requested_decision = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp resolved_at = 7;
  string resolved_by = 8;
  google.protobuf.Timestamp expires_at = 9;
}

// VerifiedApprovalDecision is the immutable join to the authoritative
// ApprovalService decision used to release this execution. ToolExecutor
// derives every field from ApprovalService; callers provide only decision_id.
message VerifiedApprovalDecision {
  string decision_id = 1;
  string approval_request_id = 2;
  string decision = 3;
  string decided_by = 4;
  string reason = 5;
  google.protobuf.Timestamp decided_at = 6;
  google.protobuf.Timestamp verified_at = 7;
}

// ToolExecutionOutputAuthority binds a caller-dispatched terminal write to
// the authenticated application/actor, exact request and approval, and the
// currently leased dispatch attempt.
message ToolExecutionOutputAuthority {
  string application_id = 1 [(buf.validate.field).string.min_len = 1];
  string actor = 2 [(buf.validate.field).string.min_len = 1];
  string request_fingerprint = 3 [(buf.validate.field).string.min_len = 1];
  string approval_decision_id = 4 [(buf.validate.field).string.min_len = 1];
  int32 dispatch_attempt = 5 [(buf.validate.field).int32.gte = 1];
  string action_digest = 6 [(buf.validate.field).string.min_len = 1];
}

// ToolExecutionOutput is deliberately structured: safe_output can be fed to a
// run checkpoint, artifact proposal, or memory proposal without raw connector
// secrets or unredacted byproducts.
message ToolExecutionOutput {
  google.protobuf.Struct raw_output = 1;
  google.protobuf.Struct safe_output = 2;
  repeated ToolOutputProposal proposals = 3;
  repeated string redactions = 4;
  string content_type = 5;
  string output_digest = 6;
  int64 duration_ms = 7;
  platform.v1.ResourceRef resource_ref = 8;
}

// ToolOutputProposal is a normalized downstream write suggestion from a tool.
message ToolOutputProposal {
  ToolExecutionProposalKind kind = 1 [(buf.validate.field).enum.defined_only = true];
  string target_ref = 2;
  google.protobuf.Struct payload = 3;
  map<string, string> metadata = 4;
}

// ToolExecutionProvenance records non-secret references emitted by each
// boundary so audit, meter, AgentRun, Artifact, and Memory records can join on
// one tool_execution_id.
message ToolExecutionProvenance {
  string capability_ref = 1;
  string credential_ref = 2;
  string gate_policy_ref = 3;
  string governance_decision_ref = 4;
  string approval_request_id = 5;
  string executor_ref = 6;
  string audit_event_id = 7;
  string meter_record_id = 8;
  string provenance_record_id = 9;
  string input_digest = 10;
  string output_digest = 11;
  map<string, string> metadata = 12;
  // Owner-persisted acknowledgement of a Runner Host event append. This
  // binds a recording to the execution, not the producer of the event.
  CommandAuditReceipt command_audit_receipt = 13;
}

message CommandAuditReceipt {
  string event_id = 1;
  string runner_session_id = 2;
  int64 sequence = 3;
  string event_type = 4;
  google.protobuf.Timestamp occurred_at = 5;
  string payload_digest_sha256 = 6;
}

// ToolExecutionFailureCode is the bounded, owner-assigned terminal failure
// taxonomy. It intentionally excludes provider prose, resource identifiers,
// and secret-bearing detail.
enum ToolExecutionFailureCode {
  TOOL_EXECUTION_FAILURE_CODE_UNSPECIFIED = 0;
  TOOL_EXECUTION_FAILURE_CODE_INVALID_REQUEST = 1;
  TOOL_EXECUTION_FAILURE_CODE_UNSUPPORTED_TOOL = 2;
  TOOL_EXECUTION_FAILURE_CODE_AUTHORITY_INVALID = 3;
  TOOL_EXECUTION_FAILURE_CODE_DEPENDENCY_UNAVAILABLE = 4;
  TOOL_EXECUTION_FAILURE_CODE_CONNECTOR_FAILED = 5;
  TOOL_EXECUTION_FAILURE_CODE_SANDBOX_PROVISION_FAILED = 6;
  TOOL_EXECUTION_FAILURE_CODE_SANDBOX_OPERATION_FAILED = 7;
  TOOL_EXECUTION_FAILURE_CODE_RUNNER_LEDGER_REQUIRED = 8;
  TOOL_EXECUTION_FAILURE_CODE_APPROVAL_DENIED = 9;
  TOOL_EXECUTION_FAILURE_CODE_APPROVAL_EXPIRED = 10;
  TOOL_EXECUTION_FAILURE_CODE_EXECUTION_ABANDONED = 11;
  TOOL_EXECUTION_FAILURE_CODE_EXECUTION_CANCELLED = 12;
  TOOL_EXECUTION_FAILURE_CODE_CALLER_REPORTED_FAILURE = 13;
}

// ToolExecution is the canonical durable record for one governed tool call.
message ToolExecution {
  string id = 1;
  ToolExecutionLinkage linkage = 2 [(buf.validate.field).required = true];
  ToolRef tool = 3 [(buf.validate.field).required = true];
  ConnectorRef connector = 4;
  google.protobuf.Struct arguments = 5;
  common.v1.RiskLevel risk_level = 6;
  ToolRetryPolicy retry_policy = 7;
  string idempotency_key = 8 [(buf.validate.field).string.min_len = 1];
  ToolExecutionState state = 9 [(buf.validate.field).enum.defined_only = true];
  int32 attempt = 10;
  int32 max_attempts = 11;
  repeated ToolExecutionStep steps = 12;
  ToolApprovalWait approval_wait = 13;
  ToolExecutionOutput output = 14;
  ToolExecutionProvenance provenance = 15;
  string error_message = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
  google.protobuf.Timestamp completed_at = 19;
  ToolExecutionTraceContext trace_context = 20;
  // Stable machine-readable terminal failure reason when the owning execution
  // boundary classified it. Human-readable detail remains in error_message
  // and must never be parsed for routing or policy.
  ToolExecutionFailureCode failure_code = 21 [(buf.validate.field).enum.defined_only = true];
  VerifiedApprovalDecision verified_approval_decision = 22;
}

message ExecuteToolRequest {
  ToolExecutionLinkage linkage = 1 [(buf.validate.field).required = true];
  ToolRef tool = 2 [(buf.validate.field).required = true];
  ConnectorRef connector = 3;
  google.protobuf.Struct arguments = 4;
  common.v1.RiskLevel risk_level = 5;
  ToolRetryPolicy retry_policy = 6;
  string idempotency_key = 7 [(buf.validate.field).string.min_len = 1];
  map<string, string> metadata = 8;
  ToolExecutionTraceContext trace_context = 9;
}

message ExecuteToolResponse {
  ToolExecution execution = 1;
  bool idempotent_replay = 2;
}

message ResumeToolExecutionRequest {
  string execution_id = 1 [(buf.validate.field).string.min_len = 1];
  string approval_request_id = 2 [(buf.validate.field).string.min_len = 1];
  string resume_token = 3 [(buf.validate.field).string.min_len = 1];
  bool approved = 4 [deprecated = true];
  string decided_by = 5 [deprecated = true];
  string reason = 6 [deprecated = true];
  // Identity of the durable ApprovalService decision to verify. The
  // deprecated decision fields above are ignored by production verification.
  string approval_decision_id = 7 [(buf.validate.field).string.min_len = 1];
}

message ResumeToolExecutionResponse {
  ToolExecution execution = 1;
}

message RecordToolExecutionOutputRequest {
  string execution_id = 1 [(buf.validate.field).string.min_len = 1];
  ToolExecutionOutput output = 2 [(buf.validate.field).required = true];
  map<string, string> metadata = 3;
  ToolExecutionOutputAuthority authority = 4 [(buf.validate.field).required = true];
}

message RecordToolExecutionOutputResponse {
  ToolExecution execution = 1;
}

message GetToolExecutionRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string organization_id = 2 [(buf.validate.field).string.min_len = 1];
  string workspace_id = 3 [(buf.validate.field).string.min_len = 1];
  // When greater than zero, the owner may block until the execution is
  // settled (terminal or WAITING_APPROVAL) or this timeout elapses. Zero
  // returns a snapshot and remains backward compatible.
  uint32 wait_timeout_ms = 4 [(buf.validate.field).uint32 = {
    gte: 0
    lte: 30000
  }];
}

message GetToolExecutionResponse {
  ToolExecution execution = 1;
}

message ListToolExecutionsRequest {
  string workspace_id = 1;
  string run_id = 2;
  string objective_id = 3;
  string agent_id = 4;
  string tool_namespace = 5;
  string tool_name = 6;
  string connection_id = 7;
  string approval_request_id = 8;
  ToolExecutionState state = 9;
  int32 limit = 10 [(buf.validate.field).int32.gte = 0];
  int32 offset = 11 [(buf.validate.field).int32.gte = 0];
  string organization_id = 12;
  string task_id = 13;
}

message ListToolExecutionsResponse {
  repeated ToolExecution executions = 1;
  int32 total = 2;
  bool has_more = 3;
}

// An immutable file restored below the private task workspace.
message ToolExecutionProjectSourceFile {
  string path = 1;
  string object_id = 2;
  string version_id = 3;
  string sha256 = 4;
  uint64 size_bytes = 5;
  bool executable = 6;
}

// Server-owned, pinned accepted source. Never a writable shared directory.
message ToolExecutionProjectSource {
  string project_resource_id = 1;
  string accepted_ref_name = 2;
  uint64 accepted_ref_version = 3;
  string accepted_snapshot_id = 4;
  string source_workspace_id = 5;
  uint64 source_workspace_version = 6;
  repeated ToolExecutionProjectSourceFile files = 7 [(buf.validate.field).repeated.max_items = 1000];
}

// Server-admitted immutable import job; browser requests cannot choose a commit.
message ToolExecutionProjectImport {
  string project_resource_id = 1;
  string connection_id = 2;
  optional uint64 expected_ref_version = 3;
  ToolExecutionGitSnapshotManifest manifest = 4;
  string grant_key_id = 5;
  string grant_signature = 6;
}
message ToolExecutionGitSnapshotManifest {
  uint64 repository_id = 1;
  string full_name = 2;
  string default_branch = 3;
  string commit_sha = 4;
  string tree_sha = 5;
  repeated ToolExecutionGitSnapshotFile files = 6;
  bool complete = 7;
}
message ToolExecutionGitSnapshotFile {
  string path = 1;
  string git_blob_sha = 2;
  uint64 size_bytes = 3;
  bool executable = 4;
}
