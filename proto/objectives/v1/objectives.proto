syntax = "proto3";

package objectives.v1;

import "buf/validate/validate.proto";
import "common/v1/authz.proto";
import "common/v1/surface.proto";
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/evalops/platform/gen/go/objectives/v1;objectivesv1";

// ObjectiveService manages agent objectives and their lifecycle.
service ObjectiveService {
  rpc Create(CreateRequest) returns (CreateResponse) {
    option (common.v1.required_scopes) = "objectives:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";

    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  rpc Get(GetRequest) returns (GetResponse) {
    option (common.v1.required_scopes) = "objectives:read";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc Transition(TransitionRequest) returns (TransitionResponse) {
    option (common.v1.required_scopes) = "objectives:write";

    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  rpc Wake(WakeRequest) returns (WakeResponse) {
    option (common.v1.required_scopes) = "objectives:write";

    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  rpc ScheduleWake(ScheduleWakeRequest) returns (ScheduleWakeResponse) {
    option (common.v1.required_scopes) = "objectives:write";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc Query(QueryRequest) returns (QueryResponse) {
    option (common.v1.required_scopes) = "objectives:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc RecordProvenance(RecordProvenanceRequest) returns (RecordProvenanceResponse) {
    option (common.v1.required_scopes) = "objectives:write";

    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  rpc RecordMutation(RecordMutationRequest) returns (RecordMutationResponse) {
    option (common.v1.required_scopes) = "objectives:write";

    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  rpc GetGovernanceEvaluation(GetGovernanceEvaluationRequest) returns (GetGovernanceEvaluationResponse) {
    option (common.v1.required_scopes) = "objectives:read";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc Cancel(CancelRequest) returns (CancelResponse) {
    option (common.v1.required_scopes) = "objectives:write";

    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  rpc AppendTurn(AppendTurnRequest) returns (AppendTurnResponse) {
    option (common.v1.required_scopes) = "objectives:write";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";

    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  rpc RunStep(RunStepRequest) returns (RunStepResponse) {
    option (common.v1.required_scopes) = "objectives:write";

    option (common.v1.risk_level) = RISK_LEVEL_MEDIUM;
  }
  rpc WaitForEvent(WaitForEventRequest) returns (WaitForEventResponse) {
    option (common.v1.required_scopes) = "objectives:write";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc ListTurns(ListTurnsRequest) returns (ListTurnsResponse) {
    option (common.v1.required_scopes) = "objectives:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
  rpc QueryTurns(QueryTurnsRequest) returns (QueryTurnsResponse) {
    option (common.v1.required_scopes) = "objectives:read";
    option (common.v1.organization_scope_field) = "organization_id";
    option (common.v1.workspace_scope_field) = "workspace_id";

    option (common.v1.risk_level) = RISK_LEVEL_LOW;
  }
}

// ObjectiveState describes the lifecycle state of an objective.
enum ObjectiveState {
  OBJECTIVE_STATE_UNSPECIFIED = 0;
  OBJECTIVE_STATE_PENDING = 1;
  OBJECTIVE_STATE_RUNNING = 2;
  OBJECTIVE_STATE_BLOCKED = 3;
  OBJECTIVE_STATE_DEGRADED = 4;
  OBJECTIVE_STATE_AWAITING_APPROVAL = 5;
  OBJECTIVE_STATE_QUEUED = 6;
  OBJECTIVE_STATE_COMPLETED = 7;
  OBJECTIVE_STATE_FAILED = 8;
  OBJECTIVE_STATE_CANCELLED = 9;
}

// MutationStatus describes the status of a mutation operation.
enum MutationStatus {
  MUTATION_STATUS_UNSPECIFIED = 0;
  MUTATION_STATUS_PENDING = 1;
  MUTATION_STATUS_APPROVED = 2;
  MUTATION_STATUS_DENIED = 3;
  MUTATION_STATUS_EXECUTED = 4;
  MUTATION_STATUS_ROLLED_BACK = 5;
}

// TurnKind identifies the durable work represented by an objective turn.
enum TurnKind {
  TURN_KIND_UNSPECIFIED = 0;
  TURN_KIND_USER_MESSAGE = 1;
  TURN_KIND_LLM_CALL = 2;
  TURN_KIND_TOOL_CALL = 3;
  TURN_KIND_APPROVAL_WAIT = 4;
  TURN_KIND_SLEEP = 5;
  TURN_KIND_EVENT_WAIT = 6;
}

// TurnStatus describes replayable execution state for a journaled turn.
enum TurnStatus {
  TURN_STATUS_UNSPECIFIED = 0;
  TURN_STATUS_PENDING = 1;
  TURN_STATUS_RUNNING = 2;
  TURN_STATUS_COMPLETED = 3;
  TURN_STATUS_FAILED = 4;
  TURN_STATUS_REPLAY = 5;
}

// Objective is the canonical agent objective record.
message Objective {
  string id = 1;
  string workspace_id = 2;
  string agent_id = 3;
  string surface = 4;
  string title = 5;
  string description = 6;
  ObjectiveState state = 7;
  repeated ProvenanceRecord provenance = 8;
  repeated MutationRecord mutations = 9;
  WakeSchedule wake_schedule = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  common.v1.Surface surface_type = 13 [(buf.validate.field).enum.defined_only = true];
  string idempotency_key = 14;
  string organization_id = 15;
}

// ProvenanceRecord tracks where data came from.
message ProvenanceRecord {
  string source_integration = 1;
  string source_id = 2;
  int32 freshness_seconds = 3;
  float confidence = 4;
}

// MutationRecord tracks a write operation performed by an objective.
message MutationRecord {
  string target_integration = 1;
  string operation = 2;
  MutationStatus status = 3;
  string approval_id = 4;
}

// WakeSchedule defines when and how an objective should be reactivated.
message WakeSchedule {
  google.protobuf.Timestamp wake_at = 1;
  string reason = 2;
  int32 retry_count = 3;
  int32 max_retries = 4;
  int32 backoff_seconds = 5;
}

// Turn is the per-objective replay journal used by agent sessions.
message Turn {
  string id = 1;
  string objective_id = 2;
  int32 sequence = 3;
  TurnKind kind = 4;
  google.protobuf.Any payload = 5;
  google.protobuf.Any result = 6;
  TurnStatus status = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp completed_at = 9;
  string idempotency_key = 10;
}

message WaitForEventPayload {
  string event_subject = 1;
  google.protobuf.Any payload = 2;
}

message CreateRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  string agent_id = 2;
  string surface = 3;
  string title = 4 [(buf.validate.field).string.min_len = 1];
  string description = 5;
  common.v1.Surface surface_type = 6 [(buf.validate.field).enum.defined_only = true];
  string idempotency_key = 7;
  repeated ProvenanceRecord provenance = 8;
  string organization_id = 9;
}

message CreateResponse {
  Objective objective = 1;
}

message GetRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetResponse {
  Objective objective = 1;
}

message TransitionRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  ObjectiveState state = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string reason = 3;
}

message TransitionResponse {
  Objective objective = 1;
}

message WakeRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message WakeResponse {
  Objective objective = 1;
}

message ScheduleWakeRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  WakeSchedule wake_schedule = 2 [(buf.validate.field).required = true];
  // State to hold until wake_at is due. If unspecified, the service uses BLOCKED.
  ObjectiveState state = 3 [(buf.validate.field).enum.defined_only = true];
}

message ScheduleWakeResponse {
  Objective objective = 1;
}

message QueryRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  string agent_id = 2;
  ObjectiveState state = 3;
  int32 limit = 4 [(buf.validate.field).int32.lte = 200];
  int32 offset = 5 [(buf.validate.field).int32.gte = 0];
  string organization_id = 6;
}

message QueryResponse {
  repeated Objective objectives = 1;
  int32 total = 2;
}

message RecordProvenanceRequest {
  string objective_id = 1 [(buf.validate.field).string.min_len = 1];
  ProvenanceRecord provenance = 2 [(buf.validate.field).required = true];
}

message RecordProvenanceResponse {
  Objective objective = 1;
}

message RecordMutationRequest {
  string objective_id = 1 [(buf.validate.field).string.min_len = 1];
  MutationRecord mutation = 2 [(buf.validate.field).required = true];
}

message RecordMutationResponse {
  Objective objective = 1;
}

message GetGovernanceEvaluationRequest {
  string objective_id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetGovernanceEvaluationResponse {
  string objective_id = 1;
  bool compliant = 2;
  repeated string violations = 3;
}

message CancelRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string reason = 2;
}

message CancelResponse {
  Objective objective = 1;
}

message AppendTurnRequest {
  string objective_id = 1 [(buf.validate.field).string.min_len = 1];
  TurnKind kind = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  google.protobuf.Any payload = 3;
  string idempotency_key = 4;
  int32 sequence = 5 [(buf.validate.field).int32.gte = 0];
  google.protobuf.Any result = 6;
  TurnStatus status = 7 [(buf.validate.field).enum.defined_only = true];
  string organization_id = 8;
  string workspace_id = 9;
}

message AppendTurnResponse {
  Turn turn = 1;
  bool replayed = 2;
}

message RunStepRequest {
  string objective_id = 1 [(buf.validate.field).string.min_len = 1];
  string idempotency_key = 2 [(buf.validate.field).string.min_len = 1];
  TurnKind kind = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  google.protobuf.Any payload = 4;
  google.protobuf.Any result = 5;
}

message RunStepResponse {
  Turn turn = 1;
  bool replayed = 2;
}

message WaitForEventRequest {
  string objective_id = 1 [(buf.validate.field).string.min_len = 1];
  string idempotency_key = 2;
  string event_subject = 3 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Any payload = 4;
}

message WaitForEventResponse {
  Turn turn = 1;
  bool replayed = 2;
}

message ListTurnsRequest {
  string objective_id = 1 [(buf.validate.field).string.min_len = 1];
  int32 limit = 2 [(buf.validate.field).int32.lte = 200];
  int32 offset = 3 [(buf.validate.field).int32.gte = 0];
  string organization_id = 4;
  string workspace_id = 5;
}

message ListTurnsResponse {
  repeated Turn turns = 1;
  int32 total = 2;
}

message ObjectiveTurn {
  Objective objective = 1;
  Turn turn = 2;
}

message QueryTurnsRequest {
  string organization_id = 1;
  string workspace_id = 2 [(buf.validate.field).string.min_len = 1];
  string agent_id = 3;
  int32 limit = 4 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 200
  ];
  int32 offset = 5 [(buf.validate.field).int32.gte = 0];
  string payload_channel_id = 6;
  bool omit_total = 7;
}

message QueryTurnsResponse {
  repeated ObjectiveTurn turns = 1;
  int32 total = 2 [(buf.validate.field).int32.gte = 0];
}
